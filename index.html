  looter: 7.8,
  exterminator: 7.4,
  pyromaniac: 7.2,
  rabble_rouser: 7.4,
  vanguard: 7.2,
  vigilante: 7.2,
  repair_bot: 7.2,
  cult_leader: 7.0,
  holdout: 7.2,
  scout: 6.8,
  scientist: 6.8,
  mimic: 7.5,
  rescue_team: 6.5,
  doomsayer: 6.4,
  mutant: 6.6,
  wounded_soldier: 6.4,
  punk: 4.0,
};

function personThreatValue(person, ownerKey, obs) {
  let v = PERSON_VALUE[person.isPunk ? 'punk' : person.id] || 5.0;
  if (person.damaged) v *= 0.45;
  if (person.ready && !person.damaged) v += 1.2;
  // Argo Yesky buffs punks!
  if (person.isPunk && hasActiveTrait(obs, ownerKey, 'grant_damage_to_all_people')) {
    v += 2.6;
  }
  return v;
}

function evaluateObservation(obs) {
  const botAlive = obs.bot.camps.filter((c) => !c.destroyed).length;
  const humAlive = obs.human.camps.filter((c) => !c.destroyed).length;

  if (humAlive === 0 && botAlive > 0) return 10000;
  if (botAlive === 0 && humAlive > 0) return -10000;
  if (botAlive === 0 && humAlive === 0) return 0;

  let score = 0;

  // 1. Camps (by far the most important objective)
  const evalCamps = (sideKey, sign) => {
    const p = obs[sideKey];
    for (let col = 0; col < 3; col++) {
      const c = p.camps[col];
      if (c.destroyed) {
        score -= sign * 42;
      } else {
        score += sign * 30;
        const prot = isCardProtected(obs, sideKey, 'camp', col, 0, sideKey === 'bot' ? 'human' : 'bot');
        if (c.damaged) {
          score -= sign * (prot ? 14 : 21); // unprotected damaged camp is extreme danger!
        } else if (prot) {
          score += sign * 3.5;
        }
        if (c.id === 'juggernaut' && c.juggernautStep > 0) {
          score += sign * c.juggernautStep * 7.5;
        }
      }
    }
  };
  evalCamps('bot', 1);
  evalCamps('human', -1);

  // 2. People & Positioning
  const evalPeople = (sideKey, sign) => {
    const p = obs[sideKey];
    const opp = sideKey === 'bot' ? 'human' : 'bot';
    for (let col = 0; col < 3; col++) {
      for (let slot = 0; slot < 2; slot++) {
        const per = p.columns[col][slot];
        if (!per) continue;
        let v = personThreatValue(per, sideKey, obs);
        const prot = isCardProtected(obs, sideKey, 'person', col, slot, opp);
        // High-value squishy people LOVE being protected in back
        if (!per.isPunk && prot && v >= 7.5) v += 2.2;
        if (per.isPunk && !prot && p.columns[col][0]) v += 1.2; // Punk shielding someone behind!
        score += sign * v;
      }
    }
  };
  evalPeople('bot', 1);
  evalPeople('human', -1);

  // 3. Event Queues
  const eventScore = (evId, slotIdx, ownerKey) => {
    const urgency = 1 + (2 - slotIdx) * 0.28; // slot 0 (space 1) is imminent!
    const oppKey = ownerKey === 'bot' ? 'human' : 'bot';
    const oppAliveCamps = obs[oppKey].camps.filter((c) => !c.destroyed).length;
    const oppPeople = countPeople(obs, oppKey);
    const ownPeople = countPeople(obs, ownerKey);
    switch (evId) {
      case 'raiders':
        return 10.5 * urgency;
      case 'bombardment':
        return (12 + oppAliveCamps * 5.5) * urgency;
      case 'napalm':
        return (4 + Math.min(2, oppPeople) * 5.5) * urgency;
      case 'banish':
        return (oppPeople > 0 ? 9.5 : 3.5) * urgency;
      case 'strafe':
        return (2.5 + oppPeople * 3.8) * urgency;
      case 'uprising':
        return Math.min(3, 6 - ownPeople) * 3.8 * urgency;
      case 'interrogate':
        return 5.5 * urgency;
      case 'famine':
        return ((oppPeople - ownPeople) * 4.5) * urgency;
      case 'radiation':
        return ((oppPeople - ownPeople) * 3.0) * urgency;
      default:
        return 4.0 * urgency;
    }
  };
  obs.bot.events.forEach((e, i) => {
    if (e) score += eventScore(e, i, 'bot');
  });
  obs.human.events.forEach((e, i) => {
    if (e) score -= eventScore(e, i, 'human');
  });

  // 4. Card advantage & Water Silo banking
  score += obs.bot.hand.length * 4.2;
  score -= (obs.human.handCount || 0) * 4.0;
  if (obs.bot.waterSiloInHand) score += 3.2;
  if (obs.human.waterSiloInHand) score -= 2.8;

  // Small value for remaining water during mid-turn planning (don't waste water for nothing!)
  score += getTotalWater(obs.bot) * 0.35;

  return score;
}

// === 3. SYNTHETIC SIMULATION WRAPPER (ZERO LEAK!) ===
function makeSimStateFromObs(obs) {
  // Construct a valid engine state strictly from obs (synthetic unknown deck & synthetic dummy human hand)
  const syntheticDeck = [];
  for (let i = 0; i < Math.max(0, obs.deckCount); i++) {
    syntheticDeck.push('__unknown__');
  }
  const syntheticHumanHand = [];
  for (let i = 0; i < (obs.human.handCount || 0); i++) {
    syntheticHumanHand.push('__hidden__');
  }
  return {
    phase: obs.phase,
    winner: obs.winner,
    winReason: '',
    turn: obs.turn,
    activePlayer: obs.activePlayer,
    firstPlayer: obs.firstPlayer,
    turnStep: 'actions',
    difficulty: obs.difficulty,
    deck: syntheticDeck,
    discard: [...obs.discard],
    reshuffles: obs.reshuffles,
    bot: JSON.parse(JSON.stringify(obs.bot)),
    human: {
      ...JSON.parse(JSON.stringify(obs.human)),
      hiddenHand: syntheticHumanHand,
      pendingDraws: 0,
    },
    pendingChoice: null,
    log: [],
    history: [],
  };
}

// Pessimistic defender choices for simulation when bot plays Raiders / Scud / Mercenary / Famine
function simApplyHumanChoicePessimistic(simState) {
  const pc = simState.pendingChoice;
  if (!pc) return;
  simState.pendingChoice = null;
  if (pc.kind === 'raiders_camp' || pc.kind === 'juggernaut_camp') {
    // Assume human picks their healthiest (undamaged) camp to minimize damage!
    const undamaged = pc.options.find((o) => !simState.human.camps[o.value].damaged);
    const col = undamaged ? undamaged.value : pc.options[0].value;
    if (pc.kind === 'raiders_camp') {
      const c = simState.human.camps[col];
      if (c.damaged) c.destroyed = true;
      else c.damaged = true;
    } else {
      simState.human.camps[col].destroyed = true;
    }
  } else if (pc.kind === 'scud_target') {
    // Assume human picks a damaged/cheap punk or undamaged camp
    const punkOpt = pc.options.find((o) => o.target.id === 'punk');
    const chosen = punkOpt || pc.options[0];
    if (chosen.target.type === 'person') {
      const per = simState.human.columns[chosen.target.col][chosen.target.slot];
      if (per) {
        if (per.isPunk || per.damaged) simState.human.columns[chosen.target.col][chosen.target.slot] = null;
        else per.damaged = true;
      }
    } else {
      const c = simState.human.camps[chosen.target.col];
      if (c.damaged) c.destroyed = true;
      else c.damaged = true;
    }
  } else if (pc.kind === 'mercenary_choice') {
    if (simState.human.hiddenHand.length >= 2) {
      simState.human.hiddenHand.splice(0, 2);
    } else {
      const opt = pc.options.find((o) => o.mode === 'destroy');
      if (opt && opt.target) {
        if (opt.target.type === 'person') simState.human.columns[opt.target.col][opt.target.slot] = null;
        else simState.human.camps[opt.target.col].destroyed = true;
      }
    }
  } else if (pc.kind === 'famine_keep') {
    // Assume human keeps their best person!
    const all = getAllPeople(simState, 'human');
    all.sort((a, b) => (PERSON_VALUE[b.person.id] || 4) - (PERSON_VALUE[a.person.id] || 4));
    for (let i = 1; i < all.length; i++) {
      simState.human.columns[all[i].col][all[i].slot] = null;
    }
  } else if (pc.kind === 'octagon_destroy') {
    const all = getAllPeople(simState, 'human');
    all.sort((a, b) => (PERSON_VALUE[a.person.id] || 4) - (PERSON_VALUE[b.person.id] || 4));
    if (all[0]) simState.human.columns[all[0].col][all[0].slot] = null;
  } else if (pc.kind === 'vanguard_counter') {
    // Assume human hits bot's highest-value unprotected target!
    const best = [...pc.options].sort((a, b) => {
      const va = a.target.type === 'camp' ? (a.target.damaged ? 50 : 25) : PERSON_VALUE[a.target.id] || 5;
      const vb = b.target.type === 'camp' ? (b.target.damaged ? 50 : 25) : PERSON_VALUE[b.target.id] || 5;
      return vb - va;
    })[0];
    if (best?.target) {
      if (best.target.type === 'camp') {
        const c = simState.bot.camps[best.target.col];
        if (c.damaged) c.destroyed = true;
        else c.damaged = true;
      } else {
        const per = simState.bot.columns[best.target.col][best.target.slot];
        if (per) {
          if (per.isPunk || per.damaged) simState.bot.columns[best.target.col][best.target.slot] = null;
          else per.damaged = true;
        }
      }
    }
  }
}

// === 4. CANDIDATE ACTION GENERATOR ===
function pickBestTarget(obs, targets, preferDestroy = false) {
  if (!targets || targets.length === 0) return null;
  const scored = targets.map((t) => {
    let s = 0;
    if (t.type === 'camp') {
      s = t.damaged ? 120 : 38;
      if (preferDestroy) s += 40;
    } else if (t.type === 'column') {
      const h = obs.human;
      if (!h.camps[t.col].destroyed) s += h.camps[t.col].damaged ? 110 : 34;
      for (let slot = 0; slot < 2; slot++) {
        const per = h.columns[t.col][slot];
        if (per) s += (PERSON_VALUE[per.isPunk ? 'punk' : per.id] || 5) * (per.damaged || per.isPunk ? 1.5 : 0.9);
      }
    } else {
      const per = obs.human.columns[t.col][t.slot];
      const baseV = per ? PERSON_VALUE[per.isPunk ? 'punk' : per.id] || 5 : 5;
      s = baseV * (t.damaged || t.id === 'punk' || preferDestroy ? 1.5 : 0.95);
      // Bonus if clearing this person exposes a damaged camp!
      const colPeople = (obs.human.columns[t.col][0] ? 1 : 0) + (obs.human.columns[t.col][1] ? 1 : 0);
      if (colPeople === 1 && !obs.human.camps[t.col].destroyed && (t.damaged || t.id === 'punk' || preferDestroy)) {
        s += obs.human.camps[t.col].damaged ? 18 : 7;
      }
    }
    return { t, s };
  });
  scored.sort((a, b) => b.s - a.s);
  return scored[0].t;
}

function pickBestRestore(obs, restorables) {
  if (!restorables || restorables.length === 0) return null;
  const scored = restorables.map((r) => {
    if (r.type === 'camp') return { r, s: 50 + (isCardProtected(obs, 'bot', 'camp', r.col, 0, 'human') ? 0 : 20) };
    return { r, s: (PERSON_VALUE[r.id] || 5) * 2.2 };
  });
  scored.sort((a, b) => b.s - a.s);
  return scored[0].r;
}

function pickBestOwnSacrifice(obs) {
  const all = getAllPeople(obs, 'bot');
  if (all.length === 0) return null;
  const scored = all.map((x) => {
    let cost = PERSON_VALUE[x.person.isPunk ? 'punk' : x.person.id] || 5;
    if (x.person.damaged) cost *= 0.4;
    if (!x.person.ready) cost *= 0.85;
    // Penalize sacrificing the ONLY defender of a damaged camp!
    const colCount = (obs.bot.columns[x.col][0] ? 1 : 0) + (obs.bot.columns[x.col][1] ? 1 : 0);
    if (colCount === 1 && obs.bot.camps[x.col].damaged && !obs.bot.camps[x.col].destroyed) {
      cost += 14;
    }
    return { x, cost };
  });
  scored.sort((a, b) => a.cost - b.cost);
  return scored[0].x;
}

function pickBestPlacementForPerson(obs, cardId) {
  const empty = getEmptyPersonSlots(obs, 'bot');
  if (empty.length === 0) return null;
  const val = PERSON_VALUE[cardId] || 6;
  const isSquishyValuable = val >= 7.5;
  const scored = empty.map(({ col, slot }) => {
    let s = 0;
    const camp = obs.bot.camps[col];
    const cost = getPersonPlayCost(obs, 'bot', cardId, col);
    s -= cost * 4.5; // Holdout 0-cost or Oasis -1 discount!
    if (!camp.destroyed && camp.damaged) s += 8.0; // protect damaged camp!
    if (!camp.destroyed && !obs.bot.columns[col][0] && !obs.bot.columns[col][1]) s += 3.5; // cover naked camp
    if (isSquishyValuable && slot === 0) s += 2.5; // keep valuable in back
    if (isSquishyValuable && slot === 0 && obs.bot.columns[col][1]) s += 4.5; // hide behind existing front!
    if (!isSquishyValuable && slot === 1 && obs.bot.columns[col][0]) s += 3.0; // shield back person!
    return { col, slot, s };
  });
  scored.sort((a, b) => b.s - a.s);
  return scored[0];
}

function generateCandidateActions(obs) {
  const actions = [];
  const water = getTotalWater(obs.bot);
  const aliveBotCamps = obs.bot.camps.filter((c) => !c.destroyed).length;

  // 1. Play cards from hand (deduplicate by cardId)
  const seenHand = new Set();
  for (const cardId of obs.bot.hand) {
    if (cardId === '__unknown__' || seenHand.has(cardId)) continue;
    seenHand.add(cardId);
    const card = DECK_CARDS_BY_ID[cardId];
    if (!card) continue;

    if (card.type === 'person') {
      const place = pickBestPlacementForPerson(obs, cardId);
      if (place) {
        const cost = getPersonPlayCost(obs, 'bot', cardId, place.col);
        if (water >= cost) {
          const restoreTarget = card.enterPlay === 'restore' ? pickBestRestore(obs, getRestorableCards(obs, 'bot')) : null;
          actions.push({
            type: 'play_person',
            cardId,
            col: place.col,
            slot: place.slot,
            restoreTarget,
          });
        }
      }
    } else if (card.type === 'event') {
      if (water >= card.cost) {
        const zetoZero =
          obs.bot.flags.eventsPlayedThisTurn === 0 && hasActiveTrait(obs, 'bot', 'first_event_queue_zero');
        const effBomb = zetoZero ? 0 : card.bomb;
        const queueOk = effBomb === 0 || findEventQueueSlot(obs.bot.events, effBomb) !== null;
        if (queueOk) {
          actions.push({ type: 'play_event', cardId });
        }
      }
    }

    // 2. Junk card from hand (0 water!)
    const j = card.junk;
    if (j === 'water' || j === 'draw' || j === 'raid') {
      if (j !== 'raid' || obs.bot.events.includes('raiders') || findEventQueueSlot(obs.bot.events, 2) !== null) {
        actions.push({ type: 'junk_card', cardId });
      }
    } else if (j === 'punk' && getEmptyPersonSlots(obs, 'bot').length > 0) {
      actions.push({ type: 'junk_card', cardId });
    } else if (j === 'restore') {
      const rt = pickBestRestore(obs, getRestorableCards(obs, 'bot'));
      if (rt) actions.push({ type: 'junk_card', cardId, target: rt });
    } else if (j === 'injure') {
      const t = pickBestTarget(obs, getLegalTargets(obs, 'bot', 'unprotected_enemy_person'));
      if (t) actions.push({ type: 'junk_card', cardId, target: t });
    } else if (j === 'damage') {
      const t = pickBestTarget(obs, getLegalTargets(obs, 'bot', 'unprotected_enemy'));
      if (t) actions.push({ type: 'junk_card', cardId, target: t });
    }
  }

  // 3. Junk Water Silo if in hand (0 water -> +1 extra water!)
  if (obs.bot.waterSiloInHand) {
    actions.push({ type: 'junk_silo' });
  }

  // 4. Activate Ready Camps
  for (let col = 0; col < 3; col++) {
    const camp = obs.bot.camps[col];
    if (!camp || camp.destroyed || !camp.ready) continue;
    const def = CAMPS_BY_ID[camp.id];
    for (const ab of def.abilities) {
      const cost = getAbilityCost(obs, 'bot', ab);
      if (water < cost) continue;
      // Never suicide last camp!
      if ((ab.selfDamage || ab.kind === 'reactor') && aliveBotCamps <= 1 && (camp.damaged || ab.kind === 'reactor')) {
        continue;
      }
      if (ab.kind === 'arcade' && (countPeople(obs, 'bot') > 1 || getEmptyPersonSlots(obs, 'bot').length === 0)) continue;
      if (ab.kind === 'nest_of_spies' && obs.bot.flags.peoplePlayedThisTurn < 2) continue;
      if (ab.kind === 'transplant_lab' && (obs.bot.flags.peoplePlayedThisTurn < 2 || getRestorableCards(obs, 'bot').length === 0)) continue;
      if (ab.kind === 'watchtower' && !obs.bot.flags.anyEventResolvedThisTurn) continue;
      if (ab.kind === 'construction_yard' && (camp.damaged || countDestroyedCamps(obs, 'bot') === 0)) continue;
      if (ab.kind === 'training_camp' && countPunks(obs, 'bot') === 0) continue;
      if (ab.kind === 'omen_clock' && !obs.bot.events.some((e) => e !== null)) continue;
      if (ab.kind === 'adrenaline_lab') continue; // handled cleanly when damaged person exists below
      if (ab.kind === 'parachute_base') continue;
      if ((ab.kind === 'scavenger_water' || ab.kind === 'scavenger_punk' || ab.kind === 'warehouse') && obs.bot.hand.filter((c) => c !== '__unknown__').length === 0) continue;
      if (ab.kind === 'scavenger_punk' && getEmptyPersonSlots(obs, 'bot').length === 0) continue;
      if (ab.kind === 'cache_punk' && getEmptyPersonSlots(obs, 'bot').length === 0) continue;
      if (ab.kind === 'raid' && !obs.bot.events.includes('raiders') && findEventQueueSlot(obs.bot.events, 2) === null) continue;
      if ((ab.kind === 'restore' || ab.kind === 'cache_restore' || ab.kind === 'labor_camp' || ab.kind === 'bonfire') && getRestorableCards(obs, 'bot').length === 0) continue;
      if (ab.kind === 'atomic_garden' && getRestorableCards(obs, 'bot', true).length === 0) continue;
      if (ab.needsOwnPerson && countPeople(obs, 'bot') === 0) continue;

      let target = null;
      if (ab.needsTarget) {
        const legal = getLegalTargets(obs, 'bot', ab.needsTarget);
        if (legal.length === 0) continue;
        target = pickBestTarget(obs, legal, ab.kind === 'resonator');
      }
      const restoreTarget =
        ab.kind === 'atomic_garden'
          ? pickBestRestore(obs, getRestorableCards(obs, 'bot', true))
          : ['restore', 'cache_restore', 'labor_camp', 'transplant_lab'].includes(ab.kind)
            ? pickBestRestore(obs, getRestorableCards(obs, 'bot'))
            : null;
      const ownPerson = ab.needsOwnPerson ? pickBestOwnSacrifice(obs) : null;
      const discardCardId =
        ab.kind === 'scavenger_water' || ab.kind === 'scavenger_punk'
          ? pickWorstCardInHand(obs.bot.hand)
          : null;

      actions.push({
        type: 'activate_ability',
        source: { type: 'camp', col },
        abilityId: ab.id,
        target,
        restoreTarget,
        ownPerson,
        discardCardId,
      });
    }
  }

  // 5. Activate Ready People
  for (let col = 0; col < 3; col++) {
    for (let slot = 0; slot < 2; slot++) {
      const per = obs.bot.columns[col][slot];
      if (!per || per.damaged || !per.ready) continue;
      const abs = getAvailableAbilitiesForCard(obs, 'bot', 'person', col, slot);
      for (const ab of abs) {
        if (ab.kind === 'mimic') continue; // optional mimic handling below
        const cost = getAbilityCost(obs, 'bot', ab);
        if (water < cost) continue;
        if (ab.kind === 'doomsayer_damage' && !obs.human.events.some((e) => e !== null)) continue;
        if (ab.kind === 'rabble_damage' && countPunks(obs, 'bot') === 0) continue;
        if (ab.kind === 'gain_punk' && getEmptyPersonSlots(obs, 'bot').length === 0) continue;
        if (ab.kind === 'raid' && !obs.bot.events.includes('raiders') && findEventQueueSlot(obs.bot.events, 2) === null) continue;
        if (ab.kind === 'destroy_all_damaged_enemies' && !getAllPeople(obs, 'human').some((x) => x.person.damaged)) continue;
        if (ab.kind === 'injure_all_unprotected' && getLegalTargets(obs, 'bot', 'unprotected_enemy_person').length === 0) continue;
        if ((ab.kind === 'restore' || ab.kind === 'mutant_restore') && getRestorableCards(obs, 'bot').length === 0) continue;
        if (ab.kind === 'return_own_person') {
          // Only bounce damaged valuable people or enter-play-value people (avoid infinite self-bounce!)
          const bounceTarget = getAllPeople(obs, 'bot').find(
            (x) =>
              !x.person.isPunk &&
              x.person.id !== 'rescue_team' &&
              (x.person.damaged || ['wounded_soldier', 'repair_bot', 'vanguard', 'argo_yesky'].includes(x.person.id))
          );
          if (!bounceTarget) continue;
          actions.push({
            type: 'activate_ability',
            source: { type: 'person', col, slot },
            abilityId: ab.id,
            ownPerson: bounceTarget,
          });
          continue;
        }

        let target = null;
        let targetCol = undefined;
        if (ab.needsTarget === 'enemy_column') {
          const cols = getLegalTargets(obs, 'bot', 'enemy_column');
          if (cols.length === 0) continue;
          const bestCol = pickBestTarget(obs, cols);
          targetCol = bestCol.col;
        } else if (ab.needsTarget) {
          const legal = getLegalTargets(obs, 'bot', ab.needsTarget);
          if (legal.length === 0) continue;
          target = pickBestTarget(obs, legal, ab.kind === 'destroy_unprotected_person' || ab.kind === 'destroy_any_camp');
        }
        const restoreTarget =
          ab.kind === 'restore' || ab.kind === 'mutant_restore'
            ? pickBestRestore(obs, getRestorableCards(obs, 'bot'))
            : null;
        const ownPerson = ab.needsOwnPerson ? pickBestOwnSacrifice(obs) : null;

        actions.push({
          type: 'activate_ability',
          source: { type: 'person', col, slot },
          abilityId: ab.id,
          target,
          targetCol,
          restoreTarget,
          ownPerson,
        });
      }
    }
  }

  // 6. Take Water Silo (1 water)
  if (!obs.bot.waterSiloInHand && water >= 1) {
    actions.push({ type: 'take_silo' });
  }

  // 7. Buy Draw (2 water)
  if (water >= 2 && obs.deckCount > 0) {
    actions.push({ type: 'buy_draw' });
  }

  return actions;
}

function pickWorstCardInHand(hand) {
  const real = hand.filter((c) => c !== '__unknown__');
  if (real.length === 0) return null;
  const scored = real.map((cid) => {
    const def = DECK_CARDS_BY_ID[cid];
    const v = def?.type === 'person' ? PERSON_VALUE[cid] || 6 : 7;
    return { cid, v };
  });
  scored.sort((a, b) => a.v - b.v);
  return scored[0].cid;
}

function executeActionOnState(state, action, rng = Math.random, botChoiceFn = null) {
  switch (action.type) {
    case 'play_person':
      return playPerson(state, 'bot', action.cardId, action.col, action.slot, {
        rng,
        restoreTarget: action.restoreTarget,
      });
    case 'play_event':
      return playEvent(state, 'bot', action.cardId, { rng, botChoiceFn });
    case 'junk_card':
      return junkCard(state, 'bot', action.cardId, { rng, target: action.target, botChoiceFn });
    case 'junk_silo':
      return junkWaterSilo(state, 'bot');
    case 'activate_ability':
      return activateAbility(state, 'bot', action.source, action.abilityId, {
        rng,
        target: action.target,
        targetCol: action.targetCol,
        restoreTarget: action.restoreTarget,
        ownPerson: action.ownPerson,
        discardCardId: action.discardCardId,
        botChoiceFn,
      });
    case 'take_silo':
      return takeWaterSilo(state, 'bot');
    case 'buy_draw':
      return buyDrawCard(state, 'bot', rng);
    default:
      return { ok: false, error: 'Acción desconocida' };
  }
}

// === 5. BEAM-SEARCH MULTI-STEP TURN PLANNER ===
function chooseBestBotAction(obs, difficulty = 'tactical', rng = Math.random) {
  const baseScore = evaluateObservation(obs);
  const maxDepth = difficulty === 'ruthless' ? 5 : difficulty === 'tactical' ? 4 : 2;
  const beamWidth = difficulty === 'ruthless' ? 12 : difficulty === 'tactical' ? 8 : 5;

  let bestScore = baseScore;
  let bestFirstAction = null;

  let frontier = [{ obs, firstAction: null, score: baseScore }];

  for (let depth = 0; depth < maxDepth; depth++) {
    const nextFrontier = [];
    for (const node of frontier) {
      const candidates = generateCandidateActions(node.obs);
      for (const act of candidates) {
        const sim = makeSimStateFromObs(node.obs);
        const res = executeActionOnState(sim, act, () => 0.5, chooseBotDefensiveResponse);
        if (!res.ok) continue;
        if (sim.pendingChoice) {
          simApplyHumanChoicePessimistic(sim);
        }
        const nextObs = getBotObservation(sim);
        const sc = evaluateObservation(nextObs);
        const firstAct = node.firstAction || act;

        // Instant Lethal Shortcut!
        if (sc >= 9000) {
          return firstAct;
        }
        if (sc > bestScore + 0.15) {
          bestScore = sc;
          bestFirstAction = firstAct;
        }
        nextFrontier.push({ obs: nextObs, firstAction: firstAct, score: sc });
      }
    }
    if (nextFrontier.length === 0) break;
    nextFrontier.sort((a, b) => b.score - a.score);
    frontier = nextFrontier.slice(0, beamWidth);
  }

  // Casual mode occasionally picks 2nd best move for variety
  if (difficulty === 'casual' && frontier.length >= 2 && rng() < 0.25) {
    if (frontier[1].score > baseScore + 0.1) {
      return frontier[1].firstAction;
    }
  }

  return bestFirstAction; // null means End Turn!
}

// === 6. SMART BOT RESPONSES TO HUMAN EFFECTS ===
function chooseBotDefensiveResponse(obs, kind, payload) {
  switch (kind) {
    case 'raiders_camp':
    case 'juggernaut_camp': {
      // payload = array of alive camp col indices
      const scored = payload.map((col) => {
        const c = obs.bot.camps[col];
        let pain = CAMP_BASE_POWER[c.id] || 7;
        if (kind === 'raiders_camp' && c.damaged) pain += 100; // NEVER kill a damaged camp if an undamaged one exists!
        if (kind === 'juggernaut_camp' && c.damaged) pain -= 5; // If forced to destroy a camp, prefer sacrificing an already damaged one!
        return { col, pain };
      });
      scored.sort((a, b) => a.pain - b.pain);
      return scored[0].col;
    }

    case 'scud_target': {
      // payload = array of legal targets on bot's board
      const scored = payload.map((t) => {
        let pain = 0;
        if (t.type === 'camp') {
          pain = t.damaged ? 120 : 28;
        } else {
          const base = PERSON_VALUE[t.id] || 5;
          pain = t.id === 'punk' ? 7 : t.damaged ? base * 1.4 : base * 0.7;
        }
        return { t, pain };
      });
      scored.sort((a, b) => a.pain - b.pain);
      return scored[0].t;
    }

    case 'mercenary_choice': {
      const { canDiscard2, oppCards } = payload;
      // Pick least painful card to destroy
      const scored = oppCards.map((t) => {
        const pain = t.type === 'camp' ? 95 : (PERSON_VALUE[t.id] || 5) * (t.damaged ? 0.6 : 1.3);
        return { t, pain };
      });
      scored.sort((a, b) => a.pain - b.pain);
      const cheapestLoss = scored[0];
      // Discard 2 cards if losing the cheapest card hurts more than 9 pts (e.g. only camps or valuable people)
      if (canDiscard2 && (!cheapestLoss || cheapestLoss.pain > 9.5)) {
        const sortedHand = [...obs.bot.hand].sort(
          (a, b) => (PERSON_VALUE[a] || 6.5) - (PERSON_VALUE[b] || 6.5)
        );
        return { mode: 'discard', cards: sortedHand.slice(0, 2) };
      }
      return { mode: 'destroy', target: cheapestLoss.t };
    }

    case 'famine_keep': {
      // payload = array of { person, col, slot }
      const scored = payload.map((x) => ({
        uid: x.person.uid,
        v: personThreatValue(x.person, 'bot', obs),
      }));
      scored.sort((a, b) => b.v - a.v);
      return scored[0].uid;
    }

    case 'octagon_destroy': {
      const scored = payload.map((x) => ({
        x,
        v: personThreatValue(x.person, 'bot', obs),
      }));
      scored.sort((a, b) => a.v - b.v);
      return scored[0].x;
    }

    case 'vanguard_counter':
    case 'banish_target': {
      return pickBestTarget(obs, payload, kind === 'banish_target');
    }

    case 'napalm_col': {
      const cols = payload.map((col) => ({ type: 'column', owner: 'human', col }));
      return pickBestTarget(obs, cols).col;
    }

    case 'keep_one_card': {
      const sorted = [...payload].sort((a, b) => {
        const va = DECK_CARDS_BY_ID[a]?.type === 'person' ? PERSON_VALUE[a] || 6 : 8.2;
        const vb = DECK_CARDS_BY_ID[b]?.type === 'person' ? PERSON_VALUE[b] || 6 : 8.2;
        return vb - va;
      });
      return sorted[0];
    }

    case 'discard_n': {
      const { n, hand } = payload;
      const sorted = [...hand].sort((a, b) => {
        const va = DECK_CARDS_BY_ID[a]?.type === 'person' ? PERSON_VALUE[a] || 6 : 8.0;
        const vb = DECK_CARDS_BY_ID[b]?.type === 'person' ? PERSON_VALUE[b] || 6 : 8.0;
        return va - vb;
      });
      return sorted.slice(0, n);
    }

    default:
      return Array.isArray(payload) ? payload[0] : null;
  }
}

function buildStepVisuals(action, res) {
  const msg = String(res.message || '');
  const isDestroy = /destruye/i.test(msg);
  const isDamage = /daña|hiere/i.test(msg);
  const isRestore = /restaura/i.test(msg);
  const isWater = /\+1💧|Depósito de Agua/i.test(msg);
  const isRaid = /Asaltantes/i.test(msg);

  let source = null;
  let target = null;
  let kind = 'play';
  let sfx = 'play';

  if (action.type === 'play_person') {
    source = { side: 'bot', type: 'person', col: res.col ?? action.col, slot: res.slot ?? action.slot, cardId: action.cardId };
    if (action.restoreTarget) {
      target = { side: 'bot', type: action.restoreTarget.type, col: action.restoreTarget.col, slot: action.restoreTarget.slot ?? 0 };
    }
    kind = 'play';
    sfx = isRestore ? 'restore' : 'play';
  } else if (action.type === 'play_event') {
    source = { side: 'bot', type: 'event', slot: res.slot ? res.slot - 1 : null, cardId: action.cardId };
    kind = 'event';
    sfx = isDestroy ? 'destroy' : isDamage ? 'damage' : 'event';
  } else if (action.type === 'activate_ability') {
    source = { side: 'bot', type: action.source.type, col: action.source.col, slot: action.source.slot ?? 0 };
    if (action.target && action.target.type !== 'column') {
      target = {
        side: action.target.owner || 'human',
        type: action.target.type,
        col: action.target.col,
        slot: action.target.slot ?? 0,
      };
    } else if (action.target?.type === 'column') {
      target = { side: action.target.owner || 'human', type: 'column', col: action.target.col };
    } else if (action.targetCol !== undefined) {
      target = { side: 'human', type: 'column', col: action.targetCol };
    } else if (action.restoreTarget) {
      target = {
        side: 'bot',
        type: action.restoreTarget.type,
        col: action.restoreTarget.col,
        slot: action.restoreTarget.slot ?? 0,
      };
    }
    kind = isDestroy ? 'destroy' : isDamage ? 'damage' : isRestore ? 'restore' : isWater ? 'water' : isRaid ? 'event' : 'ability';
    sfx = kind === 'ability' ? 'play' : kind;
  } else if (action.type === 'junk_card') {
    if (action.target) {
      target = {
        side: action.target.owner || (isRestore ? 'bot' : 'human'),
        type: action.target.type,
        col: action.target.col,
        slot: action.target.slot ?? 0,
      };
    }
    kind = isDestroy ? 'destroy' : isDamage ? 'damage' : isRestore ? 'restore' : isWater ? 'water' : isRaid ? 'event' : 'junk';
    sfx = kind === 'junk' ? 'play' : kind;
  } else if (action.type === 'take_silo' || action.type === 'junk_silo') {
    kind = 'water';
    sfx = 'water';
  }

  return {
    highlight: { source, target, kind, banner: res.botVoice || msg },
    sfx,
  };
}

// === 7. EXECUTE SINGLE BOT ACTION STEP ===
function runBotStep(state, rng = Math.random) {
  if (state.phase !== 'playing' || state.activePlayer !== 'bot' || state.pendingChoice) {
    return { done: true, paused: !!state.pendingChoice, messages: [] };
  }

  const obs = getBotObservation(state);
  const action = chooseBestBotAction(obs, state.difficulty, rng);
  if (!action) {
    return { done: true, endedTurn: true, messages: [] };
  }

  const res = executeActionOnState(state, action, rng, chooseBotDefensiveResponse);
  if (!res.ok) {
    return { done: true, endedTurn: true, messages: [] };
  }

  const msg = decorateBanter(state.personality, res.message, action, rng);
  const voice = decorateBanter(state.personality, res.botVoice || res.message, action, rng);
  const visuals = buildStepVisuals(action, res);
  return {
    done: state.phase === 'gameover' || !!state.pendingChoice,
    paused: !!state.pendingChoice,
    gameOver: state.phase === 'gameover',
    endedTurn: false,
    message: msg,
    voice,
    action,
    highlight: visuals.highlight,
    sfx: visuals.sfx,
  };
}

const WASTELAND_QUIPS = [
  'En el yermo nadie regala agua.',
  '¡A cubrir esos campamentos!',
  'Chatarra bien aprovechada.',
  'Se viene tormenta de arena.',
  'Cada gota cuenta.',
  'Ese flanco quedó regalado.',
];

function decorateBanter(personality, message, action, rng) {
  if (personality !== 'wasteland') return message;
  if (action.type === 'play_event' || (action.type === 'activate_ability' && rng() < 0.25)) {
    const quip = WASTELAND_QUIPS[Math.floor(rng() * WASTELAND_QUIPS.length)];
    return `${message} ${quip}`;
  }
  return message;
}


// ===== parser.js =====
// Offline Rioplatense / LatAm Spanish Voice & Chat Command Parser for Radlands Hybrid Bot
// Handles accents, voseo, spoken numbers, typos (Levenshtein), official Spanish + English card names + custom aliases.


function normalizeEs(str) {
  return String(str || '')
    .toLowerCase()
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g, '') // strip accents/diacritics
    .replace(/[¿?¡!.,;:()\[\]"'«»]/g, ' ')
    .replace(/\s+/g, ' ')
    .trim();
}

function levenshtein(a, b) {
  if (a === b) return 0;
  if (!a.length) return b.length;
  if (!b.length) return a.length;
  const v0 = new Array(b.length + 1);
  const v1 = new Array(b.length + 1);
  for (let i = 0; i <= b.length; i++) v0[i] = i;
  for (let i = 0; i < a.length; i++) {
    v1[0] = i + 1;
    for (let j = 0; j < b.length; j++) {
      const cost = a[i] === b[j] ? 0 : 1;
      v1[j + 1] = Math.min(v1[j] + 1, v0[j + 1] + 1, v0[j] + cost);
    }
    for (let j = 0; j <= b.length; j++) v0[j] = v1[j];
  }
  return v0[b.length];
}

// Build searchable phrase dictionary for cards
function buildCardSearchIndex(pool = 'all') {
  const custom = getCustomAliases();
  const list =
    pool === 'camps' ? CAMPS : pool === 'deck' ? DECK_CARDS : [...CAMPS, ...DECK_CARDS];

  const entries = [];
  for (const card of list) {
    const terms = new Set([
      normalizeEs(card.nameEs),
      normalizeEs(card.nameEn),
      ...(card.aliases || []).map(normalizeEs),
      ...(custom[card.id] || []).map(normalizeEs),
    ]);
    for (const term of terms) {
      if (term.length >= 2) {
        entries.push({ id: card.id, term, card, len: term.length });
      }
    }
  }
  // Longer phrases first so "deposito de suministros" beats "deposito"
  entries.sort((a, b) => b.len - a.len);
  return entries;
}

/**
 * Finds all matching cards mentioned in a Spanish utterance (ordered by position in string).
 * Supports exact substring match first, then fuzzy token-window Levenshtein match.
 */
function extractCardsFromText(rawText, pool = 'all', opts = {}) {
  const norm = normalizeEs(rawText);
  if (!norm) return [];
  const entries = buildCardSearchIndex(pool);
  const found = [];
  const occupiedRanges = [];

  const overlaps = (start, end) =>
    occupiedRanges.some(([s, e]) => Math.max(start, s) < Math.min(end, e));

  // Pass 1: exact word-boundary substring matches (longest phrase first)
  for (const entry of entries) {
    const escaped = entry.term.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    const re = new RegExp(`(?:^|\\s)(${escaped})(?:$|\\s)`, 'g');
    let m;
    while ((m = re.exec(norm)) !== null) {
      const start = m.index + (m[0].startsWith(' ') ? 1 : 0);
      const end = start + m[1].length;
      if (!overlaps(start, end)) {
        occupiedRanges.push([start, end]);
        found.push({ id: entry.id, card: entry.card, start, end, score: 1.0, matched: entry.term });
      }
    }
  }

  // Pass 2: fuzzy Levenshtein match on remaining unmatched n-grams (1..3 words) for voice typos
  const tokens = [];
  const tokenRe = /\S+/g;
  let tm;
  while ((tm = tokenRe.exec(norm)) !== null) {
    tokens.push({ word: tm[0], start: tm.index, end: tm.index + tm[0].length });
  }

  const STOP_WORDS = new Set([
    'el', 'la', 'los', 'las', 'un', 'una', 'unos', 'unas', 'de', 'del', 'al', 'en', 'con', 'por',
    'para', 'y', 'o', 'a', 'mi', 'mis', 'tu', 'tus', 'su', 'sus', 'yo', 'vos', 'bot', 'columna',
    'col', 'fila', 'izquierda', 'centro', 'medio', 'derecha', 'adelante', 'frente', 'atras',
    'detras', 'uno', 'dos', 'tres', '1', '2', '3', 'juego', 'bajo', 'pongo', 'tiro', 'uso',
    'activo', 'desecho', 'descarto', 'descarte', 'chatarra', 'robe', 'saco', 'saque', 'toco',
    'dano', 'hiero', 'destruyo', 'restauro', 'curo', 'contra', 'sobre', 'campamento', 'campamentos',
    'son', 'elegi', 'carta', 'cartas', 'agua', 'paso', 'termino', 'turno', 'que', 'me', 'te', 'se',
  ]);

  if (opts.allowFuzzy !== false) {
    for (let n = 3; n >= 1; n--) {
      for (let i = 0; i <= tokens.length - n; i++) {
        const start = tokens[i].start;
        const end = tokens[i + n - 1].end;
        if (overlaps(start, end)) continue;
        const sliceWords = tokens.slice(i, i + n).map((t) => t.word);
        if (n === 1 && (STOP_WORDS.has(sliceWords[0]) || sliceWords[0].length < 4)) continue;
        if (sliceWords.every((w) => STOP_WORDS.has(w))) continue;
        const phrase = sliceWords.join(' ');

        let best = null;
        for (const entry of entries) {
          if (Math.abs(entry.term.length - phrase.length) > 3) continue;
          const dist = levenshtein(phrase, entry.term);
          const maxAllowed = entry.term.length >= 8 ? 2 : entry.term.length >= 5 ? 1 : 0;
          if (dist <= maxAllowed) {
            const score = 1 - dist / Math.max(phrase.length, entry.term.length);
            if (!best || score > best.score) {
              best = { id: entry.id, card: entry.card, start, end, score, matched: entry.term };
            }
          }
        }
        if (best) {
          occupiedRanges.push([start, end]);
          found.push(best);
        }
      }
    }
  }

  found.sort((a, b) => a.start - b.start);
  return found;
}

// Column & Slot extraction from Spanish text
function extractColumn(rawText) {
  const norm = normalizeEs(rawText);
  // Explicit column keywords first
  const colRegex = /(?:col(?:umna)?|carril|fila|posicion)\s*(1|2|3|uno|una|primera|dos|segunda|tres|tercera|izquierda|izq|centro|medio|derecha|der)/;
  const m = norm.match(colRegex);
  if (m) return wordToCol(m[1]);

  if (/\b(?:izquierda|izq|primera)\b/.test(norm)) return 0;
  if (/\b(?:centro|medio|central|segunda)\b/.test(norm)) return 1;
  if (/\b(?:derecha|der|tercera)\b/.test(norm)) return 2;

  const enNum = norm.match(/\b(?:en|a|al|la|el)\s+(1|2|3|uno|dos|tres)\b/);
  if (enNum) return wordToCol(enNum[1]);

  const bareNum = norm.match(/(?:^|\s)(1|2|3)(?:$|\s)/);
  if (bareNum) return wordToCol(bareNum[1]);

  return null;
}

function wordToCol(w) {
  if (['1', 'uno', 'una', 'primera', 'izquierda', 'izq'].includes(w)) return 0;
  if (['2', 'dos', 'segunda', 'centro', 'medio', 'central'].includes(w)) return 1;
  if (['3', 'tres', 'tercera', 'derecha', 'der'].includes(w)) return 2;
  return null;
}

function extractSlot(rawText) {
  const norm = normalizeEs(rawText);
  if (/\b(?:adelante|frente|delante|delantera|frontal)\b/.test(norm)) return 1;
  if (/\b(?:atras|detras|trasera|fondo)\b/.test(norm)) return 0;
  return null;
}

// Resolve a target mentioned in the second half of a phrase (e.g., "contra tu cañón", "en tu columna 2", "a tu punki")
function resolveTargetFromText(rawText, legalTargets) {
  if (!legalTargets || legalTargets.length === 0) return null;
  const norm = normalizeEs(rawText);

  // Split after target prepositions if present so source card doesn't collide with target card!
  const splitMatch = norm.match(/\b(?:contra|sobre|hacia|a tu|al|en tu|tu|tuyo|del bot|mio|mi)\b(.*)$/);
  const focus = splitMatch ? splitMatch[1] : norm;

  // Check punk mention (including common Spanish dictation homophones!)
  if (/\b(?:punk[iy]?s?|panqu[ie]s?|pank[iy]?s?|funk[iy]?s?)\b/.test(focus)) {
    const col = extractColumn(focus);
    const punks = legalTargets.filter((t) => t.id === 'punk');
    if (punks.length > 0) {
      if (col !== null) return punks.find((p) => p.col === col) || punks[0];
      return punks[0];
    }
  }

  // Check camp/person card match inside focus
  const cards = extractCardsFromText(focus, 'all');
  if (cards.length > 0) {
    for (const c of cards) {
      const match = legalTargets.find((t) => t.id === c.id);
      if (match) return match;
    }
  }

  // Check column mention
  const col = extractColumn(focus);
  if (col !== null) {
    const inCol = legalTargets.filter((t) => t.col === col);
    if (inCol.length > 0) {
      if (/\bcampamento\b/.test(focus)) {
        return inCol.find((t) => t.type === 'camp') || inCol[0];
      }
      return inCol[0]; // unprotected person first (or camp if unprotected)
    }
  }

  if (legalTargets.length === 1) return legalTargets[0];
  return null;
}

// === MAIN NATURAL-LANGUAGE COMMAND PARSER ===
function parseUserInput(rawText, state) {
  const norm = normalizeEs(rawText);
  if (!norm) return { intent: 'empty' };

  // Global meta commands (work in any phase!)
  if (/^(?:deshacer|deshace|undo|volver|me equivoque|cancelar ultima|atras)$/.test(norm)) {
    return { intent: 'undo' };
  }
  if (/^(?:ayuda|help|comandos|como funciona|que puedo decir)$/.test(norm)) {
    return { intent: 'help' };
  }
  if (/^(?:estado|resumen|tablero|que tenes|como vamos|situacion|ver estado)$/.test(norm)) {
    return { intent: 'status' };
  }
  if (/^(?:nueva partida|reiniciar|empezar de nuevo|reset)$/.test(norm)) {
    return { intent: 'new_game' };
  }

  // === PHASE: PENDING CHOICE ===
  if (state.pendingChoice) {
    return parsePendingChoiceReply(rawText, norm, state);
  }

  // === PHASE: SETUP CAMPS ===
  if (state.phase === 'setup_camps') {
    const camps = extractCardsFromText(rawText, 'camps');
    if (/\b(?:descarte|descartados|deje fuera|saque fuera)\b/.test(norm) && !/\b(?:mis campamentos|elegi|tengo)\b/.test(norm)) {
      return { intent: 'setup_discarded_camps', campIds: [...new Set(camps.map((c) => c.id))] };
    }
    // Check if user said BOTH active + discarded ("mis campamentos son X, Y, Z y descarté A, B, C")
    const discSplit = norm.split(/\b(?:y\s+)?(?:descarte|descartados|deje fuera)\b/);
    if (discSplit.length === 2) {
      const active = [...new Set(extractCardsFromText(discSplit[0], 'camps').map((c) => c.id))];
      const discarded = [...new Set(extractCardsFromText(discSplit[1], 'camps').map((c) => c.id))];
      if (active.length === 3) {
        return { intent: 'setup_camps', campIds: active, discardedCampIds: discarded };
      }
    }
    const uniqueIds = [...new Set(camps.map((c) => c.id))];
    if (uniqueIds.length === 3) {
      return { intent: 'setup_camps', campIds: uniqueIds, discardedCampIds: [] };
    }
    if (uniqueIds.length > 0 && uniqueIds.length < 3) {
      return {
        intent: 'error',
        error: `Reconocí solo ${uniqueIds.length} campamento(s): ${uniqueIds.map((id) => CAMPS_BY_ID[id].nameEs).join(', ')}. Necesito los 3 (ej: "Cañón, Hoguera y Almacén").`,
      };
    }
    return {
      intent: 'error',
      error: 'Decime tus 3 campamentos elegidos (ej: "mis campamentos son Cañón, Hoguera y Almacén") o seleccionalos en el panel.',
    };
  }

  // === PHASE: SETUP FIRST PLAYER ===
  if (state.phase === 'setup_first') {
    if (/\b(?:empiezo|arranco|voy yo|primero yo|yo|humano|nico)\b/.test(norm) && !/\bbot\b/.test(norm)) {
      return { intent: 'setup_first', who: 'human' };
    }
    if (/\b(?:bot|vos|maquina|cpu|empieza el bot|arranca el bot|empezas|arrancas)\b/.test(norm)) {
      return { intent: 'setup_first', who: 'bot' };
    }
    if (/\b(?:sorteo|azar|random|moneda|suerte|elegi vos|cualquiera)\b/.test(norm)) {
      return { intent: 'setup_first', who: 'random' };
    }
    return { intent: 'error', error: 'Decime "empiezo yo", "empieza el bot" o "sorteo".' };
  }

  // === PHASE: SETUP DRAW (Initial Hand) ===
  if (state.phase === 'setup_draw') {
    const cards = extractCardsFromText(rawText, 'deck');
    if (cards.length > 0) {
      return { intent: 'draw_cards', cardIds: cards.map((c) => c.id) };
    }
    return {
      intent: 'error',
      error: `Todavía faltan registrar ${state.human.pendingDraws} carta(s) inicial(es). Decime cuáles robaste (ej: "robé Francotirador, Musa y Napalm").`,
    };
  }

  // === PHASE: GAME OVER ===
  if (state.phase === 'gameover') {
    return { intent: 'error', error: 'La partida terminó. Decí "nueva partida" para jugar otra.' };
  }

  // === PHASE: PLAYING ===
  // 1. End turn (including natural spoken Spanish dictation variants!)
  if (/^(?:paso|pasar|paso turno|paso el turno|pasar turno|termino|termine|terminar|termino turno|termino mi turno|termine mi turno|fin|fin de turno|fin del turno|listo|tu turno|turno del bot|te toca|dale bot|dale vos|juga vos|juega el bot|va el bot)$/.test(norm)) {
    return { intent: 'end_turn' };
  }

  // 2. Water Silo take / junk
  if (/\b(?:silo|deposito de agua|tanque de agua|deposito)\b/.test(norm) && !/\bsuministros\b/.test(norm)) {
    if (/\b(?:desecho|desechar|chatarra|uso|usar|gasto|gastar|rompo|tiro|activo)\b/.test(norm)) {
      return { intent: 'junk_silo' };
    }
    if (/\b(?:tomo|tomar|agarro|agarrar|compro|comprar|llevo|llevar|mano)\b/.test(norm)) {
      return { intent: 'take_silo' };
    }
    // Smart toggle based on current location!
    return { intent: state.human.waterSiloInHand ? 'junk_silo' : 'take_silo' };
  }

  // 3. Buy Draw (2 water)
  if (/\b(?:robo con agua|robo por 2|robo por dos|compro carta|comprar carta|pago 2|pago dos|robar por 2|robar carta con agua)\b/.test(norm)) {
    return { intent: 'buy_draw' };
  }

  // 4. Report drawn physical card(s): "robé X", "saqué X", "me tocó X"
  if (/^(?:robe|robar|saque|me toco|toco|agarre|levante|tuve)\b/.test(norm)) {
    const cards = extractCardsFromText(rawText, 'deck');
    if (cards.length > 0) {
      return { intent: 'draw_cards', cardIds: cards.map((c) => c.id) };
    }
    return { intent: 'error', error: 'No reconocí qué carta robaste. Probá ej: "robé Francotirador" o "robé Musa y Napalm".' };
  }

  // 5. Reveal destroyed physical Punk ("el punki era napalm") OR plain discard
  if (/^(?:el punki era|punki era|el punk era|punk era|el panki era|el panqui era|el funky era)\b/.test(norm)) {
    const cards = extractCardsFromText(rawText, 'deck');
    if (cards.length > 0) {
      return { intent: 'reveal_punk', cardId: cards[0].id };
    }
  }
  if (/^(?:descarte|descarto al pozo|al descarte)\b/.test(norm)) {
    const cards = extractCardsFromText(rawText, 'deck');
    if (cards.length > 0) {
      return { intent: 'discard_plain', cardIds: cards.map((c) => c.id) };
    }
  }

  // 5b. Move own person ("muevo francotirador a columna 2", "mover mi punki a 3 adelante")
  if (/^(?:muevo|mover|cambio de lugar|reorganizo)\b/.test(norm)) {
    const cards = extractCardsFromText(rawText, 'deck');
    const isPunk = /\bpunk[iy]?\b/.test(norm);
    const parts = norm.split(/\b(?:a|hacia|al)\b/);
    const destPart = parts.length > 1 ? parts[parts.length - 1] : norm;
    return {
      intent: 'move_person',
      cardId: cards[0]?.id || (isPunk ? 'punk' : null),
      toCol: extractColumn(destPart),
      toSlot: extractSlot(destPart),
    };
  }

  // 6. Junk card from hand (Chatarra / Desechar)
  if (/\b(?:desecho|desechar|chatarra|por chatarra|para chatarra|basura|tiro por|descarto por chatarra)\b/.test(norm)) {
    const cards = extractCardsFromText(rawText, 'deck');
    if (cards.length === 0) {
      return { intent: 'error', error: 'Decime qué carta desechás por chatarra (ej: "desecho Explorador").' };
    }
    const junkedId = cards[0].id;
    const afterCard = rawText.slice(Math.min(rawText.length, cards[0].end));
    return {
      intent: 'junk_card',
      cardId: junkedId,
      col: extractColumn(afterCard),
      slot: extractSlot(afterCard),
      rawTargetText: afterCard,
    };
  }

  // 7. Play a card (Person or Event): "juego X", "bajo X", "pongo X", "tiro X"
  if (/^(?:juego|jugar|bajo|bajar|pongo|poner|despliego|tiro|lanzo|mando)\b/.test(norm)) {
    const cards = extractCardsFromText(rawText, 'deck');
    if (cards.length === 0) {
      return { intent: 'error', error: 'No reconocí qué carta querés jugar. Ej: "juego Francotirador en 2" o "juego Napalm".' };
    }
    const cardId = cards[0].id;
    const card = DECK_CARDS_BY_ID[cardId];
    return {
      intent: card.type === 'event' ? 'play_event' : 'play_person',
      cardId,
      col: extractColumn(rawText),
      slot: extractSlot(rawText),
      rawTargetText: rawText,
    };
  }

  // 8. Activate ability: "uso X", "activo X", "disparo con X", "ataco con X"
  if (/^(?:uso|usar|activo|activar|disparo|ataco|pego|habilidad)\b/.test(norm)) {
    return parseActivateAbility(rawText, norm, state);
  }

  // 9. Direct physical shortcuts (damage / injure / destroy / restore / gain punk / raid / water)
  if (/^(?:dano|danar|hiero|herir|destruyo|destruir|mato|matar)\b/.test(norm)) {
    const isDestroy = /^(?:destruyo|destruir|mato|matar)\b/.test(norm);
    const isInjure = /^(?:hiero|herir)\b/.test(norm);
    const hitSelf = /\b(?:mi|mio|propio|propia)\b/.test(norm) && !/\b(?:tu|tuyo|bot)\b/.test(norm);
    return {
      intent: 'direct_attack',
      mode: isDestroy ? 'destroy' : isInjure ? 'injure' : 'damage',
      owner: hitSelf ? 'human' : 'bot',
      rawText,
    };
  }
  if (/^(?:restauro|restaurar|curo|curar|reparo|reparar)\b/.test(norm)) {
    return { intent: 'direct_restore', rawText };
  }
  if (/\b(?:(?:gano|ganar|pongo|poner|sumo|nuevo|un)\s+)+(?:punk[iy]?|pank[iy]?|panqu[ie]|funk[iy]?)\b|\b(?:punk[iy]?|pank[iy]?|panqu[ie]|funk[iy]?)\s+en\b/.test(norm)) {
    return { intent: 'direct_punk', col: extractColumn(rawText), slot: extractSlot(rawText) };
  }
  if (/^(?:asalto|asaltar|asaltantes|asaltante|raid|reid|raiders|reiders|avanzo asaltantes|avanzar asaltantes)$/.test(norm)) {
    return { intent: 'direct_raid' };
  }
  if (/^(?:\+?1\s*agua|sumo\s*1?\s*agua|agua extra|mas 1 agua)$/.test(norm)) {
    return { intent: 'direct_water', delta: 1 };
  }
  if (/^(?:-1\s*agua|gasto\s*1?\s*agua|resto\s*1?\s*agua)$/.test(norm)) {
    return { intent: 'direct_water', delta: -1 };
  }

  // 10. Context-smart fallback!
  // If human owes pendingDraws and just typed/spoke card name(s) directly, treat as draw!
  const deckCards = extractCardsFromText(rawText, 'deck');
  if (state.human.pendingDraws > 0 && deckCards.length > 0) {
    return { intent: 'draw_cards', cardIds: deckCards.map((c) => c.id) };
  }

  // If user named one of their ready cards on board, treat as activate ability!
  const allFound = extractCardsFromText(rawText, 'all');
  if (allFound.length > 0) {
    const firstId = allFound[0].id;
    const onBoard = findOwnBoardCardById(state, 'human', firstId);
    if (onBoard) {
      return parseActivateAbility(`uso ${rawText}`, `uso ${norm}`, state);
    }
    if (DECK_CARDS_BY_ID[firstId]) {
      const card = DECK_CARDS_BY_ID[firstId];
      return {
        intent: card.type === 'event' ? 'play_event' : 'play_person',
        cardId: firstId,
        col: extractColumn(rawText),
        slot: extractSlot(rawText),
        rawTargetText: rawText,
      };
    }
  }

  return {
    intent: 'unknown',
    error: `No entendí "${rawText}". Probá ej: "robé [carta]", "juego [carta] en 2", "uso [carta] contra tu [objetivo]", "desecho [carta]", "paso" o "ayuda".`,
  };
}

function findOwnBoardCardById(state, playerKey, cardId) {
  const p = state[playerKey];
  for (let col = 0; col < 3; col++) {
    if (p.camps[col] && !p.camps[col].destroyed && p.camps[col].id === cardId) {
      return { type: 'camp', col, obj: p.camps[col] };
    }
    for (let slot = 0; slot < 2; slot++) {
      const per = p.columns[col][slot];
      if (per && !per.isPunk && per.id === cardId) {
        return { type: 'person', col, slot, obj: per };
      }
    }
  }
  return null;
}

function parseActivateAbility(rawText, norm, state) {
  // Check if user said "uso mi punki..." (Argo Yesky granted damage!)
  if (/\b(?:mi\s+)?punk[iy]?\b/.test(norm.split(/\b(?:contra|sobre|a tu|en tu)\b/)[0])) {
    const punks = getAllPeople(state, 'human').filter((x) => x.person.isPunk && x.person.ready);
    if (punks.length > 0) {
      return {
        intent: 'use_ability',
        source: { type: 'person', col: punks[0].col, slot: punks[0].slot },
        abilityId: 'argo_granted_damage',
        rawTargetText: rawText,
      };
    }
  }

  // Split source phrase vs target phrase
  const parts = norm.split(/\b(?:contra|sobre|a tu|en tu|para)\b/);
  const sourcePart = parts[0] || norm;
  const targetPart = parts.slice(1).join(' ') || norm;

  const sourceCards = extractCardsFromText(sourcePart, 'all');
  let foundSource = null;

  for (const sc of sourceCards) {
    const match = findOwnBoardCardById(state, 'human', sc.id);
    if (match) {
      foundSource = match;
      break;
    }
  }

  // Also allow "uso campamento 1 / izquierdo / centro / derecho"
  if (!foundSource && /\bcampamento\b/.test(sourcePart)) {
    const col = extractColumn(sourcePart);
    if (col !== null && state.human.camps[col] && !state.human.camps[col].destroyed) {
      foundSource = { type: 'camp', col, obj: state.human.camps[col] };
    }
  }

  if (!foundSource) {
    return {
      intent: 'error',
      error: 'No encontré esa carta en tu tablero para activar. Decime el nombre exacto de tu persona o campamento (ej: "uso Cañón contra tu columna 2").',
    };
  }

  const abilities = getAvailableAbilitiesForCard(
    state,
    'human',
    foundSource.type,
    foundSource.col,
    foundSource.slot || 0
  );

  // Pick specific sub-ability for multi-ability camps/people (Outpost, Victory Totem, Cache, Scavenger, Rabble Rouser, Mutant)
  let abilityId = abilities[0]?.id || null;
  if (abilities.length > 1) {
    if (/\b(?:asaltar|asalto|raid|asaltantes)\b/.test(norm)) {
      abilityId = abilities.find((a) => a.kind === 'raid')?.id || abilityId;
    } else if (/\b(?:restaurar|restauro|curar|reparar)\b/.test(norm)) {
      abilityId = abilities.find((a) => a.kind.includes('restore'))?.id || abilityId;
    } else if (/\b(?:robar|robo|carta)\b/.test(norm)) {
      abilityId = abilities.find((a) => a.kind.includes('draw'))?.id || abilityId;
    } else if (/\b(?:punki|punk)\b/.test(norm)) {
      abilityId = abilities.find((a) => a.kind.includes('punk'))?.id || abilityId;
    } else if (/\b(?:agua)\b/.test(norm)) {
      abilityId = abilities.find((a) => a.kind.includes('water'))?.id || abilityId;
    } else if (/\b(?:danar|dano|pegar|atacar|contra)\b/.test(norm)) {
      abilityId = abilities.find((a) => a.kind.includes('damage'))?.id || abilityId;
    }
  }

  return {
    intent: 'use_ability',
    source: { type: foundSource.type, col: foundSource.col, slot: foundSource.slot || 0 },
    abilityId,
    rawTargetText: targetPart || rawText,
    fullRawText: rawText,
  };
}

function parsePendingChoiceReply(rawText, norm, state) {
  const pc = state.pendingChoice;

  // Mercenary Camp: check if user chose to discard 2 cards!
  if (pc.kind === 'mercenary_choice') {
    if (/\b(?:descarto|descartar|tiro 2|dos cartas|descarte)\b/.test(norm)) {
      const cards = extractCardsFromText(rawText, 'deck').map((c) => c.id);
      return { intent: 'answer_choice', selection: 'discard2', extra: { mode: 'discard', cards } };
    }
  }

  // For camp-column choices (raiders_camp, juggernaut_camp, napalm_col)
  if (pc.kind === 'raiders_camp' || pc.kind === 'juggernaut_camp' || pc.kind === 'napalm_col') {
    const col = extractColumn(rawText);
    if (col !== null && pc.options.some((o) => o.value === col)) {
      return { intent: 'answer_choice', selection: col };
    }
    const camps = extractCardsFromText(rawText, 'camps');
    if (camps.length > 0) {
      const match = pc.options.find((o) => state.human.camps[o.value]?.id === camps[0].id);
      if (match) return { intent: 'answer_choice', selection: match.value };
    }
  }

  // Generic match by option index ("1", "2", "el 3")
  const numMatch = norm.match(/\b(\d+)\b/);
  if (numMatch) {
    const idx = parseInt(numMatch[1], 10) - 1;
    if (pc.kind === 'mercenary_choice') {
      const destroyOpts = pc.options.filter((o) => o.mode === 'destroy');
      if (destroyOpts[idx]) {
        return { intent: 'answer_choice', selection: destroyOpts[idx].value };
      }
    } else if (pc.options[idx]) {
      return { intent: 'answer_choice', selection: pc.options[idx].value };
    }
  }

  // Match by card name or punk
  if (/\bpunk[iy]?\b/.test(norm)) {
    const match = pc.options.find((o) => normalizeEs(o.labelEs).includes('punki'));
    if (match) return { intent: 'answer_choice', selection: match.value };
  }
  const cards = extractCardsFromText(rawText, 'all');
  if (cards.length > 0) {
    for (const c of cards) {
      const cName = normalizeEs(ALL_CARDS_BY_ID[c.id]?.nameEs || '');
      const match = pc.options.find((o) => normalizeEs(o.labelEs).includes(cName));
      if (match) return { intent: 'answer_choice', selection: match.value };
    }
  }

  return {
    intent: 'error',
    error: `Respondé a la decisión pendiente: ${pc.promptEs} (o tocá un botón abajo).`,
  };
}

// Autocomplete helper for chat input box!
function getAutocompleteSuggestions(inputText, state) {
  const norm = normalizeEs(inputText);
  if (!norm || norm.length < 2) return [];

  const tokens = norm.split(' ');
  const lastWord = tokens[tokens.length - 1];
  if (lastWord.length < 2) return [];

  const pool = state.phase === 'setup_camps' ? CAMPS : [...CAMPS, ...DECK_CARDS];
  const matches = [];
  for (const card of pool) {
    const es = normalizeEs(card.nameEs);
    const en = normalizeEs(card.nameEn);
    if (es.includes(lastWord) || en.includes(lastWord) || (card.aliases || []).some((a) => normalizeEs(a).includes(lastWord))) {
      matches.push(card);
    }
  }
  return matches.slice(0, 6);
}


// ===== controller.js =====
// Radlands Hybrid Game Controller
// Connects natural-language Spanish commands (voice/chat) + HUD clicks -> Engine + Tactical AI




function buildWelcomeState(options = {}) {
  const state = createInitialState(options);
  addLog(
    state,
    'system',
    'Elegí tus 3 campamentos físicos en el selector o por voz (ej: "mis campamentos son Cañón, Hoguera y Almacén").',
    { speak: false }
  );
  return state;
}

function formatBoardSummary(state) {
  const fmtCamps = (side) =>
    state[side].camps
      .map((c, i) => {
        const st = c.destroyed ? 'DESTRUIDO' : c.damaged ? 'DAÑADO' : 'sano';
        const jg = c.id === 'juggernaut' && c.juggernautStep ? ` [paso ${c.juggernautStep}/3]` : '';
        return `${i + 1}) ${getCardNameEs(c.id)} (${st}${jg})`;
      })
      .join(', ');

  const fmtPeople = (side) => {
    const all = getAllPeople(state, side);
    if (all.length === 0) return 'ninguna';
    return all
      .map(({ person, col, slot }) => {
        const nm = person.isPunk ? 'Punki' : getCardNameEs(person.id);
        const st = person.damaged ? 'dañado' : person.ready ? 'lista' : 'agotada';
        return `${nm} (${COL_SHORT_ES[col]} ${SLOT_NAMES_ES[slot]}, ${st})`;
      })
      .join('; ');
  };

  const fmtEvents = (side) => {
    const evs = state[side].events
      .map((e, i) => (e ? `[${i + 1}] ${getCardNameEs(e)}` : null))
      .filter(Boolean);
    return evs.length ? evs.join(', ') : 'vacía';
  };

  return [
    `Turno ${state.turn} (${state.activePlayer === 'human' ? 'Tu turno' : 'Turno del Bot'}) | Mazo: ${state.deck.length} | Descarte: ${state.discard.length} | Rebarajados: ${state.reshuffles}/1`,
    `🤖 BOT (${getTotalWater(state.bot)}💧, Mano: ${state.bot.hand.length}, Silo: ${state.bot.waterSiloInHand ? 'en mano' : 'en mesa'})`,
    `  Campamentos: ${fmtCamps('bot')}`,
    `  Personas: ${fmtPeople('bot')}`,
    `  Eventos: ${fmtEvents('bot')}`,
    `🧑 VOS (${getTotalWater(state.human)}💧, Mano: ${getHumanHandSize(state)}, Silo: ${state.human.waterSiloInHand ? 'en mano' : 'en mesa'})`,
    `  Campamentos: ${fmtCamps('human')}`,
    `  Personas: ${fmtPeople('human')}`,
    `  Eventos: ${fmtEvents('human')}`,
  ].join('\n');
}

function getHelpTextEs() {
  return [
    'Comandos por voz o chat:',
    '• Robar (mazo compartido): "robé Francotirador" o "robé Musa, Napalm y Artillero"',
    '• Jugar persona/evento: "juego Francotirador en 2" · "bajo Musa en izquierda atrás" · "juego Napalm"',
    '• Usar habilidad: "uso Francotirador contra tu Cañón" · "activo Musa" · "uso Cañón en columna 1"',
    '• Chatarra (0💧): "desecho Explorador" · "chatarra de Pirómano contra tu Musa"',
    '• Silo y robo pago: "tomo depósito" · "uso depósito" · "robo por 2"',
    '• Atajos manuales: "daño tu columna 2" · "restauro mi Hoguera" · "gano punki en 1" · "asaltar" · "descarté [cartas]"',
    '• Control: "paso" (termina tu turno) · "estado" · "deshacer" · "nueva partida"',
  ].join('\n');
}

// Executes a single Bot action step (for animated step-by-step playback in UI or looped execution in tests).
function executeOneBotStep(state, rng = Math.random) {
  if (state.phase !== 'playing' || state.activePlayer !== 'bot' || state.pendingChoice) {
    return {
      ok: true,
      done: true,
      spoken: [],
      paused: !!state.pendingChoice,
      gameOver: state.phase === 'gameover',
      highlight: null,
      sfx: null,
      eventAlert: false,
    };
  }

  const spoken = [];
  const step = runBotStep(state, rng);

  if (step.message) {
    addLog(state, 'bot', step.message);
    spoken.push(step.voice || step.message);
  }

  if (step.gameOver || state.phase === 'gameover') {
    if (state.winReason) {
      addLog(state, 'system', `🏆 ${state.winReason}`);
      spoken.push(state.winReason);
    }
    return {
      ok: true,
      done: true,
      spoken,
      paused: false,
      gameOver: true,
      highlight: step.highlight || null,
      sfx: state.winner === 'human' ? 'win' : 'lose',
      eventAlert: false,
    };
  }

  if (step.paused || state.pendingChoice) {
    return {
      ok: true,
      done: true,
      spoken,
      paused: true,
      gameOver: false,
      highlight: step.highlight || null,
      sfx: step.sfx || 'alert',
      eventAlert: false,
    };
  }

  if (!step.endedTurn && !step.done) {
    return {
      ok: true,
      done: false,
      spoken,
      paused: false,
      gameOver: false,
      highlight: step.highlight || null,
      sfx: step.sfx || 'play',
      eventAlert: false,
    };
  }

  // Bot has no more actions -> announce "Paso." and hand turn back to Human
  const endMsg = 'Paso.';
  addLog(state, 'bot', endMsg);
  spoken.push(endMsg);

  const nextRes = endTurn(state, rng, chooseBotDefensiveResponse);
  if (nextRes.messages) {
    for (const m of nextRes.messages) {
      addLog(state, 'system', m, { speak: false });
    }
  }
  if (nextRes.botVoiceMessages && nextRes.botVoiceMessages.length > 0) {
    spoken.push(...nextRes.botVoiceMessages);
  }
  if (checkGameOver(state)) {
    addLog(state, 'system', `🏆 ${state.winReason}`);
    spoken.push(state.winReason);
  }
  return {
    ok: true,
    done: true,
    endedTurn: true,
    spoken,
    paused: !!state.pendingChoice,
    gameOver: state.phase === 'gameover',
    highlight: { source: null, target: null, kind: 'pass', banner: 'Paso.' },
    sfx: state.phase === 'gameover' ? (state.winner === 'human' ? 'win' : 'lose') : nextRes.eventAlert ? 'alert' : 'pass',
    eventAlert: !!nextRes.eventAlert,
  };
}

// Runs the Bot's full turn synchronously until it decides to pass, wins, or pauses for a Human pendingChoice!
function runBotTurnLoop(state, rng = Math.random) {
  const spokenSteps = [];
  let safety = 0;

  while (
    state.phase === 'playing' &&
    state.activePlayer === 'bot' &&
    !state.pendingChoice &&
    safety < 14
  ) {
    safety++;
    const step = executeOneBotStep(state, rng);
    if (step.spoken && step.spoken.length > 0) {
      spokenSteps.push(...step.spoken);
    }
    if (step.done) {
      return {
        ok: true,
        spoken: spokenSteps,
        paused: !!step.paused,
        gameOver: !!step.gameOver,
      };
    }
  }

  return { ok: true, spoken: spokenSteps, paused: !!state.pendingChoice, gameOver: state.phase === 'gameover' };
}

function classifyHumanSfx(res, state) {
  if (state.phase === 'gameover') return state.winner === 'human' ? 'win' : 'lose';
  const msg = String(res?.message || '');
  if (/destruye|destruido|destruida/i.test(msg)) return 'destroy';
  if (/daña|dañado|dañada|hiere|herido/i.test(msg)) return 'damage';
  if (/restaura/i.test(msg)) return 'restore';
  if (/💧|Depósito de Agua/i.test(msg)) return 'water';
  if (/evento|Asaltantes/i.test(msg)) return 'event';
  return 'play';
}

function handleUserCommand(state, rawText, options = {}) {
  const rng = options.rng || Math.random;
  const deferBotTurn = Boolean(options.deferBotTurn);
  const trimmed = String(rawText || '').trim();
  if (!trimmed) return { ok: false, spoken: [] };

  const parsed = parseUserInput(trimmed, state);
  const spoken = [];

  // Mask draw commands in chat log so hidden cards stay private!
  const isSecretDraw = parsed.intent === 'draw_cards';
  if (!isSecretDraw && parsed.intent !== 'empty') {
    addLog(state, 'human', trimmed, { speak: false });
  }

  if (parsed.intent === 'empty') return { ok: false, spoken: [] };

  if (parsed.intent === 'error' || parsed.intent === 'unknown') {
    addLog(state, 'system', parsed.error, { speak: false });
    return { ok: false, error: parsed.error, spoken: [] };
  }

  if (parsed.intent === 'help') {
    const txt = getHelpTextEs();
    addLog(state, 'system', txt, { speak: false });
    return { ok: true, spoken: [] };
  }

  if (parsed.intent === 'status') {
    const txt = formatBoardSummary(state);
    addLog(state, 'system', txt, { speak: false });
    return { ok: true, spoken: [buildShortVoiceSummary(state)] };
  }

  if (parsed.intent === 'undo') {
    const u = undoState(state);
    const msg = u.ok ? u.message : u.error;
    addLog(state, 'system', msg, { speak: false });
    return { ok: u.ok, spoken: [] };
  }

  if (parsed.intent === 'new_game') {
    const fresh = buildWelcomeState({
      difficulty: state.difficulty,
      personality: state.personality,
      fastMode: state.fastMode,
      rng,
    });
    Object.keys(state).forEach((k) => delete state[k]);
    Object.assign(state, fresh);
    return { ok: true, spoken: [] };
  }

  // === SETUP DISCARDED CAMPS ===
  if (parsed.intent === 'setup_discarded_camps') {
    pushUndoSnapshot(state);
    state.excludedCamps = [...new Set([...state.excludedCamps, ...parsed.campIds])];
    const names = parsed.campIds.map(getCardNameEs).join(', ');
    addLog(state, 'system', `Excluidos del pool del bot: ${names}.`, { speak: false });
    return { ok: true, spoken: [] };
  }

  // === SETUP ACTIVE CAMPS ===
  if (parsed.intent === 'setup_camps') {
    const allDiscarded = [...new Set([...state.excludedCamps, ...(parsed.discardedCampIds || [])])];
    const res = setupHumanCamps(state, parsed.campIds, allDiscarded, chooseBotCamps, rng);
    if (!res.ok) {
      addLog(state, 'system', res.error, { speak: false });
      return { ok: false, error: res.error, spoken: [] };
    }
    return { ok: true, spoken: res.botVoice ? [res.botVoice] : [], sfx: 'play' };
  }

  // === SETUP FIRST PLAYER ===
  if (parsed.intent === 'setup_first') {
    const res = setFirstPlayer(state, parsed.who, rng);
    if (!res.ok) {
      addLog(state, 'system', res.error, { speak: false });
      return { ok: false, error: res.error, spoken: [] };
    }
    if (res.botVoice) spoken.push(res.botVoice);
    if (res.messages) {
      for (const m of res.messages) {
        addLog(state, state.activePlayer === 'bot' ? 'bot' : 'system', m, { speak: false });
      }
    }
    if (res.botVoiceMessages && res.botVoiceMessages.length > 0) {
      spoken.push(...res.botVoiceMessages);
    }
    if (state.phase === 'playing' && state.activePlayer === 'bot' && !state.pendingChoice) {
      if (deferBotTurn) {
        return { ok: true, spoken, botTurnPending: true, sfx: 'play', eventAlert: !!res.eventAlert };
      }
      const botRes = runBotTurnLoop(state, rng);
      spoken.push(...botRes.spoken);
    }
    return { ok: true, spoken, sfx: 'play', eventAlert: !!res.eventAlert };
  }

  // === ANSWER PENDING CHOICE ===
  if (parsed.intent === 'answer_choice') {
    const res = resolvePendingChoice(state, parsed.selection, parsed.extra || {});
    if (!res.ok) {
      addLog(state, 'system', res.error, { speak: false });
      return { ok: false, error: res.error, spoken: [] };
    }
    addLog(state, 'system', res.message, { speak: false });
    if (checkGameOver(state)) {
      addLog(state, 'system', `🏆 ${state.winReason}`);
      spoken.push(state.winReason);
      return { ok: true, spoken, sfx: state.winner === 'human' ? 'win' : 'lose' };
    }
    if (res.resumeBot && state.activePlayer === 'bot' && state.phase === 'playing' && !state.pendingChoice) {
      if (deferBotTurn) {
        return { ok: true, spoken, botTurnPending: true, sfx: classifyHumanSfx(res, state) };
      }
      const botRes = runBotTurnLoop(state, rng);
      spoken.push(...botRes.spoken);
    }
    return { ok: true, spoken, sfx: classifyHumanSfx(res, state) };
  }

  // === DRAW PHYSICAL CARDS (FAIR SHARED DECK) ===
  if (parsed.intent === 'draw_cards') {
    pushUndoSnapshot(state);
    const okNames = [];
    const errors = [];
    for (const cid of parsed.cardIds) {
      const dr = recordHumanDraw(state, cid, { rng });
      if (dr.ok) {
        okNames.push(getCardNameEs(cid));
      } else {
        errors.push(dr.error);
      }
    }
    if (okNames.length > 0) {
      addLog(
        state,
        'human',
        `🔒 Robaste ${okNames.length} carta(s) física(s) (oculta para la IA)`,
        { masked: true, secretText: okNames.join(', '), speak: false }
      );
    }
    if (errors.length > 0) {
      for (const e of errors) {
        addLog(state, 'system', `⚠️ ${e}`, { speak: false });
      }
    }

    // Check if initial setup_draw is complete!
    if (state.phase === 'setup_draw') {
      if (state.human.pendingDraws > 0) {
        addLog(state, 'system', `Faltan ${state.human.pendingDraws} robo(s) inicial(es).`, { speak: false });
        return { ok: true, spoken: [], sfx: 'play' };
      }
      state.phase = 'playing';
      const startRes = beginTurn(state, state.firstPlayer, rng, chooseBotDefensiveResponse);
      if (startRes.messages) {
        for (const m of startRes.messages) {
          addLog(state, state.activePlayer === 'bot' ? 'bot' : 'system', m, { speak: false });
        }
      }
      if (startRes.botVoiceMessages && startRes.botVoiceMessages.length > 0) {
        spoken.push(...startRes.botVoiceMessages);
      }
      if (state.activePlayer === 'bot' && state.phase === 'playing' && !state.pendingChoice) {
        if (deferBotTurn) {
          return { ok: true, spoken, botTurnPending: true, sfx: 'play', eventAlert: !!startRes.eventAlert };
        }
        const botRes = runBotTurnLoop(state, rng);
        spoken.push(...botRes.spoken);
      }
      return { ok: true, spoken, sfx: 'play', eventAlert: !!startRes.eventAlert };
    }

    // Normal mid-turn draw: silent!
    return { ok: okNames.length > 0, spoken: [], sfx: okNames.length > 0 ? 'play' : null };
  }

  // === PLAYING ACTIONS (Human turn check for standard actions) ===
  if (state.activePlayer !== 'human' && !['direct_attack', 'direct_restore', 'direct_punk', 'direct_water', 'discard_plain'].includes(parsed.intent)) {
    const err = 'No es tu turno en este momento.';
    addLog(state, 'system', err, { speak: false });
    return { ok: false, error: err, spoken: [] };
  }

  pushUndoSnapshot(state);

  if (parsed.intent === 'end_turn') {
    const res = endTurn(state, rng, chooseBotDefensiveResponse);
    if (!res.ok) {
      addLog(state, 'system', res.error, { speak: false });
      return { ok: false, error: res.error, spoken: [] };
    }
    if (res.messages) {
      for (const m of res.messages) {
        addLog(state, state.activePlayer === 'bot' ? 'bot' : 'system', m, { speak: false });
      }
    }
    if (res.botVoiceMessages && res.botVoiceMessages.length > 0) {
      spoken.push(...res.botVoiceMessages);
    }
    if (checkGameOver(state)) {
      addLog(state, 'system', `🏆 ${state.winReason}`);
      spoken.push(state.winReason);
      return { ok: true, spoken, sfx: state.winner === 'human' ? 'win' : 'lose' };
    }
    const turnSfx = res.eventAlert ? 'alert' : res.eventResolved ? 'event' : 'pass';
    if (state.activePlayer === 'bot' && !state.pendingChoice) {
      if (deferBotTurn) {
        return { ok: true, spoken, botTurnPending: true, sfx: turnSfx, eventAlert: !!res.eventAlert };
      }
      const botRes = runBotTurnLoop(state, rng);
      spoken.push(...botRes.spoken);
    }
    return { ok: true, spoken, sfx: turnSfx, eventAlert: !!res.eventAlert };
  }

  if (parsed.intent === 'take_silo') {
    const res = takeWaterSilo(state, 'human');
    return finalizeHumanAction(state, res);
  }

  if (parsed.intent === 'junk_silo') {
    const res = junkWaterSilo(state, 'human');
    return finalizeHumanAction(state, res);
  }

  if (parsed.intent === 'buy_draw') {
    const res = buyDrawCard(state, 'human', rng);
    return finalizeHumanAction(state, res);
  }

  if (parsed.intent === 'discard_plain') {
    const res = discardHumanCards(state, parsed.cardIds, rng);
    return finalizeHumanAction(state, res);
  }

  if (parsed.intent === 'reveal_punk') {
    const res = revealHumanDestroyedPunk(state, parsed.cardId, rng);
    return finalizeHumanAction(state, res);
  }

  if (parsed.intent === 'move_person') {
    if (parsed.toCol === null) {
      return finalizeHumanAction(state, { ok: false, error: 'Indicá a qué columna querés moverla (1, 2 o 3).' });
    }
    const all = getAllPeople(state, 'human');
    const found =
      parsed.cardId === 'punk'
        ? all.find((x) => x.person.isPunk)
        : all.find((x) => !x.person.isPunk && x.person.id === parsed.cardId);
    if (!found) {
      return finalizeHumanAction(state, { ok: false, error: 'No encontré esa persona en tu mesa para mover.' });
    }
    const res = movePersonPosition(state, 'human', found.col, found.slot, parsed.toCol, parsed.toSlot);
    return finalizeHumanAction(state, res);
  }

  if (parsed.intent === 'play_person') {
    let col = parsed.col;
    if (col === null) {
      const empty = getEmptyPersonSlots(state, 'human');
      if (empty.length === 0) {
        return finalizeHumanAction(state, { ok: false, error: 'Ya tenés 6 personas en mesa.' });
      }
      col = empty[0].col;
    }
    const card = DECK_CARDS_BY_ID[parsed.cardId];
    let restoreTarget = null;
    if (card?.enterPlay === 'restore') {
      const legalRest = getRestorableCards(state, 'human');
      restoreTarget = resolveTargetFromText(parsed.rawTargetText || '', legalRest) || legalRest[0] || null;
    }
    const res = playPerson(state, 'human', parsed.cardId, col, parsed.slot, { rng, restoreTarget });
    return finalizeHumanAction(state, res);
  }

  if (parsed.intent === 'play_event') {
    const targetCol = extractColumn(parsed.rawTargetText || '');
    const legalBanish = getLegalTargets(state, 'human', 'any_enemy_person');
    const target = resolveTargetFromText(parsed.rawTargetText || '', legalBanish);
    const res = playEvent(state, 'human', parsed.cardId, {
      rng,
      botChoiceFn: chooseBotDefensiveResponse,
      targetCol: targetCol !== null ? targetCol : undefined,
      target,
    });
    return finalizeHumanAction(state, res);
  }

  if (parsed.intent === 'junk_card') {
    const card = DECK_CARDS_BY_ID[parsed.cardId];
    let target = null;
    if (card?.junk === 'injure') {
      const legal = getLegalTargets(state, 'human', 'unprotected_enemy_person');
      target = resolveTargetFromText(parsed.rawTargetText || '', legal) || legal[0] || null;
    } else if (card?.junk === 'damage') {
      const legal = getLegalTargets(state, 'human', 'unprotected_enemy');
      target = resolveTargetFromText(parsed.rawTargetText || '', legal) || legal[0] || null;
    } else if (card?.junk === 'restore') {
      const legal = getRestorableCards(state, 'human');
      target = resolveTargetFromText(parsed.rawTargetText || '', legal) || legal[0] || null;
    }
    const res = junkCard(state, 'human', parsed.cardId, {
      rng,
      col: parsed.col,
      slot: parsed.slot,
      target,
      botChoiceFn: chooseBotDefensiveResponse,
    });
    return finalizeHumanAction(state, res);
  }

  if (parsed.intent === 'use_ability') {
    const abs = getAvailableAbilitiesForCard(
      state,
      'human',
      parsed.source.type,
      parsed.source.col,
      parsed.source.slot || 0
    );
    const ab = parsed.abilityId ? abs.find((a) => a.id === parsed.abilityId) || abs[0] : abs[0];
    let target = null;
    let targetCol = undefined;
    let restoreTarget = null;
    if (ab?.needsTarget === 'enemy_column') {
      const c = extractColumn(parsed.rawTargetText || '');
      const legalCols = getLegalTargets(state, 'human', 'enemy_column');
      targetCol = c !== null ? c : legalCols[0]?.col;
    } else if (ab?.needsTarget) {
      const legal = getLegalTargets(state, 'human', ab.needsTarget);
      target = resolveTargetFromText(parsed.rawTargetText || '', legal) || legal[0] || null;
    }
    if (ab && ['restore', 'atomic_garden', 'cache_restore', 'labor_camp', 'transplant_lab', 'mutant_restore'].includes(ab.kind)) {
      const legalR = getRestorableCards(state, 'human', ab.kind === 'atomic_garden');
      restoreTarget = resolveTargetFromText(parsed.rawTargetText || '', legalR) || legalR[0] || null;
    }
    const res = activateAbility(state, 'human', parsed.source, ab?.id, {
      rng,
      target,
      targetCol,
      restoreTarget,
      botChoiceFn: chooseBotDefensiveResponse,
    });
    return finalizeHumanAction(state, res);
  }

  // === DIRECT PHYSICAL SHORTCUTS ===
  if (parsed.intent === 'direct_attack') {
    const targetOwner = parsed.owner;
    const attacker = targetOwner === 'bot' ? 'human' : 'bot';
    const targetKind =
      parsed.mode === 'injure' ? 'any_enemy_person' : 'any_enemy';
    const legal = getLegalTargets(state, attacker, targetKind);
    const t = resolveTargetFromText(parsed.rawText, legal);
    if (!t) {
      return finalizeHumanAction(state, {
        ok: false,
        error: 'No encontré ese objetivo. Indicá la carta o columna (ej: "daño tu columna 2" o "daño tu Francotirador").',
      });
    }
    const res = parsed.mode === 'destroy' ? destroyTarget(state, t) : applyDamageToTarget(state, t);
    const msg = res.ok
      ? `Aplicado: ${res.labelEs} (${COL_SHORT_ES[t.col]}) quedó ${res.destroyed ? 'destruido' : 'dañado'}.`
      : res.error;
    return finalizeHumanAction(state, { ok: res.ok, message: msg, error: res.error });
  }

  if (parsed.intent === 'direct_restore') {
    const legal = getRestorableCards(state, 'human');
    const t = resolveTargetFromText(parsed.rawText, legal) || legal[0];
    if (!t) return finalizeHumanAction(state, { ok: false, error: 'No tenés cartas dañadas para restaurar.' });
    const res = restoreTarget(state, t);
    return finalizeHumanAction(state, {
      ok: res.ok,
      message: res.ok ? `Restauraste ${res.labelEs}.` : res.error,
      error: res.error,
    });
  }

  if (parsed.intent === 'direct_punk') {
    const res = gainPunk(state, 'human', parsed.col, parsed.slot, rng);
    return finalizeHumanAction(state, {
      ok: res.ok,
      message: res.ok ? `Sumaste 1 Punki en ${COL_NAMES_ES[res.col]} (poné una carta bocabajo).` : res.error,
      error: res.error,
    });
  }

  if (parsed.intent === 'direct_raid') {
    const res = triggerRaid(state, 'human', chooseBotDefensiveResponse, rng);
    return finalizeHumanAction(state, res);
  }

  if (parsed.intent === 'direct_water') {
    if (parsed.delta > 0) {
      state.human.extraWater += parsed.delta;
