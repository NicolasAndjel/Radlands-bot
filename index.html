<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#090710" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Radlands Bot" />
    <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" type="image/svg+xml" href="./icon.svg" />
  <link rel="apple-touch-icon" href="./icon-192.png" />
  <title>Radlands Bot Híbrido — Cartas Físicas vs IA Offline</title>
  <style>
/* Radlands Hybrid Bot — Neon Wasteland Offline UI */
:root {
  --bg: #090710;
  --bg-2: #110d1b;
  --surface: #171226;
  --surface-2: #211a34;
  --surface-3: #2a2142;
  --border: rgba(255, 255, 255, 0.11);
  --border-strong: rgba(255, 255, 255, 0.22);

  --text: #f4f1fb;
  --text-dim: #a99ec2;
  --text-muted: #766a91;

  --magenta: #ff2e88;
  --magenta-soft: rgba(255, 46, 136, 0.16);
  --cyan: #00e5ff;
  --cyan-soft: rgba(0, 229, 255, 0.15);
  --yellow: #ffd83d;
  --yellow-soft: rgba(255, 216, 61, 0.16);
  --green: #35f59c;
  --green-soft: rgba(53, 245, 156, 0.15);
  --danger: #ff4757;
  --danger-soft: rgba(255, 71, 87, 0.18);
  --purple: #b56bff;

  --radius: 12px;
  --radius-sm: 8px;
  --font-sans: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  --font-mono: ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html, body {
  height: 100%;
  background:
    radial-gradient(circle at 12% 8%, rgba(255, 46, 136, 0.12), transparent 36%),
    radial-gradient(circle at 88% 92%, rgba(0, 229, 255, 0.11), transparent 38%),
    var(--bg);
  color: var(--text);
  font-family: var(--font-sans);
  font-size: 14px;
  line-height: 1.4;
  overflow: hidden;
}

button, input, select {
  font-family: inherit;
  color: inherit;
}

/* === LAYOUT === */
.app-shell {
  display: flex;
  flex-direction: column;
  height: 100vh;
  height: 100dvh;
}

.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 8px 14px;
  background: rgba(17, 13, 27, 0.94);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
  flex-wrap: wrap;
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
}

.brand-logo {
  width: 32px;
  height: 32px;
  border-radius: 8px;
  background: linear-gradient(135deg, var(--magenta), #ff8a00);
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 900;
  font-size: 16px;
  box-shadow: 0 0 14px rgba(255, 46, 136, 0.45);
}

.brand-title {
  font-weight: 800;
  font-size: 15px;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}

.brand-sub {
  font-size: 11px;
  color: var(--text-dim);
}

.topbar-meta {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}

.pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 4px 9px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 600;
  background: var(--surface-2);
  border: 1px solid var(--border);
}

.pill.cyan { border-color: rgba(0, 229, 255, 0.45); color: var(--cyan); background: var(--cyan-soft); }
.pill.magenta { border-color: rgba(255, 46, 136, 0.45); color: #ff7ab6; background: var(--magenta-soft); }
.pill.yellow { border-color: rgba(255, 216, 61, 0.45); color: var(--yellow); background: var(--yellow-soft); }
.pill.green { border-color: rgba(53, 245, 156, 0.45); color: var(--green); background: var(--green-soft); }

.topbar-actions {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  padding: 6px 11px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border-strong);
  background: var(--surface-2);
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  transition: transform 0.08s ease, background 0.15s ease, border-color 0.15s ease;
}

.btn:hover { background: var(--surface-3); border-color: rgba(255, 255, 255, 0.35); }
.btn:active { transform: scale(0.97); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }

.btn-primary {
  background: linear-gradient(135deg, var(--magenta), #d91c70);
  border-color: rgba(255, 46, 136, 0.7);
  color: #fff;
}
.btn-primary:hover { background: linear-gradient(135deg, #ff4798, #eb217b); }

.btn-cyan {
  background: linear-gradient(135deg, #00b8d4, #0088a8);
  border-color: rgba(0, 229, 255, 0.65);
  color: #03151a;
  font-weight: 700;
}
.btn-cyan:hover { background: linear-gradient(135deg, #1ae6ff, #00a5c9); }

.btn-yellow {
  background: var(--yellow-soft);
  border-color: rgba(255, 216, 61, 0.55);
  color: var(--yellow);
}

.btn-danger {
  background: var(--danger-soft);
  border-color: rgba(255, 71, 87, 0.55);
  color: #ff808c;
}

.btn-ghost {
  background: transparent;
  border-color: transparent;
}
.btn-ghost:hover { background: rgba(255, 255, 255, 0.07); }

.btn-sm { padding: 4px 8px; font-size: 11px; }

/* Mobile tab switcher (hidden on desktop) */
.mobile-tabs {
  display: none;
  grid-template-columns: 1fr 1fr;
  background: var(--bg-2);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.mobile-tab {
  padding: 9px;
  border: none;
  background: transparent;
  color: var(--text-dim);
  font-weight: 700;
  font-size: 13px;
  cursor: pointer;
  border-bottom: 2px solid transparent;
}
.mobile-tab.active {
  color: var(--cyan);
  border-bottom-color: var(--cyan);
  background: rgba(0, 229, 255, 0.06);
}

/* Main Split Workspace */
.workspace {
  display: grid;
  grid-template-columns: minmax(0, 1.32fr) minmax(340px, 0.98fr);
  flex: 1;
  min-height: 0;
  overflow: hidden;
}

/* === LEFT PANE: ARENA / SETUP === */
.arena-pane {
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding: 12px 14px;
  overflow-y: auto;
  border-right: 1px solid var(--border);
  min-height: 0;
}

.board-section {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 10px 12px;
}

.board-section.bot-side {
  border-color: rgba(255, 46, 136, 0.34);
  box-shadow: inset 0 1px 0 rgba(255, 46, 136, 0.16);
}

.board-section.human-side {
  border-color: rgba(0, 229, 255, 0.34);
  box-shadow: inset 0 1px 0 rgba(0, 229, 255, 0.16);
}

.side-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 8px;
  flex-wrap: wrap;
}

.side-title {
  display: flex;
  align-items: center;
  gap: 7px;
  font-weight: 800;
  font-size: 13px;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}
.bot-side .side-title { color: #ff7ab6; }
.human-side .side-title { color: var(--cyan); }

.active-badge {
  font-size: 10px;
  padding: 2px 7px;
  border-radius: 999px;
  font-weight: 800;
  letter-spacing: 0.05em;
  animation: pulseBadge 1.8s infinite;
}
.bot-side .active-badge { background: var(--magenta); color: #fff; }
.human-side .active-badge { background: var(--cyan); color: #05161b; }

@keyframes pulseBadge {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.65; }
}

.side-stats {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
}

/* Event Queue Strip */
.event-queue {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 6px;
  margin-bottom: 9px;
}

.event-slot {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 5px 8px;
  border-radius: var(--radius-sm);
  background: rgba(0, 0, 0, 0.28);
  border: 1px dashed rgba(255, 216, 61, 0.24);
  font-size: 11px;
  min-height: 30px;
}

.event-slot.filled {
  border: 1px solid rgba(255, 216, 61, 0.7);
  background: repeating-linear-gradient(
    -45deg,
    rgba(255, 216, 61, 0.14),
    rgba(255, 216, 61, 0.14) 6px,
    rgba(20, 15, 32, 0.9) 6px,
    rgba(20, 15, 32, 0.9) 12px
  );
  cursor: pointer;
}

.event-num {
  width: 18px;
  height: 18px;
  border-radius: 50%;
  background: rgba(255, 216, 61, 0.2);
  color: var(--yellow);
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 800;
  font-size: 10px;
  flex-shrink: 0;
}

.event-name {
  font-weight: 700;
  color: var(--yellow);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.event-empty { color: var(--text-muted); font-size: 10px; }

/* 3 Columns Grid */
.columns-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 8px;
}

.column-box {
  display: flex;
  flex-direction: column;
  gap: 6px;
  background: rgba(0, 0, 0, 0.22);
  border: 1px solid rgba(255, 255, 255, 0.06);
  border-radius: 10px;
  padding: 6px;
}

.col-label {
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--text-muted);
  display: flex;
  justify-content: space-between;
  padding: 0 2px;
}

/* Cards inside Columns */
.card-tile {
  position: relative;
  border-radius: 8px;
  padding: 7px 8px;
  cursor: pointer;
  transition: transform 0.1s ease, box-shadow 0.15s ease;
  user-select: none;
}
.card-tile:hover { transform: translateY(-1px); }

/* Camp Card (black border + bold top accent) */
.card-camp {
  background: linear-gradient(180deg, #1b152c 0%, #110d1c 100%);
  border: 2px solid #050408;
  box-shadow: inset 0 2px 0 rgba(255, 255, 255, 0.14), 0 0 0 1px rgba(255, 255, 255, 0.16);
  min-height: 68px;
}

.card-camp.ready {
  box-shadow: inset 0 2px 0 rgba(53, 245, 156, 0.45), 0 0 0 1px rgba(53, 245, 156, 0.45);
}

.card-camp.damaged {
  border-color: var(--danger);
  background: linear-gradient(180deg, #2d121d 0%, #1a0b12 100%);
}

.card-camp.destroyed {
  opacity: 0.42;
  filter: grayscale(0.85);
  border-style: dashed;
  border-color: rgba(255, 71, 87, 0.5);
  background: #0e0b14;
}

/* Person Card (white border matching physical Radlands!) */
.card-person {
  background: linear-gradient(180deg, #26203a 0%, #191429 100%);
  border: 2px solid rgba(244, 241, 251, 0.72);
  min-height: 54px;
}

.card-person.ready {
  border-color: var(--green);
  box-shadow: 0 0 10px rgba(53, 245, 156, 0.2);
}

.card-person.damaged {
  border-color: var(--danger);
  background: linear-gradient(180deg, #331521 0%, #1d0c13 100%);
}

.card-person.punk {
  border: 2px dashed var(--purple);
  background: linear-gradient(180deg, #221437 0%, #140c21 100%);
}

.card-slot-empty {
  border: 1px dashed rgba(255, 255, 255, 0.12);
  border-radius: 8px;
  min-height: 40px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 10px;
  color: var(--text-muted);
  cursor: pointer;
}
.card-slot-empty:hover {
  border-color: rgba(0, 229, 255, 0.4);
  color: var(--cyan);
}

.card-top-row {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 4px;
}

.card-title {
  font-weight: 700;
  font-size: 12px;
  line-height: 1.2;
}

.card-sub {
  font-size: 10px;
  color: var(--text-dim);
  margin-top: 2px;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.status-tag {
  font-size: 9px;
  font-weight: 800;
  padding: 1px 5px;
  border-radius: 4px;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  flex-shrink: 0;
}
.status-tag.ready { background: var(--green-soft); color: var(--green); }
.status-tag.exhausted { background: rgba(255, 255, 255, 0.08); color: var(--text-dim); }
.status-tag.damaged { background: var(--danger-soft); color: #ff7c89; }
.status-tag.destroyed { background: rgba(255, 71, 87, 0.35); color: #ffb3ba; }
.status-tag.unprot { background: rgba(255, 216, 61, 0.16); color: var(--yellow); }

.card-badges {
  display: flex;
  align-items: center;
  gap: 4px;
  margin-top: 4px;
  flex-wrap: wrap;
}

/* Private Hand Drawer */
.hand-drawer {
  background: var(--surface);
  border: 1px solid rgba(0, 229, 255, 0.3);
  border-radius: var(--radius);
  overflow: hidden;
}

.hand-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 12px;
  cursor: pointer;
  background: rgba(0, 229, 255, 0.06);
}
.hand-header:hover { background: rgba(0, 229, 255, 0.1); }

.hand-cards-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(175px, 1fr));
  gap: 7px;
  padding: 10px;
  border-top: 1px solid var(--border);
}

.hand-card {
  background: var(--surface-2);
  border: 1px solid var(--border-strong);
  border-radius: 8px;
  padding: 7px 8px;
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.hand-card.event-type {
  border-color: rgba(255, 216, 61, 0.55);
}

.hand-card-actions {
  display: flex;
  gap: 4px;
  margin-top: 3px;
}

/* Setup Panel */
.setup-panel {
  background: var(--surface);
  border: 1px solid rgba(0, 229, 255, 0.35);
  border-radius: var(--radius);
  padding: 12px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.setup-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(165px, 1fr));
  gap: 7px;
  max-height: 46vh;
  overflow-y: auto;
  padding-right: 4px;
}

.camp-pick-card {
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 7px 8px;
  cursor: pointer;
  transition: border-color 0.12s, background 0.12s;
}
.camp-pick-card:hover { border-color: rgba(255, 255, 255, 0.35); }
.camp-pick-card.selected {
  border: 2px solid var(--cyan);
  background: rgba(0, 229, 255, 0.14);
}
.camp-pick-card.excluded {
  border: 2px dashed var(--danger);
  background: rgba(255, 71, 87, 0.12);
  opacity: 0.72;
}

/* === RIGHT PANE: CHAT & VOICE COMMAND CENTER === */
.chat-pane {
  display: flex;
  flex-direction: column;
  background: rgba(15, 11, 24, 0.92);
  min-height: 0;
}

.voice-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 8px 12px;
  border-bottom: 1px solid var(--border);
  background: var(--surface);
  flex-wrap: wrap;
}

.voice-status {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  color: var(--text-dim);
}

.mic-dot {
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: var(--text-muted);
}
.mic-dot.listening {
  background: var(--magenta);
  box-shadow: 0 0 10px var(--magenta);
  animation: pulseBadge 0.9s infinite;
}
.mic-dot.speaking {
  background: var(--cyan);
  box-shadow: 0 0 10px var(--cyan);
}

.chat-feed {
  flex: 1;
  overflow-y: auto;
  padding: 12px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  min-height: 0;
}

.msg {
  max-width: 92%;
  padding: 8px 11px;
  border-radius: 11px;
  font-size: 13px;
  white-space: pre-wrap;
  word-break: break-word;
  line-height: 1.42;
}

.msg.bot {
  align-self: flex-start;
  background: var(--surface-2);
  border: 1px solid rgba(255, 46, 136, 0.32);
  border-bottom-left-radius: 3px;
}

.msg.human {
  align-self: flex-end;
  background: rgba(0, 229, 255, 0.14);
  border: 1px solid rgba(0, 229, 255, 0.4);
  border-bottom-right-radius: 3px;
}

.msg.system {
  align-self: center;
  max-width: 96%;
  background: rgba(255, 216, 61, 0.1);
  border: 1px solid rgba(255, 216, 61, 0.3);
  color: #ffe88a;
  font-size: 12px;
}

.msg-meta {
  font-size: 10px;
  color: var(--text-muted);
  margin-bottom: 3px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}

.secret-reveal-btn {
  border: none;
  background: rgba(255, 255, 255, 0.08);
  color: var(--cyan);
  border-radius: 4px;
  padding: 1px 6px;
  font-size: 10px;
  cursor: pointer;
}

/* Pending Choice Banner */
.pending-banner {
  margin: 0 10px 8px;
  padding: 10px;
  border-radius: var(--radius-sm);
  background: linear-gradient(135deg, rgba(255, 46, 136, 0.2), rgba(255, 216, 61, 0.14));
  border: 1px solid var(--magenta);
  display: flex;
  flex-direction: column;
  gap: 7px;
}

.pending-options {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

/* Quick Chips Row */
.quick-chips {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 6px 10px;
  overflow-x: auto;
  border-top: 1px solid var(--border);
  background: rgba(23, 18, 38, 0.85);
  flex-shrink: 0;
}

.chip {
  white-space: nowrap;
  padding: 5px 10px;
  border-radius: 999px;
  font-size: 11px;
  font-weight: 700;
  background: var(--surface-2);
  border: 1px solid var(--border-strong);
  cursor: pointer;
  flex-shrink: 0;
}
.chip:hover { border-color: var(--cyan); color: var(--cyan); }
.chip.accent { background: var(--magenta-soft); border-color: var(--magenta); color: #ff94c4; }
.chip.cyan { background: var(--cyan-soft); border-color: var(--cyan); color: var(--cyan); }
.chip.yellow { background: var(--yellow-soft); border-color: var(--yellow); color: var(--yellow); }

/* Autocomplete Dropdown */
.autocomplete-box {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
  padding: 6px 10px;
  background: var(--surface-2);
  border-top: 1px solid var(--border);
}

/* Chat Input Row */
.input-row {
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 9px 10px;
  background: var(--surface);
  border-top: 1px solid var(--border);
  flex-shrink: 0;
}

.mic-btn {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  border: 2px solid var(--magenta);
  background: var(--magenta-soft);
  color: #fff;
  font-size: 19px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: transform 0.1s, box-shadow 0.15s, background 0.15s;
}
.mic-btn:hover { background: rgba(255, 46, 136, 0.32); }
.mic-btn.active {
  background: var(--magenta);
  box-shadow: 0 0 18px rgba(255, 46, 136, 0.75);
  animation: pulseBadge 1s infinite;
}

.chat-input {
  flex: 1;
  min-width: 0;
  padding: 10px 12px;
  border-radius: 10px;
  border: 1px solid var(--border-strong);
  background: var(--bg-2);
  font-size: 14px;
  outline: none;
}
.chat-input:focus { border-color: var(--cyan); box-shadow: 0 0 0 2px rgba(0, 229, 255, 0.18); }

/* Modals */
.modal-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(5, 3, 10, 0.78);
  backdrop-filter: blur(4px);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 14px;
  z-index: 100;
}

.modal-card {
  width: 100%;
  max-width: 680px;
  max-height: 88vh;
  background: var(--surface);
  border: 1px solid var(--border-strong);
  border-radius: 14px;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.65);
}

.modal-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 14px;
  border-bottom: 1px solid var(--border);
  background: var(--surface-2);
}

  border-radius: 7px;
  padding: 5px 9px;
  font-size: 12px;
}

  border-radius: var(--radius);
  background: linear-gradient(135deg, rgba(255, 216, 61, 0.2), rgba(255, 46, 136, 0.2));

  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}

.hidden { display: none !important; }

function buildFullDeck() {
  const deck = [];
  for (const card of DECK_CARDS) {
    for (let i = 0; i < card.copies; i++) {
      deck.push(card.id);
    }
  }
  return deck; // Exactly 66 cards!
}

function getCustomAliases() {
  if (typeof localStorage === 'undefined') return {};
  try {
    return JSON.parse(localStorage.getItem('radlands_custom_aliases') || '{}');
  } catch {
    return {};
  }
}

function saveCustomAlias(cardId, alias) {
  if (typeof localStorage === 'undefined') return;
  try {
    const map = getCustomAliases();
    const list = Array.isArray(map[cardId]) ? map[cardId] : [];
    const cleaned = alias.trim();
    if (cleaned && !list.includes(cleaned)) {
      list.push(cleaned);
      map[cardId] = list;
      localStorage.setItem('radlands_custom_aliases', JSON.stringify(map));
    }
  } catch {}
}

function clearCustomAliases(cardId) {
  if (typeof localStorage === 'undefined') return;
  try {
    const map = getCustomAliases();
    if (cardId) {
      delete map[cardId];
    } else {
      localStorage.removeItem('radlands_custom_aliases');
      return;
    }
    localStorage.setItem('radlands_custom_aliases', JSON.stringify(map));
  } catch {}
}


// ===== engine.js =====
// Radlands Hybrid Rules Engine + Fair Shared Deck (Quantum Swap) + Anti-Cheat Observation Layer

const COL_NAMES_ES = ['Izquierda (1)', 'Centro (2)', 'Derecha (3)'];
const COL_SHORT_ES = ['Col 1', 'Col 2', 'Col 3'];
const SLOT_NAMES_ES = ['Atrás', 'Adelante'];

let _uidCounter = 1;
function nextUid(prefix = 'id') {
  return `${prefix}_${_uidCounter++}`;
}

function shuffle(arr, rng = Math.random) {
  const copy = [...arr];
  for (let i = copy.length - 1; i > 0; i--) {
    const j = Math.floor(rng() * (i + 1));
    [copy[i], copy[j]] = [copy[j], copy[i]];
  }
  return copy;
}

function cloneState(state) {
  // History is not recursively cloned to avoid exponential growth
  const { history, ...rest } = state;
  const cloned = JSON.parse(JSON.stringify(rest));
  cloned.history = [];
  return cloned;
}

function createEmptyFlags() {
  return {
    peoplePlayedThisTurn: 0,
    abilitiesUsedThisTurn: 0,
    eventsPlayedThisTurn: 0,
    anyEventResolvedThisTurn: false,
    raidersResolvedThisTurn: false,
    opponentUnprotectedThisTurn: false,
  };
}

function createPlayerState(isHuman) {
  return {
    camps: [], // Array of 3: { id, damaged, destroyed, ready, juggernautStep }
    columns: [
      [null, null], // col 0: [back, front]
      [null, null], // col 1: [back, front]
      [null, null], // col 2: [back, front]
    ],
    events: [null, null, null], // index 0 = slot 1, index 1 = slot 2, index 2 = slot 3
    water: 0,
    extraWater: 0,
    waterSiloInHand: false,
    flags: createEmptyFlags(),
    ...(isHuman ? { hiddenHand: [], pendingDraws: 0 } : { hand: [] }),
  };
}

function createInitialState(options = {}) {
  const rng = options.rng || Math.random;
  return {
    phase: 'setup_camps', // setup_camps -> setup_first -> setup_draw -> playing -> gameover
    winner: null, // 'human' | 'bot' | 'draw'
    winReason: '',
    turn: 1,
    activePlayer: 'human',
    firstPlayer: 'human',
    turnStep: 'actions',
    difficulty: options.difficulty || 'tactical', // 'casual' | 'tactical' | 'ruthless'
    personality: options.personality || 'normal', // 'normal' | 'wasteland'
    deck: shuffle(buildFullDeck(), rng),
    discard: [],
    reshuffles: 0,
    excludedCamps: [],
    botCampPool: [],
    human: createPlayerState(true),
    bot: createPlayerState(false),
    pendingChoice: null,
    log: [],
    history: [],
  };
}

function pushUndoSnapshot(state) {
  const snap = cloneState(state);
  if (!Array.isArray(state.history)) state.history = [];
  state.history.push(snap);
  if (state.history.length > 50) state.history.shift();
}

function undoState(state) {
  if (!state.history || state.history.length === 0) {
    return { ok: false, error: 'No hay jugadas anteriores para deshacer.' };
  }
  const prev = state.history.pop();
  const remainingHistory = state.history;
  Object.keys(state).forEach((k) => delete state[k]);
  Object.assign(state, prev);
  state.history = remainingHistory;
  return { ok: true, message: 'Deshice la última acción.' };
}

function addLog(state, actor, text, opts = {}) {
  state.log.push({
    id: nextUid('log'),
    ts: Date.now(),
    actor, // 'system' | 'human' | 'bot'
    text,
    masked: !!opts.masked,
    secretText: opts.secretText || null,
    speak: opts.speak !== false && actor === 'bot',
  });
  if (state.log.length > 250) {
    state.log = state.log.slice(-250);
  }
}

function otherPlayer(playerKey) {
  return playerKey === 'human' ? 'bot' : 'human';
}

function getTotalWater(player) {
  return (player.water || 0) + (player.extraWater || 0);
}

function spendWater(player, amount) {
  if (amount <= 0) return true;
  if (getTotalWater(player) < amount) return false;
  let rem = amount;
  const fromRegular = Math.min(player.water, rem);
  player.water -= fromRegular;
  rem -= fromRegular;
  if (rem > 0) {
    player.extraWater -= rem;
  }
  return true;
}

function getCardNameEs(cardId) {
  if (cardId === 'punk') return 'Punki';
  const c = ALL_CARDS_BY_ID[cardId];
  return c ? c.nameEs : cardId;
}

// === STRICT FAIRNESS BARRIER: BotAI ONLY sees this observation ===
function getBotObservation(state) {
  const sanitizeColumn = (col) =>
    col.map((p) => {
      if (!p) return null;
      if (p.isPunk) {
        return {
          uid: p.uid,
          id: 'punk',
          isPunk: true,
          damaged: p.damaged,
          ready: p.ready,
          // underlyingCardId intentionally STRIPPED!
        };
      }
      return {
        uid: p.uid,
        id: p.id,
        isPunk: false,
        damaged: p.damaged,
        ready: p.ready,
      };
    });

  return {
    phase: state.phase,
    winner: state.winner,
    turn: state.turn,
    activePlayer: state.activePlayer,
    firstPlayer: state.firstPlayer,
    difficulty: state.difficulty,
    deckCount: state.deck.length,
    discard: [...state.discard],
    reshuffles: state.reshuffles,
    bot: {
      camps: state.bot.camps.map((c) => ({ ...c })),
      columns: state.bot.columns.map(sanitizeColumn),
      events: [...state.bot.events],
      water: state.bot.water,
      extraWater: state.bot.extraWater,
      waterSiloInHand: state.bot.waterSiloInHand,
      hand: [...state.bot.hand],
      flags: { ...state.bot.flags },
    },
    human: {
      camps: state.human.camps.map((c) => ({ ...c })),
      columns: state.human.columns.map(sanitizeColumn),
      events: [...state.human.events],
      water: state.human.water,
      extraWater: state.human.extraWater,
      waterSiloInHand: state.human.waterSiloInHand,
      handCount: state.human.hiddenHand.length, // ONLY count, NEVER contents!
      flags: { ...state.human.flags },
    },
  };
}

// === BOARD QUERIES ===
function getAllPeople(state, playerKey) {
  const p = state[playerKey];
  const res = [];
  for (let col = 0; col < 3; col++) {
    for (let slot = 0; slot < 2; slot++) {
      const person = p.columns[col][slot];
      if (person) {
        res.push({ person, col, slot });
      }
    }
  }
  return res;
}

function countPeople(state, playerKey) {
  return getAllPeople(state, playerKey).length;
}

function countPunks(state, playerKey) {
  return getAllPeople(state, playerKey).filter((x) => x.person.isPunk).length;
}

function countDestroyedCamps(state, playerKey) {
  return state[playerKey].camps.filter((c) => c.destroyed).length;
}

function hasActiveTrait(state, playerKey, traitName) {
  const p = state[playerKey];
  for (const camp of p.camps) {
    if (!camp.destroyed && CAMPS_BY_ID[camp.id]?.trait === traitName) {
      return true;
    }
  }
  for (const { person } of getAllPeople(state, playerKey)) {
    if (!person.isPunk && !person.damaged && DECK_CARDS_BY_ID[person.id]?.trait === traitName) {
      return true;
    }
  }
  return false;
}

function isCardProtected(state, ownerKey, targetType, col, slot = 0, attackerKey = null) {
  const att = attackerKey || otherPlayer(ownerKey);
  if (state[att]?.flags?.opponentUnprotectedThisTurn) {
    return false;
  }
  const owner = state[ownerKey];
  const camp = owner.camps[col];
  const jStep = camp && !camp.destroyed && camp.id === 'juggernaut' ? camp.juggernautStep || 0 : 0;
  const colSlots = owner.columns[col];
  const hasBack = !!colSlots[0];
  const hasFront = !!colSlots[1];

  if (targetType === 'camp') {
    if (jStep === 2) return false; // Juggernaut at very front
    if (jStep === 1) return hasFront; // Juggernaut between back and front
    return hasBack || hasFront;
  }
  // targetType === 'person'
  if (slot === 1) {
    // Front slot: only protected if Juggernaut moved past it (step 2)
    return jStep === 2;
  }
  // Back slot (slot === 0): protected if front person exists OR Juggernaut moved ahead of back (step >= 1)
  return hasFront || jStep >= 1;
}

function getLegalTargets(state, attackerKey, targetKind) {
  const defKey = otherPlayer(attackerKey);
  const def = state[defKey];
  const targets = [];

  if (targetKind === 'enemy_column') {
    for (let col = 0; col < 3; col++) {
      const hasAny =
        (def.camps[col] && !def.camps[col].destroyed) ||
        def.columns[col][0] ||
        def.columns[col][1];
      if (hasAny) {
        targets.push({ type: 'column', owner: defKey, col, labelEs: COL_NAMES_ES[col] });
      }
    }
    return targets;
  }

  for (let col = 0; col < 3; col++) {
    // People
    for (let slot = 1; slot >= 0; slot--) {
      const person = def.columns[col][slot];
      if (!person) continue;
      const prot = isCardProtected(state, defKey, 'person', col, slot, attackerKey);
      if (
        targetKind === 'any_enemy' ||
        targetKind === 'any_enemy_person' ||
        (targetKind === 'unprotected_enemy' && !prot) ||
        (targetKind === 'unprotected_enemy_person' && !prot) ||
        (targetKind === 'unprotected_damaged_enemy' && !prot && person.damaged)
      ) {
        targets.push({
          type: 'person',
          owner: defKey,
          col,
          slot,
          uid: person.uid,
          id: person.isPunk ? 'punk' : person.id,
          damaged: person.damaged,
          labelEs: `${person.isPunk ? 'Punki' : getCardNameEs(person.id)} (${COL_SHORT_ES[col]}, ${SLOT_NAMES_ES[slot]})`,
        });
      }
    }
    // Camp
    const camp = def.camps[col];
    if (camp && !camp.destroyed) {
      const prot = isCardProtected(state, defKey, 'camp', col, 0, attackerKey);
      if (
        targetKind === 'any_enemy' ||
        targetKind === 'any_enemy_camp' ||
        (targetKind === 'unprotected_enemy' && !prot) ||
        (targetKind === 'unprotected_enemy_camp' && !prot) ||
        (targetKind === 'unprotected_damaged_enemy' && !prot && camp.damaged)
      ) {
        targets.push({
          type: 'camp',
          owner: defKey,
          col,
          id: camp.id,
          damaged: camp.damaged,
          labelEs: `Campamento ${getCardNameEs(camp.id)} (${COL_SHORT_ES[col]})`,
        });
      }
    }
  }
  return targets;
}

function getRestorableCards(state, playerKey, peopleOnly = false) {
  const p = state[playerKey];
  const list = [];
  for (let col = 0; col < 3; col++) {
    for (let slot = 0; slot < 2; slot++) {
      const person = p.columns[col][slot];
      if (person && person.damaged) {
        list.push({
          type: 'person',
          owner: playerKey,
          col,
          slot,
          uid: person.uid,
          id: person.isPunk ? 'punk' : person.id,
          labelEs: `${person.isPunk ? 'Punki' : getCardNameEs(person.id)} (${COL_SHORT_ES[col]})`,
        });
      }
    }
    if (!peopleOnly) {
      const camp = p.camps[col];
      if (camp && !camp.destroyed && camp.damaged && CAMPS_BY_ID[camp.id]?.trait !== 'cannot_restore') {
        list.push({
          type: 'camp',
          owner: playerKey,
          col,
          id: camp.id,
          labelEs: `Campamento ${getCardNameEs(camp.id)} (${COL_SHORT_ES[col]})`,
        });
      }
    }
  }
  return list;
}

function getEmptyPersonSlots(state, playerKey) {
  const p = state[playerKey];
  const slots = [];
  for (let col = 0; col < 3; col++) {
    for (let slot = 0; slot < 2; slot++) {
      if (!p.columns[col][slot]) {
        slots.push({ col, slot });
      }
    }
  }
  return slots;
}

function getPersonPlayCost(state, playerKey, cardId, col) {
  const card = DECK_CARDS_BY_ID[cardId];
  if (!card) return 99;
  const p = state[playerKey];
  let cost = card.cost;
  // Holdout: 0 water in a column with a destroyed camp
  if (card.trait === 'free_in_destroyed_camp' && p.camps[col]?.destroyed) {
    return 0;
  }
  // Oasis: -1 water if no people in Oasis's column
  const camp = p.camps[col];
  if (
    camp &&
    !camp.destroyed &&
    CAMPS_BY_ID[camp.id]?.trait === 'oasis_discount' &&
    !p.columns[col][0] &&
    !p.columns[col][1]
  ) {
    cost = Math.max(0, cost - 1);
  }
  return cost;
}

function getAbilityCost(state, playerKey, ability) {
  let cost = ability.cost || 0;
  if (ability.dynamicCost === 'minus_punks') {
    cost = Math.max(0, cost - countPunks(state, playerKey));
  } else if (ability.dynamicCost === 'minus_destroyed_camps') {
    cost = Math.max(0, cost - countDestroyedCamps(state, playerKey));
  }
  return cost;
}

// === WIN / DRAW CHECKS ===
function checkGameOver(state) {
  if (state.phase === 'gameover') return true;
  const humanDestroyed = countDestroyedCamps(state, 'human');
  const botDestroyed = countDestroyedCamps(state, 'bot');
  if (botDestroyed >= 3 && humanDestroyed >= 3) {
    state.phase = 'gameover';
    state.winner = 'draw';
    state.winReason = 'Ambos jugadores perdieron sus 3 campamentos al mismo tiempo.';
    return true;
  }
  if (botDestroyed >= 3) {
    state.phase = 'gameover';
    state.winner = 'human';
    state.winReason = '¡Destruiste los 3 campamentos del bot! Victoria tuya.';
    return true;
  }
  if (humanDestroyed >= 3) {
    state.phase = 'gameover';
    state.winner = 'bot';
    state.winReason = 'El bot destruyó tus 3 campamentos. Victoria del bot.';
    return true;
  }
  return false;
}

// === SHARED DECK MANAGEMENT & QUANTUM SWAP ===
function ensureDeckAvailable(state, rng = Math.random) {
  if (state.deck.length > 0) return true;
  if (state.reshuffles >= 1) {
    state.phase = 'gameover';
    state.winner = 'draw';
    state.winReason = 'El mazo compartido se agotó por segunda vez: ¡Empate oficial según reglas de Radlands!';
    addLog(state, 'system', state.winReason);
    return false;
  }
  if (state.discard.length === 0) {
    state.phase = 'gameover';
    state.winner = 'draw';
    state.winReason = 'No quedan cartas en el mazo ni en el descarte: Empate.';
    addLog(state, 'system', state.winReason);
    return false;
  }
  state.deck = shuffle(state.discard, rng);
  state.discard = [];
  state.reshuffles += 1;
  addLog(
    state,
    'system',
    '⚠️ ¡El mazo compartido se agotó por primera vez! Barajá tu descarte físico para formar el nuevo mazo (si se agota otra vez, es empate).'
  );
  return true;
}

function drawBotCard(state, rng = Math.random) {
  if (!ensureDeckAvailable(state, rng)) return null;
  const cardId = state.deck.pop();
  state.bot.hand.push(cardId);
  return cardId;
}

function drawTopCardForPunk(state, ownerKey, rng = Math.random) {
  if (!ensureDeckAvailable(state, rng)) return null;
  if (ownerKey === 'bot') {
    return state.deck.pop();
  }
  // For human physical Punk: pop a random unseen card as placeholder (Quantum Swap handles collisions if human draws that card later!)
  return state.deck.pop();
}

function countCopiesInPublicZones(state, cardId) {
  let count = 0;
  const checkSide = (sideKey) => {
    const p = state[sideKey];
    for (let col = 0; col < 3; col++) {
      for (let slot = 0; slot < 2; slot++) {
        const per = p.columns[col][slot];
        if (per && !per.isPunk && per.id === cardId) count++;
      }
    }
    for (const ev of p.events) {
      if (ev === cardId) count++;
    }
  };
  checkSide('human');
  checkSide('bot');
  for (const d of state.discard) {
    if (d === cardId) count++;
  }
  for (const h of state.human.hiddenHand) {
    if (h === cardId) count++;
  }
  return count;
}

/**
 * Registers a physical card drawn by the human into the fair shared deck.
 * Uses Quantum Swap if the card happens to sit unrevealed in the bot's virtual hand or under a face-down Punk,
 * preventing any info leak to the human AND keeping deck distribution mathematically faithful!
 */
function recordHumanDraw(state, cardId, options = {}) {
  const rng = options.rng || Math.random;
  const cardDef = DECK_CARDS_BY_ID[cardId];
  if (!cardDef) {
    return { ok: false, error: `Carta desconocida para robar: ${cardId}` };
  }

  // If deck is empty, trigger reshuffle before checking
  if (state.deck.length === 0) {
    ensureDeckAvailable(state, rng);
    if (state.phase === 'gameover') {
      return { ok: false, error: state.winReason };
    }
  }

  // Case 1: Card is available in unseen deck
  const deckIdx = state.deck.indexOf(cardId);
  if (deckIdx !== -1) {
    state.deck.splice(deckIdx, 1);
    state.human.hiddenHand.push(cardId);
    if (state.human.pendingDraws > 0 && !options.skipPendingDecrement) {
      state.human.pendingDraws--;
    }
    return { ok: true, cardId, swapped: false };
  }

  // Case 2: Card is unrevealed inside bot's hand -> silent Quantum Swap!
  const botHandIdx = state.bot.hand.indexOf(cardId);
  if (botHandIdx !== -1 && state.deck.length > 0) {
    const swapIdx = Math.floor(rng() * state.deck.length);
    const replacement = state.deck[swapIdx];
    state.deck.splice(swapIdx, 1);
    state.bot.hand[botHandIdx] = replacement;
    state.human.hiddenHand.push(cardId);
    if (state.human.pendingDraws > 0 && !options.skipPendingDecrement) {
      state.human.pendingDraws--;
    }
    return { ok: true, cardId, swapped: true };
  }

  // Case 3: Card is hidden face-down under any Punk (bot or human placeholder) -> silent Quantum Swap!
  for (const sideKey of ['bot', 'human']) {
    for (let col = 0; col < 3; col++) {
      for (let slot = 0; slot < 2; slot++) {
        const per = state[sideKey].columns[col][slot];
        if (per && per.isPunk && per.underlyingCardId === cardId && state.deck.length > 0) {
          const swapIdx = Math.floor(rng() * state.deck.length);
          const replacement = state.deck[swapIdx];
          state.deck.splice(swapIdx, 1);
          per.underlyingCardId = replacement;
          state.human.hiddenHand.push(cardId);
          if (state.human.pendingDraws > 0 && !options.skipPendingDecrement) {
            state.human.pendingDraws--;
          }
          return { ok: true, cardId, swapped: true };
        }
      }
    }
  }

  // Case 4: Card is genuinely exhausted in public zones + human hand!
  const publicCount = countCopiesInPublicZones(state, cardId);
  return {
    ok: false,
    collision: true,
    error: `Todas las copias de ${cardDef.nameEs} (${publicCount}/${cardDef.copies}) ya están en mesa, descarte o tu mano. Saltala en tu mazo físico y robá la siguiente carta.`,
  };
}

// === SETUP ACTIONS ===
function setupHumanCamps(state, campIds, discardedCampIds = [], botCampPickerFn = null, rng = Math.random) {
  if (!Array.isArray(campIds) || campIds.length !== 3) {
    return { ok: false, error: 'Necesito exactamente 3 campamentos tuyos (izquierda, centro y derecha).' };
  }
  const uniqueSet = new Set(campIds);
  if (uniqueSet.size !== 3) {
    return { ok: false, error: 'Los 3 campamentos deben ser distintos.' };
  }
  for (const id of campIds) {
    if (!CAMPS_BY_ID[id]) return { ok: false, error: `Campamento desconocido: ${id}` };
  }

  pushUndoSnapshot(state);
  state.excludedCamps = [...new Set([...campIds, ...discardedCampIds.filter((id) => CAMPS_BY_ID[id])])];

  state.human.camps = campIds.map((id) => ({
    id,
    damaged: false,
    destroyed: CAMPS_BY_ID[id].trait === 'obelisk_start_destroyed',
    ready: true,
    juggernautStep: 0,
  }));

  // Draw 6 camps for Bot from remaining pool
  const remainingCamps = CAMPS.map((c) => c.id).filter((id) => !state.excludedCamps.includes(id));
  const botPool = shuffle(remainingCamps, rng).slice(0, 6);
  state.botCampPool = botPool;

  const chosenBotCamps = botCampPickerFn
    ? botCampPickerFn(botPool, state.difficulty)
    : botPool.slice(0, 3);

  state.bot.camps = chosenBotCamps.map((id) => ({
    id,
    damaged: false,
    destroyed: CAMPS_BY_ID[id].trait === 'obelisk_start_destroyed',
    ready: true,
    juggernautStep: 0,
  }));

  // Calculate starting draws
  const humanStartDraw = campIds.reduce((sum, id) => sum + CAMPS_BY_ID[id].startingCards, 0);
  const botStartDraw = chosenBotCamps.reduce((sum, id) => sum + CAMPS_BY_ID[id].startingCards, 0);

  state.human.pendingDraws = humanStartDraw;
  for (let i = 0; i < botStartDraw; i++) {
    drawBotCard(state, rng);
  }

  state.phase = 'setup_first';

  const humanCampNames = campIds.map((id, i) => `${i + 1}) ${CAMPS_BY_ID[id].nameEs}`).join(', ');
  const botCampNames = chosenBotCamps.map((id, i) => `${i + 1}) ${CAMPS_BY_ID[id].nameEs}`).join(', ');
  const obeliskNote =
    campIds.includes('obelisk') || chosenBotCamps.includes('obelisk')
      ? ' (Nota: Obelisco empieza destruido antes del turno 1).'
      : '';

  const msg = `Campamentos listos. Tus campamentos: ${humanCampNames} (robás ${humanStartDraw} cartas iniciales). Mis campamentos: ${botCampNames} (robé ${botStartDraw} cartas).${obeliskNote} ¿Quién empieza? Decime "empiezo yo", "empieza el bot" o "sorteo".`;
  addLog(state, 'bot', msg);
  return {
    ok: true,
    humanStartDraw,
    botStartDraw,
    botCamps: chosenBotCamps,
    message: msg,
  };
}

function setFirstPlayer(state, who, rng = Math.random) {
  pushUndoSnapshot(state);
  const chosen = who === 'random' ? (rng() < 0.5 ? 'human' : 'bot') : who;
  state.firstPlayer = chosen;
  state.activePlayer = chosen;
  state.turn = 1;

  if (state.human.pendingDraws > 0) {
    state.phase = 'setup_draw';
    const whoText = chosen === 'human' ? 'Empezás vos (turno 1 con 1💧).' : 'Empiezo yo (turno 1 con 1💧).';
    const msg = `${whoText} Primero robá tus ${state.human.pendingDraws} carta${state.human.pendingDraws > 1 ? 's' : ''} inicial${state.human.pendingDraws > 1 ? 'es' : ''} del mazo físico y cantamelas (ej: "robé francotirador, musa y napalm"). Quedan ocultas para mí.`;
    addLog(state, 'bot', msg);
    return { ok: true, firstPlayer: chosen, phase: state.phase, message: msg };
  }

  state.phase = 'playing';
  return beginTurn(state, chosen, rng);
}

// === DAMAGE / DESTROY / RESTORE PRIMITIVES ===
function applyDamageToTarget(state, target, opts = {}) {
  const owner = state[target.owner];
  if (target.type === 'camp') {
    const camp = owner.camps[target.col];
    if (!camp || camp.destroyed) return { ok: false, error: 'Ese campamento ya está destruido.' };
    if (camp.damaged) {
      camp.destroyed = true;
      camp.damaged = false;
      camp.ready = false;
      checkGameOver(state);
      return { ok: true, destroyed: true, hitCamp: true, labelEs: getCardNameEs(camp.id) };
    }
    camp.damaged = true;
    return { ok: true, destroyed: false, hitCamp: true, labelEs: getCardNameEs(camp.id) };
  }

  // target.type === 'person'
  const person = owner.columns[target.col][target.slot];
  if (!person) return { ok: false, error: 'No hay ninguna persona en esa posición.' };
  const name = person.isPunk ? 'Punki' : getCardNameEs(person.id);
  if (person.isPunk || person.damaged) {
    destroyPersonAt(state, target.owner, target.col, target.slot, opts);
    return { ok: true, destroyed: true, hitCamp: false, labelEs: name, wasPunk: person.isPunk };
  }
  person.damaged = true;
  person.ready = false;
  return { ok: true, destroyed: false, hitCamp: false, labelEs: name };
}

function destroyTarget(state, target, opts = {}) {
  const owner = state[target.owner];
  if (target.type === 'camp') {
    const camp = owner.camps[target.col];
    if (!camp || camp.destroyed) return { ok: false, error: 'Ese campamento ya está destruido.' };
    camp.destroyed = true;
    camp.damaged = false;
    camp.ready = false;
    checkGameOver(state);
    return { ok: true, destroyed: true, hitCamp: true, labelEs: getCardNameEs(camp.id) };
  }
  const person = owner.columns[target.col][target.slot];
  if (!person) return { ok: false, error: 'No hay ninguna persona ahí.' };
  const name = person.isPunk ? 'Punki' : getCardNameEs(person.id);
  destroyPersonAt(state, target.owner, target.col, target.slot, opts);
  return { ok: true, destroyed: true, hitCamp: false, labelEs: name, wasPunk: person.isPunk };
}

function destroyPersonAt(state, ownerKey, col, slot, opts = {}) {
  const owner = state[ownerKey];
  const person = owner.columns[col][slot];
  if (!person) return null;
  owner.columns[col][slot] = null;

  if (person.isPunk) {
    if (person.underlyingCardId) {
      state.discard.push(person.underlyingCardId);
      if (ownerKey === 'human') {
        if (!Array.isArray(state.humanPunkPlaceholders)) state.humanPunkPlaceholders = [];
        state.humanPunkPlaceholders.push(person.underlyingCardId);
      }
      if (ownerKey === 'bot' && !opts.silent) {
        addLog(
          state,
          'system',
          `🃏 El Punki destruido del bot era ${getCardNameEs(person.underlyingCardId)} (pasa al descarte compartido).`
        );
      }
    }
  } else {
    state.discard.push(person.id);
  }
  return person;
}

function revealHumanDestroyedPunk(state, realCardId, rng = Math.random) {
  const card = DECK_CARDS_BY_ID[realCardId];
  if (!card) return { ok: false, error: `Carta desconocida: ${realCardId}` };
  if (!state.humanPunkPlaceholders || state.humanPunkPlaceholders.length === 0) {
    return { ok: false, error: 'No hay ningún Punki destruido tuyo pendiente de revelar.' };
  }
  const placeholderId = state.humanPunkPlaceholders.pop();
  if (placeholderId === realCardId) {
    return { ok: true, message: `Confirmado: tu Punki destruido era ${card.nameEs} (ya estaba en descarte).` };
  }
  // Remove placeholder from discard back into deck, and move realCardId into discard (with Quantum Swap if in bot hand!)
  const discIdx = state.discard.lastIndexOf(placeholderId);
  if (discIdx !== -1) {
    state.discard.splice(discIdx, 1);
    state.deck.push(placeholderId);
  }
  const deckIdx = state.deck.indexOf(realCardId);
  if (deckIdx !== -1) {
    state.deck.splice(deckIdx, 1);
    state.discard.push(realCardId);
    state.deck = shuffle(state.deck, rng);
    return { ok: true, message: `Registrado: tu Punki destruido era ${card.nameEs} (movido al descarte compartido).` };
  }
  const botIdx = state.bot.hand.indexOf(realCardId);
  if (botIdx !== -1 && state.deck.length > 0) {
    const swapIdx = Math.floor(rng() * state.deck.length);
    const replacement = state.deck[swapIdx];
    state.deck.splice(swapIdx, 1);
    state.bot.hand[botIdx] = replacement;
    state.discard.push(realCardId);
    return { ok: true, message: `Registrado: tu Punki destruido era ${card.nameEs} (movido al descarte compartido).` };
  }
  // Rollback placeholder to discard if real card was already public
  if (discIdx !== -1) {
    const backIdx = state.deck.lastIndexOf(placeholderId);
    if (backIdx !== -1) state.deck.splice(backIdx, 1);
    state.discard.push(placeholderId);
  }
  return { ok: false, error: `Todas las copias de ${card.nameEs} ya figuran en zona pública.` };
}

function movePersonPosition(state, playerKey, fromCol, fromSlot, toCol, toSlot = null) {
  const p = state[playerKey];
  const person = p.columns[fromCol]?.[fromSlot];
  if (!person) return { ok: false, error: 'No hay ninguna persona en esa posición.' };
  if (toCol < 0 || toCol > 2) return { ok: false, error: 'Columna destino inválida.' };
  let destSlot = toSlot;
  if (destSlot === null || destSlot === undefined) {
    if (!p.columns[toCol][0]) destSlot = 0;
    else if (!p.columns[toCol][1]) destSlot = 1;
    else return { ok: false, error: `La ${COL_NAMES_ES[toCol]} ya está llena.` };
  } else if (p.columns[toCol][destSlot]) {
    // Swap positions!
    const other = p.columns[toCol][destSlot];
    p.columns[toCol][destSlot] = person;
    p.columns[fromCol][fromSlot] = other;
    return {
      ok: true,
      message: `Intercambiaste ${person.isPunk ? 'Punki' : getCardNameEs(person.id)} con ${other.isPunk ? 'Punki' : getCardNameEs(other.id)}.`,
    };
  }
  p.columns[fromCol][fromSlot] = null;
  p.columns[toCol][destSlot] = person;
  return {
    ok: true,
    message: `Moviste a ${person.isPunk ? 'Punki' : getCardNameEs(person.id)} a ${COL_NAMES_ES[toCol]}, ${SLOT_NAMES_ES[destSlot]}.`,
  };
}

function restoreTarget(state, target, makeReady = false) {
  const owner = state[target.owner];
  if (target.type === 'camp') {
    const camp = owner.camps[target.col];
    if (!camp || camp.destroyed) return { ok: false, error: 'No se puede restaurar un campamento destruido.' };
    if (CAMPS_BY_ID[camp.id]?.trait === 'cannot_restore') {
      return { ok: false, error: `${getCardNameEs(camp.id)} no puede restaurarse.` };
    }
    if (!camp.damaged) return { ok: false, error: 'Ese campamento ya está sano.' };
    camp.damaged = false;
    if (makeReady) camp.ready = true;
    return { ok: true, labelEs: getCardNameEs(camp.id) };
  }
  const person = owner.columns[target.col][target.slot];
  if (!person) return { ok: false, error: 'No hay persona ahí.' };
  if (!person.damaged) return { ok: false, error: 'Esa persona ya está sana.' };
  person.damaged = false;
  if (makeReady) person.ready = true;
  return { ok: true, labelEs: person.isPunk ? 'Punki' : getCardNameEs(person.id) };
}

function gainPunk(state, playerKey, preferredCol = null, preferredSlot = null, rng = Math.random) {
  const empty = getEmptyPersonSlots(state, playerKey);
  if (empty.length === 0) {
    return { ok: false, error: 'Ya tenés el máximo de 6 personas en mesa.' };
  }
  let chosen = null;
  if (preferredCol !== null && preferredCol !== undefined) {
    const inCol = empty.filter((s) => s.col === preferredCol);
    if (inCol.length > 0) {
      chosen =
        preferredSlot !== null && preferredSlot !== undefined
          ? inCol.find((s) => s.slot === preferredSlot) || inCol[0]
          : inCol.find((s) => s.slot === 1) || inCol[0]; // default front to shield!
    }
  }
  if (!chosen) {
    // Prefer protecting a damaged camp, then an empty column, then front slot
    const p = state[playerKey];
    const sorted = [...empty].sort((a, b) => {
      const aCampDamaged = p.camps[a.col]?.damaged && !p.camps[a.col]?.destroyed ? 1 : 0;
      const bCampDamaged = p.camps[b.col]?.damaged && !p.camps[b.col]?.destroyed ? 1 : 0;
      if (aCampDamaged !== bCampDamaged) return bCampDamaged - aCampDamaged;
      return b.slot - a.slot; // prefer front
    });
    chosen = sorted[0];
  }

  const underlying = drawTopCardForPunk(state, playerKey, rng);
  if (state.phase === 'gameover') return { ok: false, error: state.winReason };

  const entersReady = hasActiveTrait(state, playerKey, 'people_enter_ready');
  const punk = {
    uid: nextUid('punk'),
    id: 'punk',
    isPunk: true,
    underlyingCardId: underlying,
    damaged: false,
    ready: entersReady,
  };
  state[playerKey].columns[chosen.col][chosen.slot] = punk;
  state[playerKey].flags.peoplePlayedThisTurn += 1;
  return { ok: true, col: chosen.col, slot: chosen.slot, punk };
}

// === EVENT QUEUE & RAIDERS ===
function findEventQueueSlot(events, bombNumber) {
  if (bombNumber <= 0) return -1; // immediate
  for (let i = bombNumber - 1; i < 3; i++) {
    if (events[i] === null) return i;
  }
  return null; // queue blocked!
}

function triggerRaid(state, playerKey, botChoiceFn = null, rng = Math.random) {
  const p = state[playerKey];
  const existingIdx = p.events.indexOf('raiders');
  if (existingIdx === -1) {
    const slot = findEventQueueSlot(p.events, 2);
    if (slot === null) {
      return { ok: false, error: 'Tu cola de eventos está ocupada en casillas 2 y 3; Asaltantes no puede entrar.' };
    }
    p.events[slot] = 'raiders';
    return { ok: true, resolved: false, slot: slot + 1, message: `Asaltantes entra en casilla ${slot + 1}.` };
  }

  // Advance Raiders toward 0 (jumping over occupied slots per Radlands rules!)
  p.events[existingIdx] = null;
  let targetIdx = existingIdx - 1;
  while (targetIdx >= 0 && p.events[targetIdx] !== null) {
    targetIdx--;
  }
  if (targetIdx < 0) {
    p.flags.anyEventResolvedThisTurn = true;
    p.flags.raidersResolvedThisTurn = true;
    return resolveRaiders(state, playerKey, botChoiceFn, rng);
  }
  p.events[targetIdx] = 'raiders';
  return { ok: true, resolved: false, slot: targetIdx + 1, message: `Asaltantes avanza a casilla ${targetIdx + 1}.` };
}

function resolveRaiders(state, attackerKey, botChoiceFn = null) {
  const defKey = otherPlayer(attackerKey);
  const aliveCamps = state[defKey].camps
    .map((c, col) => ({ camp: c, col }))
    .filter((x) => !x.camp.destroyed);

  if (aliveCamps.length === 0) {
    checkGameOver(state);
    return { ok: true, resolved: true, message: 'No quedan campamentos rivales.' };
  }

  if (defKey === 'bot') {
    const chosenCol = botChoiceFn
      ? botChoiceFn(getBotObservation(state), 'raiders_camp', aliveCamps.map((x) => x.col))
      : aliveCamps[0].col;
    const res = applyDamageToTarget(state, { type: 'camp', owner: 'bot', col: chosenCol });
    const statusText = res.destroyed ? 'destruido' : 'dañado';
    return {
      ok: true,
      resolved: true,
      message: `¡Asaltantes resuelve! El bot elige dañar su campamento ${getCardNameEs(state.bot.camps[chosenCol].id)} (${COL_SHORT_ES[chosenCol]} → ${statusText}).`,
    };
  }

  // Defender is human -> if only 1 camp left, apply directly; else pause for human choice!
  if (aliveCamps.length === 1) {
    const col = aliveCamps[0].col;
    const res = applyDamageToTarget(state, { type: 'camp', owner: 'human', col });
    const statusText = res.destroyed ? 'destruido' : 'dañado';
    return {
      ok: true,
      resolved: true,
      message: `¡Asaltantes resuelve sobre tu único campamento restante (${getCardNameEs(state.human.camps[col].id)} → ${statusText})!`,
    };
  }

  state.pendingChoice = {
    forPlayer: 'human',
    kind: 'raiders_camp',
    sourcePlayer: 'bot',
    sourceName: 'Asaltantes',
    promptEs: `¡Mis Asaltantes resolvieron! Elegí qué campamento tuyo recibe 1 daño: ${aliveCamps
      .map((x) => `${x.col + 1}) ${getCardNameEs(x.camp.id)}${x.camp.damaged ? ' [DAÑADO]' : ''}`)
      .join(', ')}.`,
    options: aliveCamps.map((x) => ({
      value: x.col,
      labelEs: `${x.col + 1}) ${getCardNameEs(x.camp.id)}${x.camp.damaged ? ' (se destruye)' : ''}`,
    })),
    resumeBotTurn: state.activePlayer === 'bot',
  };
  return { ok: true, resolved: true, needsChoice: true, message: state.pendingChoice.promptEs };
}

function resolveEvent(state, playerKey, eventId, opts = {}) {
  const rng = opts.rng || Math.random;
  const botChoiceFn = opts.botChoiceFn || null;
  const oppKey = otherPlayer(playerKey);
  const p = state[playerKey];
  p.flags.anyEventResolvedThisTurn = true;

  if (eventId === 'raiders') {
    p.flags.raidersResolvedThisTurn = true;
    return resolveRaiders(state, playerKey, botChoiceFn);
  }

  const card = DECK_CARDS_BY_ID[eventId];
  if (!card) return { ok: false, error: `Evento desconocido: ${eventId}` };

  switch (card.effect) {
    case 'uprising': {
      let gained = 0;
      for (let i = 0; i < 3; i++) {
        const r = gainPunk(state, playerKey, null, null, rng);
        if (r.ok) gained++;
      }
      const note =
        playerKey === 'human' && gained > 0
          ? ` Colocá ${gained} carta(s) bocabajo del mazo físico como Punkis.`
          : '';
      return { ok: true, message: `Alzamiento resuelve: ${playerKey === 'bot' ? 'gané' : 'ganaste'} ${gained} Punki(s).${note}` };
    }

    case 'radiation': {
      const hits = [];
      for (const side of ['human', 'bot']) {
        for (let col = 0; col < 3; col++) {
          for (let slot = 0; slot < 2; slot++) {
            const per = state[side].columns[col][slot];
            if (per) {
              const res = applyDamageToTarget(state, { type: 'person', owner: side, col, slot });
              hits.push(`${side === 'bot' ? 'Bot' : 'Tu'} ${res.labelEs} (${res.destroyed ? 'destruido' : 'dañado'})`);
            }
          }
        }
      }
      return {
        ok: true,
        message:
          hits.length > 0
            ? `Radiación resuelve: todas las personas reciben daño (${hits.join(', ')}).`
            : 'Radiación resuelve: no había personas en mesa.',
      };
    }

    case 'strafe': {
      const targets = getLegalTargets(state, playerKey, 'unprotected_enemy_person');
      const hits = [];
      for (const t of targets) {
        const res = applyDamageToTarget(state, t);
        hits.push(`${res.labelEs} (${res.destroyed ? 'destruido' : 'dañado'})`);
      }
      return {
        ok: true,
        message:
          hits.length > 0
            ? `Ametrallamiento resuelve: hiere a todas las personas rivales desprotegidas (${hits.join(', ')}).`
            : 'Ametrallamiento resuelve: no había personas rivales desprotegidas.',
      };
    }

    case 'truce': {
      let humanReturned = 0;
      let botReturned = 0;
      for (const side of ['human', 'bot']) {
        for (let col = 0; col < 3; col++) {
          for (let slot = 0; slot < 2; slot++) {
            const per = state[side].columns[col][slot];
            if (!per) continue;
            state[side].columns[col][slot] = null;
            if (side === 'bot') {
              const returnedId = per.isPunk ? per.underlyingCardId : per.id;
              if (returnedId) state.bot.hand.push(returnedId);
              botReturned++;
            } else {
              if (per.isPunk) {
                // Human looks at their physical punk -> ask them to register it (or mark pendingDraw)
                if (per.underlyingCardId) {
                  // Return placeholder to deck so Quantum Swap stays balanced when human reports real card!
                  state.deck.push(per.underlyingCardId);
                  state.deck = shuffle(state.deck, rng);
                }
                state.human.pendingDraws += 1;
              } else {
                state.human.hiddenHand.push(per.id);
              }
              humanReturned++;
            }
          }
        }
      }
      const punkNote =
        state.human.pendingDraws > 0
          ? ` Si algún Punki tuyo volvió a tu mano, decime qué carta era ("robé [carta]").`
          : '';
      return {
        ok: true,
        message: `Tregua resuelve: volvieron ${humanReturned} persona(s) tuya(s) y ${botReturned} mía(s) a las manos.${punkNote}`,
      };
    }

    case 'bombardment': {
      const opp = state[oppKey];
      const hits = [];
      for (let col = 0; col < 3; col++) {
        if (!opp.camps[col].destroyed) {
          const res = applyDamageToTarget(state, { type: 'camp', owner: oppKey, col });
          hits.push(`${res.labelEs} (${res.destroyed ? 'destruido' : 'dañado'})`);
        }
      }
      if (checkGameOver(state)) {
        return { ok: true, message: `¡Bombardeo resuelve y destruye todos los campamentos rivales (${hits.join(', ')})!` };
      }
      const destroyedNow = countDestroyedCamps(state, oppKey);
      if (playerKey === 'bot') {
        for (let i = 0; i < destroyedNow; i++) drawBotCard(state, rng);
      } else {
        state.human.pendingDraws += destroyedNow;
      }
      const drawText =
        destroyedNow > 0
          ? playerKey === 'bot'
            ? ` Robé ${destroyedNow} carta(s).`
            : ` Robá ${destroyedNow} carta(s) física(s) y cantamelas.`
          : '';
      return {
        ok: true,
        message: `Bombardeo resuelve: daña todos los campamentos rivales (${hits.join(', ')}).${drawText}`,
      };
    }

    case 'high_ground': {
      p.flags.opponentUnprotectedThisTurn = true;
      return {
        ok: true,
        message: `Terreno Elevado resuelve: durante este turno TODAS las cartas ${playerKey === 'bot' ? 'tuyas' : 'del bot'} están desprotegidas (podés reorganizar tus personas en la mesa).`,
      };
    }

    case 'interrogate': {
      if (playerKey === 'bot') {
        const drawn = [];
        for (let i = 0; i < 4; i++) {
          const c = drawBotCard(state, rng);
          if (c) drawn.push(c);
        }
        // Keep the single best drawn card, discard the other 3
        if (drawn.length > 1) {
          const keepId = botChoiceFn
            ? botChoiceFn(getBotObservation(state), 'keep_one_card', drawn)
            : drawn[0];
          let keptOnce = false;
          for (const cid of drawn) {
            if (!keptOnce && cid === keepId) {
              keptOnce = true;
              continue;
            }
            const idx = state.bot.hand.lastIndexOf(cid);
            if (idx !== -1) {
              state.bot.hand.splice(idx, 1);
              state.discard.push(cid);
            }
          }
        }
        return { ok: true, message: 'Interrogatorio resuelve: robé 4 cartas, me quedé con 1 y descarté 3.' };
      }
      // Human draws 4 physically and discards 3 (without junking)
      state.human.pendingDraws += 4;
      return {
        ok: true,
        message:
          'Interrogatorio resuelve: robá 4 cartas físicas, elegí 1 para tu mano y descartá las otras 3 (sin chatarra). Cantame "robé [la que te quedás]" y las 3 descartadas con "descarté [c1, c2, c3]".',
      };
    }

    case 'napalm': {
      const cols = getLegalTargets(state, playerKey, 'enemy_column').filter((c) => {
        const opp = state[oppKey];
        return opp.columns[c.col][0] || opp.columns[c.col][1];
      });
      if (cols.length === 0) {
        return { ok: true, message: 'Napalm resuelve: no había personas rivales para destruir.' };
      }
      if (playerKey === 'bot') {
        const bestCol =
          opts.targetCol !== undefined
            ? opts.targetCol
            : botChoiceFn
              ? botChoiceFn(getBotObservation(state), 'napalm_col', cols.map((c) => c.col))
              : cols[0].col;
        const destroyedNames = [];
        for (let slot = 0; slot < 2; slot++) {
          const per = state.human.columns[bestCol][slot];
          if (per) {
            destroyedNames.push(per.isPunk ? 'Punki' : getCardNameEs(per.id));
            destroyPersonAt(state, 'human', bestCol, slot);
          }
        }
        return {
          ok: true,
          message: `Napalm resuelve en tu ${COL_NAMES_ES[bestCol]}: destruye a ${destroyedNames.join(' y ')}.`,
        };
      }
      // Human resolves Napalm
      if (opts.targetCol !== undefined && opts.targetCol !== null) {
        const c = opts.targetCol;
        const destroyedNames = [];
        for (let slot = 0; slot < 2; slot++) {
          const per = state.bot.columns[c][slot];
          if (per) {
            destroyedNames.push(per.isPunk ? 'Punki' : getCardNameEs(per.id));
            destroyPersonAt(state, 'bot', c, slot);
          }
        }
        return {
          ok: true,
          message: `Napalm resuelve en mi ${COL_NAMES_ES[c]}: destruiste ${destroyedNames.join(' y ') || 'ninguna persona'}.`,
        };
      }
      state.pendingChoice = {
        forPlayer: 'human',
        kind: 'napalm_col',
        sourcePlayer: 'human',
        sourceName: 'Napalm',
        promptEs: `¡Tu Napalm resuelve! Elegí qué columna mía limpiar: ${cols.map((c) => c.labelEs).join(', ')}.`,
        options: cols.map((c) => ({ value: c.col, labelEs: c.labelEs })),
        resumeBotTurn: false,
      };
      return { ok: true, needsChoice: true, message: state.pendingChoice.promptEs };
    }

    case 'banish': {
      const targets = getLegalTargets(state, playerKey, 'any_enemy_person');
      if (targets.length === 0) {
        return { ok: true, message: 'Destierro resuelve: no había personas rivales en mesa.' };
      }
      if (playerKey === 'bot') {
        const chosen =
          opts.target ||
          (botChoiceFn ? botChoiceFn(getBotObservation(state), 'banish_target', targets) : targets[0]);
        const res = destroyTarget(state, chosen);
        return { ok: true, message: `Destierro resuelve: destruye a tu ${res.labelEs} (${COL_SHORT_ES[chosen.col]}).` };
      }
      if (opts.target) {
        const res = destroyTarget(state, opts.target);
        return { ok: true, message: `Destierro resuelve: destruiste a mi ${res.labelEs}.` };
      }
      state.pendingChoice = {
        forPlayer: 'human',
        kind: 'banish_target',
        sourcePlayer: 'human',
        sourceName: 'Destierro',
        promptEs: `¡Tu Destierro resuelve! Elegí qué persona mía destruir: ${targets
          .map((t, i) => `${i + 1}) ${t.labelEs}`)
          .join(', ')}.`,
        options: targets.map((t, i) => ({ value: i, target: t, labelEs: t.labelEs })),
        resumeBotTurn: false,
      };
      return { ok: true, needsChoice: true, message: state.pendingChoice.promptEs };
    }

    case 'famine': {
      // Each player destroys all but one of their people!
      const botPeople = getAllPeople(state, 'bot');
      let botMsg = '';
      if (botPeople.length > 1) {
        const keepUid = botChoiceFn
          ? botChoiceFn(getBotObservation(state), 'famine_keep', botPeople)
          : botPeople[0].person.uid;
        const kept = botPeople.find((x) => x.person.uid === keepUid) || botPeople[0];
        for (const bp of botPeople) {
          if (bp.person.uid !== kept.person.uid) {
            destroyPersonAt(state, 'bot', bp.col, bp.slot);
          }
        }
        botMsg = ` Yo me quedo solo con ${kept.person.isPunk ? 'Punki' : getCardNameEs(kept.person.id)}.`;
      }
      const humanPeople = getAllPeople(state, 'human');
      if (humanPeople.length > 1) {
        state.pendingChoice = {
          forPlayer: 'human',
          kind: 'famine_keep',
          sourcePlayer: playerKey,
          sourceName: 'Hambruna',
          promptEs: `¡Hambruna resuelve!${botMsg} Elegí con cuál ÚNICA persona tuya te quedás (el resto se destruye): ${humanPeople
            .map((hp, i) => `${i + 1}) ${hp.person.isPunk ? 'Punki' : getCardNameEs(hp.person.id)} (${COL_SHORT_ES[hp.col]})`)
            .join(', ')}.`,
          options: humanPeople.map((hp, i) => ({
            value: i,
            uid: hp.person.uid,
            col: hp.col,
            slot: hp.slot,
            labelEs: `${hp.person.isPunk ? 'Punki' : getCardNameEs(hp.person.id)} (${COL_SHORT_ES[hp.col]})`,
          })),
          resumeBotTurn: state.activePlayer === 'bot',
        };
        return { ok: true, needsChoice: true, message: state.pendingChoice.promptEs };
      }
      return {
        ok: true,
        message: `Hambruna resuelve.${botMsg} Vos tenés ${humanPeople.length} persona(s), así que no perdés ninguna.`,
      };
    }

    default:
      return { ok: true, message: `Evento ${card.nameEs} resuelto.` };
  }
}

// === TURN LIFECYCLE ===
function beginTurn(state, playerKey, rng = Math.random, botChoiceFn = null) {
  state.activePlayer = playerKey;
  const p = state[playerKey];
  p.flags = createEmptyFlags();
  const messages = [];

  // Phase 1: Events
  const slot1Event = p.events[0];
  p.events[0] = null;
  if (slot1Event) {
    if (slot1Event !== 'raiders') {
      state.discard.push(slot1Event);
    }
    const evRes = resolveEvent(state, playerKey, slot1Event, { rng, botChoiceFn });
    if (evRes.message) messages.push(evRes.message);
    if (checkGameOver(state)) {
      return { ok: true, messages, gameOver: true };
    }
    // If event paused for human choice, still finish advancing remaining events & replenish after?
    // Per Radlands rules, advancing remaining events happens right after slot 1 resolves!
    // We advance slot 2->1 and 3->2 right now so queue state is clean, then replenish.
  }

  // Advance events 2->1, 3->2
  if (p.events[0] === null && p.events[1] !== null) {
    p.events[0] = p.events[1];
    p.events[1] = null;
    messages.push(`Avanza ${getCardNameEs(p.events[0])} a casilla 1.`);
  }
  if (p.events[1] === null && p.events[2] !== null) {
    p.events[1] = p.events[2];
    p.events[2] = null;
    messages.push(`Avanza ${getCardNameEs(p.events[1])} a casilla 2.`);
  }

  // Phase 2: Replenish
  const isVeryFirstTurn = state.turn === 1 && playerKey === state.firstPlayer;
  p.water = isVeryFirstTurn ? 1 : 3;
  p.extraWater = 0;

  // Ready all non-destroyed camps (including damaged camps!) and undamaged people
  for (const camp of p.camps) {
    camp.ready = !camp.destroyed;
  }
  for (const { person } of getAllPeople(state, playerKey)) {
    person.ready = !person.damaged;
  }

  // Draw 1 card
  if (playerKey === 'bot') {
    const drawn = drawBotCard(state, rng);
    if (state.phase === 'gameover') {
      return { ok: true, messages, gameOver: true };
    }
    if (drawn) {
      messages.push(`Turno ${state.turn} del Bot: robé 1 carta (mano: ${p.hand.length}) y recibí ${p.water}💧.`);
    }
  } else {
    p.pendingDraws += 1;
    messages.push(
      `¡Tu turno (Turno ${state.turn})! Recibís ${p.water}💧. Robá 1 carta del mazo físico y decime cuál salió ("robé [carta]").`
    );
  }

  state.turnStep = 'actions';
  return { ok: true, messages, needsChoice: !!state.pendingChoice };
}

function endTurn(state, rng = Math.random, botChoiceFn = null) {
  if (state.phase !== 'playing') return { ok: false, error: 'La partida no está en curso.' };
  if (state.pendingChoice) {
    return { ok: false, error: `Primero respondé la decisión pendiente: ${state.pendingChoice.promptEs}` };
  }
  const current = state.activePlayer;
  state[current].water = 0;
  state[current].extraWater = 0;
  const next = otherPlayer(current);
  if (next === state.firstPlayer) {
    state.turn += 1;
  }
  return beginTurn(state, next, rng, botChoiceFn);
}

// === ACTIONS ===
function takeWaterSilo(state, playerKey) {
  const p = state[playerKey];
  if (p.waterSiloInHand) return { ok: false, error: 'Ya tenés el Depósito de Agua en tu mano.' };
  if (getTotalWater(p) < 1) return { ok: false, error: 'Necesitás 1💧 para tomar el Depósito de Agua.' };
  spendWater(p, 1);
  p.waterSiloInHand = true;
  return {
    ok: true,
    message:
      playerKey === 'bot'
        ? 'Pago 1💧 y me llevo mi Depósito de Agua a la mano.'
        : 'Pagaste 1💧 y llevaste tu Depósito de Agua a la mano.',
  };
}

function junkWaterSilo(state, playerKey) {
  const p = state[playerKey];
  if (!p.waterSiloInHand) return { ok: false, error: 'Tu Depósito de Agua no está en tu mano (primero tomalo por 1💧).' };
  p.waterSiloInHand = false;
  p.extraWater += 1;
  return {
    ok: true,
    message:
      playerKey === 'bot'
        ? 'Desecho mi Depósito de Agua → +1💧 extra (vuelve a la mesa).'
        : 'Desechaste tu Depósito de Agua → +1💧 extra (vuelve a la mesa).',
  };
}

function buyDrawCard(state, playerKey, rng = Math.random) {
  const p = state[playerKey];
  if (getTotalWater(p) < 2) return { ok: false, error: 'Necesitás 2💧 para robar una carta.' };
  spendWater(p, 2);
  if (playerKey === 'bot') {
    drawBotCard(state, rng);
    return { ok: true, message: `Pago 2💧 y robo 1 carta (mano: ${p.hand.length}).` };
  }
  p.pendingDraws += 1;
  return { ok: true, message: 'Pagaste 2💧 para robar 1 carta física. Decime cuál salió ("robé [carta]").' };
}

function playPerson(state, playerKey, cardId, col, slot = null, opts = {}) {
  const rng = opts.rng || Math.random;
  const p = state[playerKey];
  const card = DECK_CARDS_BY_ID[cardId];
  if (!card || card.type !== 'person') return { ok: false, error: 'Esa carta no es una Persona.' };
  if (col < 0 || col > 2) return { ok: false, error: 'Columna inválida (usá 1, 2 o 3).' };

  // Choose slot in column
  let targetSlot = slot;
  if (targetSlot === null || targetSlot === undefined) {
    // Default: if back empty and front empty -> front (1) if protecting damaged camp else back (0)?
    // Actually in Radlands, if you play 1 person into an empty column, placing it in slot 0 or 1 is equivalent until a 2nd arrives;
    // putting it in back (0) lets a future Punk sit in front (1) to shield it!
    if (!p.columns[col][0]) targetSlot = 0;
    else if (!p.columns[col][1]) targetSlot = 1;
    else return { ok: false, error: `La ${COL_NAMES_ES[col]} ya tiene 2 personas.` };
  } else if (p.columns[col][targetSlot]) {
    const alt = targetSlot === 0 ? 1 : 0;
    if (!p.columns[col][alt]) {
      targetSlot = alt;
    } else {
      return { ok: false, error: `La ${COL_NAMES_ES[col]} ya está llena.` };
    }
  }

  const cost = opts.free ? 0 : getPersonPlayCost(state, playerKey, cardId, col);
  if (getTotalWater(p) < cost) {
    return { ok: false, error: `Necesitás ${cost}💧 para jugar ${card.nameEs} (tenés ${getTotalWater(p)}💧).` };
  }

  // Remove card from hand (for human: auto-sync from deck via Quantum Swap if they didn't pre-announce draw!)
  if (playerKey === 'bot') {
    const idx = p.hand.indexOf(cardId);
    if (idx === -1) return { ok: false, error: 'El bot no tiene esa carta en mano.' };
    p.hand.splice(idx, 1);
  } else {
    const idx = p.hiddenHand.indexOf(cardId);
    if (idx !== -1) {
      p.hiddenHand.splice(idx, 1);
    } else {
      const sync = recordHumanDraw(state, cardId, { rng, skipPendingDecrement: true });
      if (!sync.ok) return sync;
      const newIdx = p.hiddenHand.lastIndexOf(cardId);
      if (newIdx !== -1) p.hiddenHand.splice(newIdx, 1);
    }
  }

  spendWater(p, cost);

  const entersReady =
    opts.forceReady ||
    card.trait === 'enters_ready' ||
    card.trait === 'people_enter_ready' ||
    hasActiveTrait(state, playerKey, 'people_enter_ready');

  const instance = {
    uid: nextUid('per'),
    id: cardId,
    isPunk: false,
    damaged: false,
    ready: entersReady,
  };
  p.columns[col][targetSlot] = instance;
  p.flags.peoplePlayedThisTurn += 1;

  const extras = [];
  // Enter-play effects!
  if (card.enterPlay === 'gain_punk') {
    const pr = gainPunk(state, playerKey, null, null, rng);
    if (pr.ok) {
      extras.push(
        playerKey === 'bot'
          ? `gana 1 Punki en ${COL_SHORT_ES[pr.col]}`
          : `ganás 1 Punki en ${COL_SHORT_ES[pr.col]} (poné una carta bocabajo)`
      );
    }
  } else if (card.enterPlay === 'push_opponent_events_back') {
    const oppEvents = state[otherPlayer(playerKey)].events;
    let moved = 0;
    for (let i = 2; i >= 0; i--) {
      if (oppEvents[i] !== null && i < 2 && oppEvents[i + 1] === null) {
        oppEvents[i + 1] = oppEvents[i];
        oppEvents[i] = null;
        moved++;
      }
    }
    if (moved > 0) extras.push(`retrocede ${moved} evento(s) rival(es)`);
  } else if (card.enterPlay === 'draw_and_self_damage') {
    if (playerKey === 'bot') {
      drawBotCard(state, rng);
      extras.push('roba 1 carta');
    } else {
      state.human.pendingDraws += 1;
      extras.push('robás 1 carta física (cantamela)');
    }
    instance.damaged = true;
    instance.ready = false;
    extras.push('entra dañado');
  } else if (card.enterPlay === 'restore') {
    const restorables = getRestorableCards(state, playerKey);
    if (restorables.length > 0) {
      const target = opts.restoreTarget || restorables[0];
      const rr = restoreTarget(state, target);
      if (rr.ok) extras.push(`restaura ${rr.labelEs}`);
    }
  }

  const extraStr = extras.length > 0 ? ` (${extras.join('; ')})` : '';
  const verb = playerKey === 'bot' ? 'Juego' : 'Jugaste';
  const msg = `${verb} a ${card.nameEs} (${cost}💧) en ${COL_NAMES_ES[col]}, ${SLOT_NAMES_ES[targetSlot]}${extraStr}.`;
  return { ok: true, instance, col, slot: targetSlot, message: msg };
}

function playEvent(state, playerKey, cardId, opts = {}) {
  const rng = opts.rng || Math.random;
  const p = state[playerKey];
  const card = DECK_CARDS_BY_ID[cardId];
  if (!card || card.type !== 'event') return { ok: false, error: 'Esa carta no es un Evento.' };

  if (getTotalWater(p) < card.cost) {
    return { ok: false, error: `Necesitás ${card.cost}💧 para jugar ${card.nameEs} (tenés ${getTotalWater(p)}💧).` };
  }

  // Zeto Khan: first event each turn enters queue 0!
  const zetoZero =
    p.flags.eventsPlayedThisTurn === 0 && hasActiveTrait(state, playerKey, 'first_event_queue_zero');
  const effectiveBomb = zetoZero ? 0 : card.bomb;

  let slot = -1;
  if (effectiveBomb > 0) {
    slot = findEventQueueSlot(p.events, effectiveBomb);
    if (slot === null) {
      return { ok: false, error: `No hay espacio libre en tu cola de eventos a partir de la casilla ${effectiveBomb}.` };
    }
  }

  // Remove from hand
  if (playerKey === 'bot') {
    const idx = p.hand.indexOf(cardId);
    if (idx === -1) return { ok: false, error: 'El bot no tiene ese evento en mano.' };
    p.hand.splice(idx, 1);
  } else {
    const idx = p.hiddenHand.indexOf(cardId);
    if (idx !== -1) {
      p.hiddenHand.splice(idx, 1);
    } else {
      const sync = recordHumanDraw(state, cardId, { rng, skipPendingDecrement: true });
      if (!sync.ok) return sync;
      const newIdx = p.hiddenHand.lastIndexOf(cardId);
      if (newIdx !== -1) p.hiddenHand.splice(newIdx, 1);
    }
  }

  spendWater(p, card.cost);
  p.flags.eventsPlayedThisTurn += 1;

  if (effectiveBomb === 0) {
    state.discard.push(cardId);
    const res = resolveEvent(state, playerKey, cardId, opts);
    const zetoTag = zetoZero && card.bomb > 0 ? ' (al instante por Zeto Khan!)' : '';
    const verb = playerKey === 'bot' ? 'Juego' : 'Jugaste';
    return {
      ok: true,
      resolved: true,
      needsChoice: !!res.needsChoice,
      message: `${verb} ${card.nameEs} (${card.cost}💧)${zetoTag}. ${res.message}`,
    };
  }

  p.events[slot] = cardId;
  const verb = playerKey === 'bot' ? 'Juego' : 'Jugaste';
  return {
    ok: true,
    resolved: false,
    slot: slot + 1,
    message: `${verb} el evento ${card.nameEs} (${card.cost}💧) en casilla ${slot + 1}.`,
  };
}

function junkCard(state, playerKey, cardId, opts = {}) {
  const rng = opts.rng || Math.random;
  const p = state[playerKey];
  if (cardId === 'water_silo') {
    return junkWaterSilo(state, playerKey);
  }
  const card = DECK_CARDS_BY_ID[cardId];
  if (!card) return { ok: false, error: `Carta desconocida: ${cardId}` };

  // Validate target before removing card if injure/damage/restore requires one
  const junkType = card.junk;
  let chosenTarget = opts.target || null;
  if (junkType === 'injure') {
    const legal = getLegalTargets(state, playerKey, 'unprotected_enemy_person');
    if (legal.length === 0) return { ok: false, error: 'No hay personas rivales desprotegidas para Herir.' };
    if (!chosenTarget) chosenTarget = legal[0];
  } else if (junkType === 'damage') {
    const legal = getLegalTargets(state, playerKey, 'unprotected_enemy');
    if (legal.length === 0) return { ok: false, error: 'No hay objetivos rivales desprotegidos para Dañar.' };
    if (!chosenTarget) chosenTarget = legal[0];
  } else if (junkType === 'restore') {
    const legal = getRestorableCards(state, playerKey);
    if (legal.length === 0) return { ok: false, error: 'No tenés ninguna carta dañada para Restaurar.' };
    if (!chosenTarget) chosenTarget = legal[0];
  }

  // Remove from hand & discard
  if (playerKey === 'bot') {
    const idx = p.hand.indexOf(cardId);
    if (idx === -1) return { ok: false, error: 'El bot no tiene esa carta en mano.' };
    p.hand.splice(idx, 1);
  } else {
    const idx = p.hiddenHand.indexOf(cardId);
    if (idx !== -1) {
      p.hiddenHand.splice(idx, 1);
    } else {
      const sync = recordHumanDraw(state, cardId, { rng, skipPendingDecrement: true });
      if (!sync.ok) return sync;
      const newIdx = p.hiddenHand.lastIndexOf(cardId);
      if (newIdx !== -1) p.hiddenHand.splice(newIdx, 1);
    }
  }
  state.discard.push(cardId);

  const verb = playerKey === 'bot' ? 'Desecho' : 'Desechaste';
  const res = applyJunkEffect(state, playerKey, junkType, { ...opts, target: chosenTarget, rng });
  return {
    ok: res.ok,
    needsChoice: !!res.needsChoice,
    message: `${verb} ${card.nameEs} (Chatarra: ${JUNK_INFO[junkType].shortEs}) → ${res.message}`,
    error: res.error,
  };
}

function applyJunkEffect(state, playerKey, junkType, opts = {}) {
  const rng = opts.rng || Math.random;
  const p = state[playerKey];
  switch (junkType) {
    case 'water':
      p.extraWater += 1;
      return { ok: true, message: '+1💧 extra.' };
    case 'draw':
      if (playerKey === 'bot') {
        drawBotCard(state, rng);
        return { ok: true, message: `roba 1 carta (mano: ${p.hand.length}).` };
      }
      p.pendingDraws += 1;
      return { ok: true, message: 'robás 1 carta física (cantamela).' };
    case 'punk': {
      const pr = gainPunk(state, playerKey, opts.col, opts.slot, rng);
