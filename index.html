      normalizeEs(card.nameEs),
      normalizeEs(card.nameEn),
      ...(card.aliases || []).map(normalizeEs),
      ...(custom[card.id] || []).map(normalizeEs),
    ]);
    for (const term of terms) {
      if (term.length >= 2) {
        entries.push({ id: card.id, term, card, len: term.length });
      }
    }
  }
  // Longer phrases first so "deposito de suministros" beats "deposito"
  entries.sort((a, b) => b.len - a.len);
  return entries;
}

/**
 * Finds all matching cards mentioned in a Spanish utterance (ordered by position in string).
 * Supports exact substring match first, then fuzzy token-window Levenshtein match.
 */
function extractCardsFromText(rawText, pool = 'all', opts = {}) {
  const norm = normalizeEs(rawText);
  if (!norm) return [];
  const entries = buildCardSearchIndex(pool);
  const found = [];
  const occupiedRanges = [];

  const overlaps = (start, end) =>
    occupiedRanges.some(([s, e]) => Math.max(start, s) < Math.min(end, e));

  // Pass 1: exact word-boundary substring matches (longest phrase first)
  for (const entry of entries) {
    const escaped = entry.term.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    const re = new RegExp(`(?:^|\\s)(${escaped})(?:$|\\s)`, 'g');
    let m;
    while ((m = re.exec(norm)) !== null) {
      const start = m.index + (m[0].startsWith(' ') ? 1 : 0);
      const end = start + m[1].length;
      if (!overlaps(start, end)) {
        occupiedRanges.push([start, end]);
        found.push({ id: entry.id, card: entry.card, start, end, score: 1.0, matched: entry.term });
      }
    }
  }

  // Pass 2: fuzzy Levenshtein match on remaining unmatched n-grams (1..3 words) for voice typos
  const tokens = [];
  const tokenRe = /\S+/g;
  let tm;
  while ((tm = tokenRe.exec(norm)) !== null) {
    tokens.push({ word: tm[0], start: tm.index, end: tm.index + tm[0].length });
  }

  const STOP_WORDS = new Set([
    'el', 'la', 'los', 'las', 'un', 'una', 'unos', 'unas', 'de', 'del', 'al', 'en', 'con', 'por',
    'para', 'y', 'o', 'a', 'mi', 'mis', 'tu', 'tus', 'su', 'sus', 'yo', 'vos', 'bot', 'columna',
    'col', 'fila', 'izquierda', 'centro', 'medio', 'derecha', 'adelante', 'frente', 'atras',
    'detras', 'uno', 'dos', 'tres', '1', '2', '3', 'juego', 'bajo', 'pongo', 'tiro', 'uso',
    'activo', 'desecho', 'descarto', 'descarte', 'chatarra', 'robe', 'saco', 'saque', 'toco',
    'dano', 'hiero', 'destruyo', 'restauro', 'curo', 'contra', 'sobre', 'campamento', 'campamentos',
    'son', 'elegi', 'carta', 'cartas', 'agua', 'paso', 'termino', 'turno', 'que', 'me', 'te', 'se',
  ]);

  if (opts.allowFuzzy !== false) {
    for (let n = 3; n >= 1; n--) {
      for (let i = 0; i <= tokens.length - n; i++) {
        const start = tokens[i].start;
        const end = tokens[i + n - 1].end;
        if (overlaps(start, end)) continue;
        const sliceWords = tokens.slice(i, i + n).map((t) => t.word);
        if (n === 1 && (STOP_WORDS.has(sliceWords[0]) || sliceWords[0].length < 4)) continue;
        if (sliceWords.every((w) => STOP_WORDS.has(w))) continue;
        const phrase = sliceWords.join(' ');

        let best = null;
        for (const entry of entries) {
          if (Math.abs(entry.term.length - phrase.length) > 3) continue;
          const dist = levenshtein(phrase, entry.term);
          const maxAllowed = entry.term.length >= 8 ? 2 : entry.term.length >= 5 ? 1 : 0;
          if (dist <= maxAllowed) {
            const score = 1 - dist / Math.max(phrase.length, entry.term.length);
            if (!best || score > best.score) {
              best = { id: entry.id, card: entry.card, start, end, score, matched: entry.term };
            }
          }
        }
        if (best) {
          occupiedRanges.push([start, end]);
          found.push(best);
        }
      }
    }
  }

  found.sort((a, b) => a.start - b.start);
  return found;
}

// Column & Slot extraction from Spanish text
function extractColumn(rawText) {
  const norm = normalizeEs(rawText);
  // Explicit column keywords first
  const colRegex = /(?:col(?:umna)?|carril|fila|posicion)\s*(1|2|3|uno|una|primera|dos|segunda|tres|tercera|izquierda|izq|centro|medio|derecha|der)/;
  const m = norm.match(colRegex);
  if (m) return wordToCol(m[1]);

  if (/\b(?:izquierda|izq|primera)\b/.test(norm)) return 0;
  if (/\b(?:centro|medio|central|segunda)\b/.test(norm)) return 1;
  if (/\b(?:derecha|der|tercera)\b/.test(norm)) return 2;

  const enNum = norm.match(/\b(?:en|a|al|la|el)\s+(1|2|3|uno|dos|tres)\b/);
  if (enNum) return wordToCol(enNum[1]);

  const bareNum = norm.match(/(?:^|\s)(1|2|3)(?:$|\s)/);
  if (bareNum) return wordToCol(bareNum[1]);

  return null;
}

function wordToCol(w) {
  if (['1', 'uno', 'una', 'primera', 'izquierda', 'izq'].includes(w)) return 0;
  if (['2', 'dos', 'segunda', 'centro', 'medio', 'central'].includes(w)) return 1;
  if (['3', 'tres', 'tercera', 'derecha', 'der'].includes(w)) return 2;
  return null;
}

function extractSlot(rawText) {
  const norm = normalizeEs(rawText);
  if (/\b(?:adelante|frente|delante|delantera|frontal)\b/.test(norm)) return 1;
  if (/\b(?:atras|detras|trasera|fondo)\b/.test(norm)) return 0;
  return null;
}

// Resolve a target mentioned in the second half of a phrase (e.g., "contra tu cañón", "en tu columna 2", "a tu punki")
function resolveTargetFromText(rawText, legalTargets) {
  if (!legalTargets || legalTargets.length === 0) return null;
  const norm = normalizeEs(rawText);

  // Split after target prepositions if present so source card doesn't collide with target card!
  const splitMatch = norm.match(/\b(?:contra|sobre|hacia|a tu|al|en tu|tu|tuyo|del bot|mio|mi)\b(.*)$/);
  const focus = splitMatch ? splitMatch[1] : norm;

  // Check punk mention (including common Spanish dictation homophones!)
  if (/\b(?:punk[iy]?s?|panqu[ie]s?|pank[iy]?s?|funk[iy]?s?)\b/.test(focus)) {
    const col = extractColumn(focus);
    const punks = legalTargets.filter((t) => t.id === 'punk');
    if (punks.length > 0) {
      if (col !== null) return punks.find((p) => p.col === col) || punks[0];
      return punks[0];
    }
  }

  // Check camp/person card match inside focus
  const cards = extractCardsFromText(focus, 'all');
  if (cards.length > 0) {
    for (const c of cards) {
      const match = legalTargets.find((t) => t.id === c.id);
      if (match) return match;
    }
  }

  // Check column mention
  const col = extractColumn(focus);
  if (col !== null) {
    const inCol = legalTargets.filter((t) => t.col === col);
    if (inCol.length > 0) {
      if (/\bcampamento\b/.test(focus)) {
        return inCol.find((t) => t.type === 'camp') || inCol[0];
      }
      return inCol[0]; // unprotected person first (or camp if unprotected)
    }
  }

  if (legalTargets.length === 1) return legalTargets[0];
  return null;
}

// === MAIN NATURAL-LANGUAGE COMMAND PARSER ===
function parseUserInput(rawText, state) {
  const norm = normalizeEs(rawText);
  if (!norm) return { intent: 'empty' };

  // Global meta commands (work in any phase!)
  if (/^(?:deshacer|deshace|undo|volver|me equivoque|cancelar ultima|atras)$/.test(norm)) {
    return { intent: 'undo' };
  }
  if (/^(?:ayuda|help|comandos|como funciona|que puedo decir)$/.test(norm)) {
    return { intent: 'help' };
  }
  if (/^(?:estado|resumen|tablero|que tenes|como vamos|situacion|ver estado)$/.test(norm)) {
    return { intent: 'status' };
  }
  if (/^(?:nueva partida|reiniciar|empezar de nuevo|reset)$/.test(norm)) {
    return { intent: 'new_game' };
  }

  // === PHASE: PENDING CHOICE ===
  if (state.pendingChoice) {
    return parsePendingChoiceReply(rawText, norm, state);
  }

  // === PHASE: SETUP CAMPS ===
  if (state.phase === 'setup_camps') {
    const camps = extractCardsFromText(rawText, 'camps');
    if (/\b(?:descarte|descartados|deje fuera|saque fuera)\b/.test(norm) && !/\b(?:mis campamentos|elegi|tengo)\b/.test(norm)) {
      return { intent: 'setup_discarded_camps', campIds: [...new Set(camps.map((c) => c.id))] };
    }
    // Check if user said BOTH active + discarded ("mis campamentos son X, Y, Z y descarté A, B, C")
    const discSplit = norm.split(/\b(?:y\s+)?(?:descarte|descartados|deje fuera)\b/);
    if (discSplit.length === 2) {
      const active = [...new Set(extractCardsFromText(discSplit[0], 'camps').map((c) => c.id))];
      const discarded = [...new Set(extractCardsFromText(discSplit[1], 'camps').map((c) => c.id))];
      if (active.length === 3) {
        return { intent: 'setup_camps', campIds: active, discardedCampIds: discarded };
      }
    }
    const uniqueIds = [...new Set(camps.map((c) => c.id))];
    if (uniqueIds.length === 3) {
      return { intent: 'setup_camps', campIds: uniqueIds, discardedCampIds: [] };
    }
    if (uniqueIds.length > 0 && uniqueIds.length < 3) {
      return {
        intent: 'error',
        error: `Reconocí solo ${uniqueIds.length} campamento(s): ${uniqueIds.map((id) => CAMPS_BY_ID[id].nameEs).join(', ')}. Necesito los 3 (ej: "Cañón, Hoguera y Almacén").`,
      };
    }
    return {
      intent: 'error',
      error: 'Decime tus 3 campamentos elegidos (ej: "mis campamentos son Cañón, Hoguera y Almacén") o seleccionalos en el panel.',
    };
  }

  // === PHASE: SETUP FIRST PLAYER ===
  if (state.phase === 'setup_first') {
    if (/\b(?:empiezo|arranco|voy yo|primero yo|yo|humano|nico)\b/.test(norm) && !/\bbot\b/.test(norm)) {
      return { intent: 'setup_first', who: 'human' };
    }
    if (/\b(?:bot|vos|maquina|cpu|empieza el bot|arranca el bot|empezas|arrancas)\b/.test(norm)) {
      return { intent: 'setup_first', who: 'bot' };
    }
    if (/\b(?:sorteo|azar|random|moneda|suerte|elegi vos|cualquiera)\b/.test(norm)) {
      return { intent: 'setup_first', who: 'random' };
    }
    return { intent: 'error', error: 'Decime "empiezo yo", "empieza el bot" o "sorteo".' };
  }

  // === PHASE: SETUP DRAW (Initial Hand) ===
  if (state.phase === 'setup_draw') {
    const cards = extractCardsFromText(rawText, 'deck');
    if (cards.length > 0) {
      return { intent: 'draw_cards', cardIds: cards.map((c) => c.id) };
    }
    return {
      intent: 'error',
      error: `Todavía faltan registrar ${state.human.pendingDraws} carta(s) inicial(es). Decime cuáles robaste (ej: "robé Francotirador, Musa y Napalm").`,
    };
  }

  // === PHASE: GAME OVER ===
  if (state.phase === 'gameover') {
    return { intent: 'error', error: 'La partida terminó. Decí "nueva partida" para jugar otra.' };
  }

  // === PHASE: PLAYING ===
  // 1. End turn (including natural spoken Spanish dictation variants!)
  if (/^(?:paso|pasar|paso turno|paso el turno|pasar turno|termino|termine|terminar|termino turno|termino mi turno|termine mi turno|fin|fin de turno|fin del turno|listo|tu turno|turno del bot|te toca|dale bot|dale vos|juga vos|juega el bot|va el bot)$/.test(norm)) {
    return { intent: 'end_turn' };
  }

  // 2. Water Silo take / junk
  if (/\b(?:silo|deposito de agua|tanque de agua|deposito)\b/.test(norm) && !/\bsuministros\b/.test(norm)) {
    if (/\b(?:desecho|desechar|chatarra|uso|usar|gasto|gastar|rompo|tiro|activo)\b/.test(norm)) {
      return { intent: 'junk_silo' };
    }
    if (/\b(?:tomo|tomar|agarro|agarrar|compro|comprar|llevo|llevar|mano)\b/.test(norm)) {
      return { intent: 'take_silo' };
    }
    // Smart toggle based on current location!
    return { intent: state.human.waterSiloInHand ? 'junk_silo' : 'take_silo' };
  }

  // 3. Buy Draw (2 water)
  if (/\b(?:robo con agua|robo por 2|robo por dos|compro carta|comprar carta|pago 2|pago dos|robar por 2|robar carta con agua)\b/.test(norm)) {
    return { intent: 'buy_draw' };
  }

  // 4. Report drawn physical card(s): "robé X", "saqué X", "me tocó X"
  if (/^(?:robe|robar|saque|me toco|toco|agarre|levante|tuve)\b/.test(norm)) {
    const cards = extractCardsFromText(rawText, 'deck');
    if (cards.length > 0) {
      return { intent: 'draw_cards', cardIds: cards.map((c) => c.id) };
    }
    return { intent: 'error', error: 'No reconocí qué carta robaste. Probá ej: "robé Francotirador" o "robé Musa y Napalm".' };
  }

  // 5. Reveal destroyed physical Punk ("el punki era napalm") OR plain discard
  if (/^(?:el punki era|punki era|el punk era|punk era|el panki era|el panqui era|el funky era)\b/.test(norm)) {
    const cards = extractCardsFromText(rawText, 'deck');
    if (cards.length > 0) {
      return { intent: 'reveal_punk', cardId: cards[0].id };
    }
  }
  if (/^(?:descarte|descarto al pozo|al descarte)\b/.test(norm)) {
    const cards = extractCardsFromText(rawText, 'deck');
    if (cards.length > 0) {
      return { intent: 'discard_plain', cardIds: cards.map((c) => c.id) };
    }
  }

  // 5b. Move own person ("muevo francotirador a columna 2", "mover mi punki a 3 adelante")
  if (/^(?:muevo|mover|cambio de lugar|reorganizo)\b/.test(norm)) {
    const cards = extractCardsFromText(rawText, 'deck');
    const isPunk = /\bpunk[iy]?\b/.test(norm);
    const parts = norm.split(/\b(?:a|hacia|al)\b/);
    const destPart = parts.length > 1 ? parts[parts.length - 1] : norm;
    return {
      intent: 'move_person',
      cardId: cards[0]?.id || (isPunk ? 'punk' : null),
      toCol: extractColumn(destPart),
      toSlot: extractSlot(destPart),
    };
  }

  // 6. Junk card from hand (Chatarra / Desechar)
  if (/\b(?:desecho|desechar|chatarra|por chatarra|para chatarra|basura|tiro por|descarto por chatarra)\b/.test(norm)) {
    const cards = extractCardsFromText(rawText, 'deck');
    if (cards.length === 0) {
      return { intent: 'error', error: 'Decime qué carta desechás por chatarra (ej: "desecho Explorador").' };
    }
    const junkedId = cards[0].id;
    const afterCard = rawText.slice(Math.min(rawText.length, cards[0].end));
    return {
      intent: 'junk_card',
      cardId: junkedId,
      col: extractColumn(afterCard),
      slot: extractSlot(afterCard),
      rawTargetText: afterCard,
    };
  }

  // 7. Play a card (Person or Event): "juego X", "bajo X", "pongo X", "tiro X"
  if (/^(?:juego|jugar|bajo|bajar|pongo|poner|despliego|tiro|lanzo|mando)\b/.test(norm)) {
    const cards = extractCardsFromText(rawText, 'deck');
    if (cards.length === 0) {
      return { intent: 'error', error: 'No reconocí qué carta querés jugar. Ej: "juego Francotirador en 2" o "juego Napalm".' };
    }
    const cardId = cards[0].id;
    const card = DECK_CARDS_BY_ID[cardId];
    return {
      intent: card.type === 'event' ? 'play_event' : 'play_person',
      cardId,
      col: extractColumn(rawText),
      slot: extractSlot(rawText),
      rawTargetText: rawText,
    };
  }

  // 8. Activate ability: "uso X", "activo X", "disparo con X", "ataco con X"
  if (/^(?:uso|usar|activo|activar|disparo|ataco|pego|habilidad)\b/.test(norm)) {
    return parseActivateAbility(rawText, norm, state);
  }

  // 9. Direct physical shortcuts (damage / injure / destroy / restore / gain punk / raid / water)
  if (/^(?:dano|danar|hiero|herir|destruyo|destruir|mato|matar)\b/.test(norm)) {
    const isDestroy = /^(?:destruyo|destruir|mato|matar)\b/.test(norm);
    const isInjure = /^(?:hiero|herir)\b/.test(norm);
    const hitSelf = /\b(?:mi|mio|propio|propia)\b/.test(norm) && !/\b(?:tu|tuyo|bot)\b/.test(norm);
    return {
      intent: 'direct_attack',
      mode: isDestroy ? 'destroy' : isInjure ? 'injure' : 'damage',
      owner: hitSelf ? 'human' : 'bot',
      rawText,
    };
  }
  if (/^(?:restauro|restaurar|curo|curar|reparo|reparar)\b/.test(norm)) {
    return { intent: 'direct_restore', rawText };
  }
  if (/\b(?:(?:gano|ganar|pongo|poner|sumo|nuevo|un)\s+)+(?:punk[iy]?|pank[iy]?|panqu[ie]|funk[iy]?)\b|\b(?:punk[iy]?|pank[iy]?|panqu[ie]|funk[iy]?)\s+en\b/.test(norm)) {
    return { intent: 'direct_punk', col: extractColumn(rawText), slot: extractSlot(rawText) };
  }
  if (/^(?:asalto|asaltar|asaltantes|asaltante|raid|reid|raiders|reiders|avanzo asaltantes|avanzar asaltantes)$/.test(norm)) {
    return { intent: 'direct_raid' };
  }
  if (/^(?:\+?1\s*agua|sumo\s*1?\s*agua|agua extra|mas 1 agua)$/.test(norm)) {
    return { intent: 'direct_water', delta: 1 };
  }
  if (/^(?:-1\s*agua|gasto\s*1?\s*agua|resto\s*1?\s*agua)$/.test(norm)) {
    return { intent: 'direct_water', delta: -1 };
  }

  // 10. Context-smart fallback!
  // If human owes pendingDraws and just typed/spoke card name(s) directly, treat as draw!
  const deckCards = extractCardsFromText(rawText, 'deck');
  if (state.human.pendingDraws > 0 && deckCards.length > 0) {
    return { intent: 'draw_cards', cardIds: deckCards.map((c) => c.id) };
  }

  // If user named one of their ready cards on board, treat as activate ability!
  const allFound = extractCardsFromText(rawText, 'all');
  if (allFound.length > 0) {
    const firstId = allFound[0].id;
    const onBoard = findOwnBoardCardById(state, 'human', firstId);
    if (onBoard) {
      return parseActivateAbility(`uso ${rawText}`, `uso ${norm}`, state);
    }
    if (DECK_CARDS_BY_ID[firstId]) {
      const card = DECK_CARDS_BY_ID[firstId];
      return {
        intent: card.type === 'event' ? 'play_event' : 'play_person',
        cardId: firstId,
        col: extractColumn(rawText),
        slot: extractSlot(rawText),
        rawTargetText: rawText,
      };
    }
  }

  return {
    intent: 'unknown',
    error: `No entendí "${rawText}". Probá ej: "robé [carta]", "juego [carta] en 2", "uso [carta] contra tu [objetivo]", "desecho [carta]", "paso" o "ayuda".`,
  };
}

function findOwnBoardCardById(state, playerKey, cardId) {
  const p = state[playerKey];
  for (let col = 0; col < 3; col++) {
    if (p.camps[col] && !p.camps[col].destroyed && p.camps[col].id === cardId) {
      return { type: 'camp', col, obj: p.camps[col] };
    }
    for (let slot = 0; slot < 2; slot++) {
      const per = p.columns[col][slot];
      if (per && !per.isPunk && per.id === cardId) {
        return { type: 'person', col, slot, obj: per };
      }
    }
  }
  return null;
}

function parseActivateAbility(rawText, norm, state) {
  // Check if user said "uso mi punki..." (Argo Yesky granted damage!)
  if (/\b(?:mi\s+)?punk[iy]?\b/.test(norm.split(/\b(?:contra|sobre|a tu|en tu)\b/)[0])) {
    const punks = getAllPeople(state, 'human').filter((x) => x.person.isPunk && x.person.ready);
    if (punks.length > 0) {
      return {
        intent: 'use_ability',
        source: { type: 'person', col: punks[0].col, slot: punks[0].slot },
        abilityId: 'argo_granted_damage',
        rawTargetText: rawText,
      };
    }
  }

  // Split source phrase vs target phrase
  const parts = norm.split(/\b(?:contra|sobre|a tu|en tu|para)\b/);
  const sourcePart = parts[0] || norm;
  const targetPart = parts.slice(1).join(' ') || norm;

  const sourceCards = extractCardsFromText(sourcePart, 'all');
  let foundSource = null;

  for (const sc of sourceCards) {
    const match = findOwnBoardCardById(state, 'human', sc.id);
    if (match) {
      foundSource = match;
      break;
    }
  }

  // Also allow "uso campamento 1 / izquierdo / centro / derecho"
  if (!foundSource && /\bcampamento\b/.test(sourcePart)) {
    const col = extractColumn(sourcePart);
    if (col !== null && state.human.camps[col] && !state.human.camps[col].destroyed) {
      foundSource = { type: 'camp', col, obj: state.human.camps[col] };
    }
  }

  if (!foundSource) {
    return {
      intent: 'error',
      error: 'No encontré esa carta en tu tablero para activar. Decime el nombre exacto de tu persona o campamento (ej: "uso Cañón contra tu columna 2").',
    };
  }

  const abilities = getAvailableAbilitiesForCard(
    state,
    'human',
    foundSource.type,
    foundSource.col,
    foundSource.slot || 0
  );

  // Pick specific sub-ability for multi-ability camps/people (Outpost, Victory Totem, Cache, Scavenger, Rabble Rouser, Mutant)
  let abilityId = abilities[0]?.id || null;
  if (abilities.length > 1) {
    if (/\b(?:asaltar|asalto|raid|asaltantes)\b/.test(norm)) {
      abilityId = abilities.find((a) => a.kind === 'raid')?.id || abilityId;
    } else if (/\b(?:restaurar|restauro|curar|reparar)\b/.test(norm)) {
      abilityId = abilities.find((a) => a.kind.includes('restore'))?.id || abilityId;
    } else if (/\b(?:robar|robo|carta)\b/.test(norm)) {
      abilityId = abilities.find((a) => a.kind.includes('draw'))?.id || abilityId;
    } else if (/\b(?:punki|punk)\b/.test(norm)) {
      abilityId = abilities.find((a) => a.kind.includes('punk'))?.id || abilityId;
    } else if (/\b(?:agua)\b/.test(norm)) {
      abilityId = abilities.find((a) => a.kind.includes('water'))?.id || abilityId;
    } else if (/\b(?:danar|dano|pegar|atacar|contra)\b/.test(norm)) {
      abilityId = abilities.find((a) => a.kind.includes('damage'))?.id || abilityId;
    }
  }

  return {
    intent: 'use_ability',
    source: { type: foundSource.type, col: foundSource.col, slot: foundSource.slot || 0 },
    abilityId,
    rawTargetText: targetPart || rawText,
    fullRawText: rawText,
  };
}

function parsePendingChoiceReply(rawText, norm, state) {
  const pc = state.pendingChoice;

  // Mercenary Camp: check if user chose to discard 2 cards!
  if (pc.kind === 'mercenary_choice') {
    if (/\b(?:descarto|descartar|tiro 2|dos cartas|descarte)\b/.test(norm)) {
      const cards = extractCardsFromText(rawText, 'deck').map((c) => c.id);
      return { intent: 'answer_choice', selection: 'discard2', extra: { mode: 'discard', cards } };
    }
  }

  // For camp-column choices (raiders_camp, juggernaut_camp, napalm_col)
  if (pc.kind === 'raiders_camp' || pc.kind === 'juggernaut_camp' || pc.kind === 'napalm_col') {
    const col = extractColumn(rawText);
    if (col !== null && pc.options.some((o) => o.value === col)) {
      return { intent: 'answer_choice', selection: col };
    }
    const camps = extractCardsFromText(rawText, 'camps');
    if (camps.length > 0) {
      const match = pc.options.find((o) => state.human.camps[o.value]?.id === camps[0].id);
      if (match) return { intent: 'answer_choice', selection: match.value };
    }
  }

  // Generic match by option index ("1", "2", "el 3")
  const numMatch = norm.match(/\b(\d+)\b/);
  if (numMatch) {
    const idx = parseInt(numMatch[1], 10) - 1;
    if (pc.kind === 'mercenary_choice') {
      const destroyOpts = pc.options.filter((o) => o.mode === 'destroy');
      if (destroyOpts[idx]) {
        return { intent: 'answer_choice', selection: destroyOpts[idx].value };
      }
    } else if (pc.options[idx]) {
      return { intent: 'answer_choice', selection: pc.options[idx].value };
    }
  }

  // Match by card name or punk
  if (/\bpunk[iy]?\b/.test(norm)) {
    const match = pc.options.find((o) => normalizeEs(o.labelEs).includes('punki'));
    if (match) return { intent: 'answer_choice', selection: match.value };
  }
  const cards = extractCardsFromText(rawText, 'all');
  if (cards.length > 0) {
    for (const c of cards) {
      const cName = normalizeEs(ALL_CARDS_BY_ID[c.id]?.nameEs || '');
      const match = pc.options.find((o) => normalizeEs(o.labelEs).includes(cName));
      if (match) return { intent: 'answer_choice', selection: match.value };
    }
  }

  return {
    intent: 'error',
    error: `Respondé a la decisión pendiente: ${pc.promptEs} (o tocá un botón abajo).`,
  };
}

// Autocomplete helper for chat input box!
function getAutocompleteSuggestions(inputText, state) {
  const norm = normalizeEs(inputText);
  if (!norm || norm.length < 2) return [];

  const tokens = norm.split(' ');
  const lastWord = tokens[tokens.length - 1];
  if (lastWord.length < 2) return [];

  const pool = state.phase === 'setup_camps' ? CAMPS : [...CAMPS, ...DECK_CARDS];
  const matches = [];
  for (const card of pool) {
    const es = normalizeEs(card.nameEs);
    const en = normalizeEs(card.nameEn);
    if (es.includes(lastWord) || en.includes(lastWord) || (card.aliases || []).some((a) => normalizeEs(a).includes(lastWord))) {
      matches.push(card);
    }
  }
  return matches.slice(0, 6);
}


// ===== controller.js =====
// Radlands Hybrid Game Controller
// Connects natural-language Spanish commands (voice/chat) + HUD clicks -> Engine + Tactical AI




function buildWelcomeState(options = {}) {
  const state = createInitialState(options);
  addLog(
    state,
    'bot',
    '¡Listo para jugar Radlands híbrido! Elegí tus 3 campamentos físicos en la mesa y cantamelos (ej: "mis campamentos son Cañón, Hoguera y Almacén") o tocalos en el selector. El mazo es 100% compartido y tu mano queda oculta para mí.'
  );
  return state;
}

function formatBoardSummary(state) {
  const fmtCamps = (side) =>
    state[side].camps
      .map((c, i) => {
        const st = c.destroyed ? 'DESTRUIDO' : c.damaged ? 'DAÑADO' : 'sano';
        const jg = c.id === 'juggernaut' && c.juggernautStep ? ` [paso ${c.juggernautStep}/3]` : '';
        return `${i + 1}) ${getCardNameEs(c.id)} (${st}${jg})`;
      })
      .join(', ');

  const fmtPeople = (side) => {
    const all = getAllPeople(state, side);
    if (all.length === 0) return 'ninguna';
    return all
      .map(({ person, col, slot }) => {
        const nm = person.isPunk ? 'Punki' : getCardNameEs(person.id);
        const st = person.damaged ? 'dañado' : person.ready ? 'lista' : 'agotada';
        return `${nm} (${COL_SHORT_ES[col]} ${SLOT_NAMES_ES[slot]}, ${st})`;
      })
      .join('; ');
  };

  const fmtEvents = (side) => {
    const evs = state[side].events
      .map((e, i) => (e ? `[${i + 1}] ${getCardNameEs(e)}` : null))
      .filter(Boolean);
    return evs.length ? evs.join(', ') : 'vacía';
  };

  return [
    `Turno ${state.turn} (${state.activePlayer === 'human' ? 'Tu turno' : 'Turno del Bot'}) | Mazo: ${state.deck.length} | Descarte: ${state.discard.length} | Rebarajados: ${state.reshuffles}/1`,
    `🤖 BOT (${getTotalWater(state.bot)}💧, Mano: ${state.bot.hand.length}, Silo: ${state.bot.waterSiloInHand ? 'en mano' : 'en mesa'})`,
    `  Campamentos: ${fmtCamps('bot')}`,
    `  Personas: ${fmtPeople('bot')}`,
    `  Eventos: ${fmtEvents('bot')}`,
    `🧑 VOS (${getTotalWater(state.human)}💧, Mano: ${state.human.hiddenHand.length}, Silo: ${state.human.waterSiloInHand ? 'en mano' : 'en mesa'})`,
    `  Campamentos: ${fmtCamps('human')}`,
    `  Personas: ${fmtPeople('human')}`,
    `  Eventos: ${fmtEvents('human')}`,
  ].join('\n');
}

function getHelpTextEs() {
  return [
    'Comandos por voz o chat:',
    '• Robar (mazo compartido): "robé Francotirador" o "robé Musa, Napalm y Artillero"',
    '• Jugar persona/evento: "juego Francotirador en 2" · "bajo Musa en izquierda atrás" · "juego Napalm"',
    '• Usar habilidad: "uso Francotirador contra tu Cañón" · "activo Musa" · "uso Cañón en columna 1"',
    '• Chatarra (0💧): "desecho Explorador" · "chatarra de Pirómano contra tu Musa"',
    '• Silo y robo pago: "tomo depósito" · "uso depósito" · "robo por 2"',
    '• Atajos manuales: "daño tu columna 2" · "restauro mi Hoguera" · "gano punki en 1" · "asaltar" · "descarté [cartas]"',
    '• Control: "paso" (termina tu turno) · "estado" · "deshacer" · "nueva partida"',
  ].join('\n');
}

// Runs the Bot's actions until it decides to pass, wins, or pauses for a Human pendingChoice!
function runBotTurnLoop(state, rng = Math.random) {
  const spokenSteps = [];
  let safety = 0;

  while (
    state.phase === 'playing' &&
    state.activePlayer === 'bot' &&
    !state.pendingChoice &&
    safety < 12
  ) {
    safety++;
    const step = runBotStep(state, rng);
    if (step.message) {
      addLog(state, 'bot', step.message);
      spokenSteps.push(step.message);
    }
    if (step.gameOver || state.phase === 'gameover') {
      if (state.winReason) {
        addLog(state, 'system', `🏆 ${state.winReason}`);
        spokenSteps.push(state.winReason);
      }
      return { ok: true, spoken: spokenSteps, paused: false, gameOver: true };
    }
    if (step.paused || state.pendingChoice) {
      return { ok: true, spoken: spokenSteps, paused: true };
    }
    if (step.endedTurn || step.done) {
      break;
    }
  }

  // Bot finishes its turn -> hand off to human!
  if (state.phase === 'playing' && state.activePlayer === 'bot' && !state.pendingChoice) {
    const endMsg = 'Termino mi turno.';
    addLog(state, 'bot', endMsg);
    spokenSteps.push(endMsg);

    const nextRes = endTurn(state, rng, chooseBotDefensiveResponse);
    if (nextRes.messages) {
      for (const m of nextRes.messages) {
        addLog(state, 'bot', m);
        spokenSteps.push(m);
      }
    }
    if (checkGameOver(state)) {
      addLog(state, 'system', `🏆 ${state.winReason}`);
      spokenSteps.push(state.winReason);
    }
  }

  return { ok: true, spoken: spokenSteps, paused: !!state.pendingChoice, gameOver: state.phase === 'gameover' };
}

function handleUserCommand(state, rawText, options = {}) {
  const rng = options.rng || Math.random;
  const trimmed = String(rawText || '').trim();
  if (!trimmed) return { ok: false, spoken: [] };

  const parsed = parseUserInput(trimmed, state);
  const spoken = [];

  // Mask draw commands in chat log so hidden cards stay private!
  const isSecretDraw = parsed.intent === 'draw_cards';
  if (!isSecretDraw && parsed.intent !== 'empty') {
    addLog(state, 'human', trimmed, { speak: false });
  }

  if (parsed.intent === 'empty') return { ok: false, spoken: [] };

  if (parsed.intent === 'error' || parsed.intent === 'unknown') {
    addLog(state, 'system', parsed.error);
    return { ok: false, error: parsed.error, spoken: [parsed.error] };
  }

  if (parsed.intent === 'help') {
    const txt = getHelpTextEs();
    addLog(state, 'system', txt);
    return { ok: true, spoken: ['Te dejé la lista de comandos en el chat.'] };
  }

  if (parsed.intent === 'status') {
    const txt = formatBoardSummary(state);
    addLog(state, 'system', txt);
    return { ok: true, spoken: [buildShortVoiceSummary(state)] };
  }

  if (parsed.intent === 'undo') {
    const u = undoState(state);
    const msg = u.ok ? u.message : u.error;
    addLog(state, 'system', msg);
    return { ok: u.ok, spoken: [msg] };
  }

  if (parsed.intent === 'new_game') {
    const fresh = buildWelcomeState({ difficulty: state.difficulty, personality: state.personality, rng });
    Object.keys(state).forEach((k) => delete state[k]);
    Object.assign(state, fresh);
    return { ok: true, spoken: ['Nueva partida lista. Elegí tus 3 campamentos.'] };
  }

  // === SETUP DISCARDED CAMPS ===
  if (parsed.intent === 'setup_discarded_camps') {
    pushUndoSnapshot(state);
    state.excludedCamps = [...new Set([...state.excludedCamps, ...parsed.campIds])];
    const names = parsed.campIds.map(getCardNameEs).join(', ');
    const msg = `Anotado: excluyo ${names} del pool de campamentos del bot. Ahora decime los 3 campamentos con los que te quedás.`;
    addLog(state, 'bot', msg);
    return { ok: true, spoken: [msg] };
  }

  // === SETUP ACTIVE CAMPS ===
  if (parsed.intent === 'setup_camps') {
    const allDiscarded = [...new Set([...state.excludedCamps, ...(parsed.discardedCampIds || [])])];
    const res = setupHumanCamps(state, parsed.campIds, allDiscarded, chooseBotCamps, rng);
    if (!res.ok) {
      addLog(state, 'system', res.error);
      return { ok: false, error: res.error, spoken: [res.error] };
    }
    return { ok: true, spoken: [res.message] };
  }

  // === SETUP FIRST PLAYER ===
  if (parsed.intent === 'setup_first') {
    const res = setFirstPlayer(state, parsed.who, rng);
    if (!res.ok) {
      addLog(state, 'system', res.error);
      return { ok: false, error: res.error, spoken: [res.error] };
    }
    if (res.message) spoken.push(res.message);
    if (res.messages) {
      for (const m of res.messages) {
        addLog(state, 'bot', m);
        spoken.push(m);
      }
    }
    if (state.phase === 'playing' && state.activePlayer === 'bot') {
      const botRes = runBotTurnLoop(state, rng);
      spoken.push(...botRes.spoken);
    }
    return { ok: true, spoken };
  }

  // === ANSWER PENDING CHOICE ===
  if (parsed.intent === 'answer_choice') {
    const res = resolvePendingChoice(state, parsed.selection, parsed.extra || {});
    if (!res.ok) {
      addLog(state, 'system', res.error);
      return { ok: false, error: res.error, spoken: [res.error] };
    }
    addLog(state, 'bot', res.message);
    spoken.push(res.message);
    if (checkGameOver(state)) {
      addLog(state, 'system', `🏆 ${state.winReason}`);
      spoken.push(state.winReason);
      return { ok: true, spoken };
    }
    if (res.resumeBot && state.activePlayer === 'bot' && state.phase === 'playing' && !state.pendingChoice) {
      const botRes = runBotTurnLoop(state, rng);
      spoken.push(...botRes.spoken);
    }
    return { ok: true, spoken };
  }

  // === DRAW PHYSICAL CARDS (FAIR SHARED DECK) ===
  if (parsed.intent === 'draw_cards') {
    pushUndoSnapshot(state);
    const okNames = [];
    const errors = [];
    for (const cid of parsed.cardIds) {
      const dr = recordHumanDraw(state, cid, { rng });
      if (dr.ok) {
        okNames.push(getCardNameEs(cid));
      } else {
        errors.push(dr.error);
      }
    }
    if (okNames.length > 0) {
      addLog(
        state,
        'human',
        `🔒 Robaste ${okNames.length} carta(s) física(s) (oculta para la IA)`,
        { masked: true, secretText: okNames.join(', '), speak: false }
      );
    }
    if (errors.length > 0) {
      for (const e of errors) {
        addLog(state, 'system', `⚠️ ${e}`);
        spoken.push(e);
      }
    }

    // Check if initial setup_draw is complete!
    if (state.phase === 'setup_draw') {
      if (state.human.pendingDraws > 0) {
        const remMsg = `Registrado. Te falta(n) robar y cantar ${state.human.pendingDraws} carta(s) inicial(es).`;
        addLog(state, 'bot', remMsg);
        spoken.push(remMsg);
        return { ok: true, spoken };
      }
      state.phase = 'playing';
      const startRes = beginTurn(state, state.firstPlayer, rng, chooseBotDefensiveResponse);
      if (startRes.messages) {
        for (const m of startRes.messages) {
          addLog(state, 'bot', m);
          spoken.push(m);
        }
      }
      if (state.activePlayer === 'bot' && state.phase === 'playing' && !state.pendingChoice) {
        const botRes = runBotTurnLoop(state, rng);
        spoken.push(...botRes.spoken);
      }
      return { ok: true, spoken };
    }

    if (okNames.length > 0 && errors.length === 0) {
      const msg =
        state.human.pendingDraws > 0
          ? `Anotado (oculto para mí). Te falta(n) ${state.human.pendingDraws} robo(s) más.`
          : `Anotado (oculto para mí). Tenés ${getTotalWater(state.human)}💧 disponibles.`;
      addLog(state, 'bot', msg);
      spoken.push(msg);
    }
    return { ok: okNames.length > 0, spoken };
  }

  // === PLAYING ACTIONS (Human turn check for standard actions) ===
  if (state.activePlayer !== 'human' && !['direct_attack', 'direct_restore', 'direct_punk', 'direct_water', 'discard_plain'].includes(parsed.intent)) {
    const err = 'No es tu turno en este momento.';
    addLog(state, 'system', err);
    return { ok: false, error: err, spoken: [err] };
  }

  pushUndoSnapshot(state);

  if (parsed.intent === 'end_turn') {
    const res = endTurn(state, rng, chooseBotDefensiveResponse);
    if (!res.ok) {
      addLog(state, 'system', res.error);
      return { ok: false, error: res.error, spoken: [res.error] };
    }
    if (res.messages) {
      for (const m of res.messages) {
        addLog(state, 'bot', m);
        spoken.push(m);
      }
    }
    if (checkGameOver(state)) {
      addLog(state, 'system', `🏆 ${state.winReason}`);
      spoken.push(state.winReason);
      return { ok: true, spoken };
    }
    if (state.activePlayer === 'bot' && !state.pendingChoice) {
      const botRes = runBotTurnLoop(state, rng);
      spoken.push(...botRes.spoken);
    }
    return { ok: true, spoken };
  }

  if (parsed.intent === 'take_silo') {
    const res = takeWaterSilo(state, 'human');
    return finalizeHumanAction(state, res);
  }

  if (parsed.intent === 'junk_silo') {
    const res = junkWaterSilo(state, 'human');
    return finalizeHumanAction(state, res);
  }

  if (parsed.intent === 'buy_draw') {
    const res = buyDrawCard(state, 'human', rng);
    return finalizeHumanAction(state, res);
  }

  if (parsed.intent === 'discard_plain') {
    const res = discardHumanCards(state, parsed.cardIds, rng);
    return finalizeHumanAction(state, res);
  }

  if (parsed.intent === 'reveal_punk') {
    const res = revealHumanDestroyedPunk(state, parsed.cardId, rng);
    return finalizeHumanAction(state, res);
  }

  if (parsed.intent === 'move_person') {
    if (parsed.toCol === null) {
      return finalizeHumanAction(state, { ok: false, error: 'Indicá a qué columna querés moverla (1, 2 o 3).' });
    }
    const all = getAllPeople(state, 'human');
    const found =
      parsed.cardId === 'punk'
        ? all.find((x) => x.person.isPunk)
        : all.find((x) => !x.person.isPunk && x.person.id === parsed.cardId);
    if (!found) {
      return finalizeHumanAction(state, { ok: false, error: 'No encontré esa persona en tu mesa para mover.' });
    }
    const res = movePersonPosition(state, 'human', found.col, found.slot, parsed.toCol, parsed.toSlot);
    return finalizeHumanAction(state, res);
  }

  if (parsed.intent === 'play_person') {
    let col = parsed.col;
    if (col === null) {
      const empty = getEmptyPersonSlots(state, 'human');
      if (empty.length === 0) {
        return finalizeHumanAction(state, { ok: false, error: 'Ya tenés 6 personas en mesa.' });
      }
      col = empty[0].col;
    }
    const card = DECK_CARDS_BY_ID[parsed.cardId];
    let restoreTarget = null;
    if (card?.enterPlay === 'restore') {
      const legalRest = getRestorableCards(state, 'human');
      restoreTarget = resolveTargetFromText(parsed.rawTargetText || '', legalRest) || legalRest[0] || null;
    }
    const res = playPerson(state, 'human', parsed.cardId, col, parsed.slot, { rng, restoreTarget });
    return finalizeHumanAction(state, res);
  }

  if (parsed.intent === 'play_event') {
    const targetCol = extractColumn(parsed.rawTargetText || '');
    const legalBanish = getLegalTargets(state, 'human', 'any_enemy_person');
    const target = resolveTargetFromText(parsed.rawTargetText || '', legalBanish);
    const res = playEvent(state, 'human', parsed.cardId, {
      rng,
      botChoiceFn: chooseBotDefensiveResponse,
      targetCol: targetCol !== null ? targetCol : undefined,
      target,
    });
    return finalizeHumanAction(state, res);
  }

  if (parsed.intent === 'junk_card') {
    const card = DECK_CARDS_BY_ID[parsed.cardId];
    let target = null;
    if (card?.junk === 'injure') {
      const legal = getLegalTargets(state, 'human', 'unprotected_enemy_person');
      target = resolveTargetFromText(parsed.rawTargetText || '', legal) || legal[0] || null;
    } else if (card?.junk === 'damage') {
      const legal = getLegalTargets(state, 'human', 'unprotected_enemy');
      target = resolveTargetFromText(parsed.rawTargetText || '', legal) || legal[0] || null;
    } else if (card?.junk === 'restore') {
      const legal = getRestorableCards(state, 'human');
      target = resolveTargetFromText(parsed.rawTargetText || '', legal) || legal[0] || null;
    }
    const res = junkCard(state, 'human', parsed.cardId, {
      rng,
      col: parsed.col,
      slot: parsed.slot,
      target,
      botChoiceFn: chooseBotDefensiveResponse,
    });
    return finalizeHumanAction(state, res);
  }

  if (parsed.intent === 'use_ability') {
    const abs = getAvailableAbilitiesForCard(
      state,
      'human',
      parsed.source.type,
      parsed.source.col,
      parsed.source.slot || 0
    );
    const ab = parsed.abilityId ? abs.find((a) => a.id === parsed.abilityId) || abs[0] : abs[0];
    let target = null;
    let targetCol = undefined;
    let restoreTarget = null;
    if (ab?.needsTarget === 'enemy_column') {
      const c = extractColumn(parsed.rawTargetText || '');
      const legalCols = getLegalTargets(state, 'human', 'enemy_column');
      targetCol = c !== null ? c : legalCols[0]?.col;
    } else if (ab?.needsTarget) {
      const legal = getLegalTargets(state, 'human', ab.needsTarget);
      target = resolveTargetFromText(parsed.rawTargetText || '', legal) || legal[0] || null;
    }
    if (ab && ['restore', 'atomic_garden', 'cache_restore', 'labor_camp', 'transplant_lab', 'mutant_restore'].includes(ab.kind)) {
      const legalR = getRestorableCards(state, 'human', ab.kind === 'atomic_garden');
      restoreTarget = resolveTargetFromText(parsed.rawTargetText || '', legalR) || legalR[0] || null;
    }
    const res = activateAbility(state, 'human', parsed.source, ab?.id, {
      rng,
      target,
      targetCol,
      restoreTarget,
      botChoiceFn: chooseBotDefensiveResponse,
    });
    return finalizeHumanAction(state, res);
  }

  // === DIRECT PHYSICAL SHORTCUTS ===
  if (parsed.intent === 'direct_attack') {
    const targetOwner = parsed.owner;
    const attacker = targetOwner === 'bot' ? 'human' : 'bot';
    const targetKind =
      parsed.mode === 'injure' ? 'any_enemy_person' : 'any_enemy';
    const legal = getLegalTargets(state, attacker, targetKind);
    const t = resolveTargetFromText(parsed.rawText, legal);
    if (!t) {
      return finalizeHumanAction(state, {
        ok: false,
        error: 'No encontré ese objetivo. Indicá la carta o columna (ej: "daño tu columna 2" o "daño tu Francotirador").',
      });
    }
    const res = parsed.mode === 'destroy' ? destroyTarget(state, t) : applyDamageToTarget(state, t);
    const msg = res.ok
      ? `Aplicado: ${res.labelEs} (${COL_SHORT_ES[t.col]}) quedó ${res.destroyed ? 'destruido' : 'dañado'}.`
      : res.error;
    return finalizeHumanAction(state, { ok: res.ok, message: msg, error: res.error });
  }

  if (parsed.intent === 'direct_restore') {
    const legal = getRestorableCards(state, 'human');
    const t = resolveTargetFromText(parsed.rawText, legal) || legal[0];
    if (!t) return finalizeHumanAction(state, { ok: false, error: 'No tenés cartas dañadas para restaurar.' });
    const res = restoreTarget(state, t);
    return finalizeHumanAction(state, {
      ok: res.ok,
      message: res.ok ? `Restauraste ${res.labelEs}.` : res.error,
      error: res.error,
    });
  }

  if (parsed.intent === 'direct_punk') {
    const res = gainPunk(state, 'human', parsed.col, parsed.slot, rng);
    return finalizeHumanAction(state, {
      ok: res.ok,
      message: res.ok ? `Sumaste 1 Punki en ${COL_NAMES_ES[res.col]} (poné una carta bocabajo).` : res.error,
      error: res.error,
    });
  }

  if (parsed.intent === 'direct_raid') {
    const res = triggerRaid(state, 'human', chooseBotDefensiveResponse, rng);
    return finalizeHumanAction(state, res);
  }

  if (parsed.intent === 'direct_water') {
    if (parsed.delta > 0) {
      state.human.extraWater += parsed.delta;
      return finalizeHumanAction(state, {
        ok: true,
        message: `+${parsed.delta}💧 extra (total: ${getTotalWater(state.human)}💧).`,
      });
    }
    const spent = Math.min(getTotalWater(state.human), Math.abs(parsed.delta));
    if (state.human.water >= spent) state.human.water -= spent;
    else {
      const rem = spent - state.human.water;
      state.human.water = 0;
      state.human.extraWater = Math.max(0, state.human.extraWater - rem);
    }
    return finalizeHumanAction(state, {
      ok: true,
      message: `-${spent}💧 (te quedan ${getTotalWater(state.human)}💧).`,
    });
  }

  return { ok: false, spoken: [] };
}

function finalizeHumanAction(state, res) {
  if (!res.ok) {
    // Roll back unused undo snapshot on failed command
    if (state.history.length > 0) state.history.pop();
    addLog(state, 'system', `⚠️ ${res.error}`);
    return { ok: false, error: res.error, spoken: [res.error] };
  }
  const spoken = [];
  if (res.message) {
    addLog(state, 'bot', res.message);
    spoken.push(res.message);
  }
  if (checkGameOver(state)) {
    addLog(state, 'system', `🏆 ${state.winReason}`);
    spoken.push(state.winReason);
  }
  return { ok: true, spoken, needsChoice: !!state.pendingChoice };
}

function buildShortVoiceSummary(state) {
  const botAlive = state.bot.camps.filter((c) => !c.destroyed).length;
  const humAlive = state.human.camps.filter((c) => !c.destroyed).length;
  const botPeople = getAllPeople(state, 'bot')
    .map((x) => `${x.person.isPunk ? 'Punki' : getCardNameEs(x.person.id)} en columna ${x.col + 1}`)
    .join(', ');
  return `Turno ${state.turn}. Me quedan ${botAlive} campamentos y tengo ${state.bot.hand.length} cartas en mano. En mi mesa: ${botPeople || 'ninguna persona'}. A vos te quedan ${humAlive} campamentos y ${getTotalWater(state.human)} de agua.`;
}


// ===== app.js =====
// Radlands Hybrid Bot — Frontend Application (100% Offline, Voice + Chat + Interactive HUD)




const STORAGE_KEY = 'radlands_hybrid_state_v1';
const PREFS_KEY = 'radlands_hybrid_prefs_v2';

function isMicOriginBlocked() {
  try {
    if (window.origin === 'null' || location.protocol === 'file:') return true;
    if (!window.isSecureContext) return true;
    if (document.featurePolicy && typeof document.featurePolicy.allowsFeature === 'function') {
      if (!document.featurePolicy.allowsFeature('microphone')) return true;
    }
    if (document.permissionsPolicy && typeof document.permissionsPolicy.allowsFeature === 'function') {
      if (!document.permissionsPolicy.allowsFeature('microphone')) return true;
    }
  } catch {}
  return false;
}

// === PREFERENCES & VOICE ENGINE ===
const prefs = loadPrefs();
function loadPrefs() {
  const blocked = isMicOriginBlocked();
  const defaults = {
    ttsEnabled: true,
    ttsRate: 1.08,
    autoSendVoice: true,
    dictationAutoSend: blocked, // Default ON in sandboxed viewers so Fn×2 / mobile dictation works seamlessly!
    dictationDelayMs: 1600,
    handsFree: false,
    difficulty: 'tactical',
    personality: 'normal',
  };
  try {
    return { ...defaults, ...JSON.parse(localStorage.getItem(PREFS_KEY) || '{}') };
  } catch {
    return defaults;
  }
}
function savePrefs() {
  try {
    localStorage.setItem(PREFS_KEY, JSON.stringify(prefs));
  } catch {}
}

let state = loadState();
function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      if (parsed && parsed.phase && parsed.human && parsed.bot) {
        parsed.difficulty = prefs.difficulty;
        parsed.personality = prefs.personality;
        return parsed;
      }
    }
  } catch {}
  return buildWelcomeState({ difficulty: prefs.difficulty, personality: prefs.personality });
}

function persistState() {
  try {
    // Cap history size for localStorage safety
    const copy = { ...state, history: (state.history || []).slice(-18) };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(copy));
  } catch {}
}

// UI Transient State
let mobileTab = 'chat';
let handExpanded = false;
let setupSelectedCamps = [];
let setupExcludedCamps = [];
let setupMode = 'pick'; // 'pick' | 'exclude'
let setupFilter = '';
let revealedLogs = new Set();

// === SPEECH SYNTHESIS (TTS) ===
let isSpeaking = false;
function cleanTextForSpeech(text) {
  return String(text || '')
    .replace(/(\d+)\s*💧/g, '$1 de agua')
    .replace(/💧/g, ' agua ')
    .replace(/Col\s*(\d)/g, 'columna $1')
    .replace(/[🤖🧑🃏🎭💀🔧🩸💥🏆⚠️🔒🛡️⏭️↩️📊🎙️🔊🔇]/g, '')
    .replace(/→/g, ', ')
    .replace(/\s+/g, ' ')
    .trim();
}

function pickSpanishVoice() {
  if (typeof speechSynthesis === 'undefined') return null;
  const voices = speechSynthesis.getVoices() || [];
  const esVoices = voices.filter((v) => /^es\b/i.test(v.lang));
  if (!esVoices.length) return null;
  return (
    esVoices.find((v) => /es-AR/i.test(v.lang)) ||
    esVoices.find((v) => /es-419|es-US|es-MX|es-CL|es-CO/i.test(v.lang)) ||
    esVoices.find((v) => /es-ES/i.test(v.lang)) ||
    esVoices[0]
  );
}

function speakLines(lines) {
  if (!prefs.ttsEnabled || typeof speechSynthesis === 'undefined') return;
  const joined = lines.filter(Boolean).map(cleanTextForSpeech).join('. ');
  if (!joined) return;
  try {
    speechSynthesis.cancel();
    // Pause STT while bot speaks so mic doesn't hear itself!
    if (isListening && recognition) {
      pausedForTts = true;
      try { recognition.stop(); } catch {}
    }
    const utt = new SpeechSynthesisUtterance(joined);
    const v = pickSpanishVoice();
    if (v) utt.voice = v;
    utt.lang = v ? v.lang : 'es-AR';
    utt.rate = prefs.ttsRate || 1.08;
    utt.onstart = () => {
      isSpeaking = true;
      updateVoiceIndicator();
    };
    utt.onend = utt.onerror = () => {
      isSpeaking = false;
      updateVoiceIndicator();
      if (pausedForTts && prefs.handsFree) {
        pausedForTts = false;
        setTimeout(() => startListening(), 280);
      } else {
        pausedForTts = false;
        refocusChatInputIfSafe();
      }
    };
    speechSynthesis.speak(utt);
  } catch {}
}

// === SPEECH RECOGNITION (STT) & NATIVE DICTATION ENGINE ===
const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition || null;
let recognition = null;
let isListening = false;
let pausedForTts = false;
let isComposing = false;
let dictationTimer = null;
let dictationCountdownInterval = null;
let dictationDeadline = 0;

const INCOMPLETE_ENDINGS = new Set([
  'son', 'es', 'en', 'contra', 'sobre', 'y', 'o', 'de', 'del', 'a', 'al', 'mi', 'mis', 'tu', 'tus',
  'columna', 'col', 'fila', 'robe', 'saque', 'toco', 'juego', 'bajo', 'pongo', 'tiro', 'uso',
  'activo', 'desecho', 'descarto', 'descarte', 'chatarra', 'dano', 'hiero', 'destruyo', 'restauro',
  'muevo', 'elegi', 'campamentos', 'campamento', 'para', 'con', 'por',
]);

function looksIncompleteDictation(raw) {
  const norm = normalizeEs(raw);
  if (!norm) return true;
  const words = norm.split(' ');
  const last = words[words.length - 1];
  return INCOMPLETE_ENDINGS.has(last);
}

function cancelDictationAutoSend() {
  clearTimeout(dictationTimer);
  clearInterval(dictationCountdownInterval);
  dictationTimer = null;
  dictationCountdownInterval = null;
  dictationDeadline = 0;
  const cancelBtn = document.getElementById('btn-cancel-autosend');
  if (cancelBtn) cancelBtn.style.display = 'none';
  updateVoiceIndicator();
}

function scheduleDictationAutoSend(rawValue) {
  cancelDictationAutoSend();
  if (!prefs.dictationAutoSend || isComposing) return;
  const trimmed = String(rawValue || '').trim();
  if (trimmed.length < 2) return;
  // Don't auto-send single-character junk unless it's answering a pendingChoice number (1/2/3)
  if (trimmed.length === 1 && !state.pendingChoice) return;

  let delay = prefs.dictationDelayMs || 1600;
  if (looksIncompleteDictation(trimmed)) {
    delay = Math.max(delay + 1200, 2800);
  } else if (/[.!?]$/.test(trimmed)) {
    delay = Math.max(1000, delay - 450);
  }

  dictationDeadline = Date.now() + delay;
  const cancelBtn = document.getElementById('btn-cancel-autosend');
  if (cancelBtn) cancelBtn.style.display = 'inline-flex';

  const tick = () => {
    const rem = Math.max(0, (dictationDeadline - Date.now()) / 1000);
    const txt = document.getElementById('voice-status-text');
    const dot = document.getElementById('mic-dot');
    if (dot) dot.className = 'mic-dot listening';
    if (txt) txt.textContent = `⚡ Enviando dictado en ${rem.toFixed(1)}s... (seguí hablando o Esc)`;
  };
  tick();
  dictationCountdownInterval = setInterval(tick, 120);

  dictationTimer = setTimeout(() => {
    cancelDictationAutoSend();
    const inputEl = document.getElementById('chat-input');
    const current = inputEl?.value?.trim();
    if (current && !isComposing) {
      submitCommand(current);
    }
  }, delay);
}

function refocusChatInputIfSafe() {
  const modalRoot = document.getElementById('modal-root');
  if (modalRoot && modalRoot.innerHTML.trim()) return;
  const inputEl = document.getElementById('chat-input');
  if (inputEl && window.innerWidth > 920) {
    setTimeout(() => {
      try { inputEl.focus(); } catch {}
    }, 60);
  }
}

function getOsDictationHint() {
  const ua = typeof navigator !== 'undefined' ? navigator.userAgent || '' : '';
  if (/\bCrOS\b/i.test(ua)) return 'Búsqueda + D (Lupa + D) en Chromebook';
  if (/iPhone|iPad|Android/i.test(ua)) return 'el micrófono 🎙️ de tu teclado';
  if (/Mac/i.test(ua)) return 'Fn dos veces en Mac';
  return 'Win + H en Windows o Búsqueda + D en Chromebook';
}

function initSpeechRecognition() {
  if (!SpeechRec) return null;
  const rec = new SpeechRec();
  rec.lang = 'es-AR';
  rec.interimResults = true;
  rec.maxAlternatives = 1;
  rec.continuous = false;

  rec.onstart = () => {
    isListening = true;
    updateVoiceIndicator();
  };
  rec.onresult = (event) => {
    let interim = '';
    let finalTranscript = '';
    for (let i = event.resultIndex; i < event.results.length; i++) {
      const tr = event.results[i][0].transcript;
      if (event.results[i].isFinal) finalTranscript += tr;
      else interim += tr;
    }
    const inputEl = document.getElementById('chat-input');
    if (inputEl) {
      inputEl.value = (finalTranscript || interim).trim();
      renderAutocomplete(inputEl.value);
    }
    if (finalTranscript.trim() && prefs.autoSendVoice) {
      submitCommand(finalTranscript.trim());
    }
  };
  rec.onerror = (ev) => {
    isListening = false;
    if (ev.error === 'not-allowed' || ev.error === 'service-not-allowed') {
      prefs.handsFree = false;
      savePrefs();
      updateVoiceIndicator();
      openMicHelpModal(
        'Chrome bloqueó el micrófono web en esta página. Verificá los permisos de micrófono en el candado de la barra de direcciones (o usá la app desde GitHub Pages / localhost).'
      );
    } else if (ev.error === 'audio-capture') {
      prefs.handsFree = false;
      savePrefs();
      updateVoiceIndicator();
      showToast('No se detectó micrófono disponible en el dispositivo.');
    } else if (ev.error === 'no-speech' || ev.error === 'aborted') {
      // Keep handsFree active across natural silences while playing on the table!
      updateVoiceIndicator();
    } else {
      updateVoiceIndicator();
    }
  };
  rec.onend = () => {
    isListening = false;
    updateVoiceIndicator();
    if (prefs.handsFree && !isSpeaking && !pausedForTts) {
      setTimeout(() => {
        if (prefs.handsFree && !isSpeaking && !isListening) startListening();
      }, 350);
    }
  };
  return rec;
}

function startListening() {
  if (isMicOriginBlocked()) {
    // First-class Native Dictation flow: focus input + enable auto-send right away!
    if (!prefs.dictationAutoSend) {
      prefs.dictationAutoSend = true;
      savePrefs();
      renderTopbar();
    }
    const inputEl = document.getElementById('chat-input');
    inputEl?.focus();
    updateVoiceIndicator();
    showToast(`🎙️ En Artifacts el botón web está bloqueado por sandbox. Usá ${getOsDictationHint()} (o tocá ❓ Voz).`);
    return;
  }
  if (!SpeechRec) {
    openMicHelpModal('Este navegador no incluye Web Speech API (Chrome/Edge sí). Usá el dictado nativo del sistema.');
    return;
  }
  if (!recognition) recognition = initSpeechRecognition();
  if (isSpeaking && typeof speechSynthesis !== 'undefined') {
    speechSynthesis.cancel();
    isSpeaking = false;
  }
  try {
    recognition.start();
  } catch {}
}

function stopListening() {
  pausedForTts = false;
  if (recognition && isListening) {
    try { recognition.stop(); } catch {}
  }
  isListening = false;
  updateVoiceIndicator();
}

function toggleMic() {
  if (isListening) {
    prefs.handsFree = false;
    savePrefs();
    stopListening();
  } else {
    startListening();
  }
}

function updateVoiceIndicator() {
  const dot = document.getElementById('mic-dot');
  const txt = document.getElementById('voice-status-text');
  const btn = document.getElementById('mic-btn');
  if (!dot || !txt || !btn) return;
  dot.className = 'mic-dot' + (isListening ? ' listening' : isSpeaking ? ' speaking' : '');
  btn.classList.toggle('active', isListening);
  if (isListening) {
    txt.textContent = prefs.handsFree ? 'Escuchando (manos libres)...' : 'Escuchando... hablá ahora';
  } else if (isSpeaking) {
    txt.textContent = 'Bot hablando...';
  } else if (isMicOriginBlocked()) {
    txt.textContent = prefs.dictationAutoSend
      ? `⚡ Auto-dictado ON: usá ${getOsDictationHint()} (se envía solo)`
      : `Visor sandbox: usá ${getOsDictationHint()} o tocá ❓ Voz`;
  } else if (!SpeechRec) {
    txt.textContent = 'Chat offline activo (usá dictado nativo Fn×2 o teclado 🎙️)';
  } else {
    txt.textContent = prefs.handsFree ? 'Manos libres activo' : 'Tocá el micrófono o escribí tu jugada';
  }
}

// === COMMAND EXECUTION ===
function submitCommand(text) {
  cancelDictationAutoSend();
  const trimmed = String(text || '').trim();
  if (!trimmed) return;
  const inputEl = document.getElementById('chat-input');
  if (inputEl) {
    inputEl.value = '';
    renderAutocomplete('');
  }

  state.difficulty = prefs.difficulty;
  state.personality = prefs.personality;
  const res = handleUserCommand(state, trimmed);
  persistState();
  renderAll();
  if (res.spoken && res.spoken.length > 0) {
    speakLines(res.spoken);
  }
  refocusChatInputIfSafe();
}

function showToast(msg) {
  const box = document.getElementById('toast-box');
  if (!box) return;
  box.textContent = msg;
  box.classList.remove('hidden');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => box.classList.add('hidden'), 3600);
}

// === ESCAPE HTML ===
function esc(s) {
  return String(s ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

// === RENDERING ===
function renderAll() {
  renderTopbar();
  renderArena();
  renderChat();
  renderPendingBanner();
  renderQuickChips();
  updateVoiceIndicator();
}

      hfBtn.textContent = prefs.dictationAutoSend ? '⚡ Auto-dictado ON' : '⚡ Auto-dictado OFF';

      <div class="setup-grid">
        ${filtered
          .map((c) => {

        </div>
        <div style="display:flex;gap:6px;">

          <button class="btn btn-primary" id="btn-setup-confirm" ${setupSelectedCamps.length !== 3 ? 'disabled' : ''}>Confirmar 3 Campamentos</button>

function renderPlayerBoardHTML(sideKey) {
  const isBot = sideKey === 'bot';
  const p = state[sideKey];
  const oppKey = isBot ? 'human' : 'bot';
  const isActive = state.phase === 'playing' && state.activePlayer === sideKey;
  const totalWater = getTotalWater(p);
  const handCount = isBot ? p.hand.length : p.hiddenHand.length;

  // Order inside each column:
  // For Bot (top): Camp at top, Back behind, Front closest to center!
  // For Human (bottom): Front closest to center, Back behind, Camp at bottom!
  const colsHtml = [0, 1, 2]
    .map((col) => {
      const camp = p.camps[col];
      const back = p.columns[col][0];
      const front = p.columns[col][1];
      const campTile = renderCampTileHTML(sideKey, col, camp, oppKey);
      const backTile = renderPersonTileHTML(sideKey, col, 0, back, oppKey);
      const frontTile = renderPersonTileHTML(sideKey, col, 1, front, oppKey);

      const ordered = isBot ? `${campTile}${backTile}${frontTile}` : `${frontTile}${backTile}${campTile}`;
      return `
        <div class="column-box">
          <div class="col-label">
            <span>${COL_NAMES_ES[col]}</span>
          </div>
          ${ordered}
        </div>
      `;
    })
    .join('');

  const eventQueueHtml = [0, 1, 2]
    .map((idx) => {
      const evId = p.events[idx];
      if (!evId) {
        return `<div class="event-slot"><span class="event-num">${idx + 1}</span><span class="event-empty">Vacía</span></div>`;
      }
      const evName = getCardNameEs(evId);
      return `
        <div class="event-slot filled" data-inspect-event="${evId}" title="${esc(ALL_CARDS_BY_ID[evId]?.textEs || '')}">
          <span class="event-num">${idx + 1}</span>
          <span class="event-name">${esc(evName)}</span>
        </div>
      `;
    })
    .join('');

  return `
    <div class="board-section ${isBot ? 'bot-side' : 'human-side'}">
      <div class="side-header">
        <div class="side-title">
          <span>${isBot ? '🤖 BOT (CARTAS VIRTUALES)' : '🧑 TU MESA (CARTAS FÍSICAS)'}</span>
          ${isActive ? '<span class="active-badge">TURNO ACTIVO</span>' : ''}
        </div>
        <div class="side-stats">
          <span class="pill cyan">💧 ${totalWater}${p.extraWater ? ` (+${p.extraWater} extra)` : ''}</span>
          <span class="pill">🃏 Mano: ${handCount}</span>
          <span class="pill ${p.waterSiloInHand ? 'yellow' : ''}" data-silo-side="${sideKey}" style="cursor:${!isBot ? 'pointer' : 'default'};" title="Depósito de Agua">
            🛢️ Silo: ${p.waterSiloInHand ? 'en mano' : 'en mesa'}
          </span>
        </div>
      </div>
      <div class="event-queue">${eventQueueHtml}</div>
      <div class="columns-grid">${colsHtml}</div>
    </div>
  `;
}

function renderCampTileHTML(sideKey, col, camp, oppKey) {
  if (!camp) return '';
  const def = CAMPS_BY_ID[camp.id];
  const unprot = !camp.destroyed && !isCardProtected(state, sideKey, 'camp', col, 0, oppKey);
  const cls = camp.destroyed ? 'destroyed' : camp.damaged ? 'damaged' : camp.ready ? 'ready' : '';
  const statusTag = camp.destroyed
    ? '<span class="status-tag destroyed">Destruido</span>'
    : camp.damaged
      ? '<span class="status-tag damaged">Dañado</span>'
      : camp.ready
        ? '<span class="status-tag ready">Lista</span>'
        : '<span class="status-tag exhausted">Usado</span>';

  const juggTag =
    camp.id === 'juggernaut' && !camp.destroyed
      ? `<span class="status-tag unprot">Paso ${camp.juggernautStep || 0}/3</span>`
      : '';
  const unprotTag = unprot ? '<span class="status-tag unprot">Expuesto</span>' : '';
  const desc = def.traitTextEs || def.abilities.map((a) => a.textEs).join(' / ');

  return `
    <div class="card-tile card-camp ${cls}" data-inspect="camp" data-side="${sideKey}" data-col="${col}">
      <div class="card-top-row">
        <div class="card-title">${esc(def.nameEs)}</div>
        ${statusTag}
      </div>
      <div class="card-sub">${esc(desc)}</div>
      <div class="card-badges">${juggTag}${unprotTag}</div>
    </div>
  `;
}

function renderPersonTileHTML(sideKey, col, slot, person, oppKey) {
  const slotLabel = SLOT_NAMES_ES[slot];
  if (!person) {
    return `<div class="card-slot-empty" data-empty-slot="${sideKey}:${col}:${slot}">+ ${slotLabel}</div>`;
  }
  const unprot = !isCardProtected(state, sideKey, 'person', col, slot, oppKey);
  const isPunk = person.isPunk;
  const def = isPunk ? null : DECK_CARDS_BY_ID[person.id];
  const name = isPunk ? '🎭 Punki' : def.nameEs;
  const cls = isPunk ? 'punk' : person.damaged ? 'damaged' : person.ready ? 'ready' : '';
  const statusTag = person.damaged
    ? '<span class="status-tag damaged">Dañada</span>'
    : person.ready
      ? '<span class="status-tag ready">Lista</span>'
      : '<span class="status-tag exhausted">Agotada</span>';
  const desc = isPunk
    ? 'Escudo (1 golpe). Boca abajo.'
    : def.traitTextEs || def.abilities.map((a) => a.textEs).join(' / ');

  return `
    <div class="card-tile card-person ${cls}" data-inspect="person" data-side="${sideKey}" data-col="${col}" data-slot="${slot}">
      <div class="card-top-row">
        <div class="card-title">${esc(name)}</div>
        ${statusTag}
      </div>
      <div class="card-sub">${esc(desc)}</div>
      <div class="card-badges">
        <span class="status-tag exhausted">${slotLabel}</span>
        ${unprot ? '<span class="status-tag unprot">Expuesta</span>' : ''}
      </div>
    </div>
  `;
}

  const h = state.human;
  const pendingBadge =
    h.pendingDraws > 0
      ? `<span class="pill yellow">⚠️ Falta cantar ${h.pendingDraws} robo(s)</span>`
      : '';

  const cardsHtml = handExpanded
    ? `<div class="hand-cards-grid">
        ${
          h.hiddenHand.length === 0
            ? `<div style="color:var(--text-muted);font-size:12px;grid-column:1/-1;">Sin cartas registradas en mano todavía. Usá "robé [carta]" o tocá "+ Registrar robo".</div>`
            : h.hiddenHand
                .map((cid, idx) => {
                  const c = DECK_CARDS_BY_ID[cid];
                  if (!c) return '';
                  const junk = JUNK_INFO[c.junk];
                  const sub =
                    c.type === 'event'
                      ? `Evento (Bomba ${c.bomb}): ${c.textEs}`
                      : c.traitTextEs || c.abilities.map((a) => a.textEs).join(' / ');
                  return `
                    <div class="hand-card ${c.type === 'event' ? 'event-type' : ''}">
                      <div class="card-top-row">
                        <div class="card-title">${esc(c.nameEs)}</div>
                        <span class="pill cyan" style="padding:1px 6px;font-size:10px;">${c.cost}💧</span>
                      </div>
                      <div style="font-size:10px;color:var(--yellow);">Chatarra: ${junk.icon} ${junk.shortEs}</div>
                      <div class="card-sub">${esc(sub)}</div>
                      <div class="hand-card-actions">
                        <button class="btn btn-sm btn-cyan" data-hand-play="${cid}">Jugar</button>
                        <button class="btn btn-sm btn-yellow" data-hand-junk="${cid}">Chatarra</button>
                        <button class="btn btn-sm btn-ghost" data-hand-discard="${cid}" title="Descartar sin chatarra">🗑️</button>
                      </div>
                    </div>
                  `;
                })
                .join('')
        }
      </div>`
    : '';

  return `
    <div class="hand-drawer">
      <div class="hand-header" id="toggle-hand-drawer">
        <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
          <strong>🔒 Tu mano física (${h.hiddenHand.length})</strong>
          <span class="pill green" style="font-size:10px;padding:2px 7px;">🛡️ Oculta para la IA</span>
          ${pendingBadge}
        </div>
        <div style="display:flex;align-items:center;gap:6px;">
          <button class="btn btn-sm btn-yellow" id="btn-open-draw-modal">+ Registrar robo</button>
          <span style="font-size:12px;color:var(--text-dim);">${handExpanded ? '▲ Ocultar' : '▼ Ver'}</span>
        </div>
      </div>
      ${cardsHtml}
    </div>
  `;
}

function renderChat() {
  const feed = document.getElementById('chat-feed');
  if (!feed) return;
  feed.innerHTML = state.log
    .map((entry) => {
      const who = entry.actor === 'bot' ? '🤖 Bot' : entry.actor === 'human' ? '🧑 Vos' : '⚙️ Sistema';
      const isRevealed = revealedLogs.has(entry.id);
      const body =
        entry.masked && entry.secretText && isRevealed
          ? `${entry.text}\n👁️ ${entry.secretText}`
          : entry.text;
      const eyeBtn =
        entry.masked && entry.secretText
          ? `<button class="secret-reveal-btn" data-reveal-log="${entry.id}">${isRevealed ? 'Ocultar' : '👁️ Ver'}</button>`
          : '';
      return `
        <div class="msg ${entry.actor}">
          <div class="msg-meta"><span>${who}</span>${eyeBtn}</div>
          <div>${esc(body)}</div>
        </div>
      `;
    })
    .join('');
  feed.scrollTop = feed.scrollHeight;

  feed.querySelectorAll('[data-reveal-log]').forEach((btn) => {
    btn.addEventListener('click', () => {
      const id = btn.getAttribute('data-reveal-log');
      if (revealedLogs.has(id)) revealedLogs.delete(id);
      else revealedLogs.add(id);
      renderChat();
    });
  });
}

    container.innerHTML = '';

    <div class="pending-banner">

      <div class="pending-options">
        ${pc.options

            const cmd =
              pc.kind === 'mercenary_choice' && opt.mode === 'discard'

function renderQuickChips() {
  const row = document.getElementById('quick-chips');
  if (!row) return;
  const chips = [];

  if (state.phase === 'setup_first') {
    chips.push({ label: '🧑 Empiezo yo', cmd: 'empiezo yo', cls: 'cyan' });
    chips.push({ label: '🤖 Empieza el bot', cmd: 'empieza el bot', cls: 'accent' });
    chips.push({ label: '🎲 Sorteo', cmd: 'sorteo', cls: 'yellow' });
  } else if (state.phase === 'setup_draw') {
    chips.push({ label: `🃏 Registrar robo (${state.human.pendingDraws})`, action: 'open_draw', cls: 'yellow' });
  } else if (state.phase === 'playing') {
    if (state.human.pendingDraws > 0) {
      chips.push({ label: `🃏 Robé carta (${state.human.pendingDraws})`, action: 'open_draw', cls: 'yellow' });
    }
    if (state.activePlayer === 'human' && !state.pendingChoice) {
      chips.push({ label: '⏭️ Paso (Fin de turno)', cmd: 'paso', cls: 'accent' });
      chips.push({
        label: state.human.waterSiloInHand ? '💧 Usar Depósito (+1💧)' : '🛢️ Tomar Depósito (1💧)',
        cmd: state.human.waterSiloInHand ? 'uso depósito' : 'tomo depósito',
        cls: 'cyan',
      });
      chips.push({ label: '🃏 Robar (2💧)', cmd: 'robo por 2', cls: '' });
      chips.push({ label: '💀 Asaltar', cmd: 'asaltar', cls: '' });
    }
    chips.push({ label: '📊 Estado', cmd: 'estado', cls: '' });
    chips.push({ label: '↩️ Deshacer', cmd: 'deshacer', cls: '' });
    chips.push({ label: '❓ Ayuda', cmd: 'ayuda', cls: '' });
  }

  row.innerHTML = chips
    .map(
      (c, i) =>
        `<button class="chip ${c.cls}" data-chip-idx="${i}">${esc(c.label)}</button>`
    )
    .join('');

  row.querySelectorAll('[data-chip-idx]').forEach((b) => {
    b.addEventListener('click', () => {
      const ch = chips[parseInt(b.getAttribute('data-chip-idx'), 10)];
      if (ch.action === 'open_draw') openDrawModal();
      else if (ch.cmd) submitCommand(ch.cmd);
    });
  });
}

function renderAutocomplete(val) {
  const box = document.getElementById('autocomplete-box');
  if (!box) return;
  const suggestions = getAutocompleteSuggestions(val, state);
  if (suggestions.length === 0) {
    box.classList.add('hidden');
    box.innerHTML = '';
    return;
  }
  box.classList.remove('hidden');
  box.innerHTML = suggestions
    .map(
      (c) =>
        `<button class="chip" data-ac-name="${esc(c.nameEs)}">${esc(c.nameEs)} <span style="opacity:0.6;font-weight:400;">(${esc(c.nameEn)})</span></button>`
    )
    .join('');
  box.querySelectorAll('[data-ac-name]').forEach((b) => {
    b.addEventListener('click', () => {
      const inputEl = document.getElementById('chat-input');
      const parts = inputEl.value.trim().split(/\s+/);
      parts[parts.length - 1] = b.getAttribute('data-ac-name');
      inputEl.value = parts.join(' ') + ' ';
      inputEl.focus();
      renderAutocomplete('');
    });
  });
}

// === EVENT BINDERS ===
function bindSetupEvents() {
  const searchEl = document.getElementById('setup-search');
  if (searchEl) {
    searchEl.addEventListener('input', (e) => {
      setupFilter = e.target.value;
      renderArena();
      const el = document.getElementById('setup-search');
      if (el) {
        el.focus();
        el.setSelectionRange(el.value.length, el.value.length);
      }
    });
  }
  document.getElementById('setup-mode-pick')?.addEventListener('click', () => {
    setupMode = 'pick';
    renderArena();
  });
  document.getElementById('setup-mode-exclude')?.addEventListener('click', () => {
    setupMode = 'exclude';
    renderArena();
  });
  document.querySelectorAll('[data-camp-id]').forEach((el) => {
    el.addEventListener('click', () => {
      const id = el.getAttribute('data-camp-id');
      if (setupMode === 'pick') {
        setupExcludedCamps = setupExcludedCamps.filter((x) => x !== id);
        if (setupSelectedCamps.includes(id)) {
          setupSelectedCamps = setupSelectedCamps.filter((x) => x !== id);
        } else if (setupSelectedCamps.length < 3) {
          setupSelectedCamps.push(id);
        } else {
          showToast('Ya elegiste 3 campamentos. Desmarcá uno para cambiarlo.');
        }
      } else {
        setupSelectedCamps = setupSelectedCamps.filter((x) => x !== id);
        if (setupExcludedCamps.includes(id)) {
          setupExcludedCamps = setupExcludedCamps.filter((x) => x !== id);
        } else {
          setupExcludedCamps.push(id);
        }
      }
      renderArena();
    });
  });
  document.getElementById('btn-setup-random')?.addEventListener('click', () => {
    const shuffled = [...CAMPS].sort(() => Math.random() - 0.5);
    setupSelectedCamps = shuffled.slice(0, 3).map((c) => c.id);
    setupExcludedCamps = [];
    renderArena();
  });
  document.getElementById('btn-setup-confirm')?.addEventListener('click', () => {
    if (setupSelectedCamps.length !== 3) return;
    const names = setupSelectedCamps.map((id) => CAMPS_BY_ID[id].nameEs).join(', ');
    const excl =
      setupExcludedCamps.length > 0
        ? ` y descarté ${setupExcludedCamps.map((id) => CAMPS_BY_ID[id].nameEs).join(', ')}`
        : '';
    setupSelectedCamps = [];
    setupExcludedCamps = [];
    submitCommand(`mis campamentos son ${names}${excl}`);
  });
}

function bindArenaEvents() {
  document.getElementById('btn-rematch')?.addEventListener('click', () => submitCommand('nueva partida'));

  document.getElementById('toggle-hand-drawer')?.addEventListener('click', (e) => {
    if (e.target.closest('#btn-open-draw-modal')) return;
    handExpanded = !handExpanded;
    renderArena();
  });

  document.getElementById('btn-open-draw-modal')?.addEventListener('click', (e) => {
    e.stopPropagation();
    openDrawModal();
  });

  document.querySelector('[data-silo-side="human"]')?.addEventListener('click', () => {
    submitCommand(state.human.waterSiloInHand ? 'uso depósito' : 'tomo depósito');
  });

  document.querySelectorAll('[data-hand-play]').forEach((b) => {
    b.addEventListener('click', () => {
      const cid = b.getAttribute('data-hand-play');
      const card = DECK_CARDS_BY_ID[cid];
      if (card.type === 'event') {
        submitCommand(`juego ${card.nameEs}`);
      } else {
        openColumnPickModal(card);
      }
    });
  });

  document.querySelectorAll('[data-hand-junk]').forEach((b) => {
    b.addEventListener('click', () => {
      const cid = b.getAttribute('data-hand-junk');
      submitCommand(`desecho ${DECK_CARDS_BY_ID[cid].nameEs}`);
    });
  });

  document.querySelectorAll('[data-hand-discard]').forEach((b) => {
    b.addEventListener('click', () => {
      const cid = b.getAttribute('data-hand-discard');
      submitCommand(`descarté ${DECK_CARDS_BY_ID[cid].nameEs}`);
    });
  });

  document.querySelectorAll('[data-inspect]').forEach((el) => {
    el.addEventListener('click', () => {
      const type = el.getAttribute('data-inspect');
      const side = el.getAttribute('data-side');
      const col = parseInt(el.getAttribute('data-col'), 10);
      const slot = el.hasAttribute('data-slot') ? parseInt(el.getAttribute('data-slot'), 10) : 0;
      openCardInspector(type, side, col, slot);
    });
  });

  document.querySelectorAll('[data-inspect-event]').forEach((el) => {
    el.addEventListener('click', () => {
      const id = el.getAttribute('data-inspect-event');
      const def = ALL_CARDS_BY_ID[id];
      if (!def) return;
      openGenericModal(
        `Evento: ${def.nameEs}`,
        `<p><strong>${esc(def.nameEs)}</strong> (${esc(def.nameEn)})</p>
         <p style="margin-top:6px;">${esc(def.textEs)}</p>`
      );
    });
  });

  document.querySelectorAll('[data-empty-slot]').forEach((el) => {
    el.addEventListener('click', () => {
      const [side, colStr] = el.getAttribute('data-empty-slot').split(':');
      if (side === 'human') {
        const col = parseInt(colStr, 10) + 1;
        const inputEl = document.getElementById('chat-input');
        inputEl.value = `juego  en columna ${col}`;
        inputEl.focus();
        inputEl.setSelectionRange(6, 6);
      }
    });
  });
}

// === MODALS ===
function openGenericModal(title, bodyHtml) {
  const root = document.getElementById('modal-root');
  root.innerHTML = `
    <div class="modal-backdrop" id="modal-backdrop">
      <div class="modal-card">
        <div class="modal-head">
          <strong>${esc(title)}</strong>
          <button class="btn btn-sm btn-ghost" id="modal-close">✕</button>
        </div>
        <div class="modal-body">${bodyHtml}</div>
      </div>
    </div>
  `;
  const close = () => (root.innerHTML = '');
  document.getElementById('modal-close')?.addEventListener('click', close);
  document.getElementById('modal-backdrop')?.addEventListener('click', (e) => {
    if (e.target.id === 'modal-backdrop') close();
  });
}

function closeModal() {
  const root = document.getElementById('modal-root');
  if (root) root.innerHTML = '';
}

function openColumnPickModal(card) {
  openGenericModal(
    `Jugar ${card.nameEs} (${card.cost}💧)`,
    `
      <div style="font-size:13px;color:var(--text-dim);">Elegí en qué columna y fila querés colocar a <strong>${esc(card.nameEs)}</strong>:</div>
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:6px;">
        ${[0, 1, 2]
          .map(
            (col) => `
          <div style="display:flex;flex-direction:column;gap:5px;">
            <div style="font-size:11px;font-weight:700;color:var(--cyan);text-align:center;">${COL_NAMES_ES[col]}</div>
            <button class="btn btn-sm btn-cyan" data-place-col="${col}" data-place-slot="adelante">Adelante</button>
            <button class="btn btn-sm" data-place-col="${col}" data-place-slot="atrás">Atrás</button>
          </div>
        `
          )
          .join('')}
      </div>
    `
  );
