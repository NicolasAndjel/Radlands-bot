      return finalizeHumanAction(state, {
        ok: true,
        message: `+${parsed.delta}💧 extra (total: ${getTotalWater(state.human)}💧).`,
      });
    }
    const spent = Math.min(getTotalWater(state.human), Math.abs(parsed.delta));
    if (state.human.water >= spent) state.human.water -= spent;
    else {
      const rem = spent - state.human.water;
      state.human.water = 0;
      state.human.extraWater = Math.max(0, state.human.extraWater - rem);
    }
    return finalizeHumanAction(state, {
      ok: true,
      message: `-${spent}💧 (te quedan ${getTotalWater(state.human)}💧).`,
    });
  }

  return { ok: false, spoken: [] };
}

function finalizeHumanAction(state, res) {
  if (!res.ok) {
    // Roll back unused undo snapshot on failed command
    if (state.history.length > 0) state.history.pop();
    addLog(state, 'system', `⚠️ ${res.error}`, { speak: false });
    return { ok: false, error: res.error, spoken: [] };
  }
  const spoken = [];
  if (res.message) {
    addLog(state, res.botVoice ? 'bot' : 'system', res.message, { speak: !!res.botVoice });
  }
  // Only speak aloud if the Bot itself reacted (e.g., chose a camp to damage / cards to discard) or game ended!
  if (res.botVoice) {
    spoken.push(res.botVoice);
  }
  if (checkGameOver(state)) {
    addLog(state, 'system', `🏆 ${state.winReason}`);
    spoken.push(state.winReason);
  }
  return { ok: true, spoken, needsChoice: !!state.pendingChoice, sfx: classifyHumanSfx(res, state) };
}

function buildShortVoiceSummary(state) {
  const botCamps = state.bot.camps
    .filter((c) => !c.destroyed)
    .map((c) => `${getCardNameEs(c.id)}${c.damaged ? ' dañado' : ''}`)
    .join(', ');
  const botPeople = getAllPeople(state, 'bot')
    .map((x) => `${x.person.isPunk ? 'Punki' : getCardNameEs(x.person.id)} en columna ${x.col + 1}`)
    .join(', ');
  const botEvents = state.bot.events
    .map((e, i) => (e ? `${getCardNameEs(e)} en casilla ${i + 1}` : null))
    .filter(Boolean)
    .join(', ');
  return [
    `Mis campamentos: ${botCamps || 'ninguno'}.`,
    `En mi mesa: ${botPeople || 'ninguna persona'}.`,
    botEvents ? `Mis eventos: ${botEvents}.` : '',
    `Tengo ${state.bot.hand.length} cartas en mano.`,
  ]
    .filter(Boolean)
    .join(' ');
}

// === PRIVATE INDEXEDDB STORE + MEMORY CACHE ===
const IDB_NAME = 'radlands_card_art_v1';
const IDB_STORE = 'images';
const URL_CFG_KEY = 'radlands_card_art_url_cfg_v1';

const memoryArtCache = Object.create(null);
const brokenUrlCache = new Set();
let idbPromise = null;

function openArtDb() {
  if (idbPromise) return idbPromise;
  idbPromise = new Promise((resolve) => {
    try {
      if (typeof indexedDB === 'undefined' || !indexedDB) {
        resolve(null);
        return;
      }
      const req = indexedDB.open(IDB_NAME, 1);
      req.onupgradeneeded = () => {
        const db = req.result;
        if (!db.objectStoreNames.contains(IDB_STORE)) {
          db.createObjectStore(IDB_STORE);
        }
      };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => resolve(null);
    } catch {
      resolve(null);
    }
  });
  return idbPromise;
}

async function initCardArtStore() {
  const db = await openArtDb();
  if (!db) return 0;
  return new Promise((resolve) => {
    try {
      const tx = db.transaction(IDB_STORE, 'readonly');
      const store = tx.objectStore(IDB_STORE);
      const req = store.openCursor();
      let count = 0;
      req.onsuccess = (ev) => {
        const cur = ev.target.result;
        if (cur) {
          if (typeof cur.key === 'string' && typeof cur.value === 'string') {
            memoryArtCache[cur.key] = cur.value;
            count += 1;
          }
          cur.continue();
        } else {
          resolve(count);
        }
      };
      req.onerror = () => resolve(count);
    } catch {
      resolve(0);
    }
  });
}

function getCardArtUrlConfig() {
  const defaults = { enabled: false, template: './cards/{id}.jpg' };
  try {
    if (typeof localStorage === 'undefined') return defaults;
    return { ...defaults, ...JSON.parse(localStorage.getItem(URL_CFG_KEY) || '{}') };
  } catch {
    return defaults;
  }
}

function saveCardArtUrlConfig(cfg) {
  brokenUrlCache.clear();
  try {
    if (typeof localStorage === 'undefined') return;
    localStorage.setItem(URL_CFG_KEY, JSON.stringify({
      enabled: Boolean(cfg?.enabled),
      template: String(cfg?.template || './cards/{id}.jpg').trim() || './cards/{id}.jpg',
    }));
  } catch {}
}

function markCardArtUrlBroken(url) {
  if (url) brokenUrlCache.add(url);
}

function resolveTemplateArtUrl(cardId, cfg = null) {
  const conf = cfg || getCardArtUrlConfig();
  if (!conf.enabled || !conf.template) return null;
  const card = VISUAL_CARDS_BY_ID[cardId];
  if (!card) return null;
  const slugEn = normalizeEs(card.nameEn || card.id).replace(/\s+/g, '_');
  const slugEs = normalizeEs(card.nameEs || card.id).replace(/\s+/g, '_');
  const url = conf.template
    .replace(/\{id\}/gi, encodeURIComponent(cardId))
    .replace(/\{nameEn\}/gi, encodeURIComponent(card.nameEn || cardId))
    .replace(/\{nameEs\}/gi, encodeURIComponent(card.nameEs || cardId))
    .replace(/\{slugEn\}/gi, encodeURIComponent(slugEn))
    .replace(/\{slugEs\}/gi, encodeURIComponent(slugEs));
  if (brokenUrlCache.has(url)) return null;
  return url;
}

}

function getCardArtSrc(cardId) {

function loadImageElement(src) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = (e) => reject(e);
    img.src = src;
  });
}

async function compressImageToCardDataUrl(blobOrUrl, opts = {}) {
  const targetW = opts.width || 378;
  const targetH = opts.height || 528; // Exact 63:88 Radlands card aspect ratio
  const quality = opts.quality || 0.84;
  const rotateDeg = opts.rotateDeg || 0;

  let tempUrl = null;
  let srcUrl = '';
  if (typeof blobOrUrl === 'string') {
    srcUrl = blobOrUrl;
  } else {
    tempUrl = URL.createObjectURL(blobOrUrl);
    srcUrl = tempUrl;
  }

  try {
    const img = await loadImageElement(srcUrl);
    const canvas = document.createElement('canvas');
    canvas.width = targetW;
    canvas.height = targetH;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#090710';
    ctx.fillRect(0, 0, targetW, targetH);

    const rad = (rotateDeg * Math.PI) / 180;
    const swapped = Math.abs(rotateDeg % 180) === 90;
    const srcW = swapped ? img.naturalHeight : img.naturalWidth;
    const srcH = swapped ? img.naturalWidth : img.naturalHeight;

    // Cover-crop cleanly to fill card frame (if extremely wide/tall, keep card centered)
    const scale = Math.max(targetW / srcW, targetH / srcH);
    const drawW = img.naturalWidth * scale;
    const drawH = img.naturalHeight * scale;

    ctx.save();
    ctx.translate(targetW / 2, targetH / 2);
    if (rad) ctx.rotate(rad);
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(img, -drawW / 2, -drawH / 2, drawW, drawH);
    ctx.restore();

    let out = canvas.toDataURL('image/webp', quality);
    if (!out.startsWith('data:image/webp')) {
      out = canvas.toDataURL('image/jpeg', 0.86);
    }
    return out;
  } finally {
    if (tempUrl) URL.revokeObjectURL(tempUrl);
  }
}

async function saveCardArtFromBlob(cardId, blobOrUrl, opts = {}) {
  if (!VISUAL_CARDS_BY_ID[cardId]) {
    throw new Error(`Carta desconocida: ${cardId}`);
  }
  const dataUrl = await compressImageToCardDataUrl(blobOrUrl, opts);
  await putIdbImage(cardId, dataUrl);
  return dataUrl;
}

async function rotateCardArt(cardId) {
  const existing = memoryArtCache[cardId];
  if (!existing) return null;
  const rotated = await compressImageToCardDataUrl(existing, { rotateDeg: 90 });
  await putIdbImage(cardId, rotated);
  return rotated;
}

/**
 * Captures the exact 63:88 guided frame region from a live <video> viewfinder (object-fit: cover)
 * and stores it directly as a crisp 378x528 WebP card image in private local IndexedDB.
 */
async function captureFramedVideoCard(cardId, videoEl, guideEl, opts = {}) {
  if (!VISUAL_CARDS_BY_ID[cardId]) throw new Error(`Carta desconocida: ${cardId}`);
  const vidW = videoEl?.videoWidth || 0;
  const vidH = videoEl?.videoHeight || 0;
  if (!vidW || !vidH) throw new Error('La cámara todavía no está lista.');

  const targetW = opts.width || 378;
  const targetH = opts.height || 528;
  const quality = opts.quality || 0.86;

  const vRect = videoEl.getBoundingClientRect();
  const gRect = guideEl ? guideEl.getBoundingClientRect() : vRect;

  const scale = Math.max(vRect.width / vidW, vRect.height / vidH);
  const offsetX = (vidW * scale - vRect.width) / 2;
  const offsetY = (vidH * scale - vRect.height) / 2;

  const relX = gRect.left - vRect.left;
  const relY = gRect.top - vRect.top;

  const sx = Math.max(0, Math.min(vidW - 1, (relX + offsetX) / scale));
  const sy = Math.max(0, Math.min(vidH - 1, (relY + offsetY) / scale));
  const sw = Math.max(1, Math.min(vidW - sx, gRect.width / scale));
  const sh = Math.max(1, Math.min(vidH - sy, gRect.height / scale));

  const canvas = document.createElement('canvas');
  canvas.width = targetW;
  canvas.height = targetH;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#090710';
  ctx.fillRect(0, 0, targetW, targetH);
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(videoEl, sx, sy, sw, sh, 0, 0, targetW, targetH);

  let dataUrl = canvas.toDataURL('image/webp', quality);
  if (!dataUrl.startsWith('data:image/webp')) {
    dataUrl = canvas.toDataURL('image/jpeg', 0.88);
  }
  await putIdbImage(cardId, dataUrl);
  return dataUrl;
}

// === SMART SPANISH + ENGLISH FILENAME MATCHER ===
const FILENAME_NOISE_WORDS = new Set([
  'radlands', 'card', 'cards', 'carta', 'cartas', 'camp', 'camps', 'campamento', 'campamentos',
  'person', 'people', 'persona', 'personas', 'event', 'events', 'evento', 'eventos',
  'base', 'maldito', 'roxley', 'es', 'en', 'esp', 'eng', 'spa', 'spanish', 'english',
  'front', 'face', 'scan', 'hd', 'hq', 'img', 'image', 'imagen', 'photo', 'foto',
  'v1', 'v2', 'copy', 'copia', 'deluxe', 'super', 'cult', 'chrome',
]);

function cleanCardFilename(filename) {
  const base = String(filename || '')
    .split(/[\\/]/)
    .pop()
    .replace(/\.[a-z0-9]{2,5}$/i, '');
  // Strip parenthetical tags like "(1)", "(Camp)", "[ES]"
  const noParens = base.replace(/\([^)]*\)|\[[^\]]*\]/g, ' ');
  // Normalize accents and turn punctuation/underscores/hyphens into spaces
  const norm = normalizeEs(noParens.replace(/[_-]+/g, ' '));
  // Strip leading numeric prefixes like "01 " or "12 "
  const noNums = norm.replace(/^\d+\s+/, '').replace(/\s+\d+$/, '');
  const tokens = noNums.split(/\s+/).filter(Boolean);
  const filtered = tokens.filter((t) => !FILENAME_NOISE_WORDS.has(t));
  return {
    full: noNums.trim(),
    cleaned: (filtered.length > 0 ? filtered : tokens).join(' ').trim(),
  };
}

function buildVisualMatchEntries() {
  const custom = getCustomAliases();
  const entries = [];
  for (const card of ALL_VISUAL_CARDS) {
    const rawNames = [
      card.id.replace(/_/g, ' '),
      card.id,
      card.nameEs,
      card.nameEn,
      ...(card.aliases || []),
      ...(custom[card.id] || []),
    ];
    const seen = new Set();
    for (const rn of rawNames) {
      const n = normalizeEs(String(rn || '').replace(/[_-]+/g, ' '));
      if (!n || seen.has(n)) continue;
      seen.add(n);
      entries.push({ cardId: card.id, norm: n, compact: n.replace(/\s+/g, '') });
    }
  }
  return entries;
}

function matchFilenameToCardId(filename) {
  const { full, cleaned } = cleanCardFilename(filename);
  if (!full && !cleaned) return null;

  const candidates = cleaned && cleaned !== full ? [cleaned, full] : [full];
  const entries = buildVisualMatchEntries();

  // 1. Exact normalized or compact (space-free) match
  for (const cand of candidates) {
    const compact = cand.replace(/\s+/g, '');
    const exact = entries.find((e) => e.norm === cand || e.compact === compact);
    if (exact) return exact.cardId;
  }

  // 2. Longest token-bounded phrase contained inside filename (e.g. "radlands_04_railgun_final")
  let bestContain = null;
  for (const cand of candidates) {
    const padded = ` ${cand} `;
    for (const e of entries) {
      if (e.norm.length < 4) continue;
      if (padded.includes(` ${e.norm} `)) {
        if (!bestContain || e.norm.length > bestContain.len) {
          bestContain = { cardId: e.cardId, len: e.norm.length };
        }
      }
    }
  }
  if (bestContain) return bestContain.cardId;

  // 3. Strict fuzzy Levenshtein match on cleaned stem (handles typos / minor spelling diffs)
  const target = cleaned || full;
  const targetCompact = target.replace(/\s+/g, '');
  if (targetCompact.length < 4) return null;
  let bestFuzzy = null;
  for (const e of entries) {
    if (e.compact.length < 4) continue;
    const maxLen = Math.max(targetCompact.length, e.compact.length);
    const maxDist = maxLen >= 10 ? 2 : maxLen >= 6 ? 1 : 0;
    if (maxDist === 0 || Math.abs(targetCompact.length - e.compact.length) > maxDist) continue;
    const dist = levenshtein(targetCompact, e.compact);
    if (dist <= maxDist) {
      const score = dist / maxLen;
      if (!bestFuzzy || score < bestFuzzy.score) {
        bestFuzzy = { cardId: e.cardId, score };
      }
    }
  }
  return bestFuzzy ? bestFuzzy.cardId : null;
}

// === PURE-JS OFFLINE ZIP EXTRACTOR (Store + Deflate via DecompressionStream) ===
const IMAGE_EXT_RE = /\.(png|jpe?g|webp|gif)$/i;

async function inflateRawBytes(compressedUint8) {
  if (typeof DecompressionStream === 'undefined') {
    throw new Error('Tu navegador no soporta descomprimir ZIP directamente. Descomprimí la carpeta y subí las imágenes.');
  }
  const ds = new DecompressionStream('deflate-raw');
  const writer = ds.writable.getWriter();
  writer.write(compressedUint8);
  writer.close();
  const ab = await new Response(ds.readable).arrayBuffer();
  return new Uint8Array(ab);
}

function guessImageMime(name) {
  const lower = name.toLowerCase();
  if (lower.endsWith('.png')) return 'image/png';
  if (lower.endsWith('.webp')) return 'image/webp';
  if (lower.endsWith('.gif')) return 'image/gif';
  return 'image/jpeg';
}

async function extractImageFilesFromZip(arrayBuffer) {
  const bytes = new Uint8Array(arrayBuffer);
  const view = new DataView(arrayBuffer);
  const decoder = new TextDecoder('utf-8');

  // Find End of Central Directory (EOCD) signature 0x06054b50
  let eocdOffset = -1;
  const minOffset = Math.max(0, bytes.length - 65557);
  for (let i = bytes.length - 22; i >= minOffset; i--) {
    if (view.getUint32(i, true) === 0x06054b50) {
      eocdOffset = i;
      break;
    }
  }
  if (eocdOffset < 0) throw new Error('El archivo no parece ser un ZIP válido.');

  const cdEntries = view.getUint16(eocdOffset + 10, true);
  let offset = view.getUint32(eocdOffset + 16, true);
  const results = [];

  for (let i = 0; i < cdEntries; i++) {
    if (offset + 46 > bytes.length || view.getUint32(offset, true) !== 0x02014b50) break;
    const method = view.getUint16(offset + 10, true);
    const compSize = view.getUint32(offset + 20, true);
    const nameLen = view.getUint16(offset + 28, true);
    const extraLen = view.getUint16(offset + 30, true);
    const commentLen = view.getUint16(offset + 32, true);
    const localHeaderOffset = view.getUint32(offset + 42, true);
    const fileName = decoder.decode(bytes.subarray(offset + 46, offset + 46 + nameLen));
    offset += 46 + nameLen + extraLen + commentLen;

    const baseName = fileName.split('/').pop();
    if (!baseName || baseName.startsWith('.') || fileName.includes('__MACOSX/')) continue;
    if (!IMAGE_EXT_RE.test(baseName)) continue;
    if (method !== 0 && method !== 8) continue;

    if (localHeaderOffset + 30 > bytes.length || view.getUint32(localHeaderOffset, true) !== 0x04034b50) continue;
    const lhNameLen = view.getUint16(localHeaderOffset + 26, true);
    const lhExtraLen = view.getUint16(localHeaderOffset + 28, true);
    const dataStart = localHeaderOffset + 30 + lhNameLen + lhExtraLen;
    const rawSlice = bytes.subarray(dataStart, dataStart + compSize);

    try {
      const outBytes = method === 0 ? rawSlice : await inflateRawBytes(rawSlice);
      results.push({
        filename: baseName,
        blob: new Blob([outBytes], { type: guessImageMime(baseName) }),
      });
    } catch {
      // Skip unreadable entry and keep processing rest of archive
    }
  }
  return results;
}

function escArt(s) {
  return String(s ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function formatShortAbilityLine(ab) {
  const txt = String(ab.textEs || '');
  const colonIdx = txt.indexOf(':');
  const body = colonIdx >= 0 ? txt.slice(colonIdx + 1).trim() : txt;
  const costLabel = ab.dynamicCost === 'mimic' ? '?' : String(ab.cost ?? 0);
  return { costLabel, body };
}

/**
 * Renders the visual Radlands card face (full-bleed real official image if loaded,
 * otherwise authentic Radlands vertical card anatomy with tailored neon wasteland art).
 */
function renderVisualCardFaceHTML(cardId, opts = {}) {
  const card = VISUAL_CARDS_BY_ID[cardId];
  if (!card) return '';

  const imgSrc = getCardArtSrc(cardId);
  const category = card.visualCategory; // 'camp' | 'person' | 'event' | 'special'
  const isUnique = Boolean(card.unique);
  const isPunk = cardId === 'punk_back';
  const damaged = Boolean(opts.damaged);
  const destroyed = Boolean(opts.destroyed);
  const ready = Boolean(opts.ready);
  const unprotected = Boolean(opts.unprotected);
  const compact = Boolean(opts.compact);
  const showFooterBadges = opts.showFooterBadges !== false;
  const extraBadgesHtml = opts.extraBadgesHtml || '';

  const frameClasses = [
    'rl-card',
    `rl-type-${category}`,
    isUnique ? 'rl-unique' : '',
    isPunk ? 'rl-punk' : '',
    imgSrc ? 'rl-has-photo' : 'rl-fallback',
    damaged ? 'is-damaged' : '',
    destroyed ? 'is-destroyed' : '',
    ready ? 'is-ready' : '',
    compact ? 'is-compact' : '',
    opts.extraClass || '',
  ]
    .filter(Boolean)
    .join(' ');

  // Status overlay ribbons (subtle so they never block real artwork)
  const overlayParts = [];
  if (destroyed) {
    overlayParts.push('<div class="rl-destroyed-overlay"><span>✖ DESTRUIDO</span></div>');
  } else if (damaged) {
    overlayParts.push('<div class="rl-damaged-ribbon">DAÑADA</div>');
  }

  // Top corner pill for quick game state scanning
  let stateBadge = '';
  if (opts.statusTagHtml) {
    stateBadge = opts.statusTagHtml;
  } else if (destroyed) {
    stateBadge = '<span class="rl-chip rl-chip-dead">✖</span>';
  } else if (damaged) {
    stateBadge = `<span class="rl-chip rl-chip-dmg">${getGameIconSvg('injure', 13)}</span>`;
  } else if (ready) {
    stateBadge = '<span class="rl-chip rl-chip-ready">Lista</span>';
  } else if (opts.showExhausted) {
    stateBadge = '<span class="rl-chip rl-chip-exh">Usada</span>';
  }

  const unprotChip = unprotected && !destroyed ? '<span class="rl-chip rl-chip-unprot">Expuesta</span>' : '';

  if (imgSrc) {
    // REAL OFFICIAL ARTWORK MODE: full-bleed card image with crisp status corners!
    return `
      <div class="${frameClasses}" data-card-id="${escArt(cardId)}">
        <img
          class="rl-photo-img"
          src="${escArt(imgSrc)}"
          alt="${escArt(card.nameEs)}"
          loading="lazy"
          decoding="async"
          data-art-img-id="${escArt(cardId)}"
        />
        ${overlayParts.join('')}
        ${stateBadge ? `<div class="rl-corner-tr">${stateBadge}</div>` : ''}
        ${
          showFooterBadges && (unprotChip || extraBadgesHtml)
            ? `<div class="rl-photo-footer">${extraBadgesHtml}${unprotChip}</div>`
            : ''
        }
        ${opts.showPhotoTitleBar ? `<div class="rl-photo-caption">${escArt(card.nameEs)}</div>` : ''}
      </div>
    `;
  }

  // TAILORED RADLANDS VISUAL FALLBACK CARD (Authentic black/white/hazard frame + neon art + crisp SVG icons)
  let topLeftBadge = '';
  if (category === 'camp') {
    topLeftBadge = `<span class="rl-badge-draw" title="Cartas iniciales">+${card.startingCards}${getGameIconSvg('draw', 14)}</span>`;
  } else if (category === 'person' || category === 'event' || cardId === 'water_silo') {
    topLeftBadge = `<span class="rl-badge-cost" title="Costo de agua">${card.cost ?? 0}${getGameIconSvg('water', 14)}</span>`;
  } else if (cardId === 'raiders') {
    topLeftBadge = `<span class="rl-badge-bomb">${getGameIconSvg('bomb', 14)}2</span>`;
  }

  let topRightBadge = stateBadge;
  if (!topRightBadge && category === 'event') {
    topRightBadge = `<span class="rl-badge-bomb" title="Casilla de bomba">${getGameIconSvg('bomb', 14)}${card.bomb}</span>`;
  } else if (!topRightBadge && isUnique) {
    topRightBadge = `<span class="rl-chip rl-chip-unique">★</span>`;
  }

  let bodyHtml = '';
  if (isPunk) {
    bodyHtml = `<div class="rl-body-line rl-punk-note">Escudo · 1 golpe</div>`;
  } else if (category === 'event' || category === 'special') {
    bodyHtml = `<div class="rl-body-line">${escArt(card.textEs || '')}</div>`;
  } else {
    const lines = [];
    if (card.traitTextEs) {
      lines.push(`<div class="rl-trait-line">★ ${escArt(card.traitTextEs)}</div>`);
    }
    for (const ab of card.abilities || []) {
      const { costLabel, body } = formatShortAbilityLine(ab);
      lines.push(
        `<div class="rl-ab-row"><span class="rl-ab-cost">${escArt(costLabel)}${getGameIconSvg('water', 12)}</span><span class="rl-ab-txt">${escArt(body)}</span></div>`
      );
    }
    bodyHtml = lines.join('');
  }

  const junkHtml =
    card.junk && JUNK_INFO[card.junk]
      ? `<span class="rl-junk-pill" title="Chatarra: ${escArt(JUNK_INFO[card.junk].labelEs)}">${getGameIconSvg(card.junk, 20)}</span>`
      : '';

  return `
    <div class="${frameClasses}" data-card-id="${escArt(cardId)}">
      <div class="rl-art-window">
        ${getFallbackCardArtSvg(cardId)}
        ${topLeftBadge ? `<div class="rl-corner-tl">${topLeftBadge}</div>` : ''}
        ${topRightBadge ? `<div class="rl-corner-tr">${topRightBadge}</div>` : ''}
        ${junkHtml ? `<div class="rl-corner-bl">${junkHtml}</div>` : ''}
      </div>
      <div class="rl-name-bar">
        <span class="rl-name-text">${escArt(card.nameEs)}</span>
      </div>
      <div class="rl-card-body">
        ${bodyHtml}
      </div>
      ${
        showFooterBadges && (unprotChip || extraBadgesHtml)
          ? `<div class="rl-card-footer">${extraBadgesHtml}${unprotChip}</div>`
          : ''
      }
      ${overlayParts.join('')}
    </div>
  `;
}

// ===== sfx_stats.js =====
// Radlands Hybrid Bot — Procedural Web Audio SFX (100% offline, zero audio files) + Match History & Stats

const STATS_STORAGE_KEY = 'radlands_match_history_v1';

let sfxAudioCtx = null;

function ensureAudioContext() {
  if (typeof window === 'undefined') return null;
  const Ctx = window.AudioContext || window.webkitAudioContext;
  if (!Ctx) return null;
  try {
    if (!sfxAudioCtx) sfxAudioCtx = new Ctx();
    if (sfxAudioCtx.state === 'suspended') sfxAudioCtx.resume().catch(() => {});
    return sfxAudioCtx;
  } catch {
    return null;
  }
}

function playTone(ctx, { type = 'sine', freqStart = 440, freqEnd = null, duration = 0.12, gain = 0.09, delay = 0 }) {
  const now = ctx.currentTime + delay;
  const osc = ctx.createOscillator();
  const amp = ctx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freqStart, now);
  if (freqEnd !== null && freqEnd > 0) {
    osc.frequency.exponentialRampToValueAtTime(freqEnd, now + duration);
  }
  amp.gain.setValueAtTime(0.0001, now);
  amp.gain.linearRampToValueAtTime(gain, now + Math.min(0.015, duration * 0.25));
  amp.gain.exponentialRampToValueAtTime(0.0001, now + duration);
  osc.connect(amp);
  amp.connect(ctx.destination);
  osc.start(now);
  osc.stop(now + duration + 0.02);
}

function playNoiseBurst(ctx, { duration = 0.14, gain = 0.08, cutoff = 1100, delay = 0 }) {
  const sampleRate = ctx.sampleRate || 44100;
  const length = Math.max(1, Math.floor(sampleRate * duration));
  const buf = ctx.createBuffer(1, length, sampleRate);
  const data = buf.getChannelData(0);
  for (let i = 0; i < length; i++) {
    data[i] = (Math.random() * 2 - 1) * (1 - i / length);
  }
  const src = ctx.createBufferSource();
  src.buffer = buf;
  const filter = ctx.createBiquadFilter();
  filter.type = 'lowpass';
  filter.frequency.setValueAtTime(cutoff, ctx.currentTime + delay);
  const amp = ctx.createGain();
  amp.gain.setValueAtTime(gain, ctx.currentTime + delay);
  amp.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + delay + duration);
  src.connect(filter);
  filter.connect(amp);
  amp.connect(ctx.destination);
  src.start(ctx.currentTime + delay);
}

function playSfx(kind, enabled = true) {
  if (!enabled || !kind) return;
  const ctx = ensureAudioContext();
  if (!ctx) return;

  try {
    switch (kind) {
      case 'play':
        playTone(ctx, { type: 'triangle', freqStart: 240, freqEnd: 390, duration: 0.09, gain: 0.08 });
        break;
      case 'water':
        playTone(ctx, { type: 'sine', freqStart: 540, freqEnd: 920, duration: 0.11, gain: 0.08 });
        playTone(ctx, { type: 'sine', freqStart: 780, freqEnd: 1180, duration: 0.08, gain: 0.05, delay: 0.05 });
        break;
      case 'damage':
        playTone(ctx, { type: 'sawtooth', freqStart: 220, freqEnd: 72, duration: 0.14, gain: 0.09 });
        playNoiseBurst(ctx, { duration: 0.1, gain: 0.07, cutoff: 1400 });
        break;
      case 'destroy':
        playTone(ctx, { type: 'sawtooth', freqStart: 160, freqEnd: 38, duration: 0.28, gain: 0.11 });
        playNoiseBurst(ctx, { duration: 0.24, gain: 0.1, cutoff: 820 });
        break;
      case 'restore':
        playTone(ctx, { type: 'triangle', freqStart: 440, freqEnd: 554, duration: 0.12, gain: 0.08 });
        playTone(ctx, { type: 'triangle', freqStart: 554, freqEnd: 660, duration: 0.16, gain: 0.08, delay: 0.08 });
        break;
      case 'event':
        playTone(ctx, { type: 'sawtooth', freqStart: 190, freqEnd: 310, duration: 0.18, gain: 0.07 });
        playTone(ctx, { type: 'sine', freqStart: 310, freqEnd: 260, duration: 0.14, gain: 0.06, delay: 0.12 });
        break;
      case 'alert':
        playTone(ctx, { type: 'square', freqStart: 740, freqEnd: 740, duration: 0.08, gain: 0.06 });
        playTone(ctx, { type: 'square', freqStart: 920, freqEnd: 920, duration: 0.1, gain: 0.06, delay: 0.11 });
        break;
      case 'pass':
        playTone(ctx, { type: 'sine', freqStart: 330, freqEnd: 260, duration: 0.09, gain: 0.055 });
        break;
      case 'win':
        playTone(ctx, { type: 'triangle', freqStart: 440, freqEnd: 440, duration: 0.13, gain: 0.09, delay: 0 });
        playTone(ctx, { type: 'triangle', freqStart: 554, freqEnd: 554, duration: 0.13, gain: 0.09, delay: 0.11 });
        playTone(ctx, { type: 'triangle', freqStart: 659, freqEnd: 880, duration: 0.26, gain: 0.1, delay: 0.22 });
        break;
      case 'lose':
        playTone(ctx, { type: 'sawtooth', freqStart: 310, freqEnd: 250, duration: 0.18, gain: 0.08, delay: 0 });
        playTone(ctx, { type: 'sawtooth', freqStart: 245, freqEnd: 165, duration: 0.3, gain: 0.08, delay: 0.16 });
        break;
      default:
        break;
    }
  } catch {}
}

// === MATCH HISTORY & STATISTICS (localStorage) ===
function loadMatchHistory() {
  try {
    if (typeof localStorage === 'undefined') return [];
    const raw = JSON.parse(localStorage.getItem(STATS_STORAGE_KEY) || '[]');
    return Array.isArray(raw) ? raw : [];
  } catch {
    return [];
  }
}

function saveMatchHistory(list) {
  try {
    if (typeof localStorage === 'undefined') return;
    localStorage.setItem(STATS_STORAGE_KEY, JSON.stringify((list || []).slice(-100)));
  } catch {}
}

function recordFinishedMatch(state) {
  if (!state || state.phase !== 'gameover' || !state.winner || state.matchRecorded) return false;
  const entry = {
    id: `m_${Date.now()}_${Math.random().toString(36).slice(2, 6)}`,
    dateIso: new Date().toISOString(),
    winner: state.winner, // 'human' | 'bot' | 'draw'
    winReason: state.winReason || '',
    turns: state.turn || 1,
    difficulty: state.difficulty || 'tactical',
    fastMode: Boolean(state.fastMode),
    humanCamps: (state.human?.camps || []).map((c) => c.id),
    botCamps: (state.bot?.camps || []).map((c) => c.id),
  };
  const list = loadMatchHistory();
  list.push(entry);
  saveMatchHistory(list);
  state.matchRecorded = true;
  return true;
}

function clearMatchHistory() {
  try {
    if (typeof localStorage === 'undefined') return;
    localStorage.removeItem(STATS_STORAGE_KEY);
  } catch {}
}

function computeMatchStats(records) {
  const list = Array.isArray(records) ? records : loadMatchHistory();
  const total = list.length;
  let wins = 0;
  let losses = 0;
  let draws = 0;
  let totalTurns = 0;

  const byDifficulty = {
    casual: { total: 0, wins: 0, losses: 0, draws: 0 },
    tactical: { total: 0, wins: 0, losses: 0, draws: 0 },
    ruthless: { total: 0, wins: 0, losses: 0, draws: 0 },
  };
  const humanCampStats = Object.create(null);

  for (const m of list) {
    totalTurns += m.turns || 0;
    const d = byDifficulty[m.difficulty] || (byDifficulty[m.difficulty] = { total: 0, wins: 0, losses: 0, draws: 0 });
    d.total += 1;
    if (m.winner === 'human') {
      wins += 1;
      d.wins += 1;
    } else if (m.winner === 'bot') {
      losses += 1;
      d.losses += 1;
    } else {
      draws += 1;
      d.draws += 1;
    }

    for (const cid of m.humanCamps || []) {
      if (!humanCampStats[cid]) humanCampStats[cid] = { id: cid, games: 0, wins: 0 };
      humanCampStats[cid].games += 1;
      if (m.winner === 'human') humanCampStats[cid].wins += 1;
    }
  }

  const topCamps = Object.values(humanCampStats)
    .sort((a, b) => b.wins - a.wins || b.games - a.games)
    .slice(0, 6);

  return {
    total,
    wins,
    losses,
    draws,
    winRate: total > 0 ? Math.round((wins / total) * 100) : 0,
    avgTurns: total > 0 ? Math.round((totalTurns / total) * 10) / 10 : 0,
    byDifficulty,
    topCamps,
    recent: [...list].reverse().slice(0, 25),
  };
}

function isMicOriginBlocked() {
  try {
    if (window.origin === 'null' || location.protocol === 'file:') return true;
    if (!window.isSecureContext) return true;
    if (document.featurePolicy && typeof document.featurePolicy.allowsFeature === 'function') {
      if (!document.featurePolicy.allowsFeature('microphone')) return true;
    }
    if (document.permissionsPolicy && typeof document.permissionsPolicy.allowsFeature === 'function') {
      if (!document.permissionsPolicy.allowsFeature('microphone')) return true;
    }
  } catch {}
  return false;
}

// === SPEECH SYNTHESIS (TTS) ===
let isSpeaking = false;
function cleanTextForSpeech(text) {
  return String(text || '')
    .replace(/(\d+)\s*💧/g, '$1 de agua')
    .replace(/💧/g, ' agua ')
    .replace(/Izquierda \(1\)/g, 'Izquierda')
    .replace(/Centro \(2\)/g, 'Centro')
    .replace(/Derecha \(3\)/g, 'Derecha')
    .replace(/Col\s*(\d)/g, 'columna $1')
    .replace(/[🤖🧑🃏🎭💀🔧🩸💥🏆⚠️🔒🛡️⏭️↩️📊🎙️🔊🔇]/g, '')
    .replace(/→/g, ', ')
    .replace(/\s+/g, ' ')
    .trim();
}

function pickSpanishVoice() {
  if (typeof speechSynthesis === 'undefined') return null;
  const voices = speechSynthesis.getVoices() || [];
  const esVoices = voices.filter((v) => /^es\b/i.test(v.lang));
  if (!esVoices.length) return null;
  return (
    esVoices.find((v) => /es-AR/i.test(v.lang)) ||
    esVoices.find((v) => /es-419|es-US|es-MX|es-CL|es-CO/i.test(v.lang)) ||
    esVoices.find((v) => /es-ES/i.test(v.lang)) ||
    esVoices[0]
  );
}

function speakLines(lines, opts = {}) {
  const resumeMic = opts.resumeMic !== false;
  if (!prefs.ttsEnabled || typeof speechSynthesis === 'undefined') {
    return Promise.resolve(false);
  }
  const joined = (lines || []).filter(Boolean).map(cleanTextForSpeech).join('. ');
  if (!joined) return Promise.resolve(false);

  return new Promise((resolve) => {
    let settled = false;
    let safetyTimer = null;
    const finish = () => {
      if (settled) return;
      settled = true;
      clearTimeout(safetyTimer);
      isSpeaking = false;
      updateVoiceIndicator();
      if (resumeMic && pausedForTts && prefs.handsFree && !isBotAnimating) {
        pausedForTts = false;
        setTimeout(() => startListening(), 280);
      } else if (resumeMic) {
        pausedForTts = false;
        refocusChatInputIfSafe();
      }
      resolve(true);
    };

    try {
      speechSynthesis.cancel();
      // Pause STT while bot speaks so mic doesn't hear itself!
      if (isListening && recognition) {
        pausedForTts = true;
        try { recognition.stop(); } catch {}
      }
      const utt = new SpeechSynthesisUtterance(joined);
      const v = pickSpanishVoice();
      if (v) utt.voice = v;
      utt.lang = v ? v.lang : 'es-AR';
      utt.rate = prefs.ttsRate || 1.08;
      utt.onstart = () => {
        isSpeaking = true;
        updateVoiceIndicator();
      };
      utt.onend = utt.onerror = finish;
      const estMs = Math.max(2600, Math.round((joined.length * 95) / (utt.rate || 1)) + 2000);
      safetyTimer = setTimeout(finish, estMs);
      speechSynthesis.speak(utt);
    } catch {
      finish();
    }
  });
}

function sleepMs(ms) {
  return new Promise((resolve) => setTimeout(resolve, ms));
}

const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition || null;

let isComposing = false;
let dictationTimer = null;
let dictationCountdownInterval = null;
let dictationDeadline = 0;

const INCOMPLETE_ENDINGS = new Set([
  'son', 'es', 'en', 'contra', 'sobre', 'y', 'o', 'de', 'del', 'a', 'al', 'mi', 'mis', 'tu', 'tus',
  'columna', 'col', 'fila', 'robe', 'saque', 'toco', 'juego', 'bajo', 'pongo', 'tiro', 'uso',
  'activo', 'desecho', 'descarto', 'descarte', 'chatarra', 'dano', 'hiero', 'destruyo', 'restauro',
  'muevo', 'elegi', 'campamentos', 'campamento', 'para', 'con', 'por',
]);

function looksIncompleteDictation(raw) {
  const norm = normalizeEs(raw);
  if (!norm) return true;
  const words = norm.split(' ');
  const last = words[words.length - 1];
  return INCOMPLETE_ENDINGS.has(last);
}

function cancelDictationAutoSend() {
  clearTimeout(dictationTimer);
  clearInterval(dictationCountdownInterval);
  dictationTimer = null;
  dictationCountdownInterval = null;
  dictationDeadline = 0;
  const cancelBtn = document.getElementById('btn-cancel-autosend');
  if (cancelBtn) cancelBtn.style.display = 'none';
  updateVoiceIndicator();
}

function scheduleDictationAutoSend(rawValue) {
  cancelDictationAutoSend();
  if (!prefs.dictationAutoSend || isComposing) return;
  const trimmed = String(rawValue || '').trim();
  if (trimmed.length < 2) return;
  // Don't auto-send single-character junk unless it's answering a pendingChoice number (1/2/3)
  if (trimmed.length === 1 && !state.pendingChoice) return;

  let delay = prefs.dictationDelayMs || 1600;
  if (looksIncompleteDictation(trimmed)) {
    delay = Math.max(delay + 1200, 2800);
  } else if (/[.!?]$/.test(trimmed)) {
    delay = Math.max(1000, delay - 450);
  }

  dictationDeadline = Date.now() + delay;
  const cancelBtn = document.getElementById('btn-cancel-autosend');
  if (cancelBtn) cancelBtn.style.display = 'inline-flex';

  const tick = () => {
    const rem = Math.max(0, (dictationDeadline - Date.now()) / 1000);
    const txt = document.getElementById('voice-status-text');
    const dot = document.getElementById('mic-dot');
    if (dot) dot.className = 'mic-dot listening';
    if (txt) txt.textContent = `⚡ Enviando dictado en ${rem.toFixed(1)}s... (seguí hablando o Esc)`;
  };
  tick();
  dictationCountdownInterval = setInterval(tick, 120);

  dictationTimer = setTimeout(() => {
    cancelDictationAutoSend();
    const inputEl = document.getElementById('chat-input');
    const current = inputEl?.value?.trim();
    if (current && !isComposing) {
      submitCommand(current);
    }
  }, delay);
}

function refocusChatInputIfSafe() {
  const modalRoot = document.getElementById('modal-root');
  if (modalRoot && modalRoot.innerHTML.trim()) return;
  const inputEl = document.getElementById('chat-input');
  if (inputEl && window.innerWidth > 920) {
    setTimeout(() => {
      try { inputEl.focus(); } catch {}
    }, 60);
  }
}

  if (/Mac/i.test(ua)) return 'Fn dos veces en Mac';

function initSpeechRecognition() {
  if (!SpeechRec) return null;
  const rec = new SpeechRec();
  rec.lang = 'es-AR';
  rec.interimResults = true;
  rec.maxAlternatives = 1;
  rec.continuous = false;

  rec.onstart = () => {
    isListening = true;
    updateVoiceIndicator();
  };
  rec.onresult = (event) => {
    let interim = '';
    let finalTranscript = '';
    for (let i = event.resultIndex; i < event.results.length; i++) {
      const tr = event.results[i][0].transcript;
      if (event.results[i].isFinal) finalTranscript += tr;
      else interim += tr;
    }
    const inputEl = document.getElementById('chat-input');
    if (inputEl) {
      inputEl.value = (finalTranscript || interim).trim();
      renderAutocomplete(inputEl.value);
    }
    if (finalTranscript.trim() && prefs.autoSendVoice) {
      submitCommand(finalTranscript.trim());
    }
  };
  rec.onerror = (ev) => {
    isListening = false;
    if (ev.error === 'not-allowed' || ev.error === 'service-not-allowed') {
      prefs.handsFree = false;
      savePrefs();
      updateVoiceIndicator();
      openMicHelpModal(
        'Chrome bloqueó el micrófono web en esta página. Verificá los permisos de micrófono en el candado de la barra de direcciones (o usá la app desde GitHub Pages / localhost).'
      );
    } else if (ev.error === 'audio-capture') {
      prefs.handsFree = false;
      savePrefs();
      updateVoiceIndicator();
      showToast('No se detectó micrófono disponible en el dispositivo.');
    } else if (ev.error === 'no-speech' || ev.error === 'aborted') {
      // Keep handsFree active across natural silences while playing on the table!
      updateVoiceIndicator();
    } else {
      updateVoiceIndicator();
    }
  };
  rec.onend = () => {
    isListening = false;
    updateVoiceIndicator();
    if (prefs.handsFree && !isSpeaking && !pausedForTts) {
      setTimeout(() => {
        if (prefs.handsFree && !isSpeaking && !isListening) startListening();
      }, 350);
    }
  };
  return rec;
}

function startListening() {
  if (isMicOriginBlocked()) {
    // First-class Native Dictation flow: focus input + enable auto-send right away!
    if (!prefs.dictationAutoSend) {
      prefs.dictationAutoSend = true;
      savePrefs();
      renderTopbar();
    }
    const inputEl = document.getElementById('chat-input');
    inputEl?.focus();
    updateVoiceIndicator();
    showToast(`🎙️ En Artifacts el botón web está bloqueado por sandbox. Usá ${getOsDictationHint()} (o tocá ❓ Voz).`);
    return;
  }
  if (!SpeechRec) {
    openMicHelpModal('Este navegador no incluye Web Speech API (Chrome/Edge sí). Usá el dictado nativo del sistema.');
    return;
  }
  if (!recognition) recognition = initSpeechRecognition();
  if (isSpeaking && typeof speechSynthesis !== 'undefined') {
    speechSynthesis.cancel();
    isSpeaking = false;
  }
  try {
    recognition.start();
  } catch {}
}

function stopListening() {
  pausedForTts = false;
  if (recognition && isListening) {
    try { recognition.stop(); } catch {}
  }
  isListening = false;
  updateVoiceIndicator();
}

function toggleMic() {
  if (isListening) {
    prefs.handsFree = false;
    savePrefs();
    stopListening();
  } else {
    startListening();
  }
}

function updateVoiceIndicator() {
  const dot = document.getElementById('mic-dot');
  const txt = document.getElementById('voice-status-text');
  const btn = document.getElementById('mic-btn');
  if (!dot || !txt || !btn) return;
  dot.className = 'mic-dot' + (isListening ? ' listening' : isSpeaking ? ' speaking' : '');
  btn.classList.toggle('active', isListening);
  if (isListening) {
    txt.textContent = prefs.handsFree ? 'Escuchando (manos libres)...' : 'Escuchando... hablá ahora';
  } else if (isSpeaking) {
    txt.textContent = 'Bot hablando...';
  } else if (isMicOriginBlocked()) {
    txt.textContent = prefs.dictationAutoSend
      ? `⚡ Auto-dictado ON: usá ${getOsDictationHint()} (se envía solo)`
      : `Visor sandbox: usá ${getOsDictationHint()} o tocá ❓ Voz`;
  } else if (!SpeechRec) {
    txt.textContent = 'Chat offline activo (usá dictado nativo Fn×2 o teclado 🎙️)';
  } else {
    txt.textContent = prefs.handsFree ? 'Manos libres activo' : 'Tocá el micrófono o escribí tu jugada';
  }
}

// === COMMAND EXECUTION & STEP-BY-STEP BOT PLAYBACK ===
async function runAnimatedBotTurn() {
  if (isBotAnimating) return;
  isBotAnimating = true;
  skipBotAnim = false;
  let safety = 0;

  try {
    while (
      state.phase === 'playing' &&
      state.activePlayer === 'bot' &&
      !state.pendingChoice &&
      safety < 14
    ) {
      safety++;
      const step = executeOneBotStep(state);
      activeBotHighlight = skipBotAnim ? null : step.highlight || null;
      activeBotBanner = skipBotAnim ? '' : step.highlight?.banner || '';

      if (state.phase === 'gameover') {
        recordFinishedMatch(state);
      }
      persistState();
      renderAll();

      if (!skipBotAnim) {
        if (step.sfx) playSfx(step.sfx, prefs.sfxEnabled);
        if (step.spoken && step.spoken.length > 0 && prefs.ttsEnabled) {
          await speakLines(step.spoken, { resumeMic: false });
          if (!skipBotAnim) await sleepMs(380);
        } else {
          await sleepMs(step.endedTurn ? 650 : 1150);
        }
      }

      if (step.done) break;
    }
  } finally {
    isBotAnimating = false;
    skipBotAnim = false;
    activeBotHighlight = null;
    activeBotBanner = '';
    if (state.phase === 'gameover') {
      recordFinishedMatch(state);
    }
    persistState();
    renderAll();
    if (pausedForTts && prefs.handsFree) {
      pausedForTts = false;
      setTimeout(() => startListening(), 280);
    } else {
      pausedForTts = false;
      refocusChatInputIfSafe();
    }
  }
}

async function submitCommand(text) {
  cancelDictationAutoSend();
  const trimmed = String(text || '').trim();
  if (!trimmed) return;
  if (isBotAnimating) {
    showToast('Esperá un segundo a que la bot termine su jugada (o tocá ⏩ Saltar).');
    return;
  }
  const inputEl = document.getElementById('chat-input');
  if (inputEl) {
    inputEl.value = '';
    renderAutocomplete('');
  }

  state.difficulty = prefs.difficulty;
  state.personality = prefs.personality;
  state.fastMode = Boolean(prefs.fastMode);

  const res = handleUserCommand(state, trimmed, { deferBotTurn: Boolean(prefs.stepByStepBot) });
  if (state.phase === 'gameover') {
    recordFinishedMatch(state);
  }
  persistState();
  renderAll();

  if (res.eventAlert) {
    playSfx('alert', prefs.sfxEnabled);
  } else if (res.sfx) {
    playSfx(res.sfx, prefs.sfxEnabled);
  }

  if (res.botTurnPending) {
    if (res.spoken && res.spoken.length > 0) {
      await speakLines(res.spoken, { resumeMic: false });
      await sleepMs(260);
    }
    await runAnimatedBotTurn();
    return;
  }

  if (res.spoken && res.spoken.length > 0) {
    speakLines(res.spoken);
  }
  refocusChatInputIfSafe();
}

function showToast(msg) {
  const box = document.getElementById('toast-box');
  if (!box) return;
  box.textContent = msg;
  box.classList.remove('hidden');
  clearTimeout(showToast._t);

}

function getCardHighlightClass(sideKey, type, col, slot = 0) {
  const hl = activeBotHighlight;
  if (!hl) return '';
  if (
    hl.source &&
    hl.source.side === sideKey &&
    hl.source.type === type &&
    hl.source.col === col &&
    (type === 'camp' || (hl.source.slot ?? 0) === slot)
  ) {
    return 'hl-source';
  }
  if (
    hl.target &&
    hl.target.side === sideKey &&
    hl.target.type === type &&
    hl.target.col === col &&
    (type === 'camp' || (hl.target.slot ?? 0) === slot)

  return '';

      extraClass: 'rl-size-lg',

    <div class="card-hover-zoom-meta">
      <div><strong>${esc(card.nameEs)}</strong> <span style="opacity:0.65;">(${esc(card.nameEn)})</span></div>
      <div style="color:var(--cyan);font-size:10.5px;margin-top:1px;">${esc(subParts.join(' · '))}</div>
      ${fullText ? `<div style="margin-top:3px;">${esc(fullText)}</div>` : ''}
    </div>
  `;
  el.classList.remove('hidden');
}

function bindCardHoverZoom(container) {
  if (!container) return;
  container.querySelectorAll('[data-zoom-card]').forEach((el) => {
    el.addEventListener('mouseenter', () => {
      const cid = el.getAttribute('data-zoom-card');
      showCardHoverZoom(cid, {
        damaged: el.getAttribute('data-zoom-damaged') === '1',
        destroyed: el.getAttribute('data-zoom-destroyed') === '1',
        ready: el.getAttribute('data-zoom-ready') === '1',
      });
    });
    el.addEventListener('mouseleave', hideCardHoverZoom);
  });
}

function renderTopbar() {
  const meta = document.getElementById('topbar-meta');
  if (!meta) return;
  const phaseLabel =
    state.phase === 'setup_camps'
      ? 'Setup: Campamentos'
      : state.phase === 'setup_first'
        ? 'Setup: Quién empieza'
        : state.phase === 'setup_draw'
          ? `Setup: Robá ${state.human.pendingDraws}`
          : state.phase === 'gameover'
            ? 'Partida terminada'
            : `Turno ${state.turn} · ${state.activePlayer === 'human' ? 'Tu turno' : 'Bot'}`;

  const diffLabels = { casual: 'Casual', tactical: 'Táctico', ruthless: 'Despiadado' };

  meta.innerHTML = `
    <span class="pill ${state.activePlayer === 'human' ? 'cyan' : 'magenta'}">${esc(phaseLabel)}</span>
    <span class="pill yellow" title="Mazo compartido fiel (66 cartas totales)">🃏 Mazo: ${state.deck.length} · Desc: ${state.discard.length}</span>

  if (sfxBtn) {
    sfxBtn.textContent = prefs.sfxEnabled ? '🔔 SFX' : '🔕 SFX';
  }
  const viewBtn = document.getElementById('btn-board-view');
  if (viewBtn) {
    const isSolo = prefs.boardView === 'bot_only';
    viewBtn.textContent = isSolo ? '🤖 Solo Bot' : '⚔️ Ambas';
    viewBtn.classList.toggle('btn-cyan', isSolo);
  }
  const fastBtn = document.getElementById('btn-fast-mode');
  if (fastBtn) {
    fastBtn.textContent = prefs.fastMode ? '⚡ Rápido ON' : '⚡ Rápido';
    fastBtn.classList.toggle('btn-cyan', Boolean(prefs.fastMode));
  }
  const artBtn = document.getElementById('btn-art-manager');
  if (artBtn) {
    const loadedCount = getLoadedArtCount();
    artBtn.textContent = loadedCount > 0 ? `🖼️ (${loadedCount}/${ALL_VISUAL_CARDS.length})` : '🖼️ Imágenes';
  }
  const sizeBtn = document.getElementById('btn-card-size');
  if (sizeBtn) {

    sizeBtn.classList.toggle('btn-cyan', prefs.cardSize === 'large');
  }
  const hfBtn = document.getElementById('btn-handsfree');
  if (hfBtn) {

      hfBtn.classList.toggle('btn-cyan', prefs.dictationAutoSend);

    } else {

function renderArena() {
  const pane = document.getElementById('arena-pane');
  if (!pane) return;
  const prevScroll = document.getElementById('arena-boards-scroll')?.scrollTop || 0;
  pane.setAttribute('data-card-size', prefs.cardSize === 'large' ? 'large' : 'normal');
  pane.setAttribute('data-board-view', prefs.boardView === 'bot_only' ? 'bot_only' : 'both');
  hideCardHoverZoom();

  if (state.phase === 'setup_camps') {
    pane.classList.remove('has-hand-dock');
    pane.innerHTML = renderCampSetupHTML();
    bindSetupEvents();
    bindCardHoverZoom(pane);
    return;
  }

  let boardsHtml = '';
  if (state.phase === 'gameover') {
    boardsHtml += `
      <div class="gameover-banner">
        <div>
          <div style="font-weight:800;font-size:15px;">🏆 ${esc(state.winReason)}</div>
          <div style="font-size:12px;color:var(--text-dim);">Partida guardada en tu historial local.</div>
        </div>
        <div style="display:flex;gap:6px;flex-wrap:wrap;">
          <button class="btn btn-sm btn-yellow" id="btn-gameover-stats">🏆 Historial</button>
          <button class="btn btn-primary" id="btn-rematch">Nueva partida</button>
        </div>
      </div>
    `;
  }

  if (isBotAnimating && activeBotBanner) {
    boardsHtml += `
      <div class="bot-action-banner">
        <span>🤖 ${esc(activeBotBanner)}</span>
        <button class="btn btn-sm" id="btn-skip-bot-anim" title="Terminar turno del bot al instante">⏩ Saltar</button>
      </div>
    `;
  }

  boardsHtml += renderPlayerBoardHTML('bot');
  if (prefs.boardView === 'bot_only') {
    boardsHtml += renderCompactHumanBarHTML();
  } else {
    boardsHtml += renderPlayerBoardHTML('human');
  }

  pane.classList.add('has-hand-dock');
  pane.innerHTML = `
    <div class="arena-boards-scroll" id="arena-boards-scroll">
      ${boardsHtml}
    </div>
    ${renderPrivateHandHTML()}
  `;

  const scrollEl = document.getElementById('arena-boards-scroll');
  if (scrollEl && prevScroll > 0) scrollEl.scrollTop = prevScroll;

  bindArenaEvents();
  bindCardHoverZoom(pane);
}

      return `<button class="mini-camp-pill ${stCls} ${hlCls}" data-inspect="camp" data-side="human" data-col="${col}" data-zoom-card="${c.id}" title="Tocá para ver o dañar/restaurar ${esc(def.nameEs)}">${col + 1}) ${esc(def.nameEs)} ${icon}</button>`;
    })

  return `
    <div class="human-compact-bar">
      <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;">
        <strong style="font-size:12px;color:var(--cyan);">🧑 Vos:</strong>
        <span class="pill cyan">💧 ${totalWater}${h.extraWater ? ` (+${h.extraWater})` : ''}</span>
        <span class="pill ${h.waterSiloInHand ? 'yellow' : ''}" data-silo-side="human" data-zoom-card="water_silo" style="cursor:pointer;">🛢️ Silo: ${h.waterSiloInHand ? 'mano' : 'mesa'}</span>

      <div class="compact-camps-row">

function renderCampSetupHTML() {
  const filterNorm = normalizeEs(setupFilter);
  const filtered = CAMPS.filter((c) => {
    if (!filterNorm) return true;
    return (
      normalizeEs(c.nameEs).includes(filterNorm) ||
      normalizeEs(c.nameEn).includes(filterNorm) ||
      (c.aliases || []).some((a) => normalizeEs(a).includes(filterNorm))
    );
  });

  const selNames = setupSelectedCamps.map((id) => CAMPS_BY_ID[id].nameEs);
  const totalDraw = setupSelectedCamps.reduce((s, id) => s + CAMPS_BY_ID[id].startingCards, 0);

  return `
    <div class="setup-panel">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;">
        <div>
          <div style="font-weight:800;font-size:15px;color:var(--cyan);">1. Elegí tus 3 Campamentos físicos</div>
          <div style="font-size:12px;color:var(--text-dim);">
            Robá 6 campamentos en la mesa y elegí 3. Podés tocarlos acá o cantarlos por voz/chat (ej: <em>"mis campamentos son Cañón, Hoguera y Almacén"</em>).
          </div>
        </div>
        <div style="display:flex;gap:6px;flex-wrap:wrap;">
          <button class="btn btn-sm ${setupMode === 'pick' ? 'btn-cyan' : ''}" id="setup-mode-pick">Elegir mis 3 (${setupSelectedCamps.length}/3)</button>
          <button class="btn btn-sm ${setupMode === 'exclude' ? 'btn-danger' : ''}" id="setup-mode-exclude">Descartados (${setupExcludedCamps.length})</button>
          <button class="btn btn-sm ${prefs.fastMode ? 'btn-cyan' : ''}" id="setup-fast-toggle" title="Modo Rápido: no hace falta cantar las cartas que robás">⚡ Modo Rápido: ${prefs.fastMode ? 'ON' : 'OFF'}</button>
        </div>
      </div>

      <input id="setup-search" class="search-input" type="text" placeholder="Buscar campamento en español o inglés (ej: Cañón, Hoguera, Railgun)..." value="${esc(setupFilter)}" />

      <div class="setup-grid">
        ${filtered
          .map((c) => {
            const isSel = setupSelectedCamps.includes(c.id);
            const isEx = setupExcludedCamps.includes(c.id);
            return `
              <div class="camp-pick-card ${isSel ? 'selected' : ''} ${isEx ? 'excluded' : ''}" data-camp-id="${c.id}" data-zoom-card="${c.id}">
                ${isSel ? '<div class="camp-pick-check">✓</div>' : isEx ? '<div class="camp-pick-check excl">✕</div>' : ''}
                ${renderVisualCardFaceHTML(c.id, { showFooterBadges: false, showPhotoTitleBar: true })}
              </div>
            `;
          })
          .join('')}
      </div>

      <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding-top:4px;border-top:1px solid var(--border);">
        <div style="font-size:12px;">
          ${
            setupSelectedCamps.length > 0
              ? `Elegidos: <strong style="color:var(--cyan);">${esc(selNames.join(', '))}</strong> (mano inicial: <strong>${totalDraw}</strong>)`
              : `<span style="color:var(--text-muted);">Ningún campamento seleccionado todavía.</span>`
          }
        </div>
        <div style="display:flex;gap:6px;">
          <button class="btn btn-sm" id="btn-setup-random">🎲 3 al azar</button>
          <button class="btn btn-primary" id="btn-setup-confirm" ${setupSelectedCamps.length !== 3 ? 'disabled' : ''}>Confirmar 3 Campamentos</button>
        </div>
      </div>
    </div>
  `;
}

function renderPlayerBoardHTML(sideKey) {
  const isBot = sideKey === 'bot';
  const p = state[sideKey];
  const oppKey = isBot ? 'human' : 'bot';
  const isActive = state.phase === 'playing' && state.activePlayer === sideKey;
  const totalWater = getTotalWater(p);
  const handCount = isBot ? p.hand.length : getHumanHandSize(state);

  // Order inside each column:
  // For Bot (top): Camp at top, Back behind, Front closest to center!
  // For Human (bottom): Front closest to center, Back behind, Camp at bottom!
  const colsHtml = [0, 1, 2]
    .map((col) => {
      const camp = p.camps[col];
      const back = p.columns[col][0];
      const front = p.columns[col][1];
      const campTile = renderCampTileHTML(sideKey, col, camp, oppKey);
      const backTile = renderPersonTileHTML(sideKey, col, 0, back, oppKey);
      const frontTile = renderPersonTileHTML(sideKey, col, 1, front, oppKey);
      const colHl =
        activeBotHighlight?.target?.type === 'column' &&
        activeBotHighlight.target.side === sideKey &&
        activeBotHighlight.target.col === col
          ? 'hl-col-target'
          : '';

      const ordered = isBot ? `${campTile}${backTile}${frontTile}` : `${frontTile}${backTile}${campTile}`;
      return `
        <div class="column-box ${colHl}">
          <div class="col-label">
            <span>${COL_NAMES_ES[col]}</span>
          </div>
          ${ordered}
        </div>
      `;
    })
    .join('');

  // Vertical Event Column matching real physical Radlands table orientation:
  // Bot (top): 3 -> 2 -> 1 (advances downward toward center)
  // Human (bottom): 1 -> 2 -> 3 (advances upward toward center)
  const evOrder = isBot ? [2, 1, 0] : [0, 1, 2];
  const eventQueueHtml = evOrder
    .map((idx) => {
      const evId = p.events[idx];
      const slotTag = idx === 0 ? 'Próximo' : `Casilla ${idx + 1}`;
      if (!evId) {
        return `
          <div class="event-slot">
            <div class="event-slot-head">
              <span class="event-num">${idx + 1}</span>
              <span class="event-empty">${idx === 0 ? 'Próximo' : 'Vacía'}</span>
            </div>
          </div>
        `;
      }
      const isImminent = idx === 0;
      const isEvSource =
        activeBotHighlight?.source?.side === sideKey &&
        activeBotHighlight.source.type === 'event' &&
        activeBotHighlight.source.slot === idx;
      return `
        <div class="event-slot filled ${isImminent ? 'imminent' : ''} ${isEvSource ? 'hl-source' : ''}" data-inspect-event="${evId}" data-zoom-card="${evId}" title="${esc(ALL_CARDS_BY_ID[evId]?.textEs || '')}">
          <div class="event-slot-head">
            <span class="event-num">${idx + 1}</span>
            <span class="event-slot-tag">${slotTag}</span>
          </div>
          <div class="event-card-preview">
            ${renderVisualCardFaceHTML(evId, { showFooterBadges: false })}
          </div>
        </div>
      `;
    })
    .join('');

  return `
    <div class="board-section ${isBot ? 'bot-side' : 'human-side'}">
      <div class="side-header">
        <div class="side-title">
          <span>${isBot ? '🤖 BOT (CARTAS VIRTUALES)' : '🧑 TU MESA (CARTAS FÍSICAS)'}</span>
          ${isActive ? '<span class="active-badge">TURNO ACTIVO</span>' : ''}
        </div>
        <div class="side-stats">
          <span class="pill cyan">💧 ${totalWater}${p.extraWater ? ` (+${p.extraWater} extra)` : ''}</span>
          <span class="pill" ${!isBot ? 'data-jump-hand="1" style="cursor:pointer;" title="Ir a tus cartas en mano"' : ''}>🃏 Mano: ${handCount}</span>
          <span class="pill ${p.waterSiloInHand ? 'yellow' : ''}" data-silo-side="${sideKey}" data-zoom-card="water_silo" style="cursor:${!isBot ? 'pointer' : 'default'};" title="Depósito de Agua">
            🛢️ Silo: ${p.waterSiloInHand ? 'en mano' : 'en mesa'}
          </span>
        </div>
      </div>
      <div class="board-table-grid">
        <div class="event-column">
          <div class="event-col-label">
            <span>💣 Eventos</span>
            <span>${isBot ? '↓' : '↑'}</span>
          </div>
          ${eventQueueHtml}
        </div>
        <div class="columns-grid">${colsHtml}</div>
      </div>
    </div>
  `;
}

function renderCampTileHTML(sideKey, col, camp, oppKey) {
  if (!camp) return '';
  const unprot = !camp.destroyed && !isCardProtected(state, sideKey, 'camp', col, 0, oppKey);
  const hlCls = getCardHighlightClass(sideKey, 'camp', col);
  const juggTag =
    camp.id === 'juggernaut' && !camp.destroyed
      ? `<span class="rl-chip rl-chip-unprot">Paso ${camp.juggernautStep || 0}/3</span>`
      : '';

  return `
    <div
      class="board-card-wrap ${hlCls}"
      data-inspect="camp"
      data-side="${sideKey}"
      data-col="${col}"
      data-zoom-card="${camp.id}"
      data-zoom-damaged="${camp.damaged ? '1' : '0'}"
      data-zoom-destroyed="${camp.destroyed ? '1' : '0'}"
      data-zoom-ready="${camp.ready ? '1' : '0'}"
    >
      ${renderVisualCardFaceHTML(camp.id, {
        damaged: camp.damaged,
        destroyed: camp.destroyed,
        ready: camp.ready && !camp.destroyed && !camp.damaged,
        unprotected: unprot,
        showExhausted: !camp.destroyed && !camp.damaged && !camp.ready,
        extraBadgesHtml: juggTag,
      })}
    </div>
  `;
}

function renderPersonTileHTML(sideKey, col, slot, person, oppKey) {
  const slotLabel = SLOT_NAMES_ES[slot];
  if (!person) {
    return `<div class="card-slot-empty" data-empty-slot="${sideKey}:${col}:${slot}">+ ${slotLabel}</div>`;
  }
  const unprot = !isCardProtected(state, sideKey, 'person', col, slot, oppKey);
  const isPunk = person.isPunk;
  const visualId = isPunk ? 'punk_back' : person.id;
  const slotChip = `<span class="rl-chip rl-chip-slot">${slotLabel}</span>`;
  const hlCls = getCardHighlightClass(sideKey, 'person', col, slot);

  return `
    <div
      class="board-card-wrap ${hlCls}"
      data-inspect="person"
      data-side="${sideKey}"
      data-col="${col}"
      data-slot="${slot}"
      data-zoom-card="${visualId}"
      data-zoom-damaged="${person.damaged ? '1' : '0'}"
      data-zoom-ready="${person.ready ? '1' : '0'}"
    >
      ${renderVisualCardFaceHTML(visualId, {
        damaged: person.damaged,
        ready: person.ready && !person.damaged,
        unprotected: unprot,
        showExhausted: !person.damaged && !person.ready,
        extraBadgesHtml: slotChip,
      })}
    </div>
  `;
}

function renderPrivateHandHTML() {
  const h = state.human;
  const totalHand = getHumanHandSize(state);
  const pendingBadge =
    !state.fastMode && h.pendingDraws > 0
      ? `<span class="pill yellow">⚠️ Falta cantar ${h.pendingDraws} robo(s)</span>`
      : '';
  const fastBadge = state.fastMode
    ? `<span class="pill cyan" style="font-size:10px;padding:2px 7px;">⚡ Modo Rápido (sin cantar robos)</span>`
    : `<span class="pill green" style="font-size:10px;padding:2px 7px;">🛡️ Oculta para la IA</span>`;

  const cardsHtml = handExpanded
    ? `<div class="hand-cards-grid">
        ${
          h.hiddenHand.length === 0
            ? `<div style="color:var(--text-muted);font-size:12px;grid-column:1/-1;">${
                state.fastMode
                  ? 'Modo Rápido activo: no hace falta registrar robos. Jugá o desechá cualquier carta directo por voz/chat (ej: "juego Francotirador en 2" o "desecho Musa").'
                  : 'Sin cartas registradas en mano todavía. Usá "robé [carta]" o tocá "+ Registrar robo".'
              }</div>`
            : h.hiddenHand
                .map((cid) => {
                  const c = DECK_CARDS_BY_ID[cid];
                  if (!c) return '';
                  return `
                    <div class="hand-card ${c.type === 'event' ? 'event-type' : ''}">
                      <div style="cursor:pointer;" data-inspect-card-id="${cid}" data-zoom-card="${cid}">
                        ${renderVisualCardFaceHTML(cid, { showFooterBadges: false, showPhotoTitleBar: false })}
                      </div>
                      <div class="hand-card-actions">
                        <button class="btn btn-sm btn-cyan" data-hand-play="${cid}">Jugar</button>
                        <button class="btn btn-sm btn-yellow" data-hand-junk="${cid}">Chatarra</button>
                        <button class="btn btn-sm" style="flex:0 0 auto;padding:4px 8px;color:var(--text-dim);" data-hand-discard="${cid}" title="Descartar sin chatarra">&times;</button>
                      </div>
                    </div>
                  `;
                })
                .join('')
        }
      </div>`
    : '';

  return `
    <div class="hand-drawer is-docked ${handExpanded ? 'expanded' : 'collapsed'}" id="private-hand-drawer">
      <div class="hand-header" id="toggle-hand-drawer">
        <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
          <strong>🔒 Tu mano (${totalHand})</strong>
          ${fastBadge}
          ${pendingBadge}
        </div>
        <div style="display:flex;align-items:center;gap:6px;">
          <button class="btn btn-sm btn-yellow" id="btn-open-draw-modal">+ Registrar robo</button>
          <span style="font-size:12px;font-weight:700;color:var(--cyan);">${handExpanded ? '▾ Ocultar' : '▴ Ver cartas'}</span>
        </div>
      </div>
      ${cardsHtml}
    </div>
  `;
}

function renderChat() {
  const feed = document.getElementById('chat-feed');
  if (!feed) return;
  feed.innerHTML = state.log
    .map((entry) => {
      const who = entry.actor === 'bot' ? '🤖 Bot' : entry.actor === 'human' ? '🧑 Vos' : '⚙️ Sistema';
      const isRevealed = revealedLogs.has(entry.id);
      const body =
        entry.masked && entry.secretText && isRevealed
          ? `${entry.text}\n👁️ ${entry.secretText}`
          : entry.text;
      const eyeBtn =
        entry.masked && entry.secretText
          ? `<button class="secret-reveal-btn" data-reveal-log="${entry.id}">${isRevealed ? 'Ocultar' : '👁️ Ver'}</button>`
          : '';
      return `
        <div class="msg ${entry.actor}">
          <div class="msg-meta"><span>${who}</span>${eyeBtn}</div>
          <div>${esc(body)}</div>
        </div>
      `;
    })
    .join('');
  feed.scrollTop = feed.scrollHeight;

  feed.querySelectorAll('[data-reveal-log]').forEach((btn) => {
    btn.addEventListener('click', () => {
      const id = btn.getAttribute('data-reveal-log');
      if (revealedLogs.has(id)) revealedLogs.delete(id);
      else revealedLogs.add(id);
      renderChat();
    });
  });
}

function renderPendingBanner() {

  if (!container) return;

  if (!pc) {
    container.innerHTML = '';
    return;
  }

    <div class="pending-banner">
      <div style="font-weight:700;font-size:12px;color:#fff;">⚡ Decisión pendiente (${esc(pc.sourceName)}):</div>
      <div style="font-size:12px;color:var(--text);">${esc(pc.promptEs)}</div>
      <div class="pending-options">
        ${pc.options
          .map((opt, i) => {
            const cmd =
              pc.kind === 'mercenary_choice' && opt.mode === 'discard'
                ? 'descarto 2'
                : pc.kind === 'raiders_camp' || pc.kind === 'juggernaut_camp' || pc.kind === 'napalm_col'
                  ? String(opt.value + 1)
                  : String(i + 1);
            return `<button class="btn btn-sm btn-cyan" data-choice-cmd="${esc(cmd)}">${esc(opt.labelEs)}</button>`;
          })
          .join('')}
      </div>
    </div>
  `;
  container.querySelectorAll('[data-choice-cmd]').forEach((b) => {
    b.addEventListener('click', () => submitCommand(b.getAttribute('data-choice-cmd')));
  });
}

function jumpToHumanHand() {
  handExpanded = true;
  if (window.innerWidth <= 920) {
    mobileTab = 'arena';
    document.querySelectorAll('[data-mtab]').forEach((x) => x.classList.toggle('active', x.getAttribute('data-mtab') === 'arena'));

  }
  renderArena();
  setTimeout(() => {
    document.getElementById('private-hand-drawer')?.scrollIntoView({ behavior: 'smooth', block: 'nearest' });

}

function renderQuickChips() {
  const row = document.getElementById('quick-chips');
  if (!row) return;
  const chips = [];

  if (state.phase === 'setup_first') {
    chips.push({ label: '🧑 Empiezo yo', cmd: 'empiezo yo', cls: 'cyan' });
    chips.push({ label: '🤖 Empieza el bot', cmd: 'empieza el bot', cls: 'accent' });
    chips.push({ label: '🎲 Sorteo quién empieza', cmd: 'sorteo', cls: 'yellow full-row' });
  } else if (state.phase === 'setup_draw') {
    chips.push({ label: `🃏 Registrar cartas robadas (${state.human.pendingDraws})`, action: 'open_draw', cls: 'yellow full-row' });
  } else if (state.phase === 'playing') {
    if (!state.fastMode && state.human.pendingDraws > 0) {
      chips.push({ label: `🃏 Registrar robo (${state.human.pendingDraws})`, action: 'open_draw', cls: 'yellow full-row' });
    }
    if (state.activePlayer === 'human' && !state.pendingChoice) {
      chips.push({ label: '⏭️ Pasar turno (Fin de turno)', cmd: 'paso', cls: 'accent full-row' });
      chips.push({
        label: state.human.waterSiloInHand ? '💧 Usar Depósito (+1💧)' : '🛢️ Tomar Depósito (1💧)',
        cmd: state.human.waterSiloInHand ? 'uso depósito' : 'tomo depósito',
        cls: 'cyan',
      });
      chips.push({ label: '🃏 Robar carta (2💧)', cmd: 'robo por 2', cls: 'cyan' });
      chips.push({ label: '💀 Asaltar', cmd: 'asaltar', cls: 'yellow' });
      chips.push({ label: `🔒 Mi mano (${getHumanHandSize(state)})`, action: 'jump_hand', cls: '' });
    }
    chips.push({ label: '📊 Estado', cmd: 'estado', cls: 'subtle' });
    chips.push({ label: '↩️ Deshacer', cmd: 'deshacer', cls: 'subtle' });
    chips.push({ label: '❓ Ayuda', cmd: 'ayuda', cls: 'subtle full-row' });
  }

  row.innerHTML = chips
    .map(
      (c, i) =>
        `<button class="chip ${c.cls}" data-chip-idx="${i}">${esc(c.label)}</button>`
    )
    .join('');

  row.querySelectorAll('[data-chip-idx]').forEach((b) => {
    b.addEventListener('click', () => {
      const ch = chips[parseInt(b.getAttribute('data-chip-idx'), 10)];
      if (ch.action === 'open_draw') openDrawModal();
      else if (ch.action === 'jump_hand') jumpToHumanHand();
      else if (ch.cmd) submitCommand(ch.cmd);
    });
  });
}

function renderAutocomplete(val) {
  const box = document.getElementById('autocomplete-box');
  if (!box) return;
  const suggestions = getAutocompleteSuggestions(val, state);
  if (suggestions.length === 0) {
    box.classList.add('hidden');
    box.innerHTML = '';
    return;
  }
  box.classList.remove('hidden');
  box.innerHTML = suggestions
    .map(
      (c) =>
        `<button class="chip" data-ac-name="${esc(c.nameEs)}">${esc(c.nameEs)} <span style="opacity:0.6;font-weight:400;">(${esc(c.nameEn)})</span></button>`
    )
    .join('');
  box.querySelectorAll('[data-ac-name]').forEach((b) => {
    b.addEventListener('click', () => {
      const inputEl = document.getElementById('chat-input');
      const parts = inputEl.value.trim().split(/\s+/);
      parts[parts.length - 1] = b.getAttribute('data-ac-name');
      inputEl.value = parts.join(' ') + ' ';
      inputEl.focus();
      renderAutocomplete('');
    });
  });
}

function bindSetupEvents() {
  const searchEl = document.getElementById('setup-search');
  if (searchEl) {
    searchEl.addEventListener('input', (e) => {
      setupFilter = e.target.value;
      renderArena();
      const el = document.getElementById('setup-search');
      if (el) {
        el.focus();
        el.setSelectionRange(el.value.length, el.value.length);
      }
    });
  }
  document.getElementById('setup-mode-pick')?.addEventListener('click', () => {
    setupMode = 'pick';
    renderArena();
  });
  document.getElementById('setup-mode-exclude')?.addEventListener('click', () => {
    setupMode = 'exclude';
    renderArena();
  });
  document.getElementById('setup-fast-toggle')?.addEventListener('click', () => {
    toggleFastModePreference();
  });
  document.querySelectorAll('[data-camp-id]').forEach((el) => {
    el.addEventListener('click', () => {
      const id = el.getAttribute('data-camp-id');
      if (setupMode === 'pick') {
        setupExcludedCamps = setupExcludedCamps.filter((x) => x !== id);
        if (setupSelectedCamps.includes(id)) {
          setupSelectedCamps = setupSelectedCamps.filter((x) => x !== id);
        } else if (setupSelectedCamps.length < 3) {
          setupSelectedCamps.push(id);
        } else {
          showToast('Ya elegiste 3 campamentos. Desmarcá uno para cambiarlo.');
        }
      } else {
        setupSelectedCamps = setupSelectedCamps.filter((x) => x !== id);
        if (setupExcludedCamps.includes(id)) {
          setupExcludedCamps = setupExcludedCamps.filter((x) => x !== id);
        } else {
          setupExcludedCamps.push(id);
        }
      }
      renderArena();
    });
  });
  document.getElementById('btn-setup-random')?.addEventListener('click', () => {
    const shuffled = [...CAMPS].sort(() => Math.random() - 0.5);
    setupSelectedCamps = shuffled.slice(0, 3).map((c) => c.id);
    setupExcludedCamps = [];
    renderArena();
  });
  document.getElementById('btn-setup-confirm')?.addEventListener('click', () => {
    if (setupSelectedCamps.length !== 3) return;
    const names = setupSelectedCamps.map((id) => CAMPS_BY_ID[id].nameEs).join(', ');
    const excl =
      setupExcludedCamps.length > 0
        ? ` y descarté ${setupExcludedCamps.map((id) => CAMPS_BY_ID[id].nameEs).join(', ')}`
        : '';
    setupSelectedCamps = [];
    setupExcludedCamps = [];
    submitCommand(`mis campamentos son ${names}${excl}`);
  });
}

function stopGuidedCamera() {
  if (activeCameraStream) {
    try {
      activeCameraStream.getTracks().forEach((t) => t.stop());
    } catch {}
    activeCameraStream = null;
  }
  const existing = document.getElementById('guided-camera-overlay');
  if (existing) existing.remove();
}

function closeModal() {
  stopGuidedCamera();
  activePasteCardId = null;
  onPasteArtApplied = null;
  const root = document.getElementById('modal-root');
  if (root) root.innerHTML = '';
}

function openGuidedCameraModal(startCardId, queueIds = null, onDone = null) {
  stopGuidedCamera();
  const queue =
    Array.isArray(queueIds) && queueIds.length > 0
      ? queueIds.filter((id) => VISUAL_CARDS_BY_ID[id])
      : [startCardId].filter((id) => VISUAL_CARDS_BY_ID[id]);
  if (queue.length === 0) {
    showToast('No hay cartas pendientes para escanear en este filtro.');
    return;
  }

  if (!navigator.mediaDevices || typeof navigator.mediaDevices.getUserMedia !== 'function') {
    showToast('Tu navegador no habilita cámara en vivo acá. Usá el botón 📷 para elegir foto.');
    return;
  }

  let idx = Math.max(0, queue.indexOf(startCardId));
  let facingMode = 'environment';
  let capturedCount = 0;

  const overlay = document.createElement('div');
  overlay.id = 'guided-camera-overlay';
  overlay.className = 'cam-overlay';
  overlay.innerHTML = `
    <div class="cam-topbar">
      <div>
        <strong id="cam-card-title" style="color:var(--cyan);font-size:14px;"></strong>
        <div id="cam-card-sub" style="font-size:11px;color:var(--text-dim);"></div>
      </div>
      <div style="display:flex;gap:6px;">
        <button class="btn btn-sm" id="cam-flip-btn" title="Cambiar cámara trasera / frontal">🔄 Cámara</button>
        <button class="btn btn-sm btn-danger" id="cam-close-btn">✕ Cerrar</button>
      </div>
    </div>
    <div class="cam-stage">
      <video id="cam-video-el" class="cam-video" autoplay playsinline muted></video>
      <div id="cam-guide-frame" class="cam-guide-frame">
        <span class="cam-guide-hint">Encuadrá la carta física (63:88)</span>
      </div>
      <div id="cam-flash" class="cam-flash"></div>
    </div>
    <div class="cam-controls">
      <button class="btn btn-sm" id="cam-skip-btn" ${queue.length <= 1 ? 'style="visibility:hidden;"' : ''}>⏭️ Saltar</button>
      <button class="cam-shutter-btn" id="cam-shutter-btn" title="Capturar carta">📸</button>
      <button class="btn btn-sm" id="cam-file-btn" title="Elegir imagen desde archivos">📁 Archivo</button>
      <input type="file" id="cam-fallback-file" accept="image/*" class="hidden" />
    </div>
  `;
  document.body.appendChild(overlay);

  const videoEl = document.getElementById('cam-video-el');
  const guideEl = document.getElementById('cam-guide-frame');
  const flashEl = document.getElementById('cam-flash');

  const updateHeader = () => {
    const cid = queue[idx];
    const c = VISUAL_CARDS_BY_ID[cid];
    const tEl = document.getElementById('cam-card-title');
    const sEl = document.getElementById('cam-card-sub');
    if (tEl && c) {
      tEl.textContent = `📸 ${c.nameEs} (${idx + 1}/${queue.length})`;
    }
    if (sEl && c) {
      sEl.textContent = `${c.nameEn}${capturedCount > 0 ? ` · ${capturedCount} capturada(s)` : ''}`;
    }
  };

  const finishAndClose = () => {
    stopGuidedCamera();
    renderAll();
    if (typeof onDone === 'function') onDone(capturedCount);
  };

  const startStream = async () => {
    if (activeCameraStream) {
      activeCameraStream.getTracks().forEach((t) => t.stop());
      activeCameraStream = null;
    }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({
        video: {
          facingMode: { ideal: facingMode },
          width: { ideal: 1280 },
          height: { ideal: 1920 },
        },
        audio: false,
      });
      activeCameraStream = stream;
      if (videoEl) {
        videoEl.srcObject = stream;
        try { await videoEl.play(); } catch {}
      }
    } catch {
      stopGuidedCamera();
      showToast('No se pudo abrir la cámara (revisá permisos o abrí la app en GitHub Pages).');
    }
  };

  const advanceOrFinish = () => {
    if (idx + 1 < queue.length) {
      idx += 1;
      updateHeader();
    } else {
      showToast(`¡Escaneo completo! ${capturedCount} carta(s) guardada(s).`);
      finishAndClose();
    }
  };

  document.getElementById('cam-close-btn')?.addEventListener('click', finishAndClose);
  document.getElementById('cam-flip-btn')?.addEventListener('click', () => {
    facingMode = facingMode === 'environment' ? 'user' : 'environment';
    startStream();
  });
  document.getElementById('cam-skip-btn')?.addEventListener('click', advanceOrFinish);

  document.getElementById('cam-shutter-btn')?.addEventListener('click', async () => {
    const cid = queue[idx];
    try {
      if (flashEl) {
        flashEl.classList.add('active');
        setTimeout(() => flashEl.classList.remove('active'), 180);
      }
      await captureFramedVideoCard(cid, videoEl, guideEl);
      capturedCount += 1;
      playSfx('play', prefs.sfxEnabled);
      showToast(`✅ ${VISUAL_CARDS_BY_ID[cid]?.nameEs || cid} guardada.`);
      renderAll();
      advanceOrFinish();
    } catch (err) {
      showToast(err?.message || 'Esperá un segundo a que enfoque la cámara.');
    }
  });

  const fbFile = document.getElementById('cam-fallback-file');
  document.getElementById('cam-file-btn')?.addEventListener('click', () => fbFile?.click());
  fbFile?.addEventListener('change', async (e) => {
    const f = e.target.files?.[0];
    if (!f) return;
    const cid = queue[idx];
    try {
      await saveCardArtFromBlob(cid, f);
      capturedCount += 1;
      renderAll();
      showToast(`✅ ${VISUAL_CARDS_BY_ID[cid]?.nameEs || cid} guardada.`);
      advanceOrFinish();
    } catch {
      showToast('No se pudo leer esa imagen.');
    }
    e.target.value = '';
  });

  updateHeader();
  startStream();
}

async function tryPasteImageFromClipboardForCard(cardId, onSaved) {
  activePasteCardId = cardId;
  onPasteArtApplied = onSaved;
  if (navigator.clipboard && typeof navigator.clipboard.read === 'function') {
    try {
      const items = await navigator.clipboard.read();
      for (const item of items) {
        const imgType = item.types.find((t) => t.startsWith('image/'));
        if (imgType) {
          const blob = await item.getType(imgType);
          await saveCardArtFromBlob(cardId, blob);
          renderAll();
          showToast(`Imagen guardada para ${VISUAL_CARDS_BY_ID[cardId]?.nameEs || cardId}.`);
          if (typeof onSaved === 'function') onSaved();
          return;
        }
      }
      showToast('No hay ninguna imagen copiada en el portapapeles. Copiá una y apretá Ctrl+V.');
      return;
    } catch {
      // Clipboard API permission denied or unsupported — fall back to Ctrl+V listener
    }
  }
  showToast(`Listo: apretá Ctrl+V ahora para pegar la imagen en ${VISUAL_CARDS_BY_ID[cardId]?.nameEs || cardId}.`);
}

function openStandaloneCardModal(cardId) {
  const def = VISUAL_CARDS_BY_ID[cardId];
  if (!def) return;
  const subParts = [];
  if (def.visualCategory === 'camp') subParts.push(`Campamento · +${def.startingCards} cartas iniciales`);
  else if (def.visualCategory === 'person') subParts.push(`Persona · Costo ${def.cost}💧${def.unique ? ' · Única ★' : ''}`);
  else if (def.visualCategory === 'event') subParts.push(`Evento · Costo ${def.cost}💧 · Bomba ${def.bomb}`);
  else subParts.push('Carta especial');
  if (def.junk && JUNK_INFO[def.junk]) {
    subParts.push(`Chatarra: ${JUNK_INFO[def.junk].icon} ${JUNK_INFO[def.junk].labelEs}`);
  }
  const text =
    def.visualCategory === 'event' || def.visualCategory === 'special'
      ? def.textEs || ''
      : [def.traitTextEs, ...(def.abilities || []).map((a) => a.textEs)].filter(Boolean).join('\n');

  openGenericModal(
    `${def.nameEs} (${def.nameEn})`,
    `
      <div class="inspector-layout">
        ${renderInspectorArtColumnHTML(cardId)}
        <div class="inspector-info-col">

  );
