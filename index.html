      if (!pr.ok) return pr;
      const phys = playerKey === 'human' ? ' (poné una carta bocabajo)' : '';
      return { ok: true, message: `gana 1 Punki en ${COL_NAMES_ES[pr.col]}${phys}.` };
    }
    case 'raid': {
      return triggerRaid(state, playerKey, opts.botChoiceFn, rng);
    }
    case 'restore': {
      const legal = getRestorableCards(state, playerKey);
      const t = opts.target || legal[0];
      if (!t) return { ok: false, error: 'No hay cartas dañadas para restaurar.' };
      const rr = restoreTarget(state, t);
      if (!rr.ok) return rr;
      return { ok: true, message: `restaura ${rr.labelEs}.` };
    }
    case 'injure':
    case 'damage': {
      const targetKind = junkType === 'injure' ? 'unprotected_enemy_person' : 'unprotected_enemy';
      const legal = getLegalTargets(state, playerKey, targetKind);
      const t = opts.target || legal[0];
      if (!t) return { ok: false, error: 'No hay objetivo rival válido.' };
      const dr = applyDamageToTarget(state, t);
      if (!dr.ok) return dr;
      return {
        ok: true,
        message: `${dr.destroyed ? 'destruye' : 'daña'} a ${dr.labelEs} (${COL_SHORT_ES[t.col]}).`,
      };
    }
    default:
      return { ok: false, error: `Efecto chatarra desconocido: ${junkType}` };
  }
}

// === ABILITY ACTIVATION (PEOPLE & CAMPS) ===
function getAvailableAbilitiesForCard(state, playerKey, sourceType, col, slot = 0) {
  const p = state[playerKey];
  if (sourceType === 'camp') {
    const camp = p.camps[col];
    if (!camp || camp.destroyed || !camp.ready) return [];
    return CAMPS_BY_ID[camp.id]?.abilities || [];
  }
  const person = p.columns[col][slot];
  if (!person || person.damaged || !person.ready) return [];
  const base = person.isPunk ? [] : [...(DECK_CARDS_BY_ID[person.id]?.abilities || [])];
  // Argo Yesky grants 1-water Damage to all your people (including Punks!)
  if (hasActiveTrait(state, playerKey, 'grant_damage_to_all_people') && person.id !== 'argo_yesky') {
    base.push({
      id: 'argo_granted_damage',
      cost: 1,
      kind: 'damage',
      needsTarget: 'unprotected_enemy',
      textEs: '1💧 (por Argo Yesky): Dañá 1 carta rival desprotegida.',
    });
  }
  return base;
}

function activateAbility(state, playerKey, source, abilityId = null, opts = {}) {
  const rng = opts.rng || Math.random;
  const botChoiceFn = opts.botChoiceFn || null;
  const p = state[playerKey];
  const oppKey = otherPlayer(playerKey);

  // Locate source card
  let cardObj = null;
  let cardName = '';
  let abilities = [];
  if (source.type === 'camp') {
    cardObj = p.camps[source.col];
    if (!cardObj || cardObj.destroyed) return { ok: false, error: 'Ese campamento está destruido.' };
    if (!cardObj.ready && !opts.ignoreReady) return { ok: false, error: `${getCardNameEs(cardObj.id)} ya se usó este turno.` };
    cardName = getCardNameEs(cardObj.id);
    abilities = CAMPS_BY_ID[cardObj.id]?.abilities || [];
  } else {
    cardObj = p.columns[source.col][source.slot];
    if (!cardObj) return { ok: false, error: 'No hay persona en esa casilla.' };
    if (cardObj.damaged && !opts.allowDamaged) return { ok: false, error: 'Una persona dañada no puede usar habilidades.' };
    if (!cardObj.ready && !opts.ignoreReady) return { ok: false, error: `${cardObj.isPunk ? 'Ese Punki' : getCardNameEs(cardObj.id)} no está Lista todavía.` };
    cardName = cardObj.isPunk ? 'Punki' : getCardNameEs(cardObj.id);
    abilities = opts.allowDamaged
      ? DECK_CARDS_BY_ID[cardObj.id]?.abilities || []
      : getAvailableAbilitiesForCard(state, playerKey, 'person', source.col, source.slot);
  }

  if (abilities.length === 0) return { ok: false, error: `${cardName} no tiene habilidades activables.` };
  const ability = abilityId ? abilities.find((a) => a.id === abilityId) || abilities[0] : abilities[0];

  const cost = getAbilityCost(state, playerKey, ability);
  if (getTotalWater(p) < cost) {
    return { ok: false, error: `Necesitás ${cost}💧 para usar ${cardName} (tenés ${getTotalWater(p)}💧).` };
  }

  // Condition checks before spending water
  if (ability.kind === 'arcade' && countPeople(state, playerKey) > 1) {
    return { ok: false, error: 'Salón Recreativo solo puede usarse si tenés 0 o 1 personas.' };
  }
  if (ability.kind === 'nest_of_spies' && p.flags.peoplePlayedThisTurn < 2) {
    return { ok: false, error: 'Nido de Espías requiere haber puesto 2 o más personas en juego este turno.' };
  }
  if (ability.kind === 'transplant_lab' && p.flags.peoplePlayedThisTurn < 2) {
    return { ok: false, error: 'Laboratorio de Trasplantes requiere haber puesto 2 o más personas este turno.' };
  }
  if (ability.kind === 'watchtower' && !p.flags.anyEventResolvedThisTurn) {
    return { ok: false, error: 'Torre de Vigilancia requiere que se haya resuelto un evento este turno.' };
  }
  if (ability.kind === 'doomsayer_damage' && !state[oppKey].events.some((e) => e !== null)) {
    return { ok: false, error: 'Agorero requiere que el rival tenga al menos un evento en cola.' };
  }
  if (ability.kind === 'rabble_damage' && countPunks(state, playerKey) === 0) {
    return { ok: false, error: 'Agitador necesita al menos 1 Punki para dañar.' };
  }
  if (ability.kind === 'construction_yard') {
    if (cardObj.damaged) return { ok: false, error: 'Obra en Construcción no puede estar dañada.' };
    const destroyedCamps = p.camps.map((c, idx) => ({ c, idx })).filter((x) => x.c.destroyed);
    if (destroyedCamps.length === 0) return { ok: false, error: 'No tenés campamentos destruidos para reconstruir.' };
  }
  if (ability.needsOwnPerson && countPeople(state, playerKey) === 0) {
    return { ok: false, error: `${cardName} requiere destruir o elegir una de tus personas.` };
  }
  if (ability.needsTarget) {
    const legal = getLegalTargets(state, playerKey, ability.needsTarget);
    if (legal.length === 0) return { ok: false, error: `No hay objetivos legales para ${cardName}.` };
  }
  if (ability.kind === 'restore' || ability.kind === 'mutant_restore' || ability.kind === 'labor_camp' || ability.kind === 'transplant_lab') {
    if (getRestorableCards(state, playerKey).length === 0) {
      return { ok: false, error: 'No tenés ninguna carta dañada para restaurar.' };
    }
  }
  if (ability.kind === 'atomic_garden') {
    if (getRestorableCards(state, playerKey, true).length === 0) {
      return { ok: false, error: 'No tenés ninguna persona dañada para Jardín Atómico.' };
    }
  }

  // Spend water & apply Vera Vosh ready check
  spendWater(p, cost);
  const veraKeepReady =
    !opts.skipVera &&
    p.flags.abilitiesUsedThisTurn === 0 &&
    hasActiveTrait(state, playerKey, 'first_ability_stays_ready');
  p.flags.abilitiesUsedThisTurn += 1;
  if (!veraKeepReady && !opts.ignoreReady) {
    cardObj.ready = false;
  }

  const verb = playerKey === 'bot' ? 'Uso' : 'Usaste';
  const veraNote = veraKeepReady ? ' (sigue Lista por Vera Vosh!)' : '';

  // Self-damage camps check immediate loss!
  const applySelfCampDamage = () => {
    const selfRes = applyDamageToTarget(state, { type: 'camp', owner: playerKey, col: source.col });
    return selfRes;
  };

  // Resolve ability effect
  switch (ability.kind) {
    case 'damage':
    case 'damage_any':
    case 'damage_unprotected_camp':
    case 'injure':
    case 'nest_of_spies':
    case 'watchtower':
    case 'doomsayer_damage':
    case 'rabble_damage': {
      const legal = getLegalTargets(state, playerKey, ability.needsTarget);
      const t = opts.target || legal[0];
      const dr = applyDamageToTarget(state, t);
      return {
        ok: true,
        message: `${verb} ${cardName} (${cost}💧)${veraNote} → ${dr.destroyed ? 'destruye' : 'daña'} a ${dr.labelEs} (${COL_SHORT_ES[t.col]}).`,
      };
    }

    case 'looter_damage': {
      const legal = getLegalTargets(state, playerKey, 'unprotected_enemy');
      const t = opts.target || legal[0];
      const dr = applyDamageToTarget(state, t);
      let drawMsg = '';
      if (dr.hitCamp && !checkGameOver(state)) {
        if (playerKey === 'bot') {
          drawBotCard(state, rng);
          drawMsg = ' ¡Golpeó campamento → roba 1 carta!';
        } else {
          state.human.pendingDraws += 1;
          drawMsg = ' ¡Golpeó campamento → robás 1 carta física (cantamela)!';
        }
      }
      return {
        ok: true,
        message: `${verb} ${cardName} (${cost}💧)${veraNote} → ${dr.destroyed ? 'destruye' : 'daña'} a ${dr.labelEs}.${drawMsg}`,
      };
    }

    case 'cannon': {
      const selfRes = applySelfCampDamage();
      if (checkGameOver(state)) {
        return { ok: true, message: `${verb} Cañón (${cost}💧): al dañarse destruyó el último campamento propio.` };
      }
      const legal = getLegalTargets(state, playerKey, 'unprotected_enemy');
      const t = opts.target || legal[0];
      const dr = applyDamageToTarget(state, t);
      return {
        ok: true,
        message: `${verb} Cañón (${cost}💧)${veraNote} (se ${selfRes.destroyed ? 'destruye' : 'daña'}) → ${dr.destroyed ? 'destruye' : 'daña'} a ${dr.labelEs} (${COL_SHORT_ES[t.col]}).`,
      };
    }

    case 'destroy_unprotected_person':
    case 'destroy_any_camp':
    case 'resonator': {
      const legal = getLegalTargets(state, playerKey, ability.needsTarget);
      const t = opts.target || legal[0];
      const dr = destroyTarget(state, t);
      return {
        ok: true,
        message: `${verb} ${cardName} (${cost}💧)${veraNote} → destruye a ${dr.labelEs} (${COL_SHORT_ES[t.col]}).`,
      };
    }

    case 'damage_column': {
      const legal = getLegalTargets(state, playerKey, 'enemy_column');
      const colChoice = opts.targetCol !== undefined ? opts.targetCol : legal[0].col;
      const opp = state[oppKey];
      const hits = [];
      for (let slot = 1; slot >= 0; slot--) {
        if (opp.columns[colChoice][slot]) {
          const dr = applyDamageToTarget(state, { type: 'person', owner: oppKey, col: colChoice, slot });
          hits.push(`${dr.labelEs} (${dr.destroyed ? 'destruido' : 'dañado'})`);
        }
      }
      if (!opp.camps[colChoice].destroyed) {
        const dr = applyDamageToTarget(state, { type: 'camp', owner: oppKey, col: colChoice });
        hits.push(`${dr.labelEs} (${dr.destroyed ? 'destruido' : 'dañado'})`);
      }
      return {
        ok: true,
        message: `${verb} Magnus Karv (${cost}💧)${veraNote} en ${COL_NAMES_ES[colChoice]} → ${hits.join(', ')}.`,
      };
    }

    case 'destroy_all_damaged_enemies': {
      const opp = state[oppKey];
      const hits = [];
      for (let col = 0; col < 3; col++) {
        for (let slot = 0; slot < 2; slot++) {
          const per = opp.columns[col][slot];
          if (per && per.damaged) {
            hits.push(getCardNameEs(per.id));
            destroyPersonAt(state, oppKey, col, slot);
          }
        }
      }
      return {
        ok: true,
        message: `${verb} Exterminador (${cost}💧)${veraNote} → ${hits.length ? `destruye a ${hits.join(', ')}` : 'no había enemigos dañados'}.`,
      };
    }

    case 'injure_all_unprotected': {
      const legal = getLegalTargets(state, playerKey, 'unprotected_enemy_person');
      const hits = [];
      for (const t of legal) {
        const dr = applyDamageToTarget(state, t);
        hits.push(`${dr.labelEs} (${dr.destroyed ? 'destruido' : 'dañado'})`);
      }
      return {
        ok: true,
        message: `${verb} Artillero (${cost}💧)${veraNote} → ${hits.length ? hits.join(', ') : 'sin objetivos'}.`,
      };
    }

    case 'vanguard_damage': {
      const legal = getLegalTargets(state, playerKey, 'unprotected_enemy');
      const t = opts.target || legal[0];
      const dr = applyDamageToTarget(state, t);
      if (checkGameOver(state)) {
        return {
          ok: true,
          message: `${verb} Vanguardia (${cost}💧) → destruye el último campamento rival (${dr.labelEs}) y gana la partida antes del contraataque.`,
        };
      }
      // Opponent counter-damages one of attacker's unprotected cards!
      const counterTargets = getLegalTargets(state, oppKey, 'unprotected_enemy');
      if (counterTargets.length === 0) {
        return { ok: true, message: `${verb} Vanguardia (${cost}💧) → daña a ${dr.labelEs}.` };
      }
      if (oppKey === 'bot') {
        const botPick = botChoiceFn
          ? botChoiceFn(getBotObservation(state), 'vanguard_counter', counterTargets)
          : counterTargets[0];
        const cr = applyDamageToTarget(state, botPick);
        return {
          ok: true,
          message: `${verb} Vanguardia (${cost}💧)${veraNote} → ${dr.destroyed ? 'destruye' : 'daña'} a ${dr.labelEs}. El bot contraataca y ${cr.destroyed ? 'destruye' : 'daña'} a tu ${cr.labelEs}.`,
        };
      }
      // Human gets to counter-damage Bot!
      state.pendingChoice = {
        forPlayer: 'human',
        kind: 'vanguard_counter',
        sourcePlayer: 'bot',
        sourceName: 'Vanguardia (contraataque)',
        promptEs: `Usé Vanguardia y dañé a tu ${dr.labelEs}. Ahora te toca contraatacar: elegí una carta mía desprotegida para dañar: ${counterTargets
          .map((ct, i) => `${i + 1}) ${ct.labelEs}`)
          .join(', ')}.`,
        options: counterTargets.map((ct, i) => ({ value: i, target: ct, labelEs: ct.labelEs })),
        resumeBotTurn: state.activePlayer === 'bot',
      };
      return { ok: true, needsChoice: true, message: state.pendingChoice.promptEs };
    }

    case 'gain_water': {
      p.extraWater += 1;
      return { ok: true, message: `${verb} ${cardName} (${cost}💧)${veraNote} → +1💧 extra.` };
    }

    case 'gain_punk':
    case 'arcade': {
      const pr = gainPunk(state, playerKey, opts.col, opts.slot, rng);
      if (!pr.ok) return pr;
      const phys = playerKey === 'human' ? ' (poné una carta bocabajo)' : '';
      return { ok: true, message: `${verb} ${cardName} (${cost}💧)${veraNote} → gana 1 Punki en ${COL_NAMES_ES[pr.col]}${phys}.` };
    }

    case 'raid': {
      const rr = triggerRaid(state, playerKey, botChoiceFn, rng);
      return {
        ok: rr.ok,
        needsChoice: !!rr.needsChoice,
        message: `${verb} ${cardName} (${cost}💧)${veraNote} → ${rr.message}`,
        error: rr.error,
      };
    }

    case 'restore':
    case 'transplant_lab': {
      const legal = getRestorableCards(state, playerKey);
      const t = opts.restoreTarget || legal[0];
      const rr = restoreTarget(state, t, false);
      return { ok: rr.ok, message: `${verb} ${cardName} (${cost}💧)${veraNote} → restaura ${rr.labelEs}.`, error: rr.error };
    }

    case 'atomic_garden': {
      const legal = getRestorableCards(state, playerKey, true);
      const t = opts.restoreTarget || legal[0];
      const rr = restoreTarget(state, t, true);
      return { ok: rr.ok, message: `${verb} Jardín Atómico (${cost}💧)${veraNote} → restaura a ${rr.labelEs} y queda Lista.`, error: rr.error };
    }

    case 'bonfire': {
      const selfRes = applySelfCampDamage();
      if (checkGameOver(state)) {
        return { ok: true, message: `${verb} Hoguera: al dañarse destruyó el último campamento propio.` };
      }
      const restorables = getRestorableCards(state, playerKey);
      const restored = [];
      for (const r of restorables) {
        const rr = restoreTarget(state, r, false);
        if (rr.ok) restored.push(rr.labelEs);
      }
      return {
        ok: true,
        message: `${verb} Hoguera (0💧)${veraNote} (se ${selfRes.destroyed ? 'destruye' : 'daña'}) → restaura: ${restored.join(', ') || 'ninguna carta'}.`,
      };
    }

    case 'cache_draw':
    case 'cache_restore':
    case 'cache_punk': {
      const selfRes = applySelfCampDamage();
      if (checkGameOver(state)) {
        return { ok: true, message: `${verb} Alijo: al dañarse destruyó el último campamento propio.` };
      }
      if (ability.kind === 'cache_draw') {
        if (playerKey === 'bot') {
          drawBotCard(state, rng);
          return { ok: true, message: `${verb} Alijo (se ${selfRes.destroyed ? 'destruye' : 'daña'}) → roba 1 carta.` };
        }
        p.pendingDraws += 1;
        return { ok: true, message: `${verb} Alijo (se ${selfRes.destroyed ? 'destruye' : 'daña'}) → robás 1 carta física (cantamela).` };
      }
      if (ability.kind === 'cache_restore') {
        const legal = getRestorableCards(state, playerKey);
        const t = opts.restoreTarget || legal[0];
        const rr = t ? restoreTarget(state, t) : { ok: true, labelEs: 'nada' };
        return { ok: true, message: `${verb} Alijo (se ${selfRes.destroyed ? 'destruye' : 'daña'}) → restaura ${rr.labelEs}.` };
      }
      const pr = gainPunk(state, playerKey, opts.col, opts.slot, rng);
      return { ok: true, message: `${verb} Alijo (se ${selfRes.destroyed ? 'destruye' : 'daña'}) → gana 1 Punki${pr.ok ? ` en ${COL_SHORT_ES[pr.col]}` : ''}.` };
    }

    case 'catapult': {
      const legal = getLegalTargets(state, playerKey, 'any_enemy');
      const t = opts.target || legal[0];
      const dr = applyDamageToTarget(state, t);
      if (checkGameOver(state)) {
        return { ok: true, message: `${verb} Catapulta (${cost}💧) → destruye el último campamento rival (${dr.labelEs})!` };
      }
      const ownPeople = getAllPeople(state, playerKey);
      const sac = opts.ownPerson || ownPeople.find((x) => x.person.isPunk) || ownPeople[0];
      const sacName = sac.person.isPunk ? 'Punki' : getCardNameEs(sac.person.id);
      destroyPersonAt(state, playerKey, sac.col, sac.slot);
      return {
        ok: true,
        message: `${verb} Catapulta (${cost}💧)${veraNote} → ${dr.destroyed ? 'destruye' : 'daña'} a ${dr.labelEs} y sacrifica a ${sacName}.`,
      };
    }

    case 'blood_bank':
    case 'labor_camp':
    case 'mulcher':
    case 'cult_leader': {
      const ownPeople = getAllPeople(state, playerKey);
      const sac =
        opts.ownPerson ||
        ownPeople.find((x) => x.person.isPunk) ||
        ownPeople.find((x) => x.person.damaged) ||
        ownPeople[0];
      const sacName = sac.person.isPunk ? 'Punki' : getCardNameEs(sac.person.id);
      destroyPersonAt(state, playerKey, sac.col, sac.slot);

      if (ability.kind === 'blood_bank') {
        p.extraWater += 1;
        return { ok: true, message: `${verb} Banco de Sangre (0💧)${veraNote}: sacrifica a ${sacName} → +1💧 extra.` };
      }
      if (ability.kind === 'labor_camp') {
        const legal = getRestorableCards(state, playerKey);
        const rt = opts.restoreTarget || legal[0];
        const rr = rt ? restoreTarget(state, rt) : { labelEs: 'nada' };
        return { ok: true, message: `${verb} Campo de Trabajo (0💧)${veraNote}: sacrifica a ${sacName} → restaura ${rr.labelEs}.` };
      }
      if (ability.kind === 'mulcher') {
        if (playerKey === 'bot') {
          drawBotCard(state, rng);
          return { ok: true, message: `${verb} Trituradora (0💧)${veraNote}: sacrifica a ${sacName} → roba 1 carta.` };
        }
        p.pendingDraws += 1;
        return { ok: true, message: `${verb} Trituradora (0💧)${veraNote}: sacrificaste a ${sacName} → robás 1 carta física.` };
      }
      // cult_leader
      const legal = getLegalTargets(state, playerKey, 'unprotected_enemy');
      const t = opts.target || legal[0];
      const dr = applyDamageToTarget(state, t);
      return {
        ok: true,
        message: `${verb} Líder de la Secta (0💧)${veraNote}: sacrifica a ${sacName} → ${dr.destroyed ? 'destruye' : 'daña'} a ${dr.labelEs}.`,
      };
    }

    case 'mutant_damage': {
      const legal = getLegalTargets(state, playerKey, 'unprotected_enemy');
      const t = opts.target || legal[0];
      const dr = applyDamageToTarget(state, t);
      let extraRestore = '';
      if (opts.alsoRestore) {
        const rr = restoreTarget(state, opts.alsoRestore);
        if (rr.ok) extraRestore = ` y restaura ${rr.labelEs}`;
      }
      if (!checkGameOver(state)) {
        applyDamageToTarget(state, { type: 'person', owner: playerKey, col: source.col, slot: source.slot });
      }
      return {
        ok: true,
        message: `${verb} Mutante (0💧) → ${dr.destroyed ? 'destruye' : 'daña'} a ${dr.labelEs}${extraRestore} (el Mutante se daña).`,
      };
    }

    case 'mutant_restore': {
      const legal = getRestorableCards(state, playerKey);
      const t = opts.restoreTarget || legal[0];
      const rr = restoreTarget(state, t);
      applyDamageToTarget(state, { type: 'person', owner: playerKey, col: source.col, slot: source.slot });
      return { ok: true, message: `${verb} Mutante (0💧) → restaura ${rr.labelEs} (el Mutante se daña).` };
    }

    case 'return_own_person': {
      const ownPeople = getAllPeople(state, playerKey);
      const pick = opts.ownPerson || ownPeople[0];
      const per = p.columns[pick.col][pick.slot];
      p.columns[pick.col][pick.slot] = null;
      const nm = per.isPunk ? 'Punki' : getCardNameEs(per.id);
      if (playerKey === 'bot') {
        const retId = per.isPunk ? per.underlyingCardId : per.id;
        if (retId) p.hand.push(retId);
      } else {
        if (per.isPunk) {
          if (per.underlyingCardId) {
            state.deck.push(per.underlyingCardId);
            state.deck = shuffle(state.deck, rng);
          }
          p.pendingDraws += 1;
        } else {
          p.hiddenHand.push(per.id);
        }
      }
      return {
        ok: true,
        message: `${verb} Equipo de Rescate (0💧)${veraNote} → devuelve a ${nm} a la mano.`,
      };
    }

    case 'reactor': {
      cardObj.destroyed = true;
      cardObj.damaged = false;
      cardObj.ready = false;
      if (checkGameOver(state)) {
        return { ok: true, message: `${verb} Reactor (${cost}💧): al destruirse perdió el último campamento.` };
      }
      let cleared = 0;
      for (const side of ['human', 'bot']) {
        for (let col = 0; col < 3; col++) {
          for (let slot = 0; slot < 2; slot++) {
            if (state[side].columns[col][slot]) {
              destroyPersonAt(state, side, col, slot);
              cleared++;
            }
          }
        }
      }
      return { ok: true, message: `${verb} Reactor (${cost}💧) → se destruye y aniquila a las ${cleared} persona(s) en mesa.` };
    }

    case 'construction_yard': {
      const destroyedCamps = p.camps.map((c, col) => ({ c, col })).filter((x) => x.c.destroyed);
      const rebuild = opts.rebuildCol !== undefined
        ? destroyedCamps.find((x) => x.col === opts.rebuildCol) || destroyedCamps[0]
        : destroyedCamps[0];
      rebuild.c.destroyed = false;
      rebuild.c.damaged = false;
      rebuild.c.ready = true;
      cardObj.destroyed = true;
      cardObj.ready = false;
      return {
        ok: true,
        message: `${verb} Obra en Construcción (1💧): reconstruye ${getCardNameEs(rebuild.c.id)} (sano y listo) y se destruye.`,
      };
    }

    case 'juggernaut': {
      const nextStep = (cardObj.juggernautStep || 0) + 1;
      if (nextStep < 3) {
        cardObj.juggernautStep = nextStep;
        return {
          ok: true,
          message: `${verb} Coloso (1💧)${veraNote} → avanza al paso ${nextStep}/3.`,
        };
      }
      // 3rd move! Reset to 0 and opponent destroys one of their camps!
      cardObj.juggernautStep = 0;
      const aliveOppCamps = state[oppKey].camps.map((c, col) => ({ c, col })).filter((x) => !x.c.destroyed);
      if (oppKey === 'bot') {
        const pickCol = botChoiceFn
          ? botChoiceFn(getBotObservation(state), 'juggernaut_camp', aliveOppCamps.map((x) => x.col))
          : aliveOppCamps[0].col;
        destroyTarget(state, { type: 'camp', owner: 'bot', col: pickCol });
        return {
          ok: true,
          message: `¡Coloso completa su 3er avance! El bot destruye su campamento ${getCardNameEs(state.bot.camps[pickCol].id)}.`,
        };
      }
      if (aliveOppCamps.length === 1) {
        const col = aliveOppCamps[0].col;
        destroyTarget(state, { type: 'camp', owner: 'human', col });
        return { ok: true, message: `¡Mi Coloso completó su 3er avance y destruyó tu último campamento!` };
      }
      state.pendingChoice = {
        forPlayer: 'human',
        kind: 'juggernaut_camp',
        sourcePlayer: 'bot',
        sourceName: 'Coloso',
        promptEs: `¡Mi Coloso completó su 3er avance! Elegí qué campamento tuyo destruir: ${aliveOppCamps
          .map((x) => `${x.col + 1}) ${getCardNameEs(x.c.id)}`)
          .join(', ')}.`,
        options: aliveOppCamps.map((x) => ({ value: x.col, labelEs: `${x.col + 1}) ${getCardNameEs(x.c.id)}` })),
        resumeBotTurn: state.activePlayer === 'bot',
      };
      return { ok: true, needsChoice: true, message: state.pendingChoice.promptEs };
    }

    case 'scud_launcher': {
      const oppCards = getLegalTargets(state, playerKey, 'any_enemy');
      if (oppCards.length === 0) return { ok: true, message: `${verb} Lanzamisiles Scud: sin cartas rivales.` };
      if (oppKey === 'bot') {
        const pick = botChoiceFn
          ? botChoiceFn(getBotObservation(state), 'scud_target', oppCards)
          : oppCards[0];
        const dr = applyDamageToTarget(state, pick);
        return {
          ok: true,
          message: `${verb} Lanzamisiles Scud (1💧)${veraNote} → el bot elige recibir daño en ${dr.labelEs} (${dr.destroyed ? 'destruido' : 'dañado'}).`,
        };
      }
      state.pendingChoice = {
        forPlayer: 'human',
        kind: 'scud_target',
        sourcePlayer: 'bot',
        sourceName: 'Lanzamisiles Scud',
        promptEs: `Usé Lanzamisiles Scud (1💧). Elegí cuál de tus cartas recibe 1 daño: ${oppCards
          .map((c, i) => `${i + 1}) ${c.labelEs}`)
          .join(', ')}.`,
        options: oppCards.map((c, i) => ({ value: i, target: c, labelEs: c.labelEs })),
        resumeBotTurn: state.activePlayer === 'bot',
      };
      return { ok: true, needsChoice: true, message: state.pendingChoice.promptEs };
    }

    case 'mercenary_camp': {
      const oppCards = getLegalTargets(state, playerKey, 'any_enemy');
      if (oppKey === 'bot') {
        const canDiscard2 = state.bot.hand.length >= 2;
        const decision = botChoiceFn
          ? botChoiceFn(getBotObservation(state), 'mercenary_choice', { canDiscard2, oppCards })
          : canDiscard2
            ? { mode: 'discard', cards: state.bot.hand.slice(0, 2) }
            : { mode: 'destroy', target: oppCards[0] };
        if (decision.mode === 'discard' && state.bot.hand.length >= 2) {
          const names = [];
          for (const cid of decision.cards.slice(0, 2)) {
            const idx = state.bot.hand.indexOf(cid);
            if (idx !== -1) {
              state.bot.hand.splice(idx, 1);
              state.discard.push(cid);
              names.push(getCardNameEs(cid));
            }
          }
          return {
            ok: true,
            message: `${verb} Campamento Mercenario (2💧)${veraNote} → el bot descarta 2 cartas (${names.join(' y ')}).`,
          };
        }
        const dr = destroyTarget(state, decision.target || oppCards[0]);
        return {
          ok: true,
          message: `${verb} Campamento Mercenario (2💧)${veraNote} → el bot elige destruir su ${dr.labelEs}.`,
        };
      }
      // Human chooses!
      const canDiscard2 = state.human.hiddenHand.length >= 2;
      const optsList = [];
      if (canDiscard2) {
        optsList.push({ value: 'discard2', mode: 'discard', labelEs: 'Descartar 2 cartas de mi mano' });
      }
      oppCards.forEach((c, i) => {
        optsList.push({ value: `destroy_${i}`, mode: 'destroy', target: c, labelEs: `Destruir ${c.labelEs}` });
      });
      state.pendingChoice = {
        forPlayer: 'human',
        kind: 'mercenary_choice',
        sourcePlayer: 'bot',
        sourceName: 'Campamento Mercenario',
        promptEs: `Usé Campamento Mercenario (2💧). ${
          canDiscard2 ? 'Podés descartar 2 cartas ("descarto [c1] y [c2]") o destruir una de tus cartas:' : 'Tenés menos de 2 cartas en mano, así que debés destruir una carta tuya:'
        } ${oppCards.map((c, i) => `${i + 1}) ${c.labelEs}`).join(', ')}.`,
        options: optsList,
        resumeBotTurn: state.activePlayer === 'bot',
      };
      return { ok: true, needsChoice: true, message: state.pendingChoice.promptEs };
    }

    case 'the_octagon': {
      const ownPeople = getAllPeople(state, playerKey);
      const sac = opts.ownPerson || ownPeople.find((x) => x.person.isPunk) || ownPeople[0];
      const sacName = sac.person.isPunk ? 'Punki' : getCardNameEs(sac.person.id);
      destroyPersonAt(state, playerKey, sac.col, sac.slot);

      const oppPeople = getAllPeople(state, oppKey);
      if (oppPeople.length === 0) {
        return { ok: true, message: `${verb} El Octágono (1💧): sacrifica a ${sacName} (el rival no tenía personas).` };
      }
      if (oppKey === 'bot') {
        const pick = botChoiceFn
          ? botChoiceFn(getBotObservation(state), 'octagon_destroy', oppPeople)
          : oppPeople[0];
        const nm = pick.person.isPunk ? 'Punki' : getCardNameEs(pick.person.id);
        destroyPersonAt(state, 'bot', pick.col, pick.slot);
        return {
          ok: true,
          message: `${verb} El Octágono (1💧): sacrificaste a ${sacName} y el bot destruye a su ${nm}.`,
        };
      }
      state.pendingChoice = {
        forPlayer: 'human',
        kind: 'octagon_destroy',
        sourcePlayer: 'bot',
        sourceName: 'El Octágono',
        promptEs: `Usé El Octágono (1💧) y sacrifiqué a mi ${sacName}. Elegí qué persona tuya destruís: ${oppPeople
          .map((hp, i) => `${i + 1}) ${hp.person.isPunk ? 'Punki' : getCardNameEs(hp.person.id)} (${COL_SHORT_ES[hp.col]})`)
          .join(', ')}.`,
        options: oppPeople.map((hp, i) => ({
          value: i,
          col: hp.col,
          slot: hp.slot,
          labelEs: `${hp.person.isPunk ? 'Punki' : getCardNameEs(hp.person.id)} (${COL_SHORT_ES[hp.col]})`,
        })),
        resumeBotTurn: state.activePlayer === 'bot',
      };
      return { ok: true, needsChoice: true, message: state.pendingChoice.promptEs };
    }

    case 'supply_depot': {
      if (playerKey === 'bot') {
        const c1 = drawBotCard(state, rng);
        const c2 = drawBotCard(state, rng);
        const drawn = [c1, c2].filter(Boolean);
        if (drawn.length === 2) {
          const keep = botChoiceFn ? botChoiceFn(getBotObservation(state), 'keep_one_card', drawn) : drawn[0];
          const drop = drawn[0] === keep ? drawn[1] : drawn[0];
          const idx = state.bot.hand.lastIndexOf(drop);
          if (idx !== -1) {
            state.bot.hand.splice(idx, 1);
            state.discard.push(drop);
          }
        }
        return { ok: true, message: `Uso Depósito de Suministros (2💧)${veraNote}: robé 2 cartas y descarté 1.` };
      }
      p.pendingDraws += 1;
      return {
        ok: true,
        message: 'Usaste Depósito de Suministros (2💧): robá 2 cartas físicas, quedate con 1 ("robé [carta]") y descartá la otra ("descarté [carta]").',
      };
    }

    case 'zeto_draw_discard': {
      if (playerKey === 'bot') {
        for (let i = 0; i < 3; i++) drawBotCard(state, rng);
        const dropCount = Math.min(3, state.bot.hand.length);
        const toDrop = botChoiceFn
          ? botChoiceFn(getBotObservation(state), 'discard_n', { n: dropCount, hand: [...state.bot.hand] })
          : state.bot.hand.slice(0, dropCount);
        for (const cid of toDrop) {
          const idx = state.bot.hand.indexOf(cid);
          if (idx !== -1) {
            state.bot.hand.splice(idx, 1);
            state.discard.push(cid);
          }
        }
        return { ok: true, message: `Uso Zeto Khan (1💧)${veraNote}: robé 3 cartas y descarté ${dropCount}.` };
      }
      p.pendingDraws += 3;
      return {
        ok: true,
        message: 'Usaste Zeto Khan (1💧): robá 3 cartas físicas ("robé [c1, c2, c3]") y descartá 3 de tu mano ("descarté [c1, c2, c3]").',
      };
    }

    case 'scientist': {
      if (playerKey === 'bot') {
        const revealed = [];
        for (let i = 0; i < 3; i++) {
          if (!ensureDeckAvailable(state, rng)) break;
          const c = state.deck.pop();
          revealed.push(c);
          state.discard.push(c);
        }
        const names = revealed.map(getCardNameEs).join(', ');
        // Pick best junk effect among the 3 revealed
        let chosenJunk = null;
        for (const cid of revealed) {
          const j = DECK_CARDS_BY_ID[cid]?.junk;
          if (!j) continue;
          if (j === 'damage' && getLegalTargets(state, 'bot', 'unprotected_enemy').length) { chosenJunk = j; break; }
          if (j === 'injure' && getLegalTargets(state, 'bot', 'unprotected_enemy_person').length) { chosenJunk = j; break; }
          if (j === 'punk' && getEmptyPersonSlots(state, 'bot').length) { chosenJunk = j; break; }
          if (j === 'raid' || j === 'draw' || j === 'water') chosenJunk = chosenJunk || j;
          if (j === 'restore' && getRestorableCards(state, 'bot').length) chosenJunk = chosenJunk || j;
        }
        if (chosenJunk) {
          const jr = applyJunkEffect(state, 'bot', chosenJunk, { rng, botChoiceFn });
          return {
            ok: true,
            needsChoice: !!jr.needsChoice,
            message: `Uso Científico (1💧)${veraNote}: descarto del mazo [${names}] y activo chatarra ${JUNK_INFO[chosenJunk].shortEs} → ${jr.message}`,
          };
        }
        return { ok: true, message: `Uso Científico (1💧)${veraNote}: descarto del mazo [${names}].` };
      }
      return {
        ok: true,
        message: 'Usaste Científico (1💧): descartá las 3 cartas superiores del mazo físico (podés registrarlas con "descarté [c1, c2, c3]") y aplicá el efecto chatarra de una de ellas.',
      };
    }

    case 'omen_clock': {
      // Advance any event in play by 1 space (defaults to own earliest event)
      const ownerOfEv = opts.eventOwner || playerKey;
      const evs = state[ownerOfEv].events;
      let idx = opts.eventSlot !== undefined ? opts.eventSlot : evs.findIndex((e) => e !== null);
      if (idx === -1 || !evs[idx]) {
        const otherEvs = state[otherPlayer(ownerOfEv)].events;
        const altIdx = otherEvs.findIndex((e) => e !== null);
        if (altIdx === -1) return { ok: false, error: 'No hay eventos en cola para avanzar.' };
        return advanceEventAt(state, otherPlayer(ownerOfEv), altIdx, { rng, botChoiceFn, prefix: `${verb} Reloj del Augurio (1💧)${veraNote}: ` });
      }
      return advanceEventAt(state, ownerOfEv, idx, { rng, botChoiceFn, prefix: `${verb} Reloj del Augurio (1💧)${veraNote}: ` });
    }

    case 'scavenger_water':
    case 'scavenger_punk': {
      const hand = playerKey === 'bot' ? p.hand : p.hiddenHand;
      if (hand.length === 0) return { ok: false, error: 'No tenés cartas en mano para descartar.' };
      const dropId = opts.discardCardId || hand[0];
      const idx = hand.indexOf(dropId);
      if (idx === -1) return { ok: false, error: 'No tenés esa carta en mano para descartar.' };
      hand.splice(idx, 1);
      state.discard.push(dropId);
      if (ability.kind === 'scavenger_water') {
        p.extraWater += 1;
        return { ok: true, message: `${verb} Campamento Carroñero (0💧)${veraNote}: descarta ${getCardNameEs(dropId)} → +1💧 extra.` };
      }
      const pr = gainPunk(state, playerKey, opts.col, opts.slot, rng);
      return { ok: true, message: `${verb} Campamento Carroñero (0💧)${veraNote}: descarta ${getCardNameEs(dropId)} → gana 1 Punki${pr.ok ? ` en ${COL_SHORT_ES[pr.col]}` : ''}.` };
    }

    case 'warehouse': {
      const selfRes = applySelfCampDamage();
      if (checkGameOver(state)) {
        return { ok: true, message: `${verb} Almacén: al dañarse destruyó el último campamento propio.` };
      }
      if (playerKey === 'bot') {
        const dropCount = Math.min(2, state.bot.hand.length);
        if (dropCount === 0) return { ok: true, message: `Uso Almacén (se daña), sin cartas para descartar.` };
        const toDrop = state.bot.hand.splice(0, dropCount);
        state.discard.push(...toDrop);
        for (let i = 0; i < dropCount + 1; i++) drawBotCard(state, rng);
        return { ok: true, message: `Uso Almacén (0💧)${veraNote} (se ${selfRes.destroyed ? 'destruye' : 'daña'}): descarto ${dropCount} y robo ${dropCount + 1} cartas.` };
      }
      return {
        ok: true,
        message: `Usaste Almacén (0💧) (se ${selfRes.destroyed ? 'destruye' : 'daña'}): descartá N cartas ("descarté ...") y robá N+1 cartas físicas ("robé ...").`,
      };
    }

    case 'training_camp': {
      const punks = getAllPeople(state, playerKey).filter((x) => x.person.isPunk);
      if (punks.length === 0) return { ok: false, error: 'Necesitás al menos un Punki para Campo de Entrenamiento.' };
      const pick = opts.ownPerson || punks[0];
      if (playerKey === 'bot') {
        const cardId = pick.person.underlyingCardId;
        const cardDef = DECK_CARDS_BY_ID[cardId];
        if (cardDef && cardDef.type === 'person') {
          pick.person.isPunk = false;
          pick.person.id = cardId;
          pick.person.ready = false;
          delete pick.person.underlyingCardId;
          return {
            ok: true,
            message: `Uso Campo de Entrenamiento (1💧)${veraNote}: doy vuelta mi Punki en ${COL_SHORT_ES[pick.col]} → ¡Es ${cardDef.nameEs}!`,
          };
        }
        // Event -> discard, gain Punk & +1 extra water
        state.bot.columns[pick.col][pick.slot] = null;
        if (cardId) state.discard.push(cardId);
        gainPunk(state, 'bot', pick.col, pick.slot, rng);
        state.bot.extraWater += 1;
        return {
          ok: true,
          message: `Uso Campo de Entrenamiento (1💧)${veraNote}: el Punki era el evento ${getCardNameEs(cardId)} → lo descarto, gano 1 Punki y +1💧 extra.`,
        };
      }
      return {
        ok: true,
        message: 'Usaste Campo de Entrenamiento (1💧): da vuelta tu Punki físico. Si es Persona, jugalo ahí con "reemplazar punki en [col] por [carta]" (o "juego [carta]"); si es Evento, descartalo y sumá +1💧.',
      };
    }

    case 'adrenaline_lab': {
      const damaged = getAllPeople(state, playerKey).filter((x) => x.person.damaged && !x.person.isPunk);
      if (damaged.length === 0) return { ok: false, error: 'No tenés personas dañadas con habilidad.' };
      const pick = opts.ownPerson || damaged[0];
      const subRes = activateAbility(
        state,
        playerKey,
        { type: 'person', col: pick.col, slot: pick.slot },
        opts.subAbilityId,
        { ...opts, allowDamaged: true, ignoreReady: true, skipVera: true }
      );
      if (!subRes.ok) return subRes;
      destroyPersonAt(state, playerKey, pick.col, pick.slot);
      return {
        ok: true,
        needsChoice: !!subRes.needsChoice,
        message: `${verb} Laboratorio de Adrenalina: ${subRes.message} Luego ${getCardNameEs(pick.person.id)} se destruye.`,
      };
    }

    case 'parachute_base': {
      return {
        ok: true,
        message: `${verb} Base Paracaidista (0💧): jugá la persona de tu mano, usá su habilidad (pagando ambos costos) y luego dañala.`,
      };
    }

    case 'mimic': {
      if (opts.mimicSource) {
        const sub = activateAbility(state, playerKey, opts.mimicSource, opts.subAbilityId, {
          ...opts,
          ignoreReady: true,
          skipVera: true,
        });
        return sub;
      }
      return {
        ok: true,
        message: `${verb} Imitador: indicá qué habilidad copiás (pagando su costo de agua) y su objetivo.`,
      };
    }

    default:
      return { ok: false, error: `Habilidad no implementada: ${ability.kind}` };
  }
}

function advanceEventAt(state, ownerKey, idx, opts = {}) {
  const evs = state[ownerKey].events;
  const evId = evs[idx];
  if (!evId) return { ok: false, error: 'No hay evento en esa casilla.' };
  evs[idx] = null;
  let targetIdx = idx - 1;
  while (targetIdx >= 0 && evs[targetIdx] !== null) targetIdx--;
  if (targetIdx < 0) {
    if (evId !== 'raiders') state.discard.push(evId);
    const rr = resolveEvent(state, ownerKey, evId, opts);
    return { ok: true, needsChoice: !!rr.needsChoice, message: `${opts.prefix || ''}${getCardNameEs(evId)} resuelve ahora: ${rr.message}` };
  }
  evs[targetIdx] = evId;
  return { ok: true, message: `${opts.prefix || ''}${getCardNameEs(evId)} avanza a casilla ${targetIdx + 1}.` };
}

// === RESOLVING INTERACTIVE HUMAN PENDING CHOICES ===
function resolvePendingChoice(state, selection, extra = {}) {
  const pc = state.pendingChoice;
  if (!pc) return { ok: false, error: 'No hay ninguna decisión pendiente.' };

  pushUndoSnapshot(state);
  const resumeBot = pc.resumeBotTurn;

  switch (pc.kind) {
    case 'raiders_camp': {
      const col = typeof selection === 'number' ? selection : parseInt(selection, 10);
      const valid = pc.options.find((o) => o.value === col);
      if (!valid) return { ok: false, error: 'Elegí un número de campamento válido (1, 2 o 3).' };
      state.pendingChoice = null;
      const dr = applyDamageToTarget(state, { type: 'camp', owner: 'human', col });
      return {
        ok: true,
        resumeBot,
        message: `Asaltantes daña tu campamento ${dr.labelEs} (${dr.destroyed ? '¡DESTRUIDO!' : 'dañado'}).`,
      };
    }

    case 'juggernaut_camp': {
      const col = typeof selection === 'number' ? selection : parseInt(selection, 10);
      const valid = pc.options.find((o) => o.value === col);
      if (!valid) return { ok: false, error: 'Elegí un campamento válido.' };
      state.pendingChoice = null;
      const dr = destroyTarget(state, { type: 'camp', owner: 'human', col });
      return { ok: true, resumeBot, message: `Destruiste tu campamento ${dr.labelEs} por Coloso.` };
    }

    case 'scud_target':
    case 'banish_target':
    case 'vanguard_counter': {
      const opt = typeof selection === 'object' && selection.target
        ? selection
        : pc.options.find((o) => o.value === selection) || pc.options[selection];
      if (!opt || !opt.target) return { ok: false, error: 'Elegí una opción válida de la lista.' };
      state.pendingChoice = null;
      const dr =
        pc.kind === 'banish_target'
          ? destroyTarget(state, opt.target)
          : applyDamageToTarget(state, opt.target);
      return {
        ok: true,
        resumeBot,
        message: `${pc.sourceName}: ${dr.destroyed ? 'destruido' : 'dañado'} ${dr.labelEs}.`,
      };
    }

    case 'napalm_col': {
      const col = typeof selection === 'number' ? selection : parseInt(selection, 10);
      const valid = pc.options.find((o) => o.value === col);
      if (!valid) return { ok: false, error: 'Elegí una columna válida (1, 2 o 3).' };
      state.pendingChoice = null;
      const names = [];
      for (let slot = 0; slot < 2; slot++) {
        const per = state.bot.columns[col][slot];
        if (per) {
          names.push(per.isPunk ? 'Punki' : getCardNameEs(per.id));
          destroyPersonAt(state, 'bot', col, slot);
        }
      }
      return { ok: true, resumeBot, message: `Tu Napalm limpia mi ${COL_NAMES_ES[col]}: destruye ${names.join(' y ') || 'nada'}.` };
    }

    case 'famine_keep': {
      const opt = pc.options.find((o) => o.value === selection || o.uid === selection) || pc.options[selection];
      if (!opt) return { ok: false, error: 'Elegí con qué persona te quedás.' };
      state.pendingChoice = null;
      const all = getAllPeople(state, 'human');
      const destroyed = [];
      for (const hp of all) {
        if (hp.person.uid !== opt.uid) {
          destroyed.push(hp.person.isPunk ? 'Punki' : getCardNameEs(hp.person.id));
          destroyPersonAt(state, 'human', hp.col, hp.slot);
        }
      }
      return {
        ok: true,
        resumeBot,
        message: `Hambruna: te quedás con ${opt.labelEs}; se destruyen ${destroyed.join(', ')}.`,
      };
    }

    case 'octagon_destroy': {
      const opt = pc.options.find((o) => o.value === selection) || pc.options[selection];
      if (!opt) return { ok: false, error: 'Elegí qué persona tuya destruir.' };
      state.pendingChoice = null;
      const per = destroyPersonAt(state, 'human', opt.col, opt.slot);
      return {
        ok: true,
        resumeBot,
        message: `El Octágono: destruiste a tu ${per?.isPunk ? 'Punki' : getCardNameEs(per?.id)}.`,
      };
    }

    case 'mercenary_choice': {
      if (selection === 'discard2' || extra.mode === 'discard') {
        if (state.human.hiddenHand.length < 2) {
          return { ok: false, error: 'Tenés menos de 2 cartas en mano; tenés que destruir una carta en mesa.' };
        }
        const cards = extra.cards && extra.cards.length >= 2 ? extra.cards.slice(0, 2) : state.human.hiddenHand.slice(0, 2);
        const names = [];
        for (const cid of cards) {
          const idx = state.human.hiddenHand.indexOf(cid);
          if (idx !== -1) {
            state.human.hiddenHand.splice(idx, 1);
            state.discard.push(cid);
            names.push(getCardNameEs(cid));
          }
        }
        state.pendingChoice = null;
        return {
          ok: true,
          resumeBot,
          message: `Campamento Mercenario: descartaste 2 cartas (${names.join(' y ')}).`,
        };
      }
      const opt = pc.options.find((o) => o.value === selection) || pc.options[selection];
      if (!opt || !opt.target) return { ok: false, error: 'Elegí descartar 2 cartas o qué carta destruir.' };
      state.pendingChoice = null;
      const dr = destroyTarget(state, opt.target);
      return { ok: true, resumeBot, message: `Campamento Mercenario: destruiste tu ${dr.labelEs}.` };
    }

    default:
      state.pendingChoice = null;
      return { ok: true, resumeBot, message: 'Decisión registrada.' };
  }
}

// === DIRECT PHYSICAL SYNC HELPERS (for complex combos / manual corrections) ===
function discardHumanCards(state, cardIds, rng = Math.random) {
  const names = [];
  for (const cid of cardIds) {
    const idx = state.human.hiddenHand.indexOf(cid);
    if (idx !== -1) {
      state.human.hiddenHand.splice(idx, 1);
      state.discard.push(cid);
      names.push(getCardNameEs(cid));
    } else {
      const sync = recordHumanDraw(state, cid, { rng, skipPendingDecrement: true });
      if (sync.ok) {
        const ni = state.human.hiddenHand.lastIndexOf(cid);
        if (ni !== -1) state.human.hiddenHand.splice(ni, 1);
        state.discard.push(cid);
        names.push(getCardNameEs(cid));
      }
    }
  }
  return { ok: true, message: `Descartado(s) al pozo compartido: ${names.join(', ')}.` };
}

const SELF_DAMAGERS = new Set(['cannon', 'bonfire', 'cache', 'warehouse']);
const RESTORERS = new Set(['bonfire', 'outpost', 'atomic_garden', 'labor_camp', 'transplant_lab', 'cache']);
const PUNK_MAKERS = new Set(['arcade', 'cache', 'scavenger_camp']);
const SACRIFICE_CAMPS = new Set(['catapult', 'blood_bank', 'mulcher', 'labor_camp', 'the_octagon']);
const RAID_CAMPS = new Set(['garage', 'victory_totem', 'outpost']);

function chooseBotCamps(pool6, difficulty = 'tactical', rng = Math.random) {
  if (pool6.length <= 3) return [...pool6];
  if (difficulty === 'casual' && rng() < 0.35) {
    return pool6.slice(0, 3);
  }

  const combos = [];
  for (let i = 0; i < pool6.length; i++) {
    for (let j = i + 1; j < pool6.length; j++) {
      for (let k = j + 1; k < pool6.length; k++) {
        const trio = [pool6[i], pool6[j], pool6[k]];
        combos.push({ trio, score: scoreCampTrio(trio) });
      }
    }
  }
  combos.sort((a, b) => b.score - a.score);
  if (difficulty === 'casual') {
    const idx = Math.floor(rng() * Math.min(4, combos.length));
    return combos[idx].trio;
  }
  return combos[0].trio;
}

function scoreCampTrio(trio) {
  let score = 0;
  let totalDraw = 0;
  let hasDamage = false;
  let hasRestore = false;
  let hasSelfDamage = false;
  let hasPunkMaker = false;
  let hasSacrifice = false;
  let hasRaid = false;

  for (const id of trio) {
    const def = CAMPS_BY_ID[id];
    score += CAMP_BASE_POWER[id] || 6.5;
    totalDraw += def.startingCards;
    if (['railgun', 'cannon', 'catapult', 'command_post', 'pillbox', 'victory_totem', 'scud_launcher', 'mercenary_camp', 'nest_of_spies', 'resonator', 'watchtower'].includes(id)) {
      hasDamage = true;
    }
    if (RESTORERS.has(id)) hasRestore = true;
    if (SELF_DAMAGERS.has(id)) hasSelfDamage = true;
    if (PUNK_MAKERS.has(id)) hasPunkMaker = true;
    if (SACRIFICE_CAMPS.has(id)) hasSacrifice = true;
    if (RAID_CAMPS.has(id)) hasRaid = true;
  }

  // Starting card curve: 2-4 cards is ideal; 0-1 is dangerous
  if (totalDraw === 0) score -= 4.5;
  else if (totalDraw === 1) score -= 2.2;
  else if (totalDraw === 2) score += 0.6;
  else if (totalDraw === 3) score += 2.0;
  else if (totalDraw === 4) score += 2.6;
  else if (totalDraw >= 5) score += 2.8;

  // Synergies
  if (hasDamage) score += 1.5;
  if (hasSelfDamage && hasRestore) score += 1.4;
  if (hasPunkMaker && (hasSacrifice || trio.includes('command_post'))) score += 1.6;
  if (hasRaid && trio.includes('watchtower')) score += 1.5;
  if (trio.includes('obelisk') && trio.includes('pillbox')) score += 1.4;
  if (trio.includes('obelisk') && trio.includes('construction_yard')) score += 1.8;
  if (trio.includes('obelisk') && totalDraw < 4) score -= 2.5;
  if (trio.includes('bonfire') && trio.includes('cannon')) score += 1.3;

  return score;
}

};

function personThreatValue(person, ownerKey, obs) {
  let v = PERSON_VALUE[person.isPunk ? 'punk' : person.id] || 5.0;
  if (person.damaged) v *= 0.45;
  if (person.ready && !person.damaged) v += 1.2;
  // Argo Yesky buffs punks!
  if (person.isPunk && hasActiveTrait(obs, ownerKey, 'grant_damage_to_all_people')) {
    v += 2.6;
  }
  return v;
}

function evaluateObservation(obs) {
  const botAlive = obs.bot.camps.filter((c) => !c.destroyed).length;
  const humAlive = obs.human.camps.filter((c) => !c.destroyed).length;

  if (humAlive === 0 && botAlive > 0) return 10000;
  if (botAlive === 0 && humAlive > 0) return -10000;
  if (botAlive === 0 && humAlive === 0) return 0;

  let score = 0;

  // 1. Camps (by far the most important objective)
  const evalCamps = (sideKey, sign) => {
    const p = obs[sideKey];
    for (let col = 0; col < 3; col++) {
      const c = p.camps[col];
      if (c.destroyed) {
        score -= sign * 42;
      } else {
        score += sign * 30;
        const prot = isCardProtected(obs, sideKey, 'camp', col, 0, sideKey === 'bot' ? 'human' : 'bot');
        if (c.damaged) {
          score -= sign * (prot ? 14 : 21); // unprotected damaged camp is extreme danger!
        } else if (prot) {
          score += sign * 3.5;
        }
        if (c.id === 'juggernaut' && c.juggernautStep > 0) {
          score += sign * c.juggernautStep * 7.5;
        }
      }
    }
  };
  evalCamps('bot', 1);
  evalCamps('human', -1);

  // 2. People & Positioning
  const evalPeople = (sideKey, sign) => {
    const p = obs[sideKey];
    const opp = sideKey === 'bot' ? 'human' : 'bot';
    for (let col = 0; col < 3; col++) {
      for (let slot = 0; slot < 2; slot++) {
        const per = p.columns[col][slot];
        if (!per) continue;
        let v = personThreatValue(per, sideKey, obs);
        const prot = isCardProtected(obs, sideKey, 'person', col, slot, opp);
        // High-value squishy people LOVE being protected in back
        if (!per.isPunk && prot && v >= 7.5) v += 2.2;
        if (per.isPunk && !prot && p.columns[col][0]) v += 1.2; // Punk shielding someone behind!
        score += sign * v;
      }
    }
  };
  evalPeople('bot', 1);
  evalPeople('human', -1);

  // 3. Event Queues
  const eventScore = (evId, slotIdx, ownerKey) => {
    const urgency = 1 + (2 - slotIdx) * 0.28; // slot 0 (space 1) is imminent!
    const oppKey = ownerKey === 'bot' ? 'human' : 'bot';
    const oppAliveCamps = obs[oppKey].camps.filter((c) => !c.destroyed).length;
    const oppPeople = countPeople(obs, oppKey);
    const ownPeople = countPeople(obs, ownerKey);
    switch (evId) {
      case 'raiders':
        return 10.5 * urgency;
      case 'bombardment':
        return (12 + oppAliveCamps * 5.5) * urgency;
      case 'napalm':
        return (4 + Math.min(2, oppPeople) * 5.5) * urgency;
      case 'banish':
        return (oppPeople > 0 ? 9.5 : 3.5) * urgency;
      case 'strafe':
        return (2.5 + oppPeople * 3.8) * urgency;
      case 'uprising':
        return Math.min(3, 6 - ownPeople) * 3.8 * urgency;
      case 'interrogate':
        return 5.5 * urgency;
      case 'famine':
        return ((oppPeople - ownPeople) * 4.5) * urgency;
      case 'radiation':
        return ((oppPeople - ownPeople) * 3.0) * urgency;
      default:
        return 4.0 * urgency;
    }
  };
  obs.bot.events.forEach((e, i) => {
    if (e) score += eventScore(e, i, 'bot');
  });
  obs.human.events.forEach((e, i) => {
    if (e) score -= eventScore(e, i, 'human');
  });

  // 4. Card advantage & Water Silo banking
  score += obs.bot.hand.length * 4.2;
  score -= (obs.human.handCount || 0) * 4.0;
  if (obs.bot.waterSiloInHand) score += 3.2;
  if (obs.human.waterSiloInHand) score -= 2.8;

  // Small value for remaining water during mid-turn planning (don't waste water for nothing!)
  score += getTotalWater(obs.bot) * 0.35;

  return score;
}

// === 3. SYNTHETIC SIMULATION WRAPPER (ZERO LEAK!) ===
function makeSimStateFromObs(obs) {
  // Construct a valid engine state strictly from obs (synthetic unknown deck & synthetic dummy human hand)
  const syntheticDeck = [];
  for (let i = 0; i < Math.max(0, obs.deckCount); i++) {
    syntheticDeck.push('__unknown__');
  }
  const syntheticHumanHand = [];
  for (let i = 0; i < (obs.human.handCount || 0); i++) {
    syntheticHumanHand.push('__hidden__');
  }
  return {
    phase: obs.phase,
    winner: obs.winner,
    winReason: '',
    turn: obs.turn,
    activePlayer: obs.activePlayer,
    firstPlayer: obs.firstPlayer,
    turnStep: 'actions',
    difficulty: obs.difficulty,
    deck: syntheticDeck,
    discard: [...obs.discard],
    reshuffles: obs.reshuffles,
    bot: JSON.parse(JSON.stringify(obs.bot)),
    human: {
      ...JSON.parse(JSON.stringify(obs.human)),
      hiddenHand: syntheticHumanHand,
      pendingDraws: 0,
    },
    pendingChoice: null,
    log: [],
    history: [],
  };
}

// Pessimistic defender choices for simulation when bot plays Raiders / Scud / Mercenary / Famine
function simApplyHumanChoicePessimistic(simState) {
  const pc = simState.pendingChoice;
  if (!pc) return;
  simState.pendingChoice = null;
  if (pc.kind === 'raiders_camp' || pc.kind === 'juggernaut_camp') {
    // Assume human picks their healthiest (undamaged) camp to minimize damage!
    const undamaged = pc.options.find((o) => !simState.human.camps[o.value].damaged);
    const col = undamaged ? undamaged.value : pc.options[0].value;
    if (pc.kind === 'raiders_camp') {
      const c = simState.human.camps[col];
      if (c.damaged) c.destroyed = true;
      else c.damaged = true;
    } else {
      simState.human.camps[col].destroyed = true;
    }
  } else if (pc.kind === 'scud_target') {
    // Assume human picks a damaged/cheap punk or undamaged camp
    const punkOpt = pc.options.find((o) => o.target.id === 'punk');
    const chosen = punkOpt || pc.options[0];
    if (chosen.target.type === 'person') {
      const per = simState.human.columns[chosen.target.col][chosen.target.slot];
      if (per) {
        if (per.isPunk || per.damaged) simState.human.columns[chosen.target.col][chosen.target.slot] = null;
        else per.damaged = true;
      }
    } else {
      const c = simState.human.camps[chosen.target.col];
      if (c.damaged) c.destroyed = true;
      else c.damaged = true;
    }
  } else if (pc.kind === 'mercenary_choice') {
    if (simState.human.hiddenHand.length >= 2) {
      simState.human.hiddenHand.splice(0, 2);
    } else {
      const opt = pc.options.find((o) => o.mode === 'destroy');
      if (opt && opt.target) {
        if (opt.target.type === 'person') simState.human.columns[opt.target.col][opt.target.slot] = null;
        else simState.human.camps[opt.target.col].destroyed = true;
      }
    }
  } else if (pc.kind === 'famine_keep') {
    // Assume human keeps their best person!
    const all = getAllPeople(simState, 'human');
    all.sort((a, b) => (PERSON_VALUE[b.person.id] || 4) - (PERSON_VALUE[a.person.id] || 4));
    for (let i = 1; i < all.length; i++) {
      simState.human.columns[all[i].col][all[i].slot] = null;
    }
  } else if (pc.kind === 'octagon_destroy') {
    const all = getAllPeople(simState, 'human');
    all.sort((a, b) => (PERSON_VALUE[a.person.id] || 4) - (PERSON_VALUE[b.person.id] || 4));
    if (all[0]) simState.human.columns[all[0].col][all[0].slot] = null;
  } else if (pc.kind === 'vanguard_counter') {
    // Assume human hits bot's highest-value unprotected target!
    const best = [...pc.options].sort((a, b) => {
      const va = a.target.type === 'camp' ? (a.target.damaged ? 50 : 25) : PERSON_VALUE[a.target.id] || 5;
      const vb = b.target.type === 'camp' ? (b.target.damaged ? 50 : 25) : PERSON_VALUE[b.target.id] || 5;
      return vb - va;
    })[0];
    if (best?.target) {
      if (best.target.type === 'camp') {
        const c = simState.bot.camps[best.target.col];
        if (c.damaged) c.destroyed = true;
        else c.damaged = true;
      } else {
        const per = simState.bot.columns[best.target.col][best.target.slot];
        if (per) {
          if (per.isPunk || per.damaged) simState.bot.columns[best.target.col][best.target.slot] = null;
          else per.damaged = true;
        }
      }
    }
  }
}

// === 4. CANDIDATE ACTION GENERATOR ===
function pickBestTarget(obs, targets, preferDestroy = false) {
  if (!targets || targets.length === 0) return null;
  const scored = targets.map((t) => {
    let s = 0;
    if (t.type === 'camp') {
      s = t.damaged ? 120 : 38;
      if (preferDestroy) s += 40;
    } else if (t.type === 'column') {
      const h = obs.human;
      if (!h.camps[t.col].destroyed) s += h.camps[t.col].damaged ? 110 : 34;
      for (let slot = 0; slot < 2; slot++) {
        const per = h.columns[t.col][slot];
        if (per) s += (PERSON_VALUE[per.isPunk ? 'punk' : per.id] || 5) * (per.damaged || per.isPunk ? 1.5 : 0.9);
      }
    } else {
      const per = obs.human.columns[t.col][t.slot];
      const baseV = per ? PERSON_VALUE[per.isPunk ? 'punk' : per.id] || 5 : 5;
      s = baseV * (t.damaged || t.id === 'punk' || preferDestroy ? 1.5 : 0.95);
      // Bonus if clearing this person exposes a damaged camp!
      const colPeople = (obs.human.columns[t.col][0] ? 1 : 0) + (obs.human.columns[t.col][1] ? 1 : 0);
      if (colPeople === 1 && !obs.human.camps[t.col].destroyed && (t.damaged || t.id === 'punk' || preferDestroy)) {
        s += obs.human.camps[t.col].damaged ? 18 : 7;
      }
    }
    return { t, s };
  });
  scored.sort((a, b) => b.s - a.s);
  return scored[0].t;
}

function pickBestRestore(obs, restorables) {
  if (!restorables || restorables.length === 0) return null;
  const scored = restorables.map((r) => {
    if (r.type === 'camp') return { r, s: 50 + (isCardProtected(obs, 'bot', 'camp', r.col, 0, 'human') ? 0 : 20) };
    return { r, s: (PERSON_VALUE[r.id] || 5) * 2.2 };
  });
  scored.sort((a, b) => b.s - a.s);
  return scored[0].r;
}

function pickBestOwnSacrifice(obs) {
  const all = getAllPeople(obs, 'bot');
  if (all.length === 0) return null;
  const scored = all.map((x) => {
    let cost = PERSON_VALUE[x.person.isPunk ? 'punk' : x.person.id] || 5;
    if (x.person.damaged) cost *= 0.4;
    if (!x.person.ready) cost *= 0.85;
    // Penalize sacrificing the ONLY defender of a damaged camp!
    const colCount = (obs.bot.columns[x.col][0] ? 1 : 0) + (obs.bot.columns[x.col][1] ? 1 : 0);
    if (colCount === 1 && obs.bot.camps[x.col].damaged && !obs.bot.camps[x.col].destroyed) {
      cost += 14;
    }
    return { x, cost };
  });
  scored.sort((a, b) => a.cost - b.cost);
  return scored[0].x;
}

function pickBestPlacementForPerson(obs, cardId) {
  const empty = getEmptyPersonSlots(obs, 'bot');
  if (empty.length === 0) return null;
  const val = PERSON_VALUE[cardId] || 6;
  const isSquishyValuable = val >= 7.5;
  const scored = empty.map(({ col, slot }) => {
    let s = 0;
    const camp = obs.bot.camps[col];
    const cost = getPersonPlayCost(obs, 'bot', cardId, col);
    s -= cost * 4.5; // Holdout 0-cost or Oasis -1 discount!
    if (!camp.destroyed && camp.damaged) s += 8.0; // protect damaged camp!
    if (!camp.destroyed && !obs.bot.columns[col][0] && !obs.bot.columns[col][1]) s += 3.5; // cover naked camp
    if (isSquishyValuable && slot === 0) s += 2.5; // keep valuable in back
    if (isSquishyValuable && slot === 0 && obs.bot.columns[col][1]) s += 4.5; // hide behind existing front!
    if (!isSquishyValuable && slot === 1 && obs.bot.columns[col][0]) s += 3.0; // shield back person!
    return { col, slot, s };
  });
  scored.sort((a, b) => b.s - a.s);
  return scored[0];
}

function generateCandidateActions(obs) {
  const actions = [];
  const water = getTotalWater(obs.bot);
  const aliveBotCamps = obs.bot.camps.filter((c) => !c.destroyed).length;

  // 1. Play cards from hand (deduplicate by cardId)
  const seenHand = new Set();
  for (const cardId of obs.bot.hand) {
    if (cardId === '__unknown__' || seenHand.has(cardId)) continue;
    seenHand.add(cardId);
    const card = DECK_CARDS_BY_ID[cardId];
    if (!card) continue;

    if (card.type === 'person') {
      const place = pickBestPlacementForPerson(obs, cardId);
      if (place) {
        const cost = getPersonPlayCost(obs, 'bot', cardId, place.col);
        if (water >= cost) {
          const restoreTarget = card.enterPlay === 'restore' ? pickBestRestore(obs, getRestorableCards(obs, 'bot')) : null;
          actions.push({
            type: 'play_person',
            cardId,
            col: place.col,
            slot: place.slot,
            restoreTarget,
          });
        }
      }
    } else if (card.type === 'event') {
      if (water >= card.cost) {
        const zetoZero =
          obs.bot.flags.eventsPlayedThisTurn === 0 && hasActiveTrait(obs, 'bot', 'first_event_queue_zero');
        const effBomb = zetoZero ? 0 : card.bomb;
        const queueOk = effBomb === 0 || findEventQueueSlot(obs.bot.events, effBomb) !== null;
        if (queueOk) {
          actions.push({ type: 'play_event', cardId });
        }
      }
    }

    // 2. Junk card from hand (0 water!)
    const j = card.junk;
    if (j === 'water' || j === 'draw' || j === 'raid') {
      if (j !== 'raid' || obs.bot.events.includes('raiders') || findEventQueueSlot(obs.bot.events, 2) !== null) {
        actions.push({ type: 'junk_card', cardId });
      }
    } else if (j === 'punk' && getEmptyPersonSlots(obs, 'bot').length > 0) {
      actions.push({ type: 'junk_card', cardId });
    } else if (j === 'restore') {
      const rt = pickBestRestore(obs, getRestorableCards(obs, 'bot'));
      if (rt) actions.push({ type: 'junk_card', cardId, target: rt });
    } else if (j === 'injure') {
      const t = pickBestTarget(obs, getLegalTargets(obs, 'bot', 'unprotected_enemy_person'));
      if (t) actions.push({ type: 'junk_card', cardId, target: t });
    } else if (j === 'damage') {
      const t = pickBestTarget(obs, getLegalTargets(obs, 'bot', 'unprotected_enemy'));
      if (t) actions.push({ type: 'junk_card', cardId, target: t });
    }
  }

  // 3. Junk Water Silo if in hand (0 water -> +1 extra water!)
  if (obs.bot.waterSiloInHand) {
    actions.push({ type: 'junk_silo' });
  }

  // 4. Activate Ready Camps
  for (let col = 0; col < 3; col++) {
    const camp = obs.bot.camps[col];
    if (!camp || camp.destroyed || !camp.ready) continue;
    const def = CAMPS_BY_ID[camp.id];
    for (const ab of def.abilities) {
      const cost = getAbilityCost(obs, 'bot', ab);
      if (water < cost) continue;
      // Never suicide last camp!
      if ((ab.selfDamage || ab.kind === 'reactor') && aliveBotCamps <= 1 && (camp.damaged || ab.kind === 'reactor')) {
        continue;
      }
      if (ab.kind === 'arcade' && (countPeople(obs, 'bot') > 1 || getEmptyPersonSlots(obs, 'bot').length === 0)) continue;
      if (ab.kind === 'nest_of_spies' && obs.bot.flags.peoplePlayedThisTurn < 2) continue;
      if (ab.kind === 'transplant_lab' && (obs.bot.flags.peoplePlayedThisTurn < 2 || getRestorableCards(obs, 'bot').length === 0)) continue;
      if (ab.kind === 'watchtower' && !obs.bot.flags.anyEventResolvedThisTurn) continue;
      if (ab.kind === 'construction_yard' && (camp.damaged || countDestroyedCamps(obs, 'bot') === 0)) continue;
      if (ab.kind === 'training_camp' && countPunks(obs, 'bot') === 0) continue;
      if (ab.kind === 'omen_clock' && !obs.bot.events.some((e) => e !== null)) continue;
      if (ab.kind === 'adrenaline_lab') continue; // handled cleanly when damaged person exists below
      if (ab.kind === 'parachute_base') continue;
      if ((ab.kind === 'scavenger_water' || ab.kind === 'scavenger_punk' || ab.kind === 'warehouse') && obs.bot.hand.filter((c) => c !== '__unknown__').length === 0) continue;
      if (ab.kind === 'scavenger_punk' && getEmptyPersonSlots(obs, 'bot').length === 0) continue;
      if (ab.kind === 'cache_punk' && getEmptyPersonSlots(obs, 'bot').length === 0) continue;
      if (ab.kind === 'raid' && !obs.bot.events.includes('raiders') && findEventQueueSlot(obs.bot.events, 2) === null) continue;
      if ((ab.kind === 'restore' || ab.kind === 'cache_restore' || ab.kind === 'labor_camp' || ab.kind === 'bonfire') && getRestorableCards(obs, 'bot').length === 0) continue;
      if (ab.kind === 'atomic_garden' && getRestorableCards(obs, 'bot', true).length === 0) continue;
      if (ab.needsOwnPerson && countPeople(obs, 'bot') === 0) continue;

      let target = null;
      if (ab.needsTarget) {
        const legal = getLegalTargets(obs, 'bot', ab.needsTarget);
        if (legal.length === 0) continue;
        target = pickBestTarget(obs, legal, ab.kind === 'resonator');
      }
      const restoreTarget =
        ab.kind === 'atomic_garden'
          ? pickBestRestore(obs, getRestorableCards(obs, 'bot', true))
          : ['restore', 'cache_restore', 'labor_camp', 'transplant_lab'].includes(ab.kind)
            ? pickBestRestore(obs, getRestorableCards(obs, 'bot'))
            : null;
      const ownPerson = ab.needsOwnPerson ? pickBestOwnSacrifice(obs) : null;
      const discardCardId =
        ab.kind === 'scavenger_water' || ab.kind === 'scavenger_punk'
          ? pickWorstCardInHand(obs.bot.hand)
          : null;

      actions.push({
        type: 'activate_ability',
        source: { type: 'camp', col },
        abilityId: ab.id,
        target,
        restoreTarget,
        ownPerson,
        discardCardId,
      });
    }
  }

  // 5. Activate Ready People
  for (let col = 0; col < 3; col++) {
    for (let slot = 0; slot < 2; slot++) {
      const per = obs.bot.columns[col][slot];
      if (!per || per.damaged || !per.ready) continue;
      const abs = getAvailableAbilitiesForCard(obs, 'bot', 'person', col, slot);
      for (const ab of abs) {
        if (ab.kind === 'mimic') continue; // optional mimic handling below
        const cost = getAbilityCost(obs, 'bot', ab);
        if (water < cost) continue;
        if (ab.kind === 'doomsayer_damage' && !obs.human.events.some((e) => e !== null)) continue;
        if (ab.kind === 'rabble_damage' && countPunks(obs, 'bot') === 0) continue;
        if (ab.kind === 'gain_punk' && getEmptyPersonSlots(obs, 'bot').length === 0) continue;
        if (ab.kind === 'raid' && !obs.bot.events.includes('raiders') && findEventQueueSlot(obs.bot.events, 2) === null) continue;
        if (ab.kind === 'destroy_all_damaged_enemies' && !getAllPeople(obs, 'human').some((x) => x.person.damaged)) continue;
        if (ab.kind === 'injure_all_unprotected' && getLegalTargets(obs, 'bot', 'unprotected_enemy_person').length === 0) continue;
        if ((ab.kind === 'restore' || ab.kind === 'mutant_restore') && getRestorableCards(obs, 'bot').length === 0) continue;
        if (ab.kind === 'return_own_person') {
          // Only bounce damaged valuable people or enter-play-value people (avoid infinite self-bounce!)
          const bounceTarget = getAllPeople(obs, 'bot').find(
            (x) =>
              !x.person.isPunk &&
              x.person.id !== 'rescue_team' &&
              (x.person.damaged || ['wounded_soldier', 'repair_bot', 'vanguard', 'argo_yesky'].includes(x.person.id))
          );
          if (!bounceTarget) continue;
          actions.push({
            type: 'activate_ability',
            source: { type: 'person', col, slot },
            abilityId: ab.id,
            ownPerson: bounceTarget,
          });
          continue;
        }

        let target = null;
        let targetCol = undefined;
        if (ab.needsTarget === 'enemy_column') {
          const cols = getLegalTargets(obs, 'bot', 'enemy_column');
          if (cols.length === 0) continue;
          const bestCol = pickBestTarget(obs, cols);
          targetCol = bestCol.col;
        } else if (ab.needsTarget) {
          const legal = getLegalTargets(obs, 'bot', ab.needsTarget);
          if (legal.length === 0) continue;
          target = pickBestTarget(obs, legal, ab.kind === 'destroy_unprotected_person' || ab.kind === 'destroy_any_camp');
        }
        const restoreTarget =
          ab.kind === 'restore' || ab.kind === 'mutant_restore'
            ? pickBestRestore(obs, getRestorableCards(obs, 'bot'))
            : null;
        const ownPerson = ab.needsOwnPerson ? pickBestOwnSacrifice(obs) : null;

        actions.push({
          type: 'activate_ability',
          source: { type: 'person', col, slot },
          abilityId: ab.id,
          target,
          targetCol,
          restoreTarget,
          ownPerson,
        });
      }
    }
  }

  // 6. Take Water Silo (1 water)
  if (!obs.bot.waterSiloInHand && water >= 1) {
    actions.push({ type: 'take_silo' });
  }

  // 7. Buy Draw (2 water)
  if (water >= 2 && obs.deckCount > 0) {
    actions.push({ type: 'buy_draw' });
  }

  return actions;
}

function pickWorstCardInHand(hand) {
  const real = hand.filter((c) => c !== '__unknown__');
  if (real.length === 0) return null;
  const scored = real.map((cid) => {
    const def = DECK_CARDS_BY_ID[cid];
    const v = def?.type === 'person' ? PERSON_VALUE[cid] || 6 : 7;
    return { cid, v };
  });
  scored.sort((a, b) => a.v - b.v);
  return scored[0].cid;
}

function executeActionOnState(state, action, rng = Math.random, botChoiceFn = null) {
  switch (action.type) {
    case 'play_person':
      return playPerson(state, 'bot', action.cardId, action.col, action.slot, {
        rng,
        restoreTarget: action.restoreTarget,
      });
    case 'play_event':
      return playEvent(state, 'bot', action.cardId, { rng, botChoiceFn });
    case 'junk_card':
      return junkCard(state, 'bot', action.cardId, { rng, target: action.target, botChoiceFn });
    case 'junk_silo':
      return junkWaterSilo(state, 'bot');
    case 'activate_ability':
      return activateAbility(state, 'bot', action.source, action.abilityId, {
        rng,
        target: action.target,
        targetCol: action.targetCol,
        restoreTarget: action.restoreTarget,
        ownPerson: action.ownPerson,
        discardCardId: action.discardCardId,
        botChoiceFn,
      });
    case 'take_silo':
      return takeWaterSilo(state, 'bot');
    case 'buy_draw':
      return buyDrawCard(state, 'bot', rng);
    default:
      return { ok: false, error: 'Acción desconocida' };
  }
}

// === 5. BEAM-SEARCH MULTI-STEP TURN PLANNER ===
function chooseBestBotAction(obs, difficulty = 'tactical', rng = Math.random) {
  const baseScore = evaluateObservation(obs);
  const maxDepth = difficulty === 'ruthless' ? 5 : difficulty === 'tactical' ? 4 : 2;
  const beamWidth = difficulty === 'ruthless' ? 12 : difficulty === 'tactical' ? 8 : 5;

  let bestScore = baseScore;
  let bestFirstAction = null;

  let frontier = [{ obs, firstAction: null, score: baseScore }];

  for (let depth = 0; depth < maxDepth; depth++) {
    const nextFrontier = [];
    for (const node of frontier) {
      const candidates = generateCandidateActions(node.obs);
      for (const act of candidates) {
        const sim = makeSimStateFromObs(node.obs);
        const res = executeActionOnState(sim, act, () => 0.5, chooseBotDefensiveResponse);
        if (!res.ok) continue;
        if (sim.pendingChoice) {
          simApplyHumanChoicePessimistic(sim);
        }
        const nextObs = getBotObservation(sim);
        const sc = evaluateObservation(nextObs);
        const firstAct = node.firstAction || act;

        // Instant Lethal Shortcut!
        if (sc >= 9000) {
          return firstAct;
        }
        if (sc > bestScore + 0.15) {
          bestScore = sc;
          bestFirstAction = firstAct;
        }
        nextFrontier.push({ obs: nextObs, firstAction: firstAct, score: sc });
      }
    }
    if (nextFrontier.length === 0) break;
    nextFrontier.sort((a, b) => b.score - a.score);
    frontier = nextFrontier.slice(0, beamWidth);
  }

  // Casual mode occasionally picks 2nd best move for variety
  if (difficulty === 'casual' && frontier.length >= 2 && rng() < 0.25) {
    if (frontier[1].score > baseScore + 0.1) {
      return frontier[1].firstAction;
    }
  }

  return bestFirstAction; // null means End Turn!
}

// === 6. SMART BOT RESPONSES TO HUMAN EFFECTS ===
function chooseBotDefensiveResponse(obs, kind, payload) {
  switch (kind) {
    case 'raiders_camp':
    case 'juggernaut_camp': {
      // payload = array of alive camp col indices
      const scored = payload.map((col) => {
        const c = obs.bot.camps[col];
        let pain = CAMP_BASE_POWER[c.id] || 7;
        if (kind === 'raiders_camp' && c.damaged) pain += 100; // NEVER kill a damaged camp if an undamaged one exists!
        if (kind === 'juggernaut_camp' && c.damaged) pain -= 5; // If forced to destroy a camp, prefer sacrificing an already damaged one!
        return { col, pain };
      });
      scored.sort((a, b) => a.pain - b.pain);
      return scored[0].col;
    }

    case 'scud_target': {
      // payload = array of legal targets on bot's board
      const scored = payload.map((t) => {
        let pain = 0;
        if (t.type === 'camp') {
          pain = t.damaged ? 120 : 28;
        } else {
          const base = PERSON_VALUE[t.id] || 5;
          pain = t.id === 'punk' ? 7 : t.damaged ? base * 1.4 : base * 0.7;
        }
        return { t, pain };
      });
      scored.sort((a, b) => a.pain - b.pain);
      return scored[0].t;
    }

    case 'mercenary_choice': {
      const { canDiscard2, oppCards } = payload;
      // Pick least painful card to destroy
      const scored = oppCards.map((t) => {
        const pain = t.type === 'camp' ? 95 : (PERSON_VALUE[t.id] || 5) * (t.damaged ? 0.6 : 1.3);
        return { t, pain };
      });
      scored.sort((a, b) => a.pain - b.pain);
      const cheapestLoss = scored[0];
      // Discard 2 cards if losing the cheapest card hurts more than 9 pts (e.g. only camps or valuable people)
      if (canDiscard2 && (!cheapestLoss || cheapestLoss.pain > 9.5)) {
        const sortedHand = [...obs.bot.hand].sort(
          (a, b) => (PERSON_VALUE[a] || 6.5) - (PERSON_VALUE[b] || 6.5)
        );
        return { mode: 'discard', cards: sortedHand.slice(0, 2) };
      }
      return { mode: 'destroy', target: cheapestLoss.t };
    }

    case 'famine_keep': {
      // payload = array of { person, col, slot }
      const scored = payload.map((x) => ({
        uid: x.person.uid,
        v: personThreatValue(x.person, 'bot', obs),
      }));
      scored.sort((a, b) => b.v - a.v);
      return scored[0].uid;
    }

    case 'octagon_destroy': {
      const scored = payload.map((x) => ({
        x,
        v: personThreatValue(x.person, 'bot', obs),
      }));
      scored.sort((a, b) => a.v - b.v);
      return scored[0].x;
    }

    case 'vanguard_counter':
    case 'banish_target': {
      return pickBestTarget(obs, payload, kind === 'banish_target');
    }

    case 'napalm_col': {
      const cols = payload.map((col) => ({ type: 'column', owner: 'human', col }));
      return pickBestTarget(obs, cols).col;
    }

    case 'keep_one_card': {
      const sorted = [...payload].sort((a, b) => {
        const va = DECK_CARDS_BY_ID[a]?.type === 'person' ? PERSON_VALUE[a] || 6 : 8.2;
        const vb = DECK_CARDS_BY_ID[b]?.type === 'person' ? PERSON_VALUE[b] || 6 : 8.2;
        return vb - va;
      });
      return sorted[0];
    }

    case 'discard_n': {
      const { n, hand } = payload;
      const sorted = [...hand].sort((a, b) => {
        const va = DECK_CARDS_BY_ID[a]?.type === 'person' ? PERSON_VALUE[a] || 6 : 8.0;
        const vb = DECK_CARDS_BY_ID[b]?.type === 'person' ? PERSON_VALUE[b] || 6 : 8.0;
        return va - vb;
      });
      return sorted.slice(0, n);
    }

    default:
      return Array.isArray(payload) ? payload[0] : null;
  }
}

// === 7. EXECUTE SINGLE BOT ACTION STEP ===
function runBotStep(state, rng = Math.random) {
  if (state.phase !== 'playing' || state.activePlayer !== 'bot' || state.pendingChoice) {
    return { done: true, paused: !!state.pendingChoice, messages: [] };
  }

  const obs = getBotObservation(state);
  const action = chooseBestBotAction(obs, state.difficulty, rng);
  if (!action) {
    return { done: true, endedTurn: true, messages: [] };
  }

  const res = executeActionOnState(state, action, rng, chooseBotDefensiveResponse);
  if (!res.ok) {
    return { done: true, endedTurn: true, messages: [] };
  }

  const msg = decorateBanter(state.personality, res.message, action, rng);
  return {
    done: state.phase === 'gameover' || !!state.pendingChoice,
    paused: !!state.pendingChoice,
    gameOver: state.phase === 'gameover',
    endedTurn: false,
    message: msg,
  };
}

const WASTELAND_QUIPS = [
  'En el yermo nadie regala agua.',
  '¡A cubrir esos campamentos!',
  'Chatarra bien aprovechada.',
  'Se viene tormenta de arena.',
  'Cada gota cuenta.',
  'Ese flanco quedó regalado.',
];

function decorateBanter(personality, message, action, rng) {
  if (personality !== 'wasteland') return message;
  if (action.type === 'play_event' || (action.type === 'activate_ability' && rng() < 0.25)) {
    const quip = WASTELAND_QUIPS[Math.floor(rng() * WASTELAND_QUIPS.length)];
    return `${message} ${quip}`;
  }
  return message;
}


// ===== parser.js =====
// Offline Rioplatense / LatAm Spanish Voice & Chat Command Parser for Radlands Hybrid Bot
// Handles accents, voseo, spoken numbers, typos (Levenshtein), official Spanish + English card names + custom aliases.


function normalizeEs(str) {
  return String(str || '')
    .toLowerCase()
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g, '') // strip accents/diacritics
    .replace(/[¿?¡!.,;:()\[\]"'«»]/g, ' ')
    .replace(/\s+/g, ' ')
    .trim();
}

function levenshtein(a, b) {
  if (a === b) return 0;
  if (!a.length) return b.length;
  if (!b.length) return a.length;
  const v0 = new Array(b.length + 1);
  const v1 = new Array(b.length + 1);
  for (let i = 0; i <= b.length; i++) v0[i] = i;
  for (let i = 0; i < a.length; i++) {
    v1[0] = i + 1;
    for (let j = 0; j < b.length; j++) {
      const cost = a[i] === b[j] ? 0 : 1;
      v1[j + 1] = Math.min(v1[j] + 1, v0[j + 1] + 1, v0[j] + cost);
    }
    for (let j = 0; j <= b.length; j++) v0[j] = v1[j];
  }
  return v0[b.length];
}

// Build searchable phrase dictionary for cards
function buildCardSearchIndex(pool = 'all') {
  const custom = getCustomAliases();
  const list =
    pool === 'camps' ? CAMPS : pool === 'deck' ? DECK_CARDS : [...CAMPS, ...DECK_CARDS];

  const entries = [];
  for (const card of list) {
    const terms = new Set([
