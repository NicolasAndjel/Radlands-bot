}

function openCardInspector(type, side, col, slot) {
  const p = state[side];
  const isHuman = side === 'human';
  let title = '';
  let sub = '';
  let text = '';
  let visualCardId = '';
  let junkLine = '';
  const stateFlags = {};
  const actionBtns = [];

  if (type === 'camp') {
    const camp = p.camps[col];
    const def = CAMPS_BY_ID[camp.id];
    visualCardId = camp.id;
    stateFlags.damaged = camp.damaged;
    stateFlags.destroyed = camp.destroyed;
    stateFlags.ready = camp.ready && !camp.destroyed && !camp.damaged;
    title = `${def.nameEs} (${def.nameEn})`;
    sub = `${isHuman ? 'Tu campamento' : 'Campamento del Bot'} · ${COL_NAMES_ES[col]} · +${def.startingCards} cartas iniciales`;
    text = [def.traitTextEs, ...def.abilities.map((a) => a.textEs)].filter(Boolean).join('\n');

    if (isHuman && !camp.destroyed && camp.ready && state.activePlayer === 'human') {
      def.abilities.forEach((ab) => {
        actionBtns.push({
          label: `⚡ Usar: ${ab.textEs.split(':')[0]}`,
          cls: 'btn-cyan',
          cmd: `uso ${def.nameEs}${ab.kind === 'raid' ? ' asaltar' : ab.kind.includes('restore') ? ' restaurar' : ab.kind.includes('draw') ? ' robar' : ab.kind.includes('punk') ? ' punki' : ab.kind.includes('water') ? ' agua' : ''}`,
        });
      });
    }
    if (!camp.destroyed) {
      actionBtns.push({
        label: '💥 Dañar',
        cls: 'btn-danger',
        cmd: `daño ${isHuman ? 'mi' : 'tu'} ${def.nameEs}`,
      });
      if (camp.damaged && def.trait !== 'cannot_restore' && isHuman) {
        actionBtns.push({ label: '🔧 Restaurar', cls: 'btn-yellow', cmd: `restauro mi ${def.nameEs}` });
      }
    }
  } else {
    const per = p.columns[col][slot];
    if (!per) return;
    stateFlags.damaged = per.damaged;
    stateFlags.ready = per.ready && !per.damaged;
    if (per.isPunk) {
      visualCardId = 'punk_back';
      title = '🎭 Punki (Boca abajo)';
      sub = `${isHuman ? 'Tu Punki' : 'Punki del Bot'} · ${COL_NAMES_ES[col]} · ${SLOT_NAMES_ES[slot]}`;
      text = 'Cuenta como Persona. Se destruye con 1 solo daño o herida. Sin habilidades propias (salvo Argo Yesky).';
      if (isHuman && per.ready && getAvailableAbilitiesForCard(state, 'human', 'person', col, slot).length > 0) {
        actionBtns.push({ label: '⚡ Dañar (1💧 por Argo)', cls: 'btn-cyan', cmd: 'uso mi punki' });
      }
      actionBtns.push({
        label: '💥 Destruir Punki',
        cls: 'btn-danger',
        cmd: `destruyo ${isHuman ? 'mi' : 'tu'} punki en columna ${col + 1}`,
      });
    } else {
      const def = DECK_CARDS_BY_ID[per.id];
      visualCardId = per.id;
      title = `${def.nameEs} (${def.nameEn})`;
      sub = `${isHuman ? 'Tu persona' : 'Persona del Bot'} · ${COL_NAMES_ES[col]} · ${SLOT_NAMES_ES[slot]} · Costo ${def.cost}💧`;
      if (def.junk && JUNK_INFO[def.junk]) {
        junkLine = `Chatarra: ${JUNK_INFO[def.junk].icon} ${JUNK_INFO[def.junk].labelEs}`;
      }
      text = [def.traitTextEs, ...def.abilities.map((a) => a.textEs)].filter(Boolean).join('\n');
      if (isHuman && !per.damaged && per.ready && state.activePlayer === 'human') {
        const abs = getAvailableAbilitiesForCard(state, 'human', 'person', col, slot);
        abs.forEach((ab) => {
          actionBtns.push({
            label: `⚡ Activar (${ab.cost}💧)`,
            cls: 'btn-cyan',
            cmd: `uso ${def.nameEs}`,
          });
        });
      }
      actionBtns.push({
        label: '💥 Dañar',
        cls: 'btn-danger',
        cmd: `daño ${isHuman ? 'mi' : 'tu'} ${def.nameEs}`,
      });
      actionBtns.push({
        label: '☠️ Destruir',
        cls: 'btn-danger',
        cmd: `destruyo ${isHuman ? 'mi' : 'tu'} ${def.nameEs}`,
      });
      if (per.damaged && isHuman) {
        actionBtns.push({ label: '🔧 Restaurar', cls: 'btn-yellow', cmd: `restauro mi ${def.nameEs}` });
      }
      if (isHuman) {
        [0, 1, 2]
          .filter((c2) => c2 !== col)
          .forEach((c2) => {
            actionBtns.push({
              label: `↔ Mover a Col ${c2 + 1}`,
              cls: '',
              cmd: `muevo ${def.nameEs} a columna ${c2 + 1}`,
            });
          });
      }
    }
  }

  openGenericModal(
    title,
    `
      <div class="inspector-layout">
        ${renderInspectorArtColumnHTML(visualCardId, stateFlags)}
        <div class="inspector-info-col">
          <div style="font-size:12px;color:var(--text-dim);">${esc(sub)}</div>
          ${junkLine ? `<div style="font-size:11.5px;color:var(--yellow);font-weight:700;">${esc(junkLine)}</div>` : ''}
          <div style="white-space:pre-wrap;background:var(--bg-2);padding:10px;border-radius:8px;border:1px solid var(--border);">${esc(text)}</div>
          <div style="display:flex;flex-wrap:wrap;gap:6px;">
            ${actionBtns
              .map((b, i) => `<button class="btn btn-sm ${b.cls}" data-insp-act="${i}">${esc(b.label)}</button>`)
              .join('')}
          </div>
        </div>
      </div>
    `
  );
  bindInspectorCardArtControls(visualCardId, () => openCardInspector(type, side, col, slot));
  document.querySelectorAll('[data-insp-act]').forEach((b) => {
    b.addEventListener('click', () => {
      const cmd = actionBtns[parseInt(b.getAttribute('data-insp-act'), 10)].cmd;
      closeModal();
      submitCommand(cmd);
    });
  });
}

function getCurrentTableCardIds() {
  const ids = new Set();
  for (const side of ['bot', 'human']) {
    const p = state[side];
    if (!p) continue;
    (p.camps || []).forEach((c) => c?.id && ids.add(c.id));
    (p.columns || []).forEach((col) =>
      col.forEach((per) => {
        if (!per) return;
        ids.add(per.isPunk ? 'punk_back' : per.id);
      })
    );
    (p.events || []).forEach((ev) => ev && ids.add(ev));
  }
  (state.human?.hiddenHand || []).forEach((cid) => cid && ids.add(cid));
  ids.add('punk_back');
  ids.add('water_silo');
  ids.add('raiders');
  return ids;
}

function openArtManagerModal() {
  const tableIds = getCurrentTableCardIds();
  let filterTab = state.phase === 'playing' ? 'table' : 'all';
  let q = '';
  let unmatchedQueue = []; // { id, filename, blob, previewUrl }
  let urlCfg = getCardArtUrlConfig();

  const cleanupUnmatchedUrls = () => {
    unmatchedQueue.forEach((u) => {
      try { URL.revokeObjectURL(u.previewUrl); } catch {}
    });
    unmatchedQueue = [];
  };

  async function processIncomingFiles(fileList) {
    const files = Array.from(fileList || []);
    if (!files.length) return;
    let matchedCount = 0;
    let newUnmatched = 0;

    const imageEntries = [];
    for (const f of files) {
      if (/\.zip$/i.test(f.name)) {
        try {
          showToast(`Descomprimiendo ${f.name}...`);
          const ab = await f.arrayBuffer();
          const extracted = await extractImageFilesFromZip(ab);
          imageEntries.push(...extracted);
        } catch (err) {
          showToast(err?.message || 'No se pudo leer el archivo ZIP.');
        }
      } else if (/\.json$/i.test(f.name)) {
        try {
          const text = await f.text();
          const count = await importCardArtPackJson(text);
          renderAll();
          renderArtGrid();
          showToast(`Pack importado: ${count} imágenes cargadas.`);
          return;
        } catch {
          showToast('Archivo JSON inválido.');
        }
      } else if (f.type.startsWith('image/') || /\.(png|jpe?g|webp|gif)$/i.test(f.name)) {
        imageEntries.push({ filename: f.name, blob: f });
      }
    }

    for (const entry of imageEntries) {
      const cardId = matchFilenameToCardId(entry.filename);
      if (cardId) {
        try {
          await saveCardArtFromBlob(cardId, entry.blob);
          matchedCount += 1;
        } catch {}
      } else {
        unmatchedQueue.push({
          uid: `u_${Date.now()}_${Math.random().toString(36).slice(2, 7)}`,
          filename: entry.filename,
          blob: entry.blob,
          previewUrl: URL.createObjectURL(entry.blob),
        });
        newUnmatched += 1;
      }
    }

    renderAll();
    renderArtGrid();
    if (matchedCount > 0 && newUnmatched === 0) {
      showToast(`¡Listo! Se cargaron automáticamente ${matchedCount} imágenes.`);
    } else if (matchedCount > 0 && newUnmatched > 0) {
      showToast(`${matchedCount} asignadas automáticamente y ${newUnmatched} para elegir abajo.`);
    } else if (newUnmatched > 0) {
      showToast(`${newUnmatched} imagen(es) sin nombre reconocido: asignalas abajo en 1 clic.`);
    } else {
      showToast('No se encontraron imágenes válidas en los archivos elegidos.');
    }
  }

  const renderArtGrid = () => {
    const countEl = document.getElementById('art-mgr-count');
    if (countEl) {
      countEl.textContent = `${getLoadedArtCount()} / ${ALL_VISUAL_CARDS.length} cargadas`;
    }

    // Unmatched manual assignment panel
    const unmEl = document.getElementById('art-unmatched-box');
    if (unmEl) {
      if (unmatchedQueue.length === 0) {
        unmEl.innerHTML = '';
      } else {
        const optsHtml = ALL_VISUAL_CARDS.map(
          (c) => `<option value="${c.id}">${esc(c.nameEs)} (${esc(c.nameEn)})</option>`

        unmEl.innerHTML = `
          <div class="unmatched-panel">
            <div style="display:flex;justify-content:space-between;align-items:center;">
              <strong style="font-size:12px;color:var(--yellow);">⚠️ ${unmatchedQueue.length} archivo(s) sin coincidencia automática</strong>
              <button class="btn btn-sm btn-ghost" id="btn-clear-unmatched">Descartar</button>
            </div>
            ${unmatchedQueue

        document.getElementById('btn-clear-unmatched')?.addEventListener('click', () => {

    const qn = normalizeEs(q);

        normalizeEs(c.nameEs).includes(qn) ||
        normalizeEs(c.nameEn).includes(qn) ||

    const gridEl = document.getElementById('art-mgr-grid');

          </div>

    const singleInput = document.getElementById('art-single-input');
    gridEl.querySelectorAll('[data-art-pick-one]').forEach((btn) => {
      btn.addEventListener('click', () => {
        const cid = btn.getAttribute('data-art-pick-one');

        renderAll();
        renderArtGrid();
      });
    });

    gridEl.querySelectorAll('[data-art-del-one]').forEach((btn) => {
      btn.addEventListener('click', async () => {
        const cid = btn.getAttribute('data-art-del-one');
        await deleteCardArt(cid);
        renderAll();
        renderArtGrid();
      });
    });
  };

  openGenericModal(
    '🖼️ Imágenes Oficiales de tus Cartas (Privado en tu dispositivo)',

      <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;">

      </div>

      <div class="art-dropzone" id="art-dropzone">

          <button class="btn btn-sm btn-cyan" id="btn-art-upload-files">🖼️ Elegir fotos o ZIP</button>

      renderArtGrid();

function openDrawModal() {
  let q = '';
  const renderList = () => {
    const qn = normalizeEs(q);
    const items = DECK_CARDS.filter((c) => {
      if (!qn) return true;
      return (
        normalizeEs(c.nameEs).includes(qn) ||
        normalizeEs(c.nameEn).includes(qn) ||
        (c.aliases || []).some((a) => normalizeEs(a).includes(qn))
      );
    });
    const listEl = document.getElementById('draw-modal-list');
    if (!listEl) return;
    listEl.innerHTML = items
      .map((c) => {
        const pubUsed = countCopiesInPublicZones(state, c.id);
        const exhausted = pubUsed >= c.copies;
        const junk = JUNK_INFO[c.junk];
        return `
          <div class="catalog-item" style="${exhausted ? 'opacity:0.45;' : 'cursor:pointer;'}" data-draw-pick="${c.id}">

              <div class="catalog-mini-card">

      .join('');

      el.addEventListener('click', () => {
        const cid = el.getAttribute('data-draw-pick');

async function toggleFastModePreference(forcedValue = null) {
  const next = forcedValue === null ? !prefs.fastMode : Boolean(forcedValue);
  prefs.fastMode = next;
  savePrefs();
  const res = setFastMode(state, next, Math.random, chooseBotDefensiveResponse);
  persistState();
  renderAll();
  showToast(
    next
      ? '⚡ Modo Rápido ON: jugá o desechá sin cantar cada robo.'
      : '🛡️ Modo Fiel ON: cantás tus robos para tracking exacto de mano.'
  );
  if (state.phase === 'playing' && state.activePlayer === 'bot' && !state.pendingChoice && res?.ok) {
    if (res.botVoiceMessages?.length) {
      await speakLines(res.botVoiceMessages, { resumeMic: false });
    }
    await runAnimatedBotTurn();
  }
}

function openStatsModal() {
  const stats = computeMatchStats();
  const diffNames = { casual: 'Casual', tactical: 'Táctico', ruthless: 'Despiadado' };

  const diffRows = ['casual', 'tactical', 'ruthless']
    .map((k) => {
      const d = stats.byDifficulty[k] || { total: 0, wins: 0, losses: 0, draws: 0 };
      const wr = d.total > 0 ? Math.round((d.wins / d.total) * 100) : 0;
      return `
        <div class="stats-row-card" style="flex-direction:row;justify-content:space-between;align-items:center;">
          <strong>${diffNames[k]}</strong>
          <span style="color:var(--text-dim);">${d.wins}V · ${d.losses}D · ${d.draws}E (${wr}%)</span>
        </div>
      `;
    })
    .join('');

  const topCampsHtml =
    stats.topCamps.length === 0
      ? `<div style="font-size:12px;color:var(--text-muted);">Jugá tu primera partida completa para ver tus mejores campamentos.</div>`
      : `<div style="display:flex;gap:6px;flex-wrap:wrap;">
          ${stats.topCamps
            .map((c) => {
              const name = CAMPS_BY_ID[c.id]?.nameEs || c.id;
              return `<span class="pill cyan">${esc(name)} · ${c.wins}/${c.games}V</span>`;
            })
            .join('')}
        </div>`;

  const recentHtml =
    stats.recent.length === 0
      ? `<div style="font-size:12px;color:var(--text-muted);">Todavía no hay partidas terminadas en el historial.</div>`
      : stats.recent
          .map((m) => {
            const badge =
              m.winner === 'human'
                ? '<span class="pill green" style="font-size:10px;padding:1px 7px;">🏆 Victoria</span>'
                : m.winner === 'bot'
                  ? '<span class="pill magenta" style="font-size:10px;padding:1px 7px;">🤖 Derrota</span>'
                  : '<span class="pill yellow" style="font-size:10px;padding:1px 7px;">🤝 Empate</span>';
            const dt = new Date(m.dateIso).toLocaleDateString('es-AR', {
              day: '2-digit',
              month: 'short',
              hour: '2-digit',
              minute: '2-digit',
            });
            const hCamps = (m.humanCamps || []).map((id) => CAMPS_BY_ID[id]?.nameEs || id).join(', ');
            const bCamps = (m.botCamps || []).map((id) => CAMPS_BY_ID[id]?.nameEs || id).join(', ');
            return `
              <div class="stats-row-card">
                <div style="display:flex;justify-content:space-between;align-items:center;gap:6px;flex-wrap:wrap;">
                  <div style="display:flex;align-items:center;gap:6px;">
                    ${badge}
                    <span style="font-size:11px;color:var(--text-dim);">${diffNames[m.difficulty] || m.difficulty} · ${m.turns} turnos${m.fastMode ? ' · ⚡ Rápido' : ''}</span>
                  </div>
                  <span style="font-size:10.5px;color:var(--text-muted);">${esc(dt)}</span>
                </div>
                <div style="font-size:11px;color:var(--cyan);">Vos: ${esc(hCamps)}</div>
                <div style="font-size:11px;color:#ff8cc2;">Bot: ${esc(bCamps)}</div>
              </div>
            `;
          })
          .join('');

  openGenericModal(
    '🏆 Historial de Partidas y Estadísticas',
    `
      <div class="stats-kpi-grid">
        <div class="stats-kpi">
          <div class="stats-kpi-val">${stats.total}</div>
          <div class="stats-kpi-lbl">Partidas</div>
        </div>
        <div class="stats-kpi">
          <div class="stats-kpi-val" style="color:var(--green);">${stats.wins}</div>
          <div class="stats-kpi-lbl">Victorias</div>
        </div>
        <div class="stats-kpi">
          <div class="stats-kpi-val" style="color:#ff7ab6;">${stats.losses}</div>
          <div class="stats-kpi-lbl">Derrotas (${stats.draws}E)</div>
        </div>
        <div class="stats-kpi">
          <div class="stats-kpi-val" style="color:var(--yellow);">${stats.winRate}%</div>
          <div class="stats-kpi-lbl">Win Rate · ~${stats.avgTurns} turnos</div>
        </div>
      </div>

      <div style="font-size:12px;font-weight:700;color:var(--text-dim);margin-top:2px;">Por dificultad</div>
      <div style="display:flex;flex-direction:column;gap:5px;">${diffRows}</div>

      <div style="font-size:12px;font-weight:700;color:var(--text-dim);margin-top:2px;">Tus campamentos más ganadores</div>
      ${topCampsHtml}

      <div style="display:flex;justify-content:space-between;align-items:center;margin-top:4px;">
        <span style="font-size:12px;font-weight:700;color:var(--text-dim);">Últimas partidas</span>
        ${stats.total > 0 ? '<button class="btn btn-sm btn-danger" id="btn-clear-stats">🗑️ Borrar historial</button>' : ''}
      </div>
      <div style="display:flex;flex-direction:column;gap:6px;">${recentHtml}</div>
    `,
    { wide: true }
  );

  document.getElementById('btn-clear-stats')?.addEventListener('click', () => {
    if (!confirm('¿Borrar todo el historial de partidas guardado en este dispositivo?')) return;
    clearMatchHistory();
    openStatsModal();
    showToast('Historial borrado.');
  });
}

    savePrefs();
  });
  document.getElementById('set-dict-autosend').addEventListener('change', (e) => {
    prefs.dictationAutoSend = e.target.checked;
    savePrefs();
    renderTopbar();
    updateVoiceIndicator();
  });
  document.getElementById('set-dict-delay').addEventListener('change', (e) => {
    prefs.dictationDelayMs = parseInt(e.target.value, 10);
    savePrefs();
  });
  document.getElementById('set-autosend').addEventListener('change', (e) => {
    prefs.autoSendVoice = e.target.checked;
    savePrefs();
  });
  document.getElementById('btn-settings-dl-offline')?.addEventListener('click', downloadStandaloneHtml);
  document.getElementById('btn-export-save').addEventListener('click', () => {
    const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `radlands_turno_${state.turn}.json`;
    a.click();
    URL.revokeObjectURL(url);
  });
  document.getElementById('btn-import-save').addEventListener('click', () => {
    document.getElementById('import-file-input').click();
  });
  document.getElementById('import-file-input').addEventListener('change', (e) => {
    const f = e.target.files?.[0];
    if (!f) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const loaded = JSON.parse(String(reader.result));
        if (loaded && loaded.phase && loaded.bot && loaded.human) {
          state = loaded;
          persistState();
          closeModal();
          renderAll();
          showToast('Partida importada correctamente.');
        }
      } catch {
        showToast('Archivo JSON inválido.');
      }
    };
    reader.readAsText(f);
  });
}

function downloadStandaloneHtml() {
  try {
    const clone = document.documentElement.cloneNode(true);
    // Clear dynamic runtime content so the downloaded file boots cleanly offline
    ['topbar-meta', 'arena-pane', 'chat-feed', 'pending-container', 'autocomplete-box', 'quick-chips', 'modal-root', 'card-hover-zoom'].forEach((id) => {
      const el = clone.querySelector('#' + id);
      if (el) el.innerHTML = '';
    });
    const htmlStr = '<!DOCTYPE html>\n' + clone.outerHTML;
    const blob = new Blob([htmlStr], { type: 'text/html;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'radlands_bot.html';
    a.click();
    URL.revokeObjectURL(url);
    showToast('Descargando radlands_bot.html (100% offline).');
  } catch {
    showToast('No se pudo iniciar la descarga directa en este visor.');
  }
}

let deferredInstallPrompt = null;

function registerPwaSupport() {
  try {
    if (window.origin === 'null' || location.protocol === 'file:') return;
    if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    }
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredInstallPrompt = e;
      const btn = document.getElementById('btn-install-pwa');
      if (btn) btn.classList.remove('hidden');
    });
    window.addEventListener('appinstalled', () => {
      deferredInstallPrompt = null;
      document.getElementById('btn-install-pwa')?.classList.add('hidden');
      showToast('¡Radlands Bot instalado como app! Ya funciona 100% offline.');
    });
    document.getElementById('btn-install-pwa')?.addEventListener('click', async () => {
      if (!deferredInstallPrompt) return;
      deferredInstallPrompt.prompt();
      try { await deferredInstallPrompt.userChoice; } catch {}
      deferredInstallPrompt = null;
      document.getElementById('btn-install-pwa')?.classList.add('hidden');
    });
  } catch {}
}

// === BOOTSTRAP ===
function initApp() {
  registerPwaSupport();

  // Global fallback if a user-configured external/local URL image fails to load
  document.addEventListener(
    'error',
    (e) => {
      const target = e.target;
      if (target && target.tagName === 'IMG' && target.hasAttribute('data-art-img-id')) {
        const src = target.getAttribute('src');
        if (src && !src.startsWith('data:')) {
          markCardArtUrlBroken(src);
          renderArena();
        }
      }
    },
    true
  );

  // Global Ctrl+V clipboard image paste into active card inspector or art manager tile
  document.addEventListener('paste', async (e) => {
    if (!activePasteCardId) return;
    const items = e.clipboardData?.items;
    if (!items) return;
    for (const item of items) {
      if (item.type && item.type.startsWith('image/')) {
        const blob = item.getAsFile();
        if (!blob) continue;
        e.preventDefault();
        const targetId = activePasteCardId;
        const cb = onPasteArtApplied;
        try {
          await saveCardArtFromBlob(targetId, blob);
          renderAll();
          showToast(`Imagen pegada en ${VISUAL_CARDS_BY_ID[targetId]?.nameEs || targetId}.`);
          if (typeof cb === 'function') cb();
        } catch {
          showToast('No se pudo procesar la imagen pegada.');
        }
        return;
      }
    }
  });

  // Hide desktop hover magnifier when scrolling arena
  document.getElementById('arena-pane')?.addEventListener('scroll', hideCardHoverZoom, { passive: true });

  // Preload voices
  if (typeof speechSynthesis !== 'undefined') {
    speechSynthesis.getVoices();
    speechSynthesis.onvoiceschanged = () => speechSynthesis.getVoices();
  }

  // Mobile tabs
  document.querySelectorAll('[data-mtab]').forEach((btn) => {
    btn.addEventListener('click', () => {
      mobileTab = btn.getAttribute('data-mtab');
      document.querySelectorAll('[data-mtab]').forEach((x) => x.classList.toggle('active', x === btn));
      document.getElementById('workspace')?.setAttribute('data-mobile-tab', mobileTab);
    });
  });

  // Topbar buttons
  document.getElementById('btn-tts-toggle')?.addEventListener('click', () => {
    prefs.ttsEnabled = !prefs.ttsEnabled;
    if (!prefs.ttsEnabled && typeof speechSynthesis !== 'undefined') speechSynthesis.cancel();
    savePrefs();
    renderTopbar();
  });
  document.getElementById('btn-sfx-toggle')?.addEventListener('click', () => {
    prefs.sfxEnabled = !prefs.sfxEnabled;
    savePrefs();
    renderTopbar();
    if (prefs.sfxEnabled) playSfx('restore', true);
  });
  document.getElementById('btn-board-view')?.addEventListener('click', () => {
    prefs.boardView = prefs.boardView === 'bot_only' ? 'both' : 'bot_only';
    savePrefs();
    renderTopbar();
    renderArena();
    showToast(
      prefs.boardView === 'bot_only'
        ? '🤖 Vista Solo Bot: cartas de la IA agrandadas y tu mesa en barra compacta.'
        : '⚔️ Vista completa: ambas mesas visibles.'
    );
  });
  document.getElementById('btn-fast-mode')?.addEventListener('click', () => {
    toggleFastModePreference();
  });
  document.getElementById('btn-stats')?.addEventListener('click', openStatsModal);
  document.getElementById('btn-handsfree')?.addEventListener('click', () => {
    if (isMicOriginBlocked()) {
      prefs.dictationAutoSend = !prefs.dictationAutoSend;
      if (!prefs.dictationAutoSend) cancelDictationAutoSend();
      savePrefs();
      renderTopbar();
      updateVoiceIndicator();
      showToast(
        prefs.dictationAutoSend
          ? '⚡ Auto-dictado ON: apretá Fn×2 (o 🎙️ del teclado) y al pausar se envía solo.'
          : 'Auto-dictado OFF: dictás y apretás Enter o Enviar.'
      );
      refocusChatInputIfSafe();
      return;
    }
    if (!SpeechRec) {
      openMicHelpModal('Manos libres requiere reconocimiento de voz web (Chrome/Edge en localhost).');
      return;
    }
    prefs.handsFree = !prefs.handsFree;
    savePrefs();
    renderTopbar();
    if (prefs.handsFree) startListening();
    else stopListening();
  });
  document.getElementById('btn-art-manager')?.addEventListener('click', openArtManagerModal);
  document.getElementById('btn-card-size')?.addEventListener('click', () => {
    prefs.cardSize = prefs.cardSize === 'large' ? 'normal' : 'large';
    savePrefs();
    renderTopbar();
    renderArena();
  });
  document.getElementById('btn-cancel-autosend')?.addEventListener('click', () => {
    cancelDictationAutoSend();
    document.getElementById('chat-input')?.focus();
  });
  document.getElementById('btn-mic-guide')?.addEventListener('click', () => openMicHelpModal());
  document.getElementById('btn-catalog')?.addEventListener('click', openCatalogModal);
  document.getElementById('btn-download-offline')?.addEventListener('click', downloadStandaloneHtml);
  document.getElementById('btn-settings')?.addEventListener('click', openSettingsModal);
  document.getElementById('btn-undo')?.addEventListener('click', () => submitCommand('deshacer'));
  document.getElementById('btn-new-game')?.addEventListener('click', () => {
    if (state.phase === 'setup_camps' || confirm('¿Empezar una partida nueva de Radlands?')) {
      setupSelectedCamps = [];
      setupExcludedCamps = [];
      submitCommand('nueva partida');
    }
  });

  // Chat input & Mic
  const inputEl = document.getElementById('chat-input');
  const sendBtn = document.getElementById('send-btn');
  const micBtn = document.getElementById('mic-btn');

  inputEl?.addEventListener('compositionstart', () => {
    isComposing = true;
    cancelDictationAutoSend();
    const txt = document.getElementById('voice-status-text');
    const dot = document.getElementById('mic-dot');
    if (dot) dot.className = 'mic-dot listening';
    if (txt) txt.textContent = '🎙️ Dictando...';
  });
  inputEl?.addEventListener('compositionend', (e) => {
    isComposing = false;
    renderAutocomplete(inputEl.value);
    scheduleDictationAutoSend(inputEl.value);
  });
  inputEl?.addEventListener('input', (e) => {
    renderAutocomplete(e.target.value);
    if (!isComposing) {
      scheduleDictationAutoSend(e.target.value);
    }
  });
  inputEl?.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      cancelDictationAutoSend();
      return;
    }
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      cancelDictationAutoSend();
      submitCommand(inputEl.value);
    }
  });
  sendBtn?.addEventListener('click', () => submitCommand(inputEl.value));
  micBtn?.addEventListener('click', toggleMic);

  renderAll();
  initCardArtStore().then((count) => {
    if (count > 0) renderAll();
  });
  refocusChatInputIfSafe();
}

if (typeof document !== 'undefined') {
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initApp);
  } else {
    initApp();
  }
}

})();

</script>
</body>
</html>
