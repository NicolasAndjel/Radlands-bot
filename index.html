}

function openCardInspector(type, side, col, slot) {
  const p = state[side];
  const isHuman = side === 'human';
  let title = '';
  let sub = '';
  let text = '';
  const actionBtns = [];

  if (type === 'camp') {
    const camp = p.camps[col];
    const def = CAMPS_BY_ID[camp.id];
    title = `${def.nameEs} (${def.nameEn})`;
    sub = `${isHuman ? 'Tu campamento' : 'Campamento del Bot'} · ${COL_NAMES_ES[col]} · +${def.startingCards} cartas iniciales`;
    text = [def.traitTextEs, ...def.abilities.map((a) => a.textEs)].filter(Boolean).join('\n');

    if (isHuman && !camp.destroyed && camp.ready && state.activePlayer === 'human') {
      def.abilities.forEach((ab) => {
        actionBtns.push({
          label: `⚡ Usar: ${ab.textEs.split(':')[0]}`,
          cls: 'btn-cyan',
          cmd: `uso ${def.nameEs}${ab.kind === 'raid' ? ' asaltar' : ab.kind.includes('restore') ? ' restaurar' : ab.kind.includes('draw') ? ' robar' : ab.kind.includes('punk') ? ' punki' : ab.kind.includes('water') ? ' agua' : ''}`,
        });
      });
    }
    if (!camp.destroyed) {
      actionBtns.push({
        label: '💥 Dañar',
        cls: 'btn-danger',
        cmd: `daño ${isHuman ? 'mi' : 'tu'} ${def.nameEs}`,
      });
      if (camp.damaged && def.trait !== 'cannot_restore' && isHuman) {
        actionBtns.push({ label: '🔧 Restaurar', cls: 'btn-yellow', cmd: `restauro mi ${def.nameEs}` });
      }
    }
  } else {
    const per = p.columns[col][slot];
    if (!per) return;
    if (per.isPunk) {
      title = '🎭 Punki (Boca abajo)';
      sub = `${isHuman ? 'Tu Punki' : 'Punki del Bot'} · ${COL_NAMES_ES[col]} · ${SLOT_NAMES_ES[slot]}`;
      text = 'Cuenta como Persona. Se destruye con 1 solo daño o herida. Sin habilidades propias (salvo Argo Yesky).';
      if (isHuman && per.ready && getAvailableAbilitiesForCard(state, 'human', 'person', col, slot).length > 0) {
        actionBtns.push({ label: '⚡ Dañar (1💧 por Argo)', cls: 'btn-cyan', cmd: 'uso mi punki' });
      }
      actionBtns.push({
        label: '💥 Destruir Punki',
        cls: 'btn-danger',
        cmd: `destruyo ${isHuman ? 'mi' : 'tu'} punki en columna ${col + 1}`,
      });
    } else {
      const def = DECK_CARDS_BY_ID[per.id];
      title = `${def.nameEs} (${def.nameEn})`;
      sub = `${isHuman ? 'Tu persona' : 'Persona del Bot'} · ${COL_NAMES_ES[col]} · ${SLOT_NAMES_ES[slot]} · Costo ${def.cost}💧`;
      text = [def.traitTextEs, ...def.abilities.map((a) => a.textEs)].filter(Boolean).join('\n');
      if (isHuman && !per.damaged && per.ready && state.activePlayer === 'human') {
        const abs = getAvailableAbilitiesForCard(state, 'human', 'person', col, slot);
        abs.forEach((ab) => {
          actionBtns.push({
            label: `⚡ Activar (${ab.cost}💧)`,
            cls: 'btn-cyan',
            cmd: `uso ${def.nameEs}`,
          });
        });
      }
      actionBtns.push({
        label: '💥 Dañar',
        cls: 'btn-danger',
        cmd: `daño ${isHuman ? 'mi' : 'tu'} ${def.nameEs}`,
      });
      actionBtns.push({
        label: '☠️ Destruir',
        cls: 'btn-danger',
        cmd: `destruyo ${isHuman ? 'mi' : 'tu'} ${def.nameEs}`,
      });
      if (per.damaged && isHuman) {
        actionBtns.push({ label: '🔧 Restaurar', cls: 'btn-yellow', cmd: `restauro mi ${def.nameEs}` });
      }
      if (isHuman) {
        [0, 1, 2]
          .filter((c2) => c2 !== col)
          .forEach((c2) => {
            actionBtns.push({
              label: `↔ Mover a Col ${c2 + 1}`,
              cls: '',
              cmd: `muevo ${def.nameEs} a columna ${c2 + 1}`,
            });
          });
      }
    }
  }

  openGenericModal(
    title,
    `
      <div style="font-size:12px;color:var(--text-dim);">${esc(sub)}</div>
      <div style="white-space:pre-wrap;background:var(--bg-2);padding:10px;border-radius:8px;border:1px solid var(--border);">${esc(text)}</div>
      <div style="display:flex;flex-wrap:wrap;gap:6px;">
        ${actionBtns
          .map((b, i) => `<button class="btn btn-sm ${b.cls}" data-insp-act="${i}">${esc(b.label)}</button>`)
          .join('')}
      </div>
    `
  );
  document.querySelectorAll('[data-insp-act]').forEach((b) => {
    b.addEventListener('click', () => {
      const cmd = actionBtns[parseInt(b.getAttribute('data-insp-act'), 10)].cmd;
      closeModal();
      submitCommand(cmd);
    });
  });
}

function openDrawModal() {
  let q = '';
  const renderList = () => {
    const qn = normalizeEs(q);
    const items = DECK_CARDS.filter((c) => {
      if (!qn) return true;
      return (
        normalizeEs(c.nameEs).includes(qn) ||
        normalizeEs(c.nameEn).includes(qn) ||
        (c.aliases || []).some((a) => normalizeEs(a).includes(qn))
      );
    });
    const listEl = document.getElementById('draw-modal-list');
    if (!listEl) return;
    listEl.innerHTML = items
      .map((c) => {
        const pubUsed = countCopiesInPublicZones(state, c.id);
        const exhausted = pubUsed >= c.copies;
        const junk = JUNK_INFO[c.junk];
        return `
          <div class="catalog-item" style="${exhausted ? 'opacity:0.45;' : 'cursor:pointer;'}" data-draw-pick="${c.id}">
            <div class="card-top-row">
              <strong>${esc(c.nameEs)}</strong>
              <span class="pill ${exhausted ? '' : 'cyan'}" style="font-size:10px;padding:1px 6px;">${c.cost}💧 · ${c.copies - pubUsed}/${c.copies}</span>
            </div>
            <div style="font-size:11px;color:var(--text-dim);">${esc(c.nameEn)} · ${c.type === 'event' ? `Evento B${c.bomb}` : 'Persona'} · ${junk.icon} ${junk.shortEs}</div>
          </div>
        `;
      })
      .join('');
    listEl.querySelectorAll('[data-draw-pick]').forEach((el) => {
      el.addEventListener('click', () => {
        const cid = el.getAttribute('data-draw-pick');
        const c = DECK_CARDS_BY_ID[cid];
        submitCommand(`robé ${c.nameEs}`);
        if (state.human.pendingDraws === 0) closeModal();
        else renderList();
      });
    });
  };

  openGenericModal(
    `Registrar carta física robada (Oculta para la IA)`,
    `
      <div style="font-size:12px;color:var(--text-dim);">
        Tocá la carta que robaste de tu mazo físico. Se descuenta del mazo compartido y <strong>el bot nunca puede verla</strong>.
        ${state.human.pendingDraws > 0 ? `<br><strong style="color:var(--yellow);">Pendientes de registrar: ${state.human.pendingDraws}</strong>` : ''}
      </div>
      <input id="draw-modal-search" class="search-input" type="text" placeholder="Buscar carta por nombre español o inglés..." />
      <div class="catalog-list" id="draw-modal-list"></div>
    `
  );
  const s = document.getElementById('draw-modal-search');
  s.focus();
  s.addEventListener('input', (e) => {
    q = e.target.value;
    renderList();
  });
  renderList();
}

function openCatalogModal() {
  let tab = 'camps';
  let q = '';
  const renderCat = () => {
    const qn = normalizeEs(q);
    const custom = getCustomAliases();
    const list =
      tab === 'camps'
        ? CAMPS
        : tab === 'people'
          ? DECK_CARDS.filter((c) => c.type === 'person')
          : DECK_CARDS.filter((c) => c.type === 'event');
    const filtered = list.filter((c) => {
      if (!qn) return true;
      return (
        normalizeEs(c.nameEs).includes(qn) ||
        normalizeEs(c.nameEn).includes(qn) ||
        (c.aliases || []).some((a) => normalizeEs(a).includes(qn)) ||
        (custom[c.id] || []).some((a) => normalizeEs(a).includes(qn))
      );
    });
    const el = document.getElementById('cat-list');
    if (!el) return;
    el.innerHTML = filtered
      .map((c) => {
        const desc =
          tab === 'camps'
            ? [c.traitTextEs, ...c.abilities.map((a) => a.textEs)].filter(Boolean).join(' | ')
            : c.type === 'event'
              ? `Bomba ${c.bomb} · ${c.textEs}`
              : [c.traitTextEs, ...c.abilities.map((a) => a.textEs)].filter(Boolean).join(' | ');
        const custList = custom[c.id] || [];
        return `
          <div class="catalog-item">
            <div class="card-top-row">
              <strong>${esc(c.nameEs)}</strong>
              <span class="pill" style="font-size:10px;padding:1px 6px;">${
                tab === 'camps' ? `+${c.startingCards}🃏` : `${c.cost}💧 · x${c.copies}`
              }</span>
            </div>
            <div style="font-size:10px;color:var(--text-muted);">${esc(c.nameEn)}${c.junk ? ` · Chatarra: ${JUNK_INFO[c.junk].icon} ${JUNK_INFO[c.junk].shortEs}` : ''}</div>
            <div style="font-size:11px;color:var(--text-dim);">${esc(desc)}</div>
            <div style="display:flex;gap:4px;margin-top:4px;align-items:center;">
              <input class="search-input" style="padding:4px 7px;font-size:11px;" placeholder="Agregar alias de tu carta..." data-alias-input="${c.id}" />
              <button class="btn btn-sm" data-alias-save="${c.id}">+ Alias</button>
            </div>
            ${
              custList.length
                ? `<div style="font-size:10px;color:var(--cyan);">Tus alias: ${esc(custList.join(', '))} <button class="secret-reveal-btn" data-alias-clear="${c.id}">borrar</button></div>`
                : ''
            }
          </div>
        `;
      })
      .join('');

    el.querySelectorAll('[data-alias-save]').forEach((b) => {
      b.addEventListener('click', () => {
        const id = b.getAttribute('data-alias-save');
        const inp = el.querySelector(`[data-alias-input="${id}"]`);
        if (inp && inp.value.trim()) {
          saveCustomAlias(id, inp.value.trim());
          showToast(`Alias "${inp.value.trim()}" guardado para ${ALL_CARDS_BY_ID[id].nameEs}`);
          renderCat();
        }
      });
    });
    el.querySelectorAll('[data-alias-clear]').forEach((b) => {
      b.addEventListener('click', () => {
        clearCustomAliases(b.getAttribute('data-alias-clear'));
        renderCat();
      });
    });
  };

  openGenericModal(
    'Catálogo de Cartas Base (Maldito Games / Roxley) + Alias',
    `
      <div style="font-size:12px;color:var(--text-dim);">
        34 Campamentos + 26 Personas (46 copias) + 10 Eventos (20 copias) = 66 cartas del mazo compartido. Si alguna carta física tiene otro nombre en tu edición, agregale un alias acá para que la voz y el chat lo reconozcan siempre.
      </div>
      <div style="display:flex;gap:6px;flex-wrap:wrap;">
        <button class="btn btn-sm btn-cyan" data-cat-tab="camps">Campamentos (34)</button>
        <button class="btn btn-sm" data-cat-tab="people">Personas (26 / 46)</button>
        <button class="btn btn-sm" data-cat-tab="events">Eventos (10 / 20)</button>
      </div>
      <input id="cat-search" class="search-input" type="text" placeholder="Buscar carta..." />
      <div class="catalog-list" id="cat-list"></div>
    `
  );
  document.querySelectorAll('[data-cat-tab]').forEach((b) => {
    b.addEventListener('click', () => {
      tab = b.getAttribute('data-cat-tab');
      document.querySelectorAll('[data-cat-tab]').forEach((x) => x.classList.toggle('btn-cyan', x === b));
      renderCat();
    });
  });
  document.getElementById('cat-search').addEventListener('input', (e) => {
    q = e.target.value;
    renderCat();
  });
  renderCat();
}

        <div>
          <strong>⚡ Auto-enviar dictado nativo (Fn×2 / teclado móvil)</strong>
          <div style="font-size:11px;color:var(--text-dim);">Al terminar de dictar en la caja de chat y pausar, envía la jugada sola (Esc cancela).</div>
        </div>
        <input type="checkbox" id="set-dict-autosend" ${prefs.dictationAutoSend ? 'checked' : ''} />
      </div>
      <div class="settings-row">
        <div>
          <strong>Pausa del auto-envío de dictado</strong>
          <div style="font-size:11px;color:var(--text-dim);">Cuánto espera después de tu última palabra antes de enviar.</div>
        </div>
        <select id="set-dict-delay" class="select-input">
          <option value="1200" ${prefs.dictationDelayMs === 1200 ? 'selected' : ''}>1.2s (Rápido)</option>
          <option value="1600" ${(prefs.dictationDelayMs || 1600) === 1600 ? 'selected' : ''}>1.6s (Equilibrado)</option>
          <option value="2200" ${prefs.dictationDelayMs === 2200 ? 'selected' : ''}>2.2s (Pausado)</option>
        </select>
      </div>
      <div class="settings-row">
        <div>
          <strong>Auto-enviar al terminar de hablar (micrófono web)</strong>
          <div style="font-size:11px;color:var(--text-dim);">Solo para modo localhost con Web Speech API.</div>
        </div>
        <input type="checkbox" id="set-autosend" ${prefs.autoSendVoice ? 'checked' : ''} />
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;padding-top:6px;">
        <button class="btn btn-sm" id="btn-export-save">💾 Exportar partida (JSON)</button>
        <button class="btn btn-sm" id="btn-import-save">📂 Importar partida</button>
        <input type="file" id="import-file-input" accept=".json" class="hidden" />
      </div>
    `
  );

  document.getElementById('set-diff').addEventListener('change', (e) => {
    prefs.difficulty = e.target.value;
    state.difficulty = prefs.difficulty;
    savePrefs();
    persistState();
    renderTopbar();
  });
  document.getElementById('set-pers').addEventListener('change', (e) => {
    prefs.personality = e.target.value;
    state.personality = prefs.personality;
    savePrefs();
    persistState();
  });
  document.getElementById('set-rate').addEventListener('change', (e) => {
    prefs.ttsRate = parseFloat(e.target.value);
    savePrefs();
  });
  document.getElementById('set-dict-autosend').addEventListener('change', (e) => {
    prefs.dictationAutoSend = e.target.checked;
    savePrefs();
    renderTopbar();
    updateVoiceIndicator();
  });
  document.getElementById('set-dict-delay').addEventListener('change', (e) => {
    prefs.dictationDelayMs = parseInt(e.target.value, 10);
    savePrefs();
  });
  document.getElementById('set-autosend').addEventListener('change', (e) => {
    prefs.autoSendVoice = e.target.checked;
    savePrefs();
  });
  document.getElementById('btn-export-save').addEventListener('click', () => {
    const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `radlands_turno_${state.turn}.json`;
    a.click();
    URL.revokeObjectURL(url);
  });
  document.getElementById('btn-import-save').addEventListener('click', () => {
    document.getElementById('import-file-input').click();
  });
  document.getElementById('import-file-input').addEventListener('change', (e) => {
    const f = e.target.files?.[0];
    if (!f) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const loaded = JSON.parse(String(reader.result));
        if (loaded && loaded.phase && loaded.bot && loaded.human) {
          state = loaded;
          persistState();
          closeModal();
          renderAll();
          showToast('Partida importada correctamente.');
        }
      } catch {
        showToast('Archivo JSON inválido.');
      }
    };
    reader.readAsText(f);
  });
}

function downloadStandaloneHtml() {
  try {
    const clone = document.documentElement.cloneNode(true);
    // Clear dynamic runtime content so the downloaded file boots cleanly offline
    ['topbar-meta', 'arena-pane', 'chat-feed', 'pending-container', 'autocomplete-box', 'quick-chips', 'modal-root'].forEach((id) => {
      const el = clone.querySelector('#' + id);
      if (el) el.innerHTML = '';
    });
    const htmlStr = '<!DOCTYPE html>\n' + clone.outerHTML;
    const blob = new Blob([htmlStr], { type: 'text/html;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'radlands_bot.html';
    a.click();
    URL.revokeObjectURL(url);
    showToast('Descargando radlands_bot.html (100% offline).');
  } catch {
    showToast('No se pudo iniciar la descarga directa en este visor.');
  }
}

let deferredInstallPrompt = null;

function registerPwaSupport() {
  try {
    if (window.origin === 'null' || location.protocol === 'file:') return;
    if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    }
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredInstallPrompt = e;
      const btn = document.getElementById('btn-install-pwa');
      if (btn) btn.classList.remove('hidden');
    });
    window.addEventListener('appinstalled', () => {
      deferredInstallPrompt = null;
      document.getElementById('btn-install-pwa')?.classList.add('hidden');
      showToast('¡Radlands Bot instalado como app! Ya funciona 100% offline.');
    });
    document.getElementById('btn-install-pwa')?.addEventListener('click', async () => {
      if (!deferredInstallPrompt) return;
      deferredInstallPrompt.prompt();
      try { await deferredInstallPrompt.userChoice; } catch {}
      deferredInstallPrompt = null;
      document.getElementById('btn-install-pwa')?.classList.add('hidden');
    });
  } catch {}
}

// === BOOTSTRAP ===
function initApp() {
  registerPwaSupport();
  // Preload voices
  if (typeof speechSynthesis !== 'undefined') {
    speechSynthesis.getVoices();
    speechSynthesis.onvoiceschanged = () => speechSynthesis.getVoices();
  }

  // Mobile tabs
  document.querySelectorAll('[data-mtab]').forEach((btn) => {
    btn.addEventListener('click', () => {
      mobileTab = btn.getAttribute('data-mtab');
      document.querySelectorAll('[data-mtab]').forEach((x) => x.classList.toggle('active', x === btn));
      document.getElementById('workspace')?.setAttribute('data-mobile-tab', mobileTab);
    });
  });

  // Topbar buttons
  document.getElementById('btn-tts-toggle')?.addEventListener('click', () => {
    prefs.ttsEnabled = !prefs.ttsEnabled;
    if (!prefs.ttsEnabled && typeof speechSynthesis !== 'undefined') speechSynthesis.cancel();
    savePrefs();
    renderTopbar();
  });
  document.getElementById('btn-handsfree')?.addEventListener('click', () => {
    if (isMicOriginBlocked()) {
      prefs.dictationAutoSend = !prefs.dictationAutoSend;
      if (!prefs.dictationAutoSend) cancelDictationAutoSend();
      savePrefs();
      renderTopbar();
      updateVoiceIndicator();
      showToast(
        prefs.dictationAutoSend
          ? '⚡ Auto-dictado ON: apretá Fn×2 (o 🎙️ del teclado) y al pausar se envía solo.'
          : 'Auto-dictado OFF: dictás y apretás Enter o Enviar.'
      );
      refocusChatInputIfSafe();
      return;
    }
    if (!SpeechRec) {
      openMicHelpModal('Manos libres requiere reconocimiento de voz web (Chrome/Edge en localhost).');
      return;
    }
    prefs.handsFree = !prefs.handsFree;
    savePrefs();
    renderTopbar();
    if (prefs.handsFree) startListening();
    else stopListening();
  });
  document.getElementById('btn-cancel-autosend')?.addEventListener('click', () => {
    cancelDictationAutoSend();
    document.getElementById('chat-input')?.focus();
  });
  document.getElementById('btn-mic-guide')?.addEventListener('click', () => openMicHelpModal());
  document.getElementById('btn-catalog')?.addEventListener('click', openCatalogModal);
  document.getElementById('btn-download-offline')?.addEventListener('click', downloadStandaloneHtml);
  document.getElementById('btn-settings')?.addEventListener('click', openSettingsModal);
  document.getElementById('btn-undo')?.addEventListener('click', () => submitCommand('deshacer'));
  document.getElementById('btn-new-game')?.addEventListener('click', () => {
    if (state.phase === 'setup_camps' || confirm('¿Empezar una partida nueva de Radlands?')) {
      setupSelectedCamps = [];
      setupExcludedCamps = [];
      submitCommand('nueva partida');
    }
  });

  // Chat input & Mic
  const inputEl = document.getElementById('chat-input');
  const sendBtn = document.getElementById('send-btn');
  const micBtn = document.getElementById('mic-btn');

  inputEl?.addEventListener('compositionstart', () => {
    isComposing = true;
    cancelDictationAutoSend();
    const txt = document.getElementById('voice-status-text');
    const dot = document.getElementById('mic-dot');
    if (dot) dot.className = 'mic-dot listening';
    if (txt) txt.textContent = '🎙️ Dictando...';
  });
  inputEl?.addEventListener('compositionend', (e) => {
    isComposing = false;
    renderAutocomplete(inputEl.value);
    scheduleDictationAutoSend(inputEl.value);
  });
  inputEl?.addEventListener('input', (e) => {
    renderAutocomplete(e.target.value);
    if (!isComposing) {
      scheduleDictationAutoSend(e.target.value);
    }
  });
  inputEl?.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      cancelDictationAutoSend();
      return;
    }
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      cancelDictationAutoSend();
      submitCommand(inputEl.value);
    }
  });
  sendBtn?.addEventListener('click', () => submitCommand(inputEl.value));
  micBtn?.addEventListener('click', toggleMic);

  renderAll();
  refocusChatInputIfSafe();
}

if (typeof document !== 'undefined') {
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initApp);
  } else {
    initApp();
  }
}

})();

</script>
